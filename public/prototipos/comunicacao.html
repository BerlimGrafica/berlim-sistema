<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Padrão do DESIGN.md: o mesmo mundo dos pré-prontos, da nova Produção, do novo Financeiro e dos Orçamentos. */
:root {
  --brand: #F69F00; --brand-hover: #d98b00; --brand-tinta: #8A5400; --sobre-brand: #241600;
  --fundo: #EDEFF0; --superficie: #ffffff; --sutil: #f9fafb; --realce: #f3f4f6;
  --borda-fraca: #f0f1f3; --borda: #e5e7eb; --borda-forte: #d1d5db;
  --tinta: #111827; --tinta-corpo: #374151; --tinta-suave: #6b7280; --tinta-fraca: #9ca3af;
  --perigo: #dc2626; --perigo-fundo: #fef2f2; --perigo-borda: #fecaca;
  --sombra: 0 24px 56px -16px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.08);
  --sombra-pop: 0 12px 28px -8px rgba(15,23,42,.24), 0 1px 3px rgba(15,23,42,.08);
  --sombra-leve: 0 1px 2px rgba(15,23,42,.06);
  --veu: rgba(15,23,42,.36);
  --dados: #475569; --dados-tinta: #334155; --dados-fundo: #f8fafc; --dados-borda: #e2e8f0;
  --itens: #2563eb; --itens-tinta: #1d4ed8; --itens-fundo: #eff6ff; --itens-borda: #dbeafe;
  --fin: #059669; --fin-tinta: #047857; --fin-fundo: #ecfdf5; --fin-borda: #c9f2df;
  --obs: #d97706; --obs-tinta: #b45309; --obs-fundo: #fffbeb; --obs-borda: #fdecc4;
  --saida: cubic-bezier(.16, 1, .3, 1);
}
.dark {
  --brand-tinta: #FFB938;
  --fundo: #0d1117; --superficie: #161b22; --sutil: #1b2129; --realce: #21262d;
  --borda-fraca: #232a33; --borda: #30363d; --borda-forte: #3d444d;
  --tinta: #EDEDED; --tinta-corpo: #D4D4D8; --tinta-suave: #A1A1AA; --tinta-fraca: #71717a;
  --perigo: #f87171; --perigo-fundo: rgba(239,68,68,.1); --perigo-borda: rgba(239,68,68,.3);
  --sombra: 0 24px 56px -16px rgba(0,0,0,.7); --sombra-pop: 0 12px 28px -8px rgba(0,0,0,.6); --sombra-leve: 0 1px 2px rgba(0,0,0,.4);
  --veu: rgba(0,0,0,.6);
  --dados: #94a3b8; --dados-tinta: #cbd5e1; --dados-fundo: rgba(148,163,184,.08); --dados-borda: rgba(148,163,184,.22);
  --itens: #60a5fa; --itens-tinta: #93c5fd; --itens-fundo: rgba(59,130,246,.12); --itens-borda: rgba(59,130,246,.3);
  --fin: #34d399; --fin-tinta: #6ee7b7; --fin-fundo: rgba(16,185,129,.11); --fin-borda: rgba(16,185,129,.28);
  --obs: #fbbf24; --obs-tinta: #fcd34d; --obs-fundo: rgba(245,158,11,.1); --obs-borda: rgba(245,158,11,.26);
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; } html.dark { color-scheme: dark; }
body { font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--tinta-corpo); background: var(--fundo); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
input { caret-color: var(--brand); }
::placeholder { color: var(--tinta-suave); opacity: 1; }
::selection { background: rgba(246,159,0,.3); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }
mark { background: rgba(246,159,0,.3); color: inherit; border-radius: 2px; padding: 0 1px; }
.ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.ico-s { width: 14px; height: 14px; }
.num { font-variant-numeric: tabular-nums; }
kbd { font: 600 10.5px/1 Montserrat, sans-serif; color: var(--tinta-suave); border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--superficie); }

/* moldura do protótipo */
.proto { position: sticky; top: 0; z-index: 40; height: 51px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.proto-nome { font-weight: 700; color: var(--tinta); white-space: nowrap; }
.proto-nota { color: var(--tinta-suave); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.proto-tema { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--tinta-corpo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; flex-shrink: 0; }
.proto-tema:hover { background: var(--realce); color: var(--tinta); }

/* botões */
.btn { height: 38px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, filter .15s; }
.btn-pri { background: var(--brand); color: var(--sobre-brand); }
.btn-pri:hover { background: var(--brand-hover); }
.btn-pri kbd { background: rgba(255,255,255,.35); border-color: rgba(36,22,0,.18); color: var(--sobre-brand); }
.btn-sec { border: 1px solid var(--borda-forte); color: var(--tinta); background: var(--superficie); }
.btn-sec:hover { background: var(--sutil); border-color: var(--tinta-fraca); }
.btn-txt { color: var(--tinta-suave); padding: 0 10px; }
.btn-txt:hover { color: var(--tinta); background: var(--realce); }
.btn-ok { background: var(--fin); color: #fff; } .btn-ok:hover { filter: brightness(.95); } .dark .btn-ok { color: var(--fundo); }
.btn-perigo { color: var(--perigo); }
.btn-perigo:hover, .btn-perigo.conf { background: var(--perigo-fundo); color: var(--perigo); }
.btn-p { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 7px; }
.btn.feito { background: var(--fin-fundo); border-color: var(--fin-borda); color: var(--fin-tinta); }
.ib { height: 30px; min-width: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 7px; color: var(--tinta-suave); transition: background .12s, color .12s; flex-shrink: 0; white-space: nowrap; }
.ib:hover { background: var(--realce); color: var(--tinta); }
/* concluir: em verde, como o concluir da Produção; o primeiro clique vira a pergunta */
.ib.ok { color: var(--fin); }
.ib.ok:hover { background: var(--fin-fundo); }
.ib.conf { padding: 0 9px; background: var(--fin); color: #fff; font-size: 12px; font-weight: 700; }
.dark .ib.conf { color: var(--fundo); }
.ib.feito { background: var(--fin-fundo); color: var(--fin-tinta); }
/* Confirmar no segundo clique, sem deixar dúvida: o botão cresce e acende,
   uma barrinha mostra o tempo para confirmar (4s), e a linha inteira ganha a
   cor da ação. Depois do segundo clique a linha sai deslizando e o aviso
   embaixo diz o que aconteceu, com Desfazer. */
.ib.conf, .btn.conf { position: relative; overflow: hidden; animation: acende .26s var(--saida); }
.ib.conf::after, .btn.conf::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.6); transform-origin: left; animation: esvazia 4s linear forwards; }
@keyframes acende { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes esvazia { to { transform: scaleX(0); } }
.btn-ok.conf { box-shadow: 0 0 0 3px var(--fin-borda); }
.btn-sec.conf { background: var(--fin); border-color: var(--fin); color: #fff; box-shadow: 0 0 0 3px var(--fin-borda); }
.btn-perigo.conf, .btn-perigo.conf:hover { background: var(--perigo); color: #fff; box-shadow: 0 0 0 3px var(--perigo-borda); }
.dark .btn-sec.conf, .dark .btn-perigo.conf { color: var(--fundo); }
.lin.armada { background: var(--fin-fundo); box-shadow: inset 3px 0 0 var(--fin); }
.lin.armada:hover { background: var(--fin-fundo); }
.lin.saindo { animation: saiLinha .3s var(--saida) forwards; pointer-events: none; }
@keyframes saiLinha { to { opacity: 0; transform: translateX(24px); } }

/* página */
.pg { max-width: 1120px; margin: 0 auto; padding: 24px 28px 72px; }
.cab { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 6px; }
.cab h1 { font-size: 22px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; line-height: 1.2; }
.cab p { color: var(--tinta-suave); font-size: 12.5px; margin-top: 3px; }
.cab p .alerta { color: var(--perigo); font-weight: 600; }
.cab .btn { margin-left: auto; }

/* abas: o recorte da tela, com o traço laranja que desliza até a ativa */
.faixa { display: flex; align-items: flex-end; border-bottom: 1px solid var(--borda); margin: 10px 0 16px; }
.abas { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.abas::-webkit-scrollbar { display: none; }
.aba { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 10px 2px; font-weight: 600; font-size: 13px; color: var(--tinta-suave); white-space: nowrap; border-radius: 6px 6px 0 0; transition: color .15s; }
.aba:hover { color: var(--tinta-corpo); }
.aba[aria-selected="true"] { color: var(--tinta); }
.aba .n { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; background: var(--realce); color: var(--tinta-suave); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; transition: background .15s, color .15s; }
.aba[aria-selected="true"] .n { background: var(--tinta); color: var(--superficie); }
.aba .n.alerta { background: var(--perigo-fundo); color: var(--perigo); }
.indicador { position: absolute; left: 0; bottom: 0; width: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--brand); transition: left .34s var(--saida), width .34s var(--saida); pointer-events: none; }

.busca { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
.busca:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.busca .ico { color: var(--tinta-suave); }
.busca input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 50px; font-size: 16px; font-weight: 600; color: var(--tinta); }
.busca input::placeholder { font-weight: 500; }
.busca .limpar { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--tinta-suave); }
.busca .limpar:hover { background: var(--realce); color: var(--tinta); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.chip { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--borda); background: var(--superficie); font-weight: 600; font-size: 12.5px; color: var(--tinta-corpo); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; transition: background .12s, border-color .12s; }
.chip:hover { border-color: var(--borda-forte); background: var(--sutil); }
.chip .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--superficie); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .65; }
.chips .sep { width: 1px; height: 20px; background: var(--borda); margin: 5px 4px; }

/* grupo que recolhe: a seta gira e a lista encolhe até zero, como na nova Produção */
.grupo-cab .grp-btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: inherit; border-radius: 6px; padding: 2px 6px 2px 0; }
.grupo-cab .chev { color: var(--tinta-fraca); transition: transform .2s var(--saida); }
.grupo-cab .grp-btn:hover .chev { color: var(--tinta-suave); }
.grupo-cab.fechado .chev { transform: rotate(-90deg); }
.grp-corpo { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .36s var(--saida), opacity .26s ease, transform .36s var(--saida); }
.grp-corpo.fechado { grid-template-rows: 0fr; opacity: 0; transform: translateY(-4px); }
.grp-dentro { overflow: hidden; min-height: 0; }
.grp-corpo.fechado .grp-dentro { visibility: hidden; transition: visibility 0s .36s; }
.faixa .todos { margin-left: auto; align-self: center; }
.ib.todos[aria-pressed="true"] { color: var(--brand-tinta); }
/* a lista da aba entra do lado da aba escolhida */
#corpo.de-dir { animation: entraDir .3s var(--saida); }
#corpo.de-esq { animation: entraEsq .3s var(--saida); }
@keyframes entraDir { from { opacity: 0; transform: translateX(24px); } }
@keyframes entraEsq { from { opacity: 0; transform: translateX(-24px); } }

/* lista agrupada */
.grupo-cab { display: flex; align-items: center; gap: 8px; padding: 22px 4px 8px; font-size: 13px; font-weight: 700; color: var(--tinta); }
.grupo-cab .ico { color: var(--tinta-suave); }
.grupo-cab .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.grupo-cab .tot { margin-left: auto; color: var(--tinta-suave); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
.grupo-cab.vermelho, .grupo-cab.vermelho .ico { color: var(--perigo); }
.grupo-cab.ambar, .grupo-cab.ambar .ico { color: var(--obs-tinta); }
.lista { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
.lin { display: grid; align-items: center; gap: 14px; padding: 10px 10px 10px 14px; border-top: 1px solid var(--borda-fraca); cursor: pointer; transition: background .1s; }
.lista > .lin:first-child { border-top: 0; }
.lin:hover { background: var(--sutil); }
.lin.ativo, .lin.aberta { background: var(--realce); }
.lin.pri-alta { box-shadow: inset 3px 0 0 var(--perigo); }
.lin.pri-media { box-shadow: inset 3px 0 0 var(--obs); }
/* compras: o item, de onde vem, há quanto tempo falta e as ações */
.lin.l-req { grid-template-columns: minmax(0,1fr) auto 92px 76px; min-height: 52px; }
.lin.l-req.salvando { opacity: .55; pointer-events: none; }
.lin.l-tar { grid-template-columns: 40px minmax(0,1fr) 150px 110px 96px; }
.lin.l-link { grid-template-columns: 40px minmax(0,1fr) 150px 116px 96px; }
.lin.feita .lin-tit .t { color: var(--tinta-suave); text-decoration: line-through; text-decoration-color: var(--tinta-fraca); }

/* compras: anotar o que falta fica em cima da lista, no lugar da busca */
.anotar { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; height: 52px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
.anotar:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.anotar > .ico { color: var(--brand-tinta); }
.anotar input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 50px; font-size: 16px; font-weight: 600; color: var(--tinta); }
.anotar input::placeholder { font-weight: 500; }
.ib.urg.on, .ib.urg[aria-pressed="true"] { color: var(--perigo); background: var(--perigo-fundo); }
.denovo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.denovo button { height: 26px; padding: 0 10px; border-radius: 99px; border: 1px dashed var(--borda-forte); font-size: 12px; font-weight: 600; color: var(--tinta-corpo); display: inline-flex; align-items: center; gap: 5px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.denovo button:hover { border-style: solid; background: var(--superficie); color: var(--tinta); }
.denovo .ico { color: var(--tinta-fraca); }
.aviso-mig { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 9px 12px; border-radius: 8px; background: var(--obs-fundo); border: 1px solid var(--obs-borda); color: var(--obs-tinta); font-size: 12.5px; font-weight: 600; }
.aviso-mig .ico { margin-top: 1px; }
.forn { display: inline-flex; align-items: center; gap: 5px; max-width: 190px; height: 26px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--borda); font-size: 12px; font-weight: 600; color: var(--tinta-corpo); white-space: nowrap; overflow: hidden; }
.forn span { overflow: hidden; text-overflow: ellipsis; }
.forn .ico { color: var(--tinta-suave); }
button.forn.add { border-style: dashed; color: var(--tinta-suave); }
button.forn.add:hover { border-style: solid; color: var(--tinta); background: var(--superficie); }
.lin-quando.velho { color: var(--obs-tinta); font-weight: 600; }
.grupo-cab .g-acoes { margin-left: auto; display: flex; gap: 6px; }
.grupo-cab .tot + .g-acoes { margin-left: 8px; }
/* Lista | Equipe e Por item | Por fornecedor: quem agrupa, à direita dos filtros */
.vista { margin-left: auto; display: inline-flex; gap: 2px; padding: 2px; background: var(--realce); border-radius: 8px; flex-shrink: 0; }
.vista button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--tinta-suave); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.vista button:hover { color: var(--tinta); }
.vista button[aria-pressed="true"] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-leve); }

/* tarefas › Equipe: uma coluna por pessoa; arrastar passa a tarefa */
/* as colunas quebram em linhas: com a equipe toda, ninguém fica escondido numa rolagem de lado */
.equipe { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; padding: 16px 0 6px; align-items: start; }
.eq-col { background: var(--realce); border-radius: 10px; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 150px; transition: background .15s, box-shadow .15s; }
.eq-col.alvo { background: rgba(246,159,0,.1); box-shadow: inset 0 0 0 2px var(--brand); }
.eq-cab { display: flex; align-items: center; gap: 8px; padding: 2px 4px; font-weight: 700; font-size: 13px; color: var(--tinta); min-width: 0; }
.eq-cab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eq-cab .n { margin-left: auto; color: var(--tinta-suave); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
.eq-carga { height: 4px; border-radius: 2px; background: var(--borda); overflow: hidden; margin: 0 4px 2px; }
.eq-carga i { display: block; height: 100%; border-radius: 2px; background: var(--itens); transition: width .3s var(--saida); }
.eq-card { background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; cursor: grab; text-align: left; }
.eq-card:hover { border-color: var(--borda-forte); }
.eq-card.aberta { background: var(--realce); }
.eq-card.pri-alta { box-shadow: inset 3px 0 0 var(--perigo); }
.eq-card.pri-media { box-shadow: inset 3px 0 0 var(--obs); }
.eq-card.arrastando { opacity: .4; }
.eq-card .t { font-size: 13px; font-weight: 600; color: var(--tinta); line-height: 1.35; overflow-wrap: anywhere; }
.eq-card .s { font-size: 11.5px; color: var(--tinta-suave); }
.eq-card .s.vermelho { color: var(--perigo); font-weight: 600; }
.eq-card .s.ambar { color: var(--obs-tinta); font-weight: 600; }
.eq-vazio { border: 1px dashed var(--borda-forte); border-radius: 8px; padding: 12px 10px; font-size: 12px; color: var(--tinta-fraca); text-align: center; }
.eq-dica { margin-top: 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--tinta-fraca); }

/* quadrinho de data: dia e mês; prazo segue a régua, criação fica neutra */
.diaf { width: 40px; height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--borda); background: var(--superficie); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; flex-shrink: 0; }
.diaf b { font-size: 13.5px; font-weight: 700; color: var(--tinta); font-variant-numeric: tabular-nums; }
.diaf span { font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); }
.diaf.vermelho { background: var(--perigo-fundo); box-shadow: inset 0 0 0 1px var(--perigo-borda); }
.diaf.vermelho b, .diaf.vermelho span { color: var(--perigo); }
.diaf.ambar { background: var(--obs-fundo); box-shadow: inset 0 0 0 1px var(--obs-borda); }
.diaf.ambar b, .diaf.ambar span { color: var(--obs-tinta); }
.diaf.sem { box-shadow: none; border: 1px dashed var(--borda-forte); }
.diaf.sem span { font-size: 10.5px; }
/* a tarefa de todo dia não tem data: o quadrinho mostra que ela se repete */
.diaf.rotina { color: var(--tinta-suave); }
.diaf.rotina.feita { background: var(--fin-fundo); box-shadow: inset 0 0 0 1px var(--fin-borda); color: var(--fin-tinta); }
.ic-link { color: var(--tinta-suave); }

.lin-txt { min-width: 0; }
.lin-tit { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lin-tit .t { font-size: 14px; font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lin-sub { font-size: 12px; color: var(--tinta-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.lin-quando { font-size: 12px; color: var(--tinta-suave); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lin-quando.vermelho { color: var(--perigo); font-weight: 600; }
.lin-quando.ambar { color: var(--obs-tinta); font-weight: 600; }
.lin-v { text-align: right; font-weight: 700; color: var(--fin); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lin-v.mudo { color: var(--tinta-fraca); font-weight: 500; }
.lin-acts { display: flex; gap: 2px; justify-content: flex-end; }
.selo { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 5px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--realce); color: var(--tinta-corpo); }
.selo .ico { width: 12px; height: 12px; }
.selo.s-ok { background: var(--fin-fundo); color: var(--fin-tinta); }
.selo.s-perigo { background: var(--perigo-fundo); color: var(--perigo); }
.selo.s-obs { background: var(--obs-fundo); color: var(--obs-tinta); }
.selo.s-itens { background: var(--itens-fundo); color: var(--itens-tinta); }
.lin-tit .selo { flex-shrink: 0; }

.pessoas { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--tinta-corpo); }
.pessoas .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pessoas .avs { display: inline-flex; }
.pessoas .avs .av + .av { margin-left: -3px; box-shadow: 0 0 0 2px var(--superficie); }
.pessoas.ninguem { color: var(--tinta-fraca); font-weight: 500; }
.av { width: 24px; height: 24px; border-radius: 99px; display: inline-grid; place-items: center; font: 700 10px/1 Montserrat; letter-spacing: -.02em; flex-shrink: 0; }
.av.mais { background: var(--realce); color: var(--tinta-suave); }

.vazio { padding: 40px 16px; text-align: center; color: var(--tinta-suave); }
.vazio b { display: block; color: var(--tinta); font-size: 14px; }
.vazio .btn { margin-top: 14px; }
.folha { display: block; width: 76px; height: 84px; margin: 0 auto 14px; }
.folha .f-papel { fill: var(--superficie); stroke: var(--borda-forte); }
.folha .f-marca { fill: none; stroke: var(--tinta-fraca); }
.dicas { margin-top: 18px; color: var(--tinta-fraca); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.dicas span { display: inline-flex; gap: 5px; align-items: center; }

/* gaveta (computador) / folha (celular), a mesma da nova Produção, do Financeiro e dos Orçamentos */
.gv-veu { position: fixed; inset: 51px 0 0 0; background: var(--veu); z-index: 60; animation: veuEntra .4s ease-out; }
.gaveta { position: fixed; top: 51px; right: 0; bottom: 0; width: min(460px, 100%); background: var(--fundo); border-left: 1px solid var(--borda); box-shadow: var(--sombra); z-index: 61; overflow-y: auto; animation: gavetaEntra .46s cubic-bezier(.22,1,.36,1); }
/* Com a gaveta aberta, a página de trás fica parada: a roda do mouse rola só a
   gaveta, e chegar ao fim dela (ou de uma lista aberta) não leva a página junto. */
.gaveta, .pop { overscroll-behavior: contain; }
html:has(.gaveta:not(.sai)) { overflow: hidden; scrollbar-gutter: stable; }
.gv-veu.sai { animation: veuSai .3s ease-in forwards; pointer-events: none; }
.gaveta.sai { animation: gavetaSai .3s cubic-bezier(.55,0,1,.45) forwards; pointer-events: none; }
@keyframes gavetaEntra { from { transform: translateX(100%); } }
@keyframes gavetaSai { to { transform: translateX(100%); } }
@keyframes veuEntra { from { opacity: 0; } }
@keyframes veuSai { to { opacity: 0; } }
.det { padding: 0 22px 40px; }
.det-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: 0 -22px; padding: 12px 22px; background: var(--fundo); color: var(--tinta-suave); font-size: 13px; font-weight: 600; transition: box-shadow .2s; }
.gaveta.rolou .det-cab { box-shadow: 0 1px 0 var(--borda); }
.det-ferr { margin-left: auto; display: flex; gap: 2px; }
.det-tipo { display: inline-flex; align-items: center; gap: 7px; }
.det-tipo .num { color: var(--tinta); font-weight: 800; font-size: 15px; }
.det-tit { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; }
.det-valor { font-size: 30px; font-weight: 700; letter-spacing: -.022em; color: var(--fin); margin-top: 8px; font-variant-numeric: tabular-nums; }
.det-valor small { font-size: 13.5px; font-weight: 600; color: var(--fin-tinta); margin-right: 4px; letter-spacing: 0; }
.dprops { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; row-gap: 2px; margin-top: 14px; }
.dprops dt { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 7px; align-items: center; min-height: 32px; }
.dprops dd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-weight: 600; color: var(--tinta); }
.dprops .mudo { color: var(--tinta-suave); font-weight: 500; }
.area { border: 1px solid var(--c-borda); border-radius: 10px; background: var(--superficie); margin-top: 18px; overflow: hidden; }
.a-dados { --c: var(--dados); --c-tinta: var(--dados-tinta); --c-fundo: var(--dados-fundo); --c-borda: var(--dados-borda); }
.a-itens { --c: var(--itens); --c-tinta: var(--itens-tinta); --c-fundo: var(--itens-fundo); --c-borda: var(--itens-borda); }
.a-fin { --c: var(--fin); --c-tinta: var(--fin-tinta); --c-fundo: var(--fin-fundo); --c-borda: var(--fin-borda); }
.a-obs { --c: var(--obs); --c-tinta: var(--obs-tinta); --c-fundo: var(--obs-fundo); --c-borda: var(--obs-borda); }
.area-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.area-ico { width: 26px; height: 26px; border-radius: 7px; background: var(--superficie); display: grid; place-items: center; color: var(--c); box-shadow: var(--sombra-leve); flex-shrink: 0; }
.area-cab h3 { font-size: 13px; font-weight: 700; color: var(--tinta); }
.area-meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--c-tinta); white-space: nowrap; font-variant-numeric: tabular-nums; }
/* a lista de compras: um item por linha, como foi escrito */
.it { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; padding: 9px 12px; border-top: 1px solid var(--borda-fraca); }
.it:first-child { border-top: 0; }
.it .n { font-size: 11.5px; font-weight: 700; color: var(--tinta-fraca); padding-top: 1px; font-variant-numeric: tabular-nums; }
.it .nm { font-weight: 600; color: var(--tinta); min-width: 0; overflow-wrap: anywhere; }
.txt-area { padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--tinta-corpo); line-height: 1.55; }
.url { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; }
.url span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-corpo); font-size: 12.5px; }
.det-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
.det-acoes .esp { flex: 1; }

/* barra do rodapé no celular: a ação principal ao alcance do polegar */
.barra-mob { display: none; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 95; background: var(--tinta); color: var(--superficie); padding: 8px 8px 8px 16px; border-radius: 8px; font-weight: 600; font-size: 12.5px; box-shadow: var(--sombra-pop); display: flex; gap: 8px; align-items: center; animation: sobe .22s var(--saida); max-width: calc(100vw - 32px); }
.toast:not(:has(button)) { padding-right: 16px; }
.toast .ico { color: #34d399; }
.toast button { color: var(--brand); font-weight: 700; padding: 4px 8px; border-radius: 6px; }
.toast button:hover { background: rgba(255,255,255,.1); }
.dark .toast button { color: var(--brand-tinta); } .dark .toast button:hover { background: rgba(0,0,0,.08); }
@keyframes sobe { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (max-width: 1000px) {
  .lin.l-tar, .lin.l-link { grid-template-columns: 40px minmax(0,1fr) 100px 96px; }
  .lin .pessoas { display: none; }
}
@media (max-width: 760px) {
  .proto { padding: 0 10px; gap: 8px; }
  .proto-nota, .proto-tema span { display: none; }
  .pg { padding: 16px 12px 96px; }
  .cab .btn, .busca kbd, .dicas { display: none; }
  .faixa { margin-left: -12px; margin-right: -12px; padding: 0 12px; }
  .abas { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -12px; margin-right: -12px; padding: 0 12px; }
  .lin.l-tar, .lin.l-link { grid-template-columns: 40px minmax(0,1fr) auto; gap: 10px; padding: 10px 8px 10px 12px; }
  .lin.l-req { grid-template-columns: minmax(0,1fr) auto; gap: 10px; padding: 10px 8px 10px 12px; }
  .lin.l-req .forn { display: none; }
  .anotar kbd { display: none; }
  .vista { margin-left: 4px; }
  /* no celular a vista Equipe vira uma lista por pessoa, uma embaixo da outra */
  .equipe { grid-template-columns: 1fr; }
  .eq-col { min-height: 0; }
  .eq-card { cursor: pointer; }
  .eq-dica { display: none; }
  .mc-formas { grid-template-columns: 1fr !important; }
  .lin .lin-quando, .lin .lin-v, .lin .col-selo { display: none; }
  .lin-sub .mob { display: inline !important; }
  .ib { min-width: 36px; height: 36px; }
  .barra-mob { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--superficie); border-top: 1px solid var(--borda); }
  .barra-mob .btn { flex: 1; height: 44px; }
  .toast { bottom: 80px; }
  .gv-veu { inset: 0; }
  .gaveta { top: auto; height: 88dvh; width: 100%; border-left: 0; border-radius: 12px 12px 0 0; animation-name: folhaEntra; z-index: 61; }
  .gaveta.sai { animation-name: folhaSai; }
  .det { padding: 0 14px 40px; }
  .det-cab { margin: 0 -14px; padding: 8px 6px 8px 14px; }
  .det-cab .ib { width: 44px; height: 44px; }
}
.lin-sub .mob { display: none; }
@keyframes folhaEntra { from { transform: translateY(100%); } }
@keyframes folhaSai { to { transform: translateY(100%); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
html[data-troca-tema]::view-transition-old(root), html[data-troca-tema]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html[data-troca-tema].dark::view-transition-new(root), html[data-troca-tema]:not(.dark)::view-transition-old(root) { z-index: 1; }
html[data-troca-tema] *, html[data-troca-tema] *::before, html[data-troca-tema] *::after { transition: none !important; }
/* ===== janela de edição (o modal novo, no padrão do de O.S. e do de conta a pagar) ===== */
.mc-veu { position: fixed; inset: 0; z-index: 70; background: var(--veu); animation: veuEntra .3s ease-out; }
.mc { position: fixed; z-index: 71; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(600px, calc(100% - 32px)); max-height: min(760px, calc(100dvh - 48px));
  display: flex; flex-direction: column; background: var(--superficie); border-radius: 12px; box-shadow: var(--sombra); animation: mcEntra .26s var(--saida); }
.mc.larga { width: min(760px, calc(100% - 32px)); }
@keyframes mcEntra { from { opacity: 0; transform: translate(-50%, calc(-50% + 10px)) scale(.985); } }
.mc-cab { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 22px; height: 54px; border-bottom: 1px solid var(--borda); flex-shrink: 0; }
.mc-cab h2 { font-size: 14px; font-weight: 700; color: var(--tinta); }
.mc-cab .mc-id { color: var(--tinta-suave); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.mc-cab .ib { margin-left: auto; }
.mc-corpo { flex: 1; min-height: 0; padding: 14px 22px 24px; overflow-y: auto; scrollbar-gutter: stable; }
.mc-rot { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); margin: 18px 0 4px; }
.mc-rot .dica { font-weight: 500; color: var(--tinta-fraca); }
.mc-rot .mc-erro-i { color: var(--perigo); font-weight: 600; }
.mc-corpo > .mc-rot:first-child { margin-top: 4px; }
/* campos sem caixa: só a linha de base, que acende no foco */
.mc-grande, .mc-linha, .mc-valor input { width: 100%; border: 0; background: transparent; outline: none; color: var(--tinta); box-shadow: inset 0 -1px 0 var(--borda-forte); transition: box-shadow .15s; border-radius: 0; }
.mc-grande { padding: 4px 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -.018em; line-height: 1.25; box-shadow: inset 0 -2px 0 transparent; }
.mc-grande::placeholder { color: var(--tinta-fraca); font-weight: 600; }
.mc-grande:hover { box-shadow: inset 0 -2px 0 var(--borda); }
.mc-linha { height: 36px; font-size: 14px; font-weight: 600; }
.mc-linha::placeholder { font-weight: 500; color: var(--tinta-fraca); }
.mc-linha:hover, .mc-valor input:hover { box-shadow: inset 0 -1px 0 var(--tinta-fraca); }
.mc-grande:focus, .mc-linha:focus, .mc-valor input:focus { box-shadow: inset 0 -2px 0 var(--brand); }
.mc-grande.erro, .mc-linha.erro, .mc-valor input.erro, .mc-area.erro { box-shadow: inset 0 -2px 0 var(--perigo); }
.mc-area.erro { box-shadow: 0 0 0 1px var(--perigo); border-color: var(--perigo); }
.mc-area { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--borda); border-radius: 8px; padding: 9px 11px; background: var(--superficie); font: 500 13.5px/1.55 Montserrat, system-ui, sans-serif; color: var(--tinta); outline: none; transition: border-color .15s, box-shadow .15s; }
.mc-area::placeholder { color: var(--tinta-fraca); }
.mc-area:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.mc-area.grande { min-height: 150px; }
.mc-valor { display: flex; align-items: baseline; gap: 6px; }
.mc-valor small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); }
.mc-valor input { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; padding: 2px 0 4px; }
.mc-valor input::placeholder { color: var(--tinta-fraca); }
.mc-par { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.mc-par > div { min-width: 0; }
.mc-senha { position: relative; }
.mc-senha .ib { position: absolute; right: 0; top: 3px; }
/* escolha curta: botões lado a lado, nada de select */
.mc-seg { display: flex; gap: 2px; padding: 3px; background: var(--realce); border-radius: 9px; overflow-x: auto; scrollbar-width: none; }
.mc-seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--tinta-suave); white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s; }
.mc-seg button:hover { color: var(--tinta); }
.mc-seg button[aria-checked="true"] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-leve); }
.mc-seg .ico { width: 14px; height: 14px; }
.mc-seg .bol { width: 8px; height: 8px; border-radius: 99px; background: var(--c-bol); }
/* pessoas: as bolinhas da equipe; escolhida fica em verde ("está dentro") */
.mc-pessoas { display: flex; flex-wrap: wrap; gap: 6px; }
.mc-pessoa { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px 0 4px; border-radius: 99px; border: 1px solid var(--borda); background: var(--superficie); font-size: 12.5px; font-weight: 600; color: var(--tinta-corpo); transition: background .12s, border-color .12s; }
.mc-pessoa:hover { border-color: var(--borda-forte); background: var(--sutil); }
.mc-pessoa[aria-pressed="true"] { border-color: var(--fin-borda); background: var(--fin-fundo); color: var(--fin-tinta); }
.mc-pessoa[aria-pressed="true"] .ok { display: inline-flex; }
.mc-pessoa .ok { display: none; color: var(--fin); }
.mc-pessoa .ok .ico { width: 13px; height: 13px; }
/* escolha de uma opção só: o mesmo chip, sem a bolinha */
.mc-pessoa.mc-esc { padding-left: 12px; }
/* fornecedor: um campo só, que abre a lista com busca (o mesmo popover da data) */
.mc-forn { max-width: 100%; }
.mc-forn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-forn.erro { box-shadow: inset 0 0 0 1px var(--perigo); }
.mc-forn:disabled { cursor: default; color: var(--tinta-fraca); }
.mc-forn:disabled:hover { background: none; }
.forn-pop { width: 300px; padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.forn-busca { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--borda); flex-shrink: 0; }
.forn-busca .ico { color: var(--tinta-suave); }
.forn-busca input { flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--tinta); }
.forn-busca input::placeholder { font-weight: 500; color: var(--tinta-fraca); }
.forn-lista { padding: 4px; overflow-y: auto; max-height: 280px; }
.forn-lista button span { overflow: hidden; text-overflow: ellipsis; }
.forn-lista button .ico { color: var(--tinta-fraca); }
.forn-lista button.ativo { background: var(--realce); color: var(--tinta); }
.forn-lista button[aria-selected="true"] { font-weight: 700; color: var(--tinta); }
.forn-rot { font-size: 11px; font-weight: 600; color: var(--tinta-suave); padding: 8px 10px 3px; }
.forn-vazio { padding: 16px 10px; text-align: center; font-size: 12.5px; color: var(--tinta-suave); }
/* como a compra foi paga: quatro cartões, um escolhido */
.mc-formas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mc-forma { display: grid; gap: 2px; padding: 9px 12px; border: 1px solid var(--borda); border-radius: 9px; background: var(--superficie); text-align: left; transition: border-color .12s, background .12s; }
.mc-forma:hover { border-color: var(--borda-forte); }
.mc-forma b { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--tinta); }
.mc-forma b .ico { width: 14px; height: 14px; color: var(--tinta-suave); }
.mc-forma span { font-size: 11.5px; color: var(--tinta-suave); line-height: 1.4; }
.mc-forma[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: rgba(246,159,0,.08); }
.mc-forma[aria-checked="true"] b .ico { color: var(--brand-tinta); }
/* o que foi comprado: os itens da lista, marcados */
.mc-itens { display: grid; border: 1px solid var(--borda); border-radius: 9px; overflow: hidden; }
.mc-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--borda-fraca); text-align: left; font-size: 13px; font-weight: 600; color: var(--tinta-corpo); }
.mc-item:first-child { border-top: 0; }
.mc-item:hover { background: var(--sutil); }
.mc-item .cx { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--borda-forte); display: grid; place-items: center; color: transparent; flex-shrink: 0; }
.mc-item .cx .ico { width: 12px; height: 12px; stroke-width: 3; }
.mc-item[aria-pressed="true"] { color: var(--tinta); }
.mc-item[aria-pressed="true"] .cx { background: var(--fin); border-color: var(--fin); color: #fff; }
.mc-item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mc-item small { font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); white-space: nowrap; }
.mc-nota { display: flex; gap: 8px; align-items: flex-start; margin-top: 18px; padding: 9px 12px; border-radius: 8px; background: var(--sutil); font-size: 12.5px; color: var(--tinta-corpo); }
.mc-nota .ico { margin-top: 2px; color: var(--fin); }
/* data: o valor é um botão que abre o calendário com atalhos */

/* seletor de data: o mesmo popover do filtro de período (Financeiro), com um dia só */

/* usuário: cargos em cartões e as telas que ele abre */

.mc-tela-lin .caixa { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--borda-forte); display: grid; place-items: center; flex-shrink: 0; color: transparent; transition: background .12s, border-color .12s; }
.mc-tela-lin .caixa .ico { width: 12px; height: 12px; stroke-width: 3; }
.mc-tela.liga .mc-tela-lin .caixa { background: var(--fin); border-color: var(--fin); color: #fff; }
.dark .mc-tela.liga .mc-tela-lin .caixa { color: var(--fundo); }

<body>
<div class="proto">
  <span class="proto-nome">Comunicação</span>
  <span class="proto-nota">Dados reais · grava de verdade, pelas mesmas funções da tela de hoje</span>
  <button class="proto-tema" id="tema"><i data-lucide="moon" class="ico ico-s"></i><span>Escuro</span></button>
</div>
<main class="pg" id="tela"></main>
<div class="barra-mob" id="barra-mob"></div>

<script>
/*COMUNICACAO*/

/* ===== base ===== */
const ico = (n, c = 'ico') => `<i data-lucide="${n}" class="${c}"></i>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let HOJE = DADOS.hoje;
const dataLocal = iso => { const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d); };
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const somarDias = (iso, n) => { const d = dataLocal(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const diasEntre = (de, ate) => Math.round((dataLocal(ate) - dataLocal(de)) / 864e5);
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const reais = c => 'R$ ' + (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const dataLonga = iso => { if (!iso) return ''; const d = dataLocal(iso); return `${SEMANA[d.getDay()].slice(0, 3)}, ${d.getDate()} de ${MESES[d.getMonth()]}${d.getFullYear() !== +HOJE.slice(0, 4) ? ' de ' + d.getFullYear() : ''}`; };
const haDias = iso => { const n = diasEntre(iso, HOJE); return n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`; };
const lerSessao = (k, padrao) => { try { return sessionStorage.getItem(k) || padrao; } catch { return padrao; } };
const gravarSessao = (k, v) => { try { sessionStorage.setItem(k, v); } catch { /* sem armazenamento: só não lembra */ } };
// Pessoas: duas letras na cor fixa do nome (a mesma do chat e das etiquetas).
const iniciais = n => { const p = String(n).trim().split(/\s+/); return p.length > 1 ? (p[0][0] + p.at(-1)[0]).toUpperCase() : p[0].slice(0, 1).toUpperCase() + p[0].slice(1, 2).toLowerCase(); };
const av = n => `<i class="av" style="background:${DADOS.cores[n]?.[0] || '#64748b'};color:${DADOS.cores[n]?.[1] || '#fff'}">${esc(iniciais(n))}</i>`;
// Uma, duas ou várias pessoas: até três bolinhas e "+N"; o texto vira "Ana e Rafael" ou "3 pessoas".
function pessoas(lista, vazio = 'Sem responsável') {
  const ns = (lista || []).filter(Boolean);
  if (!ns.length) return `<span class="pessoas ninguem"><span class="nm">${vazio}</span></span>`;
  const txt = ns.length === 1 ? ns[0] : ns.length === 2 ? `${ns[0]} e ${ns[1]}` : `${ns.length} pessoas`;
  return `<span class="pessoas" title="${esc(ns.join(', '))}"><span class="avs">${ns.slice(0, 3).map(av).join('')}${ns.length > 3 ? `<i class="av mais">+${ns.length - 3}</i>` : ''}</span><span class="nm">${esc(txt)}</span></span>`;
}
const FOLHA = `<svg class="folha" viewBox="0 0 76 84" aria-hidden="true"><rect class="f-papel" x="18.5" y="14.5" width="39" height="55" rx="1.5"/><g class="f-marca"><path d="M6 14.5h8M18.5 2v8M62 14.5h8M57.5 2v8M6 69.5h8M18.5 74v8M62 69.5h8M57.5 74v8M2 42h12M8 36v12M62 42h12M68 36v12"/><circle cx="8" cy="42" r="3.5"/><circle cx="68" cy="42" r="3.5"/></g></svg>`;
// As ações vão para a página, que chama a tela de hoje. O foco sai daqui junto,
// senão o teclado fica preso atrás do modal que abre lá.
const paraPai = (msg, soltarFoco = false) => { if (window.parent === window) return; if (soltarFoco) document.activeElement?.blur(); window.parent.postMessage(msg, '/'); };
let toastTimer;
function toast(msg, desfazer) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = ico('check-circle-2') + `<span>${esc(msg)}</span>` + (desfazer ? '<button type="button">Desfazer</button>' : '');
  if (desfazer) el.querySelector('button').addEventListener('click', () => { el.remove(); desfazer(); });
  document.body.appendChild(el); lucide.createIcons(); toastTimer = setTimeout(() => el.remove(), desfazer ? 5000 : 2200);
}
async function copiar(txt, el, msg) {
  try { await navigator.clipboard.writeText(txt); } catch { return toast('Não deu para copiar'); }
  if (el) { el.classList.add('feito'); const antes = el.innerHTML; el.innerHTML = ico('check', el.classList.contains('ib') ? 'ico' : 'ico ico-s') + (el.classList.contains('ib') ? '' : '<span>Copiado</span>'); lucide.createIcons(); setTimeout(() => { el.classList.remove('feito'); el.innerHTML = antes; lucide.createIcons(); }, 1400); }
  else toast(msg);
}

/* ===== dados ===== */
let REQ = [], TAR = [], LNK = [];
// Excluídos esperando o fim do Desfazer: { chave → enviar }.
const excluindo = new Map();
// Compras: as colunas novas (fornecedor, urgente, conta) só existem depois de
// supabase/compras_itens_migration.sql. Antes dela, a lista funciona sem elas.
let MIGRADO = DADOS.colunasCompras !== false;
// Só o Administrador marca "Comprei" (que lança a conta a pagar).
let PODE_COMPRAR = !!DADOS.podeComprar;
const FORNS = () => DADOS.fornecedores || [];
const nomeForn = id => FORNS().find(f => f.id === id)?.nome || '';
// Requisição: o texto é a lista de compras como foi escrita, um item por linha.
const itensDe = r => String(r.itens || '').split(/\r?\n/).map(s => s.replace(/^\s*[-•*·]\s*/, '').trim()).filter(Boolean);
const hostDe = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
// O item como aparece: as linhas do texto juntas (os pedidos antigos têm várias).
const prepReq = r => { const lista = itensDe(r), forn = nomeForn(r.fornecedor); return { ...r, lista, nome: lista.join(' · '), forn, busca: semAcento([r.itens, r.obs, forn].join(' ')) }; };
function aplicarDados(d) {
  HOJE = d.hoje || HOJE;
  if (d.cores) DADOS.cores = d.cores;
  // a equipe chega da memória depois da primeira carga: entra aqui também
  if (d.pessoas) DADOS.pessoas = d.pessoas;
  if (d.fornecedores) DADOS.fornecedores = d.fornecedores;
  if ('podeComprar' in d) PODE_COMPRAR = !!d.podeComprar;
  if ('colunasCompras' in d) MIGRADO = d.colunasCompras !== false;
  // O que foi excluído e ainda está no prazo do Desfazer não volta com os dados novos.
  const fora = (tipo, x) => !excluindo.has(`x:${tipo}:${x.id}`);
  REQ = (d.requisicoes || []).filter(r => fora('requisicao', r)).map(prepReq);
  TAR = (d.tarefas || []).filter(t => fora('tarefa', t)).map(t => ({ ...t, busca: semAcento([t.titulo, t.descricao, ...t.responsaveis].join(' ')) }));
  LNK = (d.links || []).filter(l => fora('link', l)).map(l => ({ ...l, host: hostDe(l.link), busca: semAcento([l.titulo, l.cliente, l.link].join(' ')) }));
}
aplicarDados(DADOS);

const pendente = r => r.status === 'Pendente';
const aberta = t => t.fixa || t.status !== 'Concluída';
const linkAberto = l => !['Pago', 'Concluído', 'Inativo'].includes(l.status);
const linkPago = l => l.status === 'Pago' || l.status === 'Concluído';
// A régua do sistema: vencido ou hoje é vermelho, amanhã é âmbar.
const tomPrazo = iso => !iso ? '' : iso <= HOJE ? 'vermelho' : iso === somarDias(HOJE, 1) ? 'ambar' : '';
const atrasada = t => !t.fixa && t.status !== 'Concluída' && t.prazo && t.prazo < HOJE;

/* ===== abas ===== */
const ABAS = [
  { id: 'requisicoes', rot: 'Compras', icone: 'shopping-cart', novo: 'Anotar item', tipo: 'requisicao' },
  { id: 'tarefas', rot: 'Tarefas', icone: 'list-checks', novo: 'Nova tarefa', tipo: 'tarefa' },
  { id: 'links', rot: 'Links de pagamento', icone: 'link', novo: 'Novo link', tipo: 'link' },
].filter(a => !DADOS.abas || DADOS.abas.includes(a.id));
const numeroDaAba = id => {
  if (id === 'requisicoes') {
    const n = REQ.filter(pendente).length, u = REQ.filter(r => pendente(r) && r.urgente).length;
    return n ? [n, u > 0, u ? plural(u, 'item urgente', 'itens urgentes') : plural(n, 'item faltando', 'itens faltando')] : null;
  }
  if (id === 'tarefas') {
    const n = TAR.filter(t => aberta(t) && !t.feitaHoje).length, at = TAR.filter(atrasada).length;

function realce(txt, ts) {

  faixas.forEach(([a, b]) => { if (a < pos) a = pos; if (b <= a) return; out += esc(s.slice(pos, a)) + '<mark>' + esc(s.slice(a, b)) + '</mark>'; pos = b; });

}

  const porPrazo = (a, b) => (a.prazo || '9').localeCompare(b.prazo || '9') || a.id - b.id;
  const card = (t, de) => {
    const tom = tomPrazo(t.prazo), pri = tom === 'vermelho' ? 'pri-alta' : tom === 'ambar' ? 'pri-media' : '';
    const quando = t.prazo ? `${maiuscula(prazoTxt(t.prazo))} · ${t.prazo.slice(8)}/${t.prazo.slice(5, 7)}` : 'Quando sobrar tempo';

    st.ativo = Math.min(st.ativo, Math.max(0, ids.length - 1));

    let h = nenhum ? bt(null, 'Não sei ainda') : '';

/* --- eventos da janela: ela fica com o teclado e o clique enquanto aberta --- */
mcRaiz.addEventListener('click', e => {
  e.stopPropagation();
  if (!mc) return;
  if (mc.pop && !e.target.closest('.mc-pop')) { fecharPopMc(); if (e.target.closest('[data-mc="data"], [data-mc="forn"]')) return; }
  const t = e.target;
  const bt = t.closest('[data-mc]');
  if (bt) {
    const a = bt.dataset.mc;
    if (a === 'fechar') return fecharJanela();
    if (a === 'salvar') return salvarJanela();
    if (a === 'data') return abrirPopMc(bt);
    if (a === 'forn') return abrirPopForn(bt);
    if (a === 'ver-senha') { mc.verSenha = !mc.verSenha; return renderJanela(); }
    if (a === 'inter') { mc.v[bt.dataset.k] = !mc.v[bt.dataset.k]; mc.descartar = false; FORMS[mc.tipo].aoMudar?.(bt.dataset.k, mc); return renderJanela(); }

mcRaiz.addEventListener('input', e => {

  if (mc.erro && !Object.keys(mc.erros).length) { mc.erro = null; const m = mcRaiz.querySelector('.mc-msg.erro'); m?.remove(); }
});
document.addEventListener('keydown', e => {
  if (!mc) return;
  e.stopImmediatePropagation();
  if (e.key === 'Escape') { e.preventDefault(); if (mc.pop) { const k = mc.pop.k; fecharPopMc(); return document.getElementById('mc-' + k)?.focus(); } return fecharJanela(); }
  // a lista de fornecedores aberta fica com as setas e o Enter
  if (mc.pop?.tecla?.(e)) return;
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'Enter')) { e.preventDefault(); return salvarJanela(); }
  if (e.key === 'Enter' && e.target.matches?.('.mc-grande, .mc-linha')) { e.preventDefault(); return salvarJanela(); }
  // O Tab não sai da janela.
  if (e.key === 'Tab') {
    const caixa = mc.pop ? mcRaiz.querySelector('.mc-pop') : mcRaiz.querySelector('.mc'); if (!caixa) return;
    const focaveis = [...caixa.querySelectorAll('button:not([disabled]), input, textarea, a[href]')].filter(x => x.offsetParent !== null);

    if (e.shiftKey && (i <= 0)) { e.preventDefault(); focaveis.at(-1).focus(); }
    else if (!e.shiftKey && (i === focaveis.length - 1 || i < 0)) { e.preventDefault(); focaveis[0].focus(); }
  }
}, true);

// Os itens que estão faltando, com os do "Comprei" já marcados: dá para juntar
// outros que vieram na mesma compra.
function itensCompraHTML(m) {
  const pend = REQ.filter(r => pendente(r) && r.id > 0).sort((a, b) => (m.v.ids.includes(b.id) - m.v.ids.includes(a.id)) || (a.forn || '~').localeCompare(b.forn || '~', 'pt-BR'));
  return `<div class="mc-rot">O que foi comprado <span class="dica">${plural(m.v.ids.length, 'marcado', 'marcados')}</span>${m.erros.ids ? `<span class="mc-erro-i">${esc(m.erros.ids)}</span>` : ''}</div>
    <div class="mc-itens">${pend.map(r => `<button type="button" class="mc-item" data-item="${r.id}" aria-pressed="${m.v.ids.includes(r.id)}"><span class="cx">${ico('check', 'ico')}</span><span class="nm">${esc(r.nome)}</span>${r.forn ? `<small>${esc(r.forn)}</small>` : ''}</button>`).join('')}</div>`;
}

/* ===== gravar sem janela: anotar, urgência, passar tarefa ===== */
// A mudança aparece na hora; se a página responder com erro, `voltar` desfaz e
// um aviso explica.
const avulsos = new Map();
function salvarAvulso(tipo, id, dados, voltar) {
  const n = ++mcN; avulsos.set(n, voltar);
  paraPai({ tipo: `salvar-${tipo}`, n, id, dados });
}
let tmpN = 0;
function anotarItem(texto, { fornecedor = null, limpar = true } = {}) {
  const item = String(texto || '').trim(); if (!item) return;
  const urgente = MIGRADO && est.urgente;
  const tmp = -(++tmpN);
  REQ.unshift(prepReq({ id: tmp, itens: item, obs: '', status: 'Pendente', por: DADOS.eu, criado: HOJE, urgente, fornecedor: MIGRADO ? fornecedor : null, conta: null, compradoEm: '', compradoPor: '' }));
  if (limpar) est.anotar = '';
  est.urgente = false;
  const dados = { itens: item, observacoes: '', status: 'Pendente' };
  if (urgente) dados.urgente = true;
  if (MIGRADO && fornecedor) dados.fornecedor = fornecedor;
  salvarAvulso('requisicao', null, dados, () => { REQ = REQ.filter(x => x.id !== tmp); });
  render();
  toast(`Anotado: ${item}`);
}
function alternarUrgente(id) {
  const r = REQ.find(x => x.id === id); if (!r || id < 0) return;
  r.urgente = !r.urgente; redesenhar();
  salvarAvulso('requisicao', id, { itens: r.itens, observacoes: r.obs, status: r.status, urgente: r.urgente, fornecedor: r.fornecedor ?? null }, () => { r.urgente = !r.urgente; });
}
function passarTarefa(id, de, para) {
  if (de === para) return;
  const t = TAR.find(x => x.id === id); if (!t) return;
  const antes = [...t.responsaveis];
  const novos = antes.filter(n => n !== de); if (para && !novos.includes(para)) novos.push(para);
  t.responsaveis = novos; render();
  salvarAvulso('tarefa', id, { titulo: t.titulo, descricao: t.descricao, responsaveis: novos, prazo: t.prazo, fixa: t.fixa, status: t.status }, () => { t.responsaveis = antes; });
  toast(para ? `Passada para ${para}` : 'Agora sem dono');
}

/* ===== ações ===== */
// Concluir e excluir: o primeiro clique arma a pergunta no próprio botão (4s);
// o segundo manda para a tela de hoje, já confirmado. A lista muda na hora e o
// tempo real traz o registro de verdade logo depois.
let confTimer;
function armar(k) { est.conf = k; clearTimeout(confTimer); confTimer = setTimeout(() => { est.conf = null; redesenhar(); }, 4000); redesenhar(); }
function redesenhar() { render(); if (est.gaveta != null) renderGaveta(true); }
function concluir(tipo, id) {
  const x = porId(id); if (!x) return;
  if (tipo === 'tarefa' && x.fixa) {
    // A rotina de todo dia é desfeita com um clique: não pergunta, mostra Desfazer.
    const agora = new Date(), hora = `${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}`;
    x.feitaHoje = true; x.status = 'Concluída'; x.vezesHoje = [{ hora, por: DADOS.eu }, ...(x.vezesHoje || [])];
    CONC.chave = null; redesenhar();
    paraPai({ tipo: 'concluir-tarefa', id });
    return toast(`Feita às ${hora}`, () => reabrir(id));
  }
  const k = `${tipo}:${id}`;
  if (est.conf !== k) return armar(k);
  est.conf = null; clearTimeout(confTimer);
  // Grava na hora; a linha sai deslizando e o aviso diz o que aconteceu, com
  // Desfazer (que reabre a tarefa ou volta o link para ativo).
  paraPai({ tipo: `concluir-${tipo}`, id });
  const antes = { status: x.status, concluidaEm: x.concluidaEm };
  sairLinha(id, () => {
    if (tipo === 'tarefa') { x.status = 'Concluída'; x.concluidaEm = HOJE; }
    if (tipo === 'link') x.status = 'Pago';
    redesenhar();
    const titulo = x.titulo ? `: ${x.titulo}` : '';
    toast(`${tipo === 'link' ? 'Link marcado como pago' : 'Tarefa concluída'}${titulo}`, () => {
      Object.assign(x, antes); redesenhar();
      if (tipo === 'tarefa') salvarAvulso('tarefa', id, { titulo: x.titulo, descricao: x.descricao, responsaveis: x.responsaveis, prazo: x.prazo, fixa: false, status: antes.status || 'Pendente' }, () => { x.status = 'Concluída'; });
      if (tipo === 'link') salvarAvulso('link', id, { titulo: x.titulo, valor: x.valor || null, cliente: x.cliente, link: x.link, status: antes.status || 'Ativo' }, () => { x.status = 'Pago'; });
      toast(tipo === 'link' ? 'O link voltou para ativo' : 'A tarefa voltou para a lista');
    });
  });
}
// A linha some deslizando antes de a lista ser redesenhada sem ela.
function sairLinha(id, depois) {
  const el = document.querySelector(`#corpo .lin[data-reg="${id}"]`);
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return depois();
  el.classList.add('saindo'); setTimeout(depois, 280);
}
// Desfazer da rotina: tira a última vez de hoje; se sobrar outra, continua feita.
function reabrir(id) {
  const x = TAR.find(t => t.id === id); if (!x) return;
  x.vezesHoje = (x.vezesHoje || []).slice(1);
  x.feitaHoje = x.vezesHoje.length > 0; x.status = x.feitaHoje ? 'Concluída' : 'Pendente';
  CONC.chave = null; redesenhar(); paraPai({ tipo: 'reabrir-tarefa', id });
}
// Excluir: o segundo clique tira o item da tela na hora e mostra "Excluído ·
// Desfazer". A exclusão de verdade só vai quando o aviso some (ou quando a
// tela fecha); Desfazer devolve o item para o mesmo lugar, sem ter apagado nada.
function excluir(tipo, id) {
  const k = `x:${tipo}:${id}`;
  if (est.conf !== k) return armar(k);
  est.conf = null; clearTimeout(confTimer);
  const pega = () => tipo === 'requisicao' ? REQ : tipo === 'tarefa' ? TAR : LNK;
  const poe = l => { if (tipo === 'requisicao') REQ = l; else if (tipo === 'tarefa') TAR = l; else LNK = l; };
  const item = pega().find(x => x.id === id); if (!item) return;
  const pos = pega().indexOf(item);
  const nome = item.nome || item.titulo || '';
  const enviar = () => { if (!excluindo.has(k)) return; clearTimeout(excluindo.get(k).timer); excluindo.delete(k); paraPai({ tipo: `excluir-${tipo}`, id }); };
  excluindo.set(k, { enviar, timer: setTimeout(enviar, 5200) });
  fecharGaveta(true);
  sairLinha(id, () => {
    poe(pega().filter(x => x.id !== id)); render();
    toast(`${{ requisicao: 'Item excluído', tarefa: 'Tarefa excluída', link: 'Link excluído' }[tipo]}${nome ? `: ${nome}` : ''}`, () => {
      const p = excluindo.get(k); if (!p) return; clearTimeout(p.timer); excluindo.delete(k);
      const l = [...pega()]; l.splice(Math.min(pos, l.length), 0, item); poe(l); render();
      toast('Exclusão desfeita');
    });
  });
}
// Fechar a tela com uma exclusão no prazo do Desfazer: ela vai assim mesmo.
addEventListener('pagehide', () => excluindo.forEach(p => p.enviar()));
function agir(a, el) {
  const id = el?.dataset.id != null ? +el.dataset.id : null, tipo = el?.dataset.tipo || abaAtual().tipo;
  if (a === 'grupo' || a === 'todos') return agirGrupo(a, el);
  // Novo e editar abrem a janela nova, aqui mesmo; quem grava é a página.
  // Em Compras › Falta, "novo" é o campo de anotar, em cima da lista.
  if (a === 'novo') { const i = document.getElementById('anotar'); if (i) { i.focus(); return i.scrollIntoView({ block: 'nearest' }); } return abrirJanela(abaAtual().tipo, null); }
  if (a === 'comprar') { const ids = String(el.dataset.ids || '').split(',').map(Number).filter(n => n > 0); return ids.length && abrirJanela('compra', { ids }); }
  if (a === 'urgente') return alternarUrgente(id);
  if (a === 'periodo') return abrirPeriodo(el, est.perConc, p => { est.perConc = p; est.ativo = null; render(); });
  if (a === 'urg-novo') { est.urgente = !est.urgente; el.setAttribute('aria-pressed', String(est.urgente)); return document.getElementById('anotar')?.focus(); }
  if (a === 'denovo') { const c = deNovo()[+el.dataset.i]; return c && anotarItem(c.nome, { fornecedor: c.forn, limpar: false }); }
  if (a === 'vista-req' || a === 'vista-tar') {
    const k = a === 'vista-req' ? 'vistaReq' : 'vistaTar'; if (est[k] === el.dataset.v) return;
    est[k] = el.dataset.v; gravarSessao(a === 'vista-req' ? 'com-vreq' : 'com-vtar', el.dataset.v); est.ativo = null; return render();
  }
  if (a === 'copiar-pedido') {
    const ids = String(el.dataset.ids || '').split(',').map(Number);
    const itens = REQ.filter(r => ids.includes(r.id));
    return itens.length && copiar(`Olá! Gostaria de fazer um pedido:\n${itens.map(r => `• ${r.nome}`).join('\n')}`, el);
  }
  if (a === 'editar') { const x = porId(id); return x && abrirJanela(abaAtual().tipo, x); }
  if (a === 'concluir') return concluir(tipo, id);
  if (a === 'reabrir') { reabrir(id); return toast('Desfeita a última'); }
  if (a === 'excluir') return excluir(tipo, id);
  if (a === 'copiar') { const l = LNK.find(x => x.id === id); return l?.link && copiar(l.link, el); }
  if (a === 'copiar-itens') { const r = REQ.find(x => x.id === id); return r && copiar(r.lista.join('\n'), el); }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#tema')) return;
  // O período aberto fecha com o clique de fora; no próprio botão, só fecha.
  if (perPop) { const no = perPop.ancora.contains(t); fecharPeriodo(); if (no) return; }
  const acao = t.closest('[data-acao]');
  if (acao) {
    if (acao.tagName === 'A') return;
    e.stopPropagation();
    const a = acao.dataset.acao;
    if (a === 'fechar') return fecharGaveta();
    if (a === 'limpar') { est.busca = ''; render(); return document.getElementById('busca')?.focus(); }
    return agir(a, acao);
  }
  const aba = t.closest('[data-aba]'); if (aba) return trocarAba(aba.dataset.aba);
  const chip = t.closest('[data-chip]'); if (chip) { est[chip.dataset.chip] = chip.dataset.v; est.ativo = null; return render(); }
  const lin = t.closest('[data-reg]'); if (lin && +lin.dataset.reg > 0) return abrirGaveta(+lin.dataset.reg);
});
document.addEventListener('input', e => {
  if (e.target.id === 'anotar') { est.anotar = e.target.value; return; }
  if (e.target.id !== 'busca') return;
  est.busca = e.target.value; est.ativo = est.busca ? ordem()[0]?.id ?? null : null; render();
});
document.addEventListener('keydown', e => {
  const alvo = e.target; const digitando = alvo.matches?.('input, textarea'); const naBusca = alvo.id === 'busca';
  if (alvo.id === 'anotar' && e.key === 'Enter') { e.preventDefault(); return anotarItem(est.anotar); }
  if (alvo.id === 'anotar' && e.key === 'Escape' && est.anotar) { est.anotar = ''; alvo.value = ''; return; }
  if (e.key === 'Escape') {
    if (perPop) { const a = perPop.ancora; fecharPeriodo(); return a.focus(); }
    if (est.conf) { est.conf = null; return redesenhar(); }
    if (est.gaveta != null) { e.preventDefault(); return fecharGaveta(); }
    if (est.busca) { est.busca = ''; return render(); }
    return alvo.blur?.();
  }
  if (alvo.closest?.('.abas') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault(); const ids = ABAS.map(a => a.id), i = ids.indexOf(est.aba);
    trocarAba(ids[(i + (e.key === 'ArrowRight' ? 1 : -1) + ids.length) % ids.length]);
    return tela.querySelector('.aba[aria-selected="true"]')?.focus();
  }
  if (e.key === '/' && !digitando) { e.preventDefault(); return (document.getElementById('busca') || document.getElementById('anotar'))?.focus(); }
  if (!digitando && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); return agir('novo'); }
  if (digitando && !naBusca) return;
  if (est.gaveta != null) return;
  // Enter numa linha focada pelo Tab abre ela, como o clique.
  const lin = alvo.closest?.('[data-reg]');
  if (lin && alvo === lin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return abrirGaveta(+lin.dataset.reg); }
  const o = ordem(); if (!o.length) return;
  const i = o.findIndex(x => x.id === est.ativo);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    est.ativo = o[Math.max(0, Math.min(o.length - 1, i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1)))].id;
    render(); document.querySelector(`.lin[data-reg="${est.ativo}"]`)?.scrollIntoView({ block: 'nearest' }); return;
  }
  if (e.key === 'Enter' && i >= 0) { e.preventDefault(); return abrirGaveta(o[i].id); }
});

// O tempo real chega pela página: troca os dados e redesenha no lugar, sem
// tirar o foco de quem está digitando e sem fechar a gaveta aberta.
window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  if (e.data?.tipo === 'salvo') {
    if (avulsos.has(e.data.n)) { const voltar = avulsos.get(e.data.n); avulsos.delete(e.data.n); if (!e.data.ok) { voltar?.(); redesenhar(); toast(e.data.erro || 'Não deu para salvar'); } return; }
    return aoSalvarJanela(e.data);
  }
  if (e.data?.tipo === 'conclusoes') {
    if (e.data.pedido !== CONC.pedido) return;
    CONC.lista = e.data.erro ? [] : (e.data.lista || []);
    if (e.data.cortado) toast('Mostrando as 5.000 vezes mais recentes: escolha um período menor');
    return redesenhar();
  }
  if (e.data?.tipo !== 'dados') return;
  // Concluídas aberta: as tarefas mudaram (alguém fez uma rotina), então as vezes do período são pedidas de novo.
  if (est.aba === 'tarefas' && est.tar === 'concluidas') CONC.chave = null;
  aplicarDados(e.data.dados);
  render();
  if (est.gaveta != null) { if (porId(est.gaveta)) renderGaveta(true); else fecharGaveta(true); }
});

/* ===== período: o mesmo seletor do Financeiro (atalhos à esquerda, intervalo à direita) ===== */
const ultimoDiaMes = iso => { const [a, m] = iso.split('-').map(Number); return isoDe(new Date(a, m, 0)); };
const mesMais = (ym, n) => { const [a, m] = ym.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
// Só datas que já passaram: aqui não entra "Próximo mês".
const PERIODOS = [
  { id: '', nome: 'Todo o período' },
  { id: 'mes', nome: 'Este mês', de: () => HOJE.slice(0, 8) + '01', ate: () => ultimoDiaMes(HOJE) },
  { id: 'mespassado', nome: 'Mês passado', de: () => mesMais(HOJE.slice(0, 7), -1) + '-01', ate: () => ultimoDiaMes(mesMais(HOJE.slice(0, 7), -1) + '-01') },
  { id: '30', nome: 'Últimos 30 dias', de: () => somarDias(HOJE, -29), ate: () => HOJE },
  { id: 'ano', nome: 'Este ano', de: () => HOJE.slice(0, 4) + '-01-01', ate: () => HOJE.slice(0, 4) + '-12-31' },
];
const periodoDe = id => { const x = PERIODOS.find(p => p.id === id); return x?.id ? { id, de: x.de(), ate: x.ate() } : { id: '', de: '', ate: '' }; };
const comPeriodo = p => !!(p.de || p.ate);
const dataCurta = iso => !iso ? '…' : iso.slice(0, 4) === HOJE.slice(0, 4) ? `${iso.slice(8)}/${iso.slice(5, 7)}` : `${iso.slice(8)}/${iso.slice(5, 7)}/${iso.slice(2, 4)}`;
const rotuloPeriodo = p => { if (!comPeriodo(p)) return 'Todo o período'; const pre = PERIODOS.find(x => x.id && x.id === p.id); return pre ? pre.nome : `${dataCurta(p.de)} – ${dataCurta(p.ate)}`; };
const botaoPeriodo = (p, dica) => `<button class="per ${comPeriodo(p) ? 'ativo' : ''}" data-acao="periodo" aria-haspopup="dialog" title="${esc(dica)}">${ico('calendar', 'ico ico-s')}<span>${esc(rotuloPeriodo(p))}</span>${ico('chevron-down', 'ico ico-s chev')}</button>`;
est.perConc = periodoDe('');
let perPop = null;
function fecharPeriodo() { perPop?.el.remove(); perPop?.ancora.setAttribute('aria-expanded', 'false'); perPop = null; }
function calPeriodo(c, p) {
  const y = c.base.getFullYear(), m = c.base.getMonth();
  const cab = (passo, titulo, vista) => `<div class="pcal-cab"><button type="button" class="pcal-nav" data-nav="${-passo}" aria-label="Anterior">${SETA_E_MC}</button>${vista ? `<button type="button" class="pcal-tit" data-vista="${vista}">${titulo}</button>` : `<span class="pcal-tit">${titulo}</span>`}<button type="button" class="pcal-nav" data-nav="${passo}" aria-label="Próximo">${SETA_D_MC}</button></div>`;
  if (c.vista === 'meses') return cab(12, y, 'anos') + `<div class="pcal-grade">${MESES_MC.map((n, i) => `<button type="button" class="pcal-op ${i === m ? 'on' : ''}" data-pmes="${i}">${n.slice(0, 3)}</button>`).join('')}</div>`;
  if (c.vista === 'anos') { const anos = Array.from({ length: 12 }, (_, i) => y - 5 + i);
    return cab(144, `${anos[0]} – ${anos[11]}`) + `<div class="pcal-grade">${anos.map(a => `<button type="button" class="pcal-op ${a === y ? 'on' : ''}" data-pano="${a}">${a}</button>`).join('')}</div>`; }
  // Com o início escolhido e o fim ainda não, a faixa acompanha o mouse (prévia).
  const fim = p.ate || (p.de && c.hover && c.hover > p.de ? c.hover : '');
  let cel = '';
  for (let i = new Date(y, m, 1).getDay(); i > 0; i--) cel += '<span></span>';
  for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const cls = [iso === HOJE && 'hoje', iso === p.de && 'ini', iso === p.de && fim && fim !== p.de && 'com-fim', fim && iso === fim && 'fim', p.de && fim && iso > p.de && iso < fim && 'meio'].filter(Boolean).join(' ');
    cel += `<button type="button" class="pd ${cls}" data-pdia="${iso}" aria-label="${d} de ${MESES_MC[m]}"><b>${d}</b></button>`;
  }
  const dica = !p.de ? 'Escolha a data inicial' : !p.ate ? `De <b>${dataCurta(p.de)}</b> até…` : `<b>${dataCurta(p.de)}</b> – <b>${dataCurta(p.ate)}</b>`;
  return cab(1, `${MESES_MC[m][0].toUpperCase() + MESES_MC[m].slice(1)} de ${y}`, 'meses')
    + `<div class="pcal-sem">${SEMANA_MC.map(s => `<span>${s}</span>`).join('')}</div>`
    + `<div class="pcal-dias ${p.de && !p.ate && fim ? 'previa' : ''}">${cel}</div>`
    + `<div class="pcal-pe"><span>${dica}</span>${p.de ? '<button type="button" class="pcal-limpar" data-plimpar>Limpar</button>' : ''}</div>`;
}
// `aoEscolher` só recebe um período pronto (atalho, intervalo completo ou limpar).
function abrirPeriodo(anc, atual, aoEscolher) {
  fecharPeriodo();
  let sel = { ...atual };
  const ref = sel.de && sel.ate && sel.de <= HOJE && HOJE <= sel.ate ? HOJE : sel.ate || sel.de || HOJE;
  const c = { vista: 'dias', base: new Date(ref.slice(0, 7) + '-01T12:00:00'), hover: null };
  const atalhos = () => PERIODOS.map(x => { const on = x.id ? sel.id === x.id : !comPeriodo(sel); return `<button type="button" class="${on ? 'on' : ''}" data-p="${x.id}">${x.nome}${on ? OK_MC : ''}</button>`; }).join('');
  const el = document.createElement('div'); el.className = 'mc-pop'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Escolher o período');
  el.innerHTML = `<div class="per-pop"><div class="atalhos">${atalhos()}</div><div class="pcal">${calPeriodo(c, sel)}</div></div>`;
  document.body.appendChild(el);
  const r = anc.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.right - el.offsetWidth, innerWidth - el.offsetWidth - 8)) + 'px';
  const topo = r.bottom + el.offsetHeight + 6 > innerHeight && r.top > el.offsetHeight + 6 ? r.top - el.offsetHeight - 6 : r.bottom + 6;
  el.style.top = Math.max(8, Math.min(topo, innerHeight - el.offsetHeight - 8)) + 'px';
  perPop = { el, ancora: anc }; anc.setAttribute('aria-expanded', 'true');
  const desenhar = () => { el.querySelector('.pcal').innerHTML = calPeriodo(c, sel); };
  const escolher = p => { fecharPeriodo(); aoEscolher(p); };
  el.addEventListener('mousedown', e => e.preventDefault());
  el.addEventListener('click', e => {
    // O clique redesenha o calendário e o alvo sai do documento: sem parar aqui,
    // o clique "de fora" fecharia o popover.
    e.stopPropagation();
    const at = e.target.closest('[data-p]'); if (at) return escolher(periodoDe(at.dataset.p));
    const nav = e.target.closest('[data-nav]'); if (nav) { c.base.setMonth(c.base.getMonth() + +nav.dataset.nav); return desenhar(); }
    const vista = e.target.closest('[data-vista]'); if (vista) { c.vista = vista.dataset.vista; return desenhar(); }
    const mes = e.target.closest('[data-pmes]'); if (mes) { c.base.setMonth(+mes.dataset.pmes); c.vista = 'dias'; return desenhar(); }
    const ano = e.target.closest('[data-pano]'); if (ano) { c.base.setFullYear(+ano.dataset.pano); c.vista = 'meses'; return desenhar(); }
    if (e.target.closest('[data-plimpar]')) return escolher(periodoDe(''));
    const dia = e.target.closest('[data-pdia]'); if (!dia) return;
    const iso = dia.dataset.pdia;
    // Primeiro clique marca o início; o segundo, o fim (antes do início recomeça).
    if (!sel.de || sel.ate || iso < sel.de) { sel = { id: 'livre', de: iso, ate: '' }; c.hover = null; el.querySelector('.atalhos').innerHTML = atalhos(); return desenhar(); }
    escolher({ id: 'livre', de: sel.de, ate: iso });
  });
  el.addEventListener('mouseover', e => {
    const d = e.target.closest('[data-pdia]')?.dataset.pdia || null;
    if (d === c.hover || (!d && e.target.closest('.pcal-dias'))) return; c.hover = d;
    if (sel.de && !sel.ate) desenhar();
  });
  (el.querySelector('.atalhos .on') || el.querySelector('.atalhos button'))?.focus();
}
addEventListener('resize', () => fecharPeriodo());
addEventListener('scroll', e => { if (perPop && !perPop.el.contains(e.target)) fecharPeriodo(); }, true);

/* ===== arrastar tarefa entre pessoas (vista Equipe) ===== */
let arrasto = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.eq-card'); if (!c) return;
  arrasto = { id: +c.dataset.reg, de: c.dataset.de };
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', c.dataset.reg);
  c.classList.add('arrastando');
});
document.addEventListener('dragend', e => {
  e.target.closest?.('.eq-card')?.classList.remove('arrastando');
  document.querySelectorAll('.eq-col.alvo').forEach(x => x.classList.remove('alvo'));
  arrasto = null;
});
document.addEventListener('dragover', e => {
  const col = e.target.closest?.('.eq-col'); if (!col || !arrasto) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.eq-col.alvo').forEach(x => { if (x !== col) x.classList.remove('alvo'); });
  col.classList.add('alvo');
});
document.addEventListener('drop', e => {
  const col = e.target.closest?.('.eq-col'); if (!col || !arrasto) return;
  e.preventDefault();
  const { id, de } = arrasto; arrasto = null;
  passarTarefa(id, de, col.dataset.col);
});

/* ===== troca de tema (a mesma do sistema) ===== */
const temaBtn = document.getElementById('tema');
const pintarTema = escuro => { document.documentElement.classList.toggle('dark', escuro); temaBtn.innerHTML = ico(escuro ? 'sun' : 'moon', 'ico ico-s') + `<span>${escuro ? 'Claro' : 'Escuro'}</span>`; lucide.createIcons(); };
function trocarTema(escuro) {
  const raiz = document.documentElement;
  if (!document.startViewTransition) return pintarTema(escuro);
  const r = temaBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(() => pintarTema(escuro)); let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate({ clipPath: escuro ? circulo : circulo.reverse() }, { duration: escuro ? 600 : 450, easing: escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)', fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)' });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}
temaBtn.addEventListener('click', () => trocarTema(!document.documentElement.classList.contains('dark')));
if (DADOS.escuro) pintarTema(true);
render();
paraPai({ tipo: 'pronto' });
</script>
