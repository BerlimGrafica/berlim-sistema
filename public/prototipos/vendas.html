function conteudoCateg() {
  const nome = categ.nome;
  const cab = `<div class="det-cab"><span>Despesas por categoria</span><span class="det-ferr"><button class="ib" data-fechar-gv aria-label="Fechar" title="Fechar (Esc)">${ico('x')}</button></span></div>
    <div class="det-tit"><i class="dot categ-dot" style="background:${COR_CATEG[nome] || '#9ca3af'}"></i>${esc(nome)}</div>
    <div class="det-sub">contas com vencimento em ${esc(rotuloPeriodo().toLowerCase())}</div>`;
  if (categ.erro) return `<div class="det">${cab}<div class="vazio" style="padding:18px 0">${ico('alert-triangle')}${esc(categ.erro)}</div></div>`;
  if (!categ.contas) return `<div class="det">${cab}<div class="dsec a-dados" aria-busy="true"><div class="dsec-cab"><h3>Carregando as contas…</h3></div><div class="espera">${Array.from({ length: 5 }, (_, i) => `<div style="--i:${i}"><i style="width:${40 + (i % 3) * 14}%;--i:${i}"></i><i style="width:64px;--i:${i}"></i></div>`).join('')}</div></div></div>`;
  const l = categ.contas;
  if (!l.length) return `<div class="det">${cab}<div class="vazio" style="padding:18px 0">${ico('receipt')}Nenhuma conta desta categoria no período.</div></div>`;
  const pagaC = c => c.status === 'Pago', vencidaC = c => !pagaC(c) && c.vencimento < HOJE;
  const total = soma(l, c => c.valor), pago = soma(l.filter(pagaC), c => c.valor), pendente = total - pago;
  const vencidas = l.filter(vencidaC).length;
  // O que é igual soma junto: o mesmo fornecedor ou, sem fornecedor, a mesma
  // descrição (sem acento, caixa e espaços sobrando). A Futura com dez
  // lançamentos vira uma linha só, com o total gasto nela.
  const chave = c => semAcento(c.fornecedor || c.descricao).replace(/\s+/g, ' ').trim();
  const grupos = [...l.reduce((m, c) => {
    const k = chave(c), g = m.get(k) || { chave: k, nome: c.fornecedor || c.descricao, contas: [] };
    g.contas.push(c); m.set(k, g); return m;
  }, new Map()).values()].map(g => ({ ...g, total: soma(g.contas, c => c.valor), pendente: soma(g.contas.filter(c => !pagaC(c)), c => c.valor), vencidas: g.contas.filter(vencidaC).length }))
    .sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
  const maior = Math.max(1, ...grupos.map(g => g.total)), cor = COR_CATEG[categ.nome] || '#9ca3af';
  const tom = c => pagaC(c) ? 'paga' : vencidaC(c) ? 'atraso' : c.vencimento === HOJE ? 'hoje' : '';
  const sit = c => pagaC(c) ? 'paga' : vencidaC(c) ? '<span class="desce">vencida</span>' : c.vencimento === HOJE ? 'vence hoje' : 'a pagar';
  const repete = c => c.recorrente ? (c.parcelas ? `parcela ${c.parcela || 1} de ${c.parcelas}` : 'todo mês') : '';
  // Dentro do grupo, a descrição só aparece quando diz algo além do nome dele.
  const desc = (c, g) => semAcento(c.descricao).replace(/\s+/g, ' ').trim() !== g.chave ? esc(c.descricao) : '';
  const linhaConta = (c, g) => `<li><div class="lin">${dataEmBloco(c.vencimento, tom(c))}<span class="lin-txt"><span class="lin-tit">${desc(c, g) || reais(c.valor)}</span><span class="lin-sub">${[sit(c), repete(c)].filter(Boolean).join(' · ')}</span></span><span class="lin-dir num">${desc(c, g) ? (c.valor ? reais(c.valor) : '<small>a definir</small>') : ''}</span><button class="ib" data-editar-conta="${c.id}" aria-label="Editar ${esc(c.descricao)} no modal atual" title="Editar no modal atual">${ico('pencil', 'ico ico-s')}</button></div></li>`;
  return `<div class="det">${cab}
    <div class="det-valor"><small>R$</small>${brl(total, true)}</div>
    <div class="det-sub"><b>${plural(l.length, 'conta', 'contas')}</b> · pago <b>${reais(pago)}</b> · ${pendente > 0 ? `<span class="desce">${reais(pendente)} pendente</span>` : '<span class="sobe">tudo pago</span>'}${vencidas ? ` · <span class="desce">${plural(vencidas, 'vencida', 'vencidas')}</span>` : ''}</div>
    <div class="comp">${partes([{ v: pago, cls: 'ok' }, { v: pendente, cls: 'atr' }], total).replace('class="medidor rv"', 'class="medidor" style="height:8px"')}</div>
    <section class="dsec a-dados"><div class="dsec-cab"><h3>Contas iguais somadas</h3><span class="area-meta">${plural(grupos.length, 'linha', 'linhas')} · do maior para o menor</span></div>
      <ul class="grupos">${grupos.map(g => { const aberto = categ.abertos.has(g.chave);
        return `<li class="grp ${aberto ? 'aberto' : ''}"><button class="grp-bt" data-grupo="${esc(g.chave)}" aria-expanded="${aberto}" title="${aberto ? 'Esconder' : 'Ver'} as contas que entram nesta soma">
          <span class="grp-nome">${esc(g.nome)}</span><span class="grp-v num">${reais(g.total)}</span>${ico('chevron-down', 'ico ico-s chev')}
          <span class="grp-sub">${plural(g.contas.length, 'conta', 'contas')} · ${pctTxt(g.total, total)} da categoria${g.pendente ? ` · <span class="desce">${reais(g.pendente)} pendente</span>` : ''}${g.vencidas ? ` · <span class="desce">${plural(g.vencidas, 'vencida', 'vencidas')}</span>` : ''}</span>
          <span class="grp-trilho"><i style="width:${g.total ? Math.max(2, g.total / maior * 100) : 0}%;background:${cor}"></i></span></button>
          ${aberto ? `<ul class="lista grp-itens">${[...g.contas].sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || '')).map(c => linhaConta(c, g)).join('')}</ul>` : ''}</li>`; }).join('')}</ul></section>
    <p class="det-sub" style="margin-top:10px">Clique numa linha para ver as contas que entram na soma. O lápis abre a conta no modal de hoje, que é onde se edita.</p>
  </div>`;
}

/* ===== a gaveta: o relatório do dia ou as contas de uma categoria ===== */
const gavetaAberta = () => !!(dia.iso || categ.nome);
function fecharGaveta() {
  const volta = dia.iso ? document.querySelector(`[data-dia="${dia.iso}"]`) : categ.nome ? [...document.querySelectorAll('[data-categ]')].find(e => e.dataset.categ === categ.nome) : null;
  dia.iso = null; categ.nome = null; renderGaveta(); volta?.focus({ preventScroll: true });
}
function renderGaveta() {
  let veu = gvRaiz.querySelector('.gv-veu'), g = gvRaiz.querySelector('.gaveta');
  if (!gavetaAberta()) {
    if (g && !g.classList.contains('sai')) {
      veu.classList.add('sai'); g.classList.add('sai');
      const tirar = () => { if (!gavetaAberta()) gvRaiz.innerHTML = ''; };
      g.addEventListener('animationend', tirar, { once: true }); setTimeout(tirar, 400);
    }
    return;
  }
  if (!g || g.classList.contains('sai')) {
    gvRaiz.innerHTML = '<div class="gv-veu" data-fechar-gv></div><aside class="gaveta" role="dialog" aria-modal="true" tabindex="-1"></aside>';
    g = gvRaiz.querySelector('.gaveta');
    g.addEventListener('scroll', () => g.classList.toggle('rolou', g.scrollTop > 4), { passive: true });
    setTimeout(() => g.focus({ preventScroll: true }), 30);
  }
  g.setAttribute('aria-label', dia.iso ? 'Vendas do dia' : `Contas de ${categ.nome}`);
  g.innerHTML = dia.iso ? conteudoDia() : conteudoCateg();
  lucide.createIcons();
}

/* ===== tela ===== */
const tela = document.getElementById('tela');
const TELAS = { geral: telaGeral, vendas_produto: telaProdutos, vendas_cliente: telaClientes };
function cabecalho() {
  const comp = rotuloComparacao();
  const anda = est.per.tipo === 'mes' || est.per.tipo === 'ano';
  const unidade = est.per.tipo === 'ano' ? 'ano' : 'mês';
  const noAtual = est.per.tipo === 'mes' && est.per.chave === HOJE.slice(0, 7);
  return `<div class="cab"><div><h1>Vendas</h1>
      <p class="sub">${est.carregando ? `<span class="somando">${ico('loader-circle')}somando ${esc(rotuloPeriodo().toLowerCase())} no banco…</span>` : comp && !ANT?.resumo?.bruto_centavos ? `<span>sem vendas em <b>${esc(comp)}</b> para comparar</span>` : comp ? `<span>comparando com <b>${esc(comp)}</b>${est.per.fim > HOJE && est.per.inicio <= HOJE ? ', até o mesmo dia' : ''}</span>` : '<span>todo o histórico, sem comparação</span>'}</p></div>
    <div class="cab-dir">
      ${noAtual ? '' : '<button class="voltar-mes" data-atalho="mes">Este mês</button>'}
      <div class="mes" role="group" aria-label="Período">
        <button class="ib" data-andar="-1" ${anda ? '' : 'disabled'} aria-label="${maiuscula(unidade)} anterior" title="${maiuscula(unidade)} anterior (←)">${ico('chevron-left')}</button>
        <button class="rot" id="per-bt" aria-haspopup="dialog" aria-expanded="false" title="Escolher o período">${ico('calendar', 'ico ico-s')}${esc(rotuloPeriodo())}${ico('chevron-down', 'ico ico-s chev')}</button>
        <button class="ib" data-andar="1" ${anda ? '' : 'disabled'} aria-label="Próximo ${unidade}" title="Próximo ${unidade} (→)">${ico('chevron-right')}</button>
      </div>
    </div></div>
    <div class="faixa"><div class="abas" role="tablist" aria-label="Partes de Vendas">${ABAS.map(([id, rot, ic]) => {
      const n = id === 'vendas_produto' ? (M.ranking_produto || []).length : id === 'vendas_cliente' ? (M.ranking_cliente || []).filter(c => !c.eh_balcao).length : null;
      return `<button class="aba" role="tab" data-aba="${id}" aria-selected="${est.aba === id}">${ico(ic, 'ico ico-s')}${rot}${n != null ? `<span class="n">${inteiro(n)}</span>` : ''}</button>`; }).join('')}<span class="indicador"></span></div></div>`;
}
let indicadorAnt = null;
function moverIndicador() {
  const ind = tela.querySelector('.indicador'), alvo = tela.querySelector('.aba[aria-selected="true"]');
  if (!ind || !alvo) return;
  const por = (l, w) => { ind.style.left = `${l}px`; ind.style.width = `${w}px`; };
  if (indicadorAnt) { ind.style.transition = 'none'; por(...indicadorAnt); ind.offsetWidth; ind.style.transition = ''; }
  else { ind.style.transition = 'none'; por(alvo.offsetLeft, alvo.offsetWidth); ind.offsetWidth; ind.style.transition = ''; }
  por(alvo.offsetLeft, alvo.offsetWidth);
  indicadorAnt = [alvo.offsetLeft, alvo.offsetWidth];
}
// O fundo do controle de segmentos desliza até o botão escolhido; `de` é o
// botão de onde ele sai (sem `de`, já aparece no lugar).
function moverTrilho(segEl, de) {
  const tr = segEl?.querySelector('.seg-trilho'), alvo = segEl?.querySelector('[aria-pressed="true"]');
  if (!tr || !alvo) return;
  const por = el => { tr.style.width = `${el.offsetWidth}px`; tr.style.transform = `translateX(${el.offsetLeft}px)`; };
  tr.style.transition = 'none'; por(de || alvo); tr.offsetWidth; tr.style.transition = '';
  if (de) por(alvo);
}
// modo: 'abrir' (a tela entra), 'lado' (troca de aba), 'troca' (chegou outro
// período: o conteúdo reacende e as marcas crescem de novo) ou 'quieto'.
function render(modo = 'quieto', lado = 0) {
  tela.classList.toggle('parado', modo === 'quieto');
  tela.innerHTML = cabecalho()
    + (est.erro ? `<div class="erro-faixa">${ico('alert-triangle')}Não foi possível somar o período: ${esc(est.erro)}</div>` : '')
    + `<div class="conteudo ${est.carregando ? 'esperando' : ''} ${modo === 'troca' ? 'troca' : ''}" id="conteudo" aria-busy="${est.carregando}">${(TELAS[est.aba] || telaGeral)()}</div>`;
  lucide.createIcons();
  moverIndicador();
  moverTrilho(tela.querySelector('.seg'));
  if (modo === 'abrir' || modo === 'lado') animarEntrada(lado);
}
// A ordem é a de leitura — de cima para baixo, da esquerda para a direita — e a
// espera para no décimo quadro, para ninguém lá embaixo ficar esperando.
function animarEntrada(lado) {
  tela.classList.toggle('lateral', lado !== 0);
  tela.style.setProperty('--dx', `${lado < 0 ? -16 : 16}px`);
  const marcar = (el, d) => { el.style.setProperty('--d', `${d}ms`); el.classList.add('entra'); };
  let t = 0;
  if (lado === 0) { marcar(tela.querySelector('.cab'), 0); t = 70; }
  const faixa = tela.querySelector('.numeros');
  if (faixa) { marcar(faixa, t); faixa.querySelectorAll('.n-cel').forEach((c, k) => marcar(c, t + 60 + k * 55)); t += 200; }
  const linha = el => Math.round(el.getBoundingClientRect().top / 12);
  [...tela.querySelectorAll('#conteudo .area, #conteudo .secao')]
    .sort((a, b) => linha(a) - linha(b) || a.getBoundingClientRect().left - b.getBoundingClientRect().left)
    .forEach((el, k) => marcar(el, t + Math.min(k, 9) * 60));
}

/* ===== popover do período ===== */
let popAberto = null;
function fecharPop() { if (!popAberto) return; popAberto.el.remove(); popAberto.ancora?.setAttribute('aria-expanded', 'false'); popAberto = null; }
const SETA = d => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const SETA_E = SETA('m15 18-6-6 6-6'), SETA_D = SETA('m9 18 6-6-6-6');
const OK = '<svg class="ico ico-s ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
function calHTML(c) {
  const y = c.base.getFullYear(), m = c.base.getMonth();
  const cab = (passo, titulo, vista) => `<div class="cal-cab"><button class="cal-nav" data-nav="${-passo}" aria-label="Anterior">${SETA_E}</button>${vista ? `<button class="cal-tit" data-vista="${vista}">${titulo}</button>` : `<span class="cal-tit">${titulo}</span>`}<button class="cal-nav" data-nav="${passo}" aria-label="Próximo">${SETA_D}</button></div>`;
  if (c.vista === 'meses') return cab(12, y, 'anos') + `<div class="cal-grade">${MESES.map((n, i) => `<button class="cal-op ${i === m ? 'on' : ''}" data-mes="${i}">${n.slice(0, 3)}</button>`).join('')}</div>`;
  if (c.vista === 'anos') { const anos = Array.from({ length: 12 }, (_, i) => y - 8 + i);
    return cab(144, `${anos[0]} – ${anos[11]}`) + `<div class="cal-grade">${anos.map(a => `<button class="cal-op ${a === y ? 'on' : ''}" data-ano="${a}">${a}</button>`).join('')}</div>`; }
  const fim = c.ate || (c.de && c.hover && c.hover > c.de ? c.hover : '');
  let cel = '';
  for (let i = new Date(y, m, 1).getDay(); i > 0; i--) cel += '<span></span>';
  for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const cls = [iso === HOJE && 'hoje', iso === c.de && 'ini', iso === c.de && fim && fim !== c.de && 'com-fim', fim && iso === fim && 'fim', c.de && fim && iso > c.de && iso < fim && 'meio'].filter(Boolean).join(' ');
    cel += `<button class="d ${cls}" data-cdia="${iso}" aria-label="${d} de ${MESES[m]}"><b>${d}</b></button>`;
  }
  const dica = !c.de ? 'Escolha o primeiro dia' : !c.ate ? `De <b>${ddmm(c.de)}</b> até…` : `<b>${ddmm(c.de)}</b> – <b>${ddmmaa(c.ate)}</b>`;
  return cab(1, `${maiuscula(MESES[m])} de ${y}`, 'meses')
    + `<div class="cal-sem">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(s => `<span>${s}</span>`).join('')}</div>`
    + `<div class="cal-dias ${c.de && !c.ate && fim ? 'previa' : ''}">${cel}</div><div class="cal-pe"><span>${dica}</span></div>`;
}
function abrirPeriodo(anc) {
  if (popAberto) return fecharPop();
  const livre = est.per.tipo === 'livre';
  const c = { vista: 'dias', base: new Date((est.per.fim > HOJE ? HOJE : est.per.fim).slice(0, 7) + '-01T12:00:00'), de: livre ? est.per.inicio : '', ate: livre ? est.per.fim : '', hover: null };
  const el = document.createElement('div'); el.className = 'pop'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Período');
  const ativo = id => { const p = ATALHOS.find(a => a[0] === id)[2](); return p.inicio === est.per.inicio && p.fim === est.per.fim; };
  el.innerHTML = `<div class="per-pop"><div class="atalhos">${ATALHOS.map(([id, nome]) => `<button class="${ativo(id) ? 'on' : ''}" data-atalho="${id}">${nome}${ativo(id) ? OK : ''}</button>`).join('')}</div><div class="cal">${calHTML(c)}</div></div>`;
  document.body.appendChild(el);
  const r = anc.getBoundingClientRect();
  el.style.top = `${Math.min(r.bottom + 6, innerHeight - el.offsetHeight - 8)}px`;
  el.style.left = `${Math.max(8, Math.min(r.right - el.offsetWidth, innerWidth - el.offsetWidth - 8))}px`;
  anc.setAttribute('aria-expanded', 'true');
  popAberto = { el, ancora: anc };
  const desenhar = () => { el.querySelector('.cal').innerHTML = calHTML(c); };
  el.addEventListener('click', e => {
    e.stopPropagation();
    const at = e.target.closest('[data-atalho]');
    if (at) { fecharPop(); return pedirPeriodo(ATALHOS.find(a => a[0] === at.dataset.atalho)[2]()); }
    const nav = e.target.closest('[data-nav]'); if (nav) { c.base.setMonth(c.base.getMonth() + +nav.dataset.nav); return desenhar(); }
    const vista = e.target.closest('[data-vista]'); if (vista) { c.vista = vista.dataset.vista; return desenhar(); }
    const mes = e.target.closest('[data-mes]'); if (mes) { c.base.setMonth(+mes.dataset.mes); c.vista = 'dias'; return desenhar(); }
    const ano = e.target.closest('[data-ano]'); if (ano) { c.base.setFullYear(+ano.dataset.ano); c.vista = 'meses'; return desenhar(); }
    const d = e.target.closest('[data-cdia]'); if (!d) return;
    const iso = d.dataset.cdia;
    // Primeiro clique marca o começo; o segundo, o fim (antes do começo recomeça).
    if (!c.de || c.ate || iso < c.de) { c.de = iso; c.ate = ''; c.hover = null; return desenhar(); }
    c.ate = iso; desenhar(); fecharPop(); pedirPeriodo(periodoDe(c.de, c.ate));
  });
  el.addEventListener('mouseover', e => {
    const d = e.target.closest('[data-cdia]')?.dataset.cdia || null;
    if (d === c.hover || (!d && e.target.closest('.cal-dias'))) return;
    c.hover = d; if (c.de && !c.ate) desenhar();
  });
  el.addEventListener('mousedown', e => e.preventDefault());
  (el.querySelector('.atalhos .on') || el.querySelector('.atalhos button'))?.focus();
}

/* ===== dica dos gráficos ===== */
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
function mostrarDica(alvo) {
  const [tit, val] = alvo.dataset.tip.split('|');
  tip.innerHTML = ''; const b = document.createElement('b'); b.textContent = val; tip.append(b, document.createTextNode(tit));
  tip.hidden = false;

  tip.style.left = `${Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2))}px`;
  tip.style.top = `${Math.max(56, r.top - tip.offsetHeight - 6)}px`;
}
document.addEventListener('pointerover', e => {
  const z = e.target.closest?.('.lin-zona'); if (z) return mostrarCruz(+z.dataset.mesI);
  const a = e.target.closest?.('[data-tip]'); if (a) mostrarDica(a);
});
document.addEventListener('pointerout', e => {
  if (e.target.closest?.('.lin-zona') && !e.relatedTarget?.closest?.('.lin-zona')) { limparCruz(); tip.hidden = true; }
  if (e.target.closest?.('[data-tip]')) tip.hidden = true;
});
document.addEventListener('focusin', e => { const a = e.target.closest?.('[data-tip]'); if (a) mostrarDica(a); else tip.hidden = true; });
addEventListener('scroll', () => { tip.hidden = true; limparCruz(); }, { passive: true });

/* ===== troca de tema (a mesma do sistema) ===== */
let trocaAtual = null;
function trocarTema(escuro, origem, aplicar) {
  const raiz = document.documentElement;
  const trocar = () => { raiz.classList.toggle('dark', escuro); aplicar?.(); };
  if (!document.startViewTransition) return trocar();
  const r = origem?.getBoundingClientRect();
  const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top + r.height / 2 : innerHeight / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(trocar); trocaAtual = troca;
  let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate(reduzido ? { opacity: escuro ? [0, 1] : [1, 0] } : { clipPath: escuro ? circulo : circulo.reverse() }, {
      duration: reduzido ? 200 : escuro ? 600 : 450, easing: reduzido ? 'ease' : escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)',
      fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)',
    });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); if (trocaAtual === troca) delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}

/* ===== eventos ===== */
document.addEventListener('click', e => {
  const t = e.target;
  if (popAberto && !t.closest('.pop') && !t.closest('#per-bt')) fecharPop();
  if (t.closest('#per-bt')) return abrirPeriodo(t.closest('#per-bt'));
  const at = t.closest('[data-atalho]'); if (at && !t.closest('.pop')) return pedirPeriodo(ATALHOS.find(a => a[0] === at.dataset.atalho)[2]());
  const an = t.closest('[data-andar]'); if (an) return andar(+an.dataset.andar);
  const aba = t.closest('[data-aba]');
  if (aba) {
    if (aba.dataset.aba === est.aba) return;
    const ids = ABAS.map(a => a[0]), lado = Math.sign(ids.indexOf(aba.dataset.aba) - ids.indexOf(est.aba));
    est.aba = aba.dataset.aba; render('lado', lado); return;
  }
  // Por dia / por mês / por ano: troca só o gráfico, sem redesenhar a tela.
  const serie = t.closest('[data-serie]');
  if (serie) {
    if (serie.getAttribute('aria-pressed') === 'true') return;
    const s = serie.parentElement, de = s.querySelector('[aria-pressed="true"]');
    est.serie = serie.dataset.serie;
    s.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === serie)));
    moverTrilho(s, de);
    const g = document.getElementById('graf-fat'); g.style.setProperty('--d', '-150ms'); tela.classList.remove('parado');
    g.innerHTML = grafSerie(est.serie); lucide.createIcons(); return;
  }
  const navCal = t.closest('[data-cal-mes]'); if (navCal) { cal.mes = somarMesCal(cal.mes || mesDoPeriodo(), +navCal.dataset.calMes); return redesenharCalendario(); }
  const col = t.closest('[data-dia]'); if (col) { tip.hidden = true; return abrirDia(col.dataset.dia); }
  const os = t.closest('[data-os]'); if (os) { if (!paraPai({ tipo: 'abrir-os', id: +os.dataset.os })) avisoProto(`No sistema, abre a O.S. #${os.dataset.os}`); return; }
  if (t.closest('[data-fechar-gv]')) return fecharGaveta();
  const gr = t.closest('[data-grupo]');
  if (gr) { const k = gr.dataset.grupo; categ.abertos.has(k) ? categ.abertos.delete(k) : categ.abertos.add(k); renderGaveta(); [...gvRaiz.querySelectorAll('[data-grupo]')].find(e => e.dataset.grupo === k)?.focus({ preventScroll: true }); return; }
  const cg = t.closest('[data-categ]'); if (cg) return abrirCateg(cg.dataset.categ);
  const ec = t.closest('[data-editar-conta]'); if (ec) { if (!paraPai({ tipo: 'editar-conta', id: +ec.dataset.editarConta })) avisoProto('No sistema, abre a conta no modal de hoje'); return; }
  const ped = t.closest('[data-ped]');
  if (ped) { const id = +ped.dataset.ped; dia.abertos.has(id) ? dia.abertos.delete(id) : dia.abertos.add(id); renderGaveta(); gvRaiz.querySelector(`[data-ped="${id}"]`)?.focus({ preventScroll: true }); return; }
  const prod = t.closest('[data-prod]'); if (prod) return alternarProduto(prod.dataset.prod);
  const mais = t.closest('[data-mais]');
  if (mais) {
    if (mais.dataset.mais === 'prod') { est.limProd += 30; document.getElementById('tab-prod').innerHTML = linhasProdutos(); }
    else { est.limCli += 50; document.getElementById('tab-cli').innerHTML = linhasClientes(); }
    lucide.createIcons(); return;
  }
  if (t.closest('#tema')) {
    const bt = t.closest('#tema'), escuro = !document.documentElement.classList.contains('dark');
    trocarTema(escuro, bt, () => { bt.innerHTML = `<i data-lucide="${escuro ? 'sun' : 'moon'}" class="ico ico-s"></i><span class="txt-tema">${escuro ? 'Claro' : 'Escuro'}</span>`; if (est.aba === 'vendas_produto') render('quieto'); else lucide.createIcons(); });
  }
});
// Busca: redesenha só a lista, para o campo não perder o foco.
document.addEventListener('input', e => {
  if (e.target.id === 'busca-prod') { est.buscaProd = e.target.value; est.limProd = 30; document.getElementById('tab-prod').innerHTML = linhasProdutos(); lucide.createIcons(); }
  if (e.target.id === 'busca-cli') { est.buscaCli = e.target.value; est.limCli = 50; document.getElementById('tab-cli').innerHTML = linhasClientes(); lucide.createIcons(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (popAberto) { const a = popAberto.ancora; fecharPop(); a?.focus(); return; }
    if (gavetaAberta()) return fecharGaveta();
    if (e.target.matches?.('input') && e.target.value) { e.target.value = ''; e.target.dispatchEvent(new Event('input', { bubbles: true })); return; }
  }
  const digitando = e.target.matches?.('input, textarea');
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-categ]')) { e.preventDefault(); return abrirCateg(e.target.dataset.categ); }
  if (digitando || e.ctrlKey || e.metaKey || e.altKey || popAberto || gavetaAberta()) return;
  if (e.key === '/') { const b = document.getElementById('busca-prod') || document.getElementById('busca-cli'); if (b) { e.preventDefault(); b.focus(); } return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { if (e.target.closest?.('.graf-col, .abas')) return; e.preventDefault(); andar(e.key === 'ArrowLeft' ? -1 : 1); }
});

/* ===== a página responde: outro período ou os pedidos de um dia ===== */
addEventListener('message', e => {
  if (e.source !== window.parent) return;
  const m = e.data || {};
  if (m.tipo === 'periodo' && m.pedido === est.pedido) {
    M = m.atual; ANT = m.anterior; ANT_PER = m.periodoAnterior; CORES_LOCAL = m.cores || {};
    est.carregando = false; est.erro = null; est.limProd = 30; est.limCli = 50;
    ajustarSelecao(); render('troca');
  }
  if (m.tipo === 'periodo-erro' && m.pedido === est.pedido) { est.carregando = false; est.erro = m.erro; render('quieto'); }
  if (m.tipo === 'calendario') { cal.meses[m.mes] = m.dias || {}; redesenharCalendario(); }
  if (m.tipo === 'calendario-erro') { cal.erros[m.mes] = m.erro; redesenharCalendario(); }
  if (m.tipo === 'dia' && m.dia === dia.iso) { dia.pedidos = m.pedidos || []; renderGaveta(); }
  if (m.tipo === 'dia-erro' && m.dia === dia.iso) { dia.erro = m.erro; renderGaveta(); }
  if (m.tipo === 'contas' && m.pedido === categ.pedido && m.categoria === categ.nome) { categ.contas = m.contas || []; renderGaveta(); }
});
addEventListener('resize', () => { fecharPop(); indicadorAnt = null; moverIndicador(); moverTrilho(tela.querySelector('.seg')); });

ajustarSelecao();
render('abrir');
document.fonts?.ready.then(() => { indicadorAnt = null; moverIndicador(); moverTrilho(tela.querySelector('.seg')); });
</script>
</body>
</html>
