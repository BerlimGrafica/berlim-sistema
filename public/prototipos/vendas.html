<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Padrão do DESIGN.md: o mesmo mundo do novo Início, das novas Contas e da nova Produção. */
:root {
  --brand: #F69F00; --brand-hover: #d98b00; --brand-tinta: #8A5400; --sobre-brand: #241600;
  --fundo: #EDEFF0; --superficie: #ffffff; --sutil: #f9fafb; --realce: #f3f4f6;
  --borda-fraca: #f0f1f3; --borda: #e5e7eb; --borda-forte: #d1d5db;
  --tinta: #111827; --tinta-corpo: #374151; --tinta-suave: #6b7280; --tinta-fraca: #9ca3af;
  --perigo: #dc2626; --perigo-fundo: #fef2f2; --perigo-borda: #fecaca;
  --sucesso: #059669;
  --sombra-pop: 0 12px 28px -8px rgba(15,23,42,.24), 0 1px 3px rgba(15,23,42,.08);
  --sombra-leve: 0 1px 2px rgba(15,23,42,.06);
  --dados: #475569; --dados-tinta: #334155; --dados-fundo: #f8fafc; --dados-borda: #e2e8f0;
  --itens: #2563eb; --itens-tinta: #1d4ed8; --itens-fundo: #eff6ff; --itens-borda: #dbeafe;
  --fin: #059669; --fin-tinta: #047857; --fin-fundo: #ecfdf5; --fin-borda: #c9f2df; --cal-forte: var(--tinta);
  --obs: #d97706; --obs-tinta: #b45309; --obs-fundo: #fffbeb; --obs-borda: #fdecc4;
  --saida: cubic-bezier(.16, 1, .3, 1);
  /* paleta categórica (validada): fatias e linhas de quem não tem cor no sistema, em ordem fixa */
  --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a; --serie-4: #eda100; --serie-5: #e87ba4; --serie-6: #008300; --serie-7: #6250d6; --serie-8: #e34948;
}
.dark {
  --brand-tinta: #FFB938;
  --fundo: #0d1117; --superficie: #161b22; --sutil: #1b2129; --realce: #21262d;
  --borda-fraca: #232a33; --borda: #30363d; --borda-forte: #3d444d;
  --tinta: #EDEDED; --tinta-corpo: #D4D4D8; --tinta-suave: #A1A1AA; --tinta-fraca: #71717a;
  --perigo: #f87171; --perigo-fundo: rgba(239,68,68,.1); --perigo-borda: rgba(239,68,68,.3);
  --sucesso: #34d399;
  --sombra-pop: 0 12px 28px -8px rgba(0,0,0,.6); --sombra-leve: 0 1px 2px rgba(0,0,0,.4);
  --dados: #94a3b8; --dados-tinta: #cbd5e1; --dados-fundo: rgba(148,163,184,.08); --dados-borda: rgba(148,163,184,.22);
  --itens: #60a5fa; --itens-tinta: #93c5fd; --itens-fundo: rgba(59,130,246,.12); --itens-borda: rgba(59,130,246,.3);
  --fin: #34d399; --fin-tinta: #6ee7b7; --fin-fundo: rgba(16,185,129,.11); --fin-borda: rgba(16,185,129,.28); --cal-forte: #0d1117;
  --obs: #fbbf24; --obs-tinta: #fcd34d; --obs-fundo: rgba(245,158,11,.1); --obs-borda: rgba(245,158,11,.26);
  --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; --serie-4: #c98500; --serie-5: #d55181; --serie-6: #008300; --serie-7: #9085e9; --serie-8: #e66767;
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; } html.dark { color-scheme: dark; }
/* overflow-x: clip: o quadro que entra deslizando da direita não cria rolagem lateral */
body { overflow-x: clip; font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--tinta-corpo); background: var(--fundo); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: rgba(246,159,0,.3); }
input { caret-color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }
[hidden] { display: none !important; }
.ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.ico-s { width: 14px; height: 14px; }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex-shrink: 0; }
.num { font-variant-numeric: tabular-nums; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
kbd { font: 600 10.5px/1 Montserrat, sans-serif; color: var(--tinta-suave); border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--superficie); }

.a-dados { --c: var(--dados); --c-tinta: var(--dados-tinta); --c-fundo: var(--dados-fundo); --c-borda: var(--dados-borda); }
.a-itens { --c: var(--itens); --c-tinta: var(--itens-tinta); --c-fundo: var(--itens-fundo); --c-borda: var(--itens-borda); }
.a-fin { --c: var(--fin); --c-tinta: var(--fin-tinta); --c-fundo: var(--fin-fundo); --c-borda: var(--fin-borda); }
.a-obs { --c: var(--obs); --c-tinta: var(--obs-tinta); --c-fundo: var(--obs-fundo); --c-borda: var(--obs-borda); }
.a-perigo { --c: var(--perigo); --c-tinta: var(--perigo); --c-fundo: var(--perigo-fundo); --c-borda: var(--perigo-borda); }

/* A tela entra como o Início: cada quadro sobe 14px e acende, na ordem de
   leitura (--d); trocando de aba, vêm do lado dela (--dx). As marcas de dentro
   crescem depois que o quadro chegou. Trocando o período, o conteúdo só
   reacende e as marcas crescem de novo, mostrando a mudança. */
@keyframes entrarY { from { opacity: 0; transform: translateY(14px); } }
@keyframes entrarX { from { opacity: 0; transform: translateX(var(--dx, 16px)); } }
@keyframes acender { from { opacity: .35; } }
@keyframes crescerY { from { transform: scaleY(0); } }
@keyframes crescerX { from { transform: scaleX(0); } }
@keyframes revelar { from { clip-path: inset(0 100% 0 0); } }
.entra { animation: entrarY .56s var(--saida) both; animation-delay: var(--d, 0ms); }
.lateral .entra { animation-name: entrarX; animation-duration: .44s; }
.conteudo.troca { animation: acender .3s ease-out; }
.cy { transform-origin: bottom; animation: crescerY .75s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 200ms + var(--i, 0) * 28ms); }
.cx { transform-origin: left; animation: crescerX .8s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 220ms + var(--i, 0) * 40ms); }
.rv { animation: revelar .9s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 220ms + var(--i, 0) * 40ms); }
/* Redesenhos por digitar ou marcar não repetem o crescimento. */
.parado .cy, .parado .cx, .parado .rv, .parado .lin-svg { animation: none; }

/* moldura do protótipo */
.proto { position: sticky; top: 0; z-index: 40; height: 51px; display: flex; align-items: center; gap: 14px; padding: 8px 20px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.proto-nome { font-weight: 700; color: var(--tinta); white-space: nowrap; }
.proto-nota { color: var(--tinta-suave); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.proto-dir { margin-left: auto; display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
.proto-bt { display: inline-flex; align-items: center; gap: 6px; color: var(--tinta-corpo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
.proto-bt:hover { background: var(--realce); color: var(--tinta); }

/* página */
.pg { max-width: 1280px; margin: 0 auto; padding: 26px 28px 64px; }
.cab { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.cab h1 { font-size: 22px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; line-height: 1.2; }
.cab .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: 7px; color: var(--tinta-suave); font-size: 12.5px; }
.cab .sub b { color: var(--tinta-corpo); font-weight: 600; }
.cab-dir { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ib { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--tinta-suave); transition: background .12s, color .12s; flex-shrink: 0; }
.ib:hover { background: var(--realce); color: var(--tinta); }
.ib:disabled { opacity: .35; pointer-events: none; }
/* o período: setas que andam de mês (ou de ano) e o nome dele, que abre o
   popover com os atalhos e o calendário — a mesma navegação das novas Contas */
.mes { display: inline-flex; align-items: center; gap: 2px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px; padding: 2px; }
.mes .rot { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 168px; height: 30px; padding: 0 8px; border-radius: 6px; font-weight: 700; color: var(--tinta); font-size: 13px; white-space: nowrap; }
.mes .rot:hover, .mes .rot[aria-expanded="true"] { background: var(--realce); }
.mes .rot .chev { color: var(--tinta-fraca); }
.voltar-mes { font-size: 12px; font-weight: 600; color: var(--brand-tinta); padding: 6px 8px; border-radius: 7px; white-space: nowrap; }
.voltar-mes:hover { background: var(--realce); }
.somando { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.somando .ico { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* abas: o traço laranja corre até a aba escolhida (DESIGN.md › Abas de filtro) */
.faixa { display: flex; align-items: flex-end; border-bottom: 1px solid var(--borda); margin: 18px 0 22px; }
.abas { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.abas::-webkit-scrollbar { display: none; }
.aba { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 10px 2px; font-weight: 600; font-size: 13px; color: var(--tinta-suave); white-space: nowrap; border-radius: 6px 6px 0 0; transition: color .15s; }
.aba:hover { color: var(--tinta-corpo); }
.aba[aria-selected="true"] { color: var(--tinta); }
.aba .n { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; background: var(--realce); color: var(--tinta-suave); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; transition: background .15s, color .15s; }
.aba[aria-selected="true"] .n { background: var(--tinta); color: var(--superficie); }
.indicador { position: absolute; left: 0; bottom: 0; width: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--brand); transition: left .34s var(--saida), width .34s var(--saida); pointer-events: none; }

.conteudo { transition: opacity .2s; }
.conteudo.esperando { opacity: .45; pointer-events: none; }
.erro-faixa { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--perigo-fundo); border: 1px solid var(--perigo-borda); color: var(--perigo); font-weight: 600; font-size: 12.5px; }

.selo { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; white-space: nowrap; background: var(--realce); color: var(--tinta-corpo); }
.selo .ico { width: 12px; height: 12px; }
.selo.atraso { background: var(--perigo-fundo); color: var(--perigo); }
.selo.hoje { background: var(--obs-fundo); color: var(--obs-tinta); }
.selo.fin { background: var(--fin-fundo); color: var(--fin-tinta); }

/* controle de segmentos (Por dia / Por mês / Por ano), o mesmo do Início */
.seg { position: relative; margin-left: auto; display: inline-flex; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--c-borda, var(--borda)); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { position: relative; z-index: 1; padding: 3px 10px; border-radius: 6px; font-weight: 600; font-size: 12px; color: var(--tinta-suave); white-space: nowrap; transition: color .2s; }
.seg button:hover, .seg button[aria-pressed="true"] { color: var(--tinta); }
.seg-trilho { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 6px; background: var(--c-fundo, var(--realce)); box-shadow: inset 0 0 0 1px var(--c-borda, var(--borda)); transition: transform .34s var(--saida), width .34s var(--saida); }

/* números do topo: uma peça só, dividida por fios (como no Início) */
.numeros { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; margin-bottom: 22px; overflow: hidden; }
.n-cel { padding: 16px 18px 15px; border-left: 1px solid var(--borda-fraca); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.n-cel:first-child { border-left: 0; }
.n-topo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.n-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--c-fundo); color: var(--c); box-shadow: inset 0 0 0 1px var(--c-borda); flex-shrink: 0; }
.n-rot { font-size: 12px; font-weight: 600; color: var(--tinta-suave); line-height: 1.3; min-width: 0; }
.n-linha { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 36px; flex-wrap: wrap; }
.n-val { font-size: 30px; font-weight: 700; color: var(--tinta); letter-spacing: -.022em; line-height: 1.15; white-space: nowrap; }
.n-val small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-right: 3px; letter-spacing: 0; }
.n-val.alerta { color: var(--perigo); }
.n-val.texto { font-size: 15px; letter-spacing: 0; white-space: normal; line-height: 1.3; }
.n-pe { margin-top: auto; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.n-ctx { font-size: 12px; color: var(--tinta-suave); overflow: hidden; text-overflow: ellipsis; }
.n-ctx b { color: var(--tinta-corpo); font-weight: 600; }
.tend { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; white-space: nowrap; background: var(--realce); color: var(--tinta-corpo); }
.tend .ico { width: 13px; height: 13px; }
.tend.sobe { background: var(--fin-fundo); color: var(--fin-tinta); }
.tend.desce { background: var(--perigo-fundo); color: var(--perigo); }
.sobe { color: var(--sucesso); font-weight: 600; }
.desce { color: var(--perigo); font-weight: 600; }
.medidor { display: flex; gap: 2px; height: 6px; border-radius: 3px; background: var(--realce); overflow: hidden; }
.medidor i { height: 100%; background: var(--c); border-radius: 3px; }
.medidor i.claro { opacity: .35; }
.medidor i.atr { background: var(--perigo); }
.medidor i.desp { background: var(--tinta-fraca); }
.medidor i.ok { background: var(--fin); }
.n-mini { margin-left: auto; display: flex; align-items: flex-end; gap: 3px; height: 30px; flex-shrink: 0; }
.n-mini i { width: 6px; min-height: 2px; background: var(--c); opacity: .3; border-radius: 2px 2px 0 0; }
.n-mini i.aceso { opacity: 1; }
/* a segunda faixa: os outros números do resumo, um degrau abaixo da primeira */
.numeros.menor { margin-top: -10px; }
.numeros.menor .n-cel { padding: 13px 16px 12px; gap: 8px; }
.numeros.menor .n-ico { width: 26px; height: 26px; border-radius: 7px; }
.numeros.menor .n-ico .ico { width: 14px; height: 14px; }
.numeros.menor .n-val { font-size: 22px; letter-spacing: -.02em; }
.numeros.menor .n-val small { font-size: 12px; }
.numeros.menor .n-linha { min-height: 30px; }
.medidor i.vazio { background: transparent; }
.leg-i { display: inline-flex; align-items: center; gap: 5px; }
.leg-i i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
/* destaque leve: um degrau abaixo do laranja — o verde da área bem clarinho,
   que se apaga para a superfície, o ícone cheio e o valor na tinta da área */
.n-cel.leve { background: linear-gradient(160deg, var(--c-fundo) 0%, var(--superficie) 78%); }
.n-cel.leve .n-ico { background: var(--c); color: var(--superficie); box-shadow: none; }
.n-cel.leve .n-val { color: var(--c-tinta); }
.n-cel.leve .n-val small { color: var(--c-tinta); opacity: .75; }
/* o número laranja: o primeiro da tela (DESIGN.md, como no Início) */
.n-cel.laranja {
  --tinta: #241600; --tinta-corpo: #3a2400; --tinta-suave: rgba(36,22,0,.78); --tinta-fraca: rgba(36,22,0,.66);
  --borda-fraca: rgba(36,22,0,.12); --realce: rgba(255,255,255,.34);
  --perigo: #8f1d10; --fin: #241600;
  --c: #241600; --c-tinta: #241600; --c-fundo: #241600; --c-borda: transparent;
  color: var(--tinta-corpo); background: linear-gradient(155deg, #FFB429 0%, #F69F00 55%, #F29400 100%); border-left: 0;
}
.dark .n-cel.laranja { background: linear-gradient(155deg, #F7A81B 0%, #E89600 55%, #DB8A00 100%); }
.n-cel.laranja + .n-cel { border-left: 0; }
.n-cel.laranja .n-ico { color: #FFF6E3; }
.n-cel.laranja .tend, .n-cel.laranja .tend.sobe, .n-cel.laranja .tend.desce { background: rgba(255,255,255,.5); color: #241600; }
.n-cel.laranja .tend.desce { color: var(--perigo); }
.n-cel.laranja ::selection { background: rgba(255,255,255,.55); }

/* blocos */
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
/* saídas: categoria e situação empilhadas à esquerda, as maiores contas à direita */
.duas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.pilha { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.pilha > .area:last-child { flex: 1; }
.secao { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 30px 0 12px; }
.secao h2 { font-size: 15px; font-weight: 700; color: var(--tinta); letter-spacing: -.01em; }
.secao span { font-size: 12px; color: var(--tinta-suave); }
.area { background: var(--superficie); border: 1px solid var(--c-borda); border-radius: 10px; overflow: hidden; min-width: 0; }
.area-cab { display: flex; align-items: center; gap: 10px; min-height: 47px; padding: 9px 14px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.area-ico { width: 26px; height: 26px; border-radius: 7px; background: var(--superficie); display: grid; place-items: center; color: var(--c); box-shadow: var(--sombra-leve); flex-shrink: 0; }
.area-cab h2 { font-size: 13.5px; font-weight: 700; color: var(--tinta); line-height: 1.3; min-width: 0; }
.area-cab h2 small { display: block; font-size: 12px; font-weight: 500; color: var(--tinta-suave); }
.area-meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--c-tinta); white-space: nowrap; }
.area-corpo { padding: 14px 16px; }
.area-pe { display: flex; padding: 4px 8px 8px; }
.area.elevado { border: 0; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 16px 36px -18px rgba(15,23,42,.34); }
.area.elevado .area-cab { min-height: 60px; padding: 11px 16px; }
.area.elevado .area-cab h2 { font-size: 15px; }
.area.elevado .area-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--c); color: var(--superficie); box-shadow: none; }
.area.elevado .area-ico .ico { width: 18px; height: 18px; }
.dark .area.elevado { box-shadow: 0 0 0 1px var(--c-borda), 0 18px 40px -16px rgba(0,0,0,.8); }
.ver { display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--tinta-suave); }
.ver:hover { background: var(--realce); color: var(--tinta); }
.vazio { display: flex; align-items: center; gap: 8px; padding: 14px 16px; color: var(--tinta-suave); font-size: 12.5px; }
.vazio .ico { color: var(--sucesso); }


/* composição (local, forma de pagamento, instituição, categoria, situação):
   o maior pedaço em destaque, a barra fatiada e a lista — o mesmo desenho em
   todos, para a seção se ler como uma peça só */
.comp-corpo { padding: 14px 16px 12px; }
.comp-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.comp-topo > b { font-size: 22px; font-weight: 700; color: var(--tinta); letter-spacing: -.02em; line-height: 1.15; }
.comp-topo > b small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-left: 1px; letter-spacing: 0; }
.comp-topo > span { font-size: 12.5px; color: var(--tinta-suave); }
.comp-topo > span b { color: var(--tinta); font-weight: 600; }
.comp-topo .selo { margin-left: auto; align-self: center; }
.fatias { display: flex; gap: 2px; height: 10px; }
.fatias i { border-radius: 3px; min-width: 3px; }
.comp-lista { list-style: none; padding: 0 0 6px; }
.comp-lista li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 40px; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--borda-fraca); }
.comp-lista li > i { width: 10px; height: 10px; border-radius: 3px; }
.comp-lista .nome { font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-lista .v { font-weight: 600; color: var(--tinta); text-align: right; white-space: nowrap; }
.comp-lista .v.neg { color: var(--perigo); }
.comp-lista .p { text-align: right; color: var(--tinta-suave); font-size: 12px; }
.comp-lista.clicavel li { grid-template-columns: 10px minmax(0, 1fr) auto 40px 14px; cursor: pointer; transition: background .12s; }
.comp-lista.clicavel li:hover { background: var(--sutil); }
.comp-lista.clicavel li:focus-visible { background: var(--sutil); outline: 2px solid var(--brand); outline-offset: -2px; }
.comp-lista .seta { color: var(--tinta-fraca); transition: transform .15s, color .15s; }
.comp-lista.clicavel li:hover .seta { color: var(--tinta); transform: translateX(2px); }
.lista.compacta .lin { padding: 7px 16px; }
.lista.compacta .diaf { width: 36px; height: 36px; }

/* listas */
.lista { list-style: none; padding: 0; }
.lin { display: flex; align-items: center; gap: 11px; padding: 9px 16px; border-top: 1px solid var(--borda-fraca); min-width: 0; width: 100%; }
.lista > li:first-child .lin { border-top: 0; }
button.lin:hover { background: var(--sutil); }
.lin-txt { min-width: 0; flex: 1; }
.lin-tit, .lin-sub { display: block; }
.lin-tit { font-weight: 600; color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin-tit .oid { color: var(--tinta-fraca); font-weight: 600; font-size: 12px; margin-right: 6px; }
.lin-sub { font-size: 12px; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin-dir { margin-left: auto; text-align: right; flex-shrink: 0; font-weight: 600; color: var(--tinta); }
.lin-dir small { display: block; font-size: 11.5px; font-weight: 500; color: var(--tinta-suave); }
.lin-dir .falta { color: var(--perigo); }
.diaf { width: 40px; height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--borda); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; flex-shrink: 0; }
.diaf b { font-size: 13.5px; font-weight: 700; color: var(--tinta); }
.diaf span { font-size: 10.5px; font-weight: 600; color: var(--tinta-suave); }
.diaf.atraso { background: var(--perigo-fundo); box-shadow: inset 0 0 0 1px var(--perigo-borda); }
.diaf.atraso b, .diaf.atraso span { color: var(--perigo); }
.diaf.hoje { background: var(--obs-fundo); box-shadow: inset 0 0 0 1px var(--obs-borda); }
.diaf.hoje b, .diaf.hoje span { color: var(--obs-tinta); }
.diaf.paga { opacity: .6; }

.graf-area { position: relative; height: 200px; margin-top: 22px; border-bottom: 1px solid var(--borda); }
/* Calendário: cada dia no tom do quanto vendeu, do claro ao chapado, como a escala
   de retícula de uma tinta só. A tinta é o verde das barras deste quadro. */
.calv-topo { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.calv-topo b { min-width: 150px; text-align: center; font-size: 13px; font-weight: 700; color: var(--tinta); }
.calv-topo .ib { width: 28px; height: 28px; }
.calv-topo .ib[disabled] { opacity: .35; pointer-events: none; }
.calv-topo .resumo-mes { margin-left: auto; font-size: 12px; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.calv-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.calv-grade .sem { font-size: 11px; font-weight: 600; color: var(--tinta-suave); text-align: center; }
.calv-dia { min-height: 40px; border-radius: 6px; padding: 5px 7px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; font-variant-numeric: tabular-nums; color: var(--tinta); }
.calv-dia .n { font-size: 12px; font-weight: 700; }
.calv-dia .v { font-size: 10.5px; font-weight: 600; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.calv-dia { transition: box-shadow .12s; }
button.calv-dia:hover, button.calv-dia:focus-visible { box-shadow: 0 0 0 2px var(--tinta); outline: none; }
.calv-dia.forte { color: var(--cal-forte); }
.calv-dia.sem-venda { box-shadow: inset 0 0 0 1px var(--borda); color: var(--tinta-fraca); }
.calv-dia.futuro { box-shadow: inset 0 0 0 1px var(--borda-fraca); color: var(--tinta-fraca); }
.calv-dia.hoje { box-shadow: inset 0 0 0 2px var(--brand); }
.calv-dia.espera { background: var(--realce); animation: pulsar-cal 1.2s ease-in-out infinite; }
@keyframes pulsar-cal { 50% { opacity: .45; } }
.calv-escala { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; max-width: 560px; margin-top: 12px; }
.calv-escala span { display: grid; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.calv-escala b { color: var(--tinta-corpo); font-weight: 700; }
.calv-escala i { width: 100%; height: 10px; border-radius: 2px; margin-bottom: 2px; }
@media (max-width: 560px) { .calv-dia .v { display: none; } .calv-dia { min-height: 34px; } }
@media (prefers-reduced-motion: reduce) { .calv-dia.espera { animation: none; } }
.graf-grade { position: absolute; left: 0; right: 0; border-top: 1px solid var(--borda-fraca); }
.graf-grade span { position: absolute; left: 0; top: -17px; font-size: 10.5px; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.graf-media { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--tinta-fraca); z-index: 1; pointer-events: none; }
.graf-cols { position: absolute; inset: 0; display: flex; align-items: flex-end; }
.graf-col { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 4px 4px 0 0; }
.graf-col:hover, .graf-col:focus-visible { outline: none; background: var(--sutil); }
button.graf-col { cursor: pointer; }
.graf-col i { position: relative; width: min(24px, 58%); min-height: 2px; background: var(--fin); border-radius: 4px 4px 0 0; }
.graf-col i.passado { opacity: .42; transition: opacity .12s; }
.graf-col:hover i.passado, .graf-col:focus-visible i.passado { opacity: .8; }
.graf-col .proj { position: absolute; width: min(24px, 58%); border: 1.5px dashed var(--fin); border-bottom: 0; border-radius: 4px 4px 0 0; opacity: .7; }
.graf-val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--tinta); white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 2; pointer-events: none; }
.graf-val.suave { color: var(--tinta-suave); font-weight: 600; }
.graf-val.fim { left: auto; right: 0; transform: none; }
.graf-x { display: flex; margin-top: 6px; }
.graf-x span { flex: 1; text-align: center; font-size: 10.5px; color: var(--tinta-suave); font-variant-numeric: tabular-nums; white-space: nowrap; }
.graf-x span.hoje { color: var(--tinta); font-weight: 700; }
.graf-leg { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; color: var(--tinta-suave); }
.graf-leg > span { display: inline-flex; align-items: center; gap: 7px; }
.graf-leg b { color: var(--tinta); font-weight: 600; }
.graf-leg .m-col { width: 9px; height: 12px; border-radius: 2px 2px 0 0; background: var(--fin); }
.graf-leg .m-proj { width: 9px; height: 12px; border: 1.5px dashed var(--fin); border-bottom: 0; border-radius: 2px 2px 0 0; }
.graf-leg .m-media { width: 16px; border-top: 1px dashed var(--tinta-fraca); }
.graf-leg .dica { margin-left: auto; color: var(--brand-tinta); font-weight: 600; }
.tip { position: fixed; z-index: 95; pointer-events: none; background: var(--tinta); color: var(--superficie); border-radius: 7px; padding: 6px 9px; font-size: 12px; box-shadow: var(--sombra-pop); white-space: nowrap; }
.tip b { font-size: 13px; display: block; }
.tip .tl { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; margin-top: 4px; }
.tip .tl i { width: 9px; height: 3px; border-radius: 2px; }
.tip .tl span { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.tip .tl em { font-style: normal; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

/* produtos: linhas de 12 meses, uma cor por produto (até 8, sem repetir) */
.chips-leg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip-leg { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 9px; border-radius: 99px; border: 1px solid var(--borda); background: var(--superficie); font-size: 12px; font-weight: 600; color: var(--tinta-corpo); max-width: 260px; }
.chip-leg i { width: 10px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.chip-leg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-leg .ico { width: 13px; height: 13px; color: var(--tinta-fraca); }
.chip-leg:hover { border-color: var(--borda-forte); }
.chip-leg:hover .ico { color: var(--tinta); }
.lin-area { position: relative; height: 230px; margin: 22px 0 0 0; border-bottom: 1px solid var(--borda); }
/* as linhas se revelam da esquerda para a direita, todas juntas, como o tempo anda */
.lin-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: revelar 1.1s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 200ms); }
.lin-svg polyline { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.lin-zonas { position: absolute; inset: 0; display: flex; }
.lin-zona { flex: 1; height: 100%; }
.lin-cruz { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--borda-forte); pointer-events: none; }
.lin-ponto { position: absolute; width: 9px; height: 9px; border-radius: 99px; transform: translate(-50%, 50%); box-shadow: 0 0 0 2px var(--superficie); pointer-events: none; }
.lin-x { position: relative; height: 18px; margin-top: 6px; }
.lin-x span { position: absolute; transform: translateX(-50%); font-size: 10.5px; color: var(--tinta-suave); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lin-x span.hoje { color: var(--tinta); font-weight: 700; }

/* tabelas (produtos e clientes) */
.ferramentas { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--borda-fraca); flex-wrap: wrap; }
.busca { position: relative; flex: 1 1 260px; max-width: 420px; }
.busca .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--tinta-suave); pointer-events: none; }
.busca input { width: 100%; height: 36px; border: 1px solid var(--borda); border-radius: 8px; background: var(--superficie); padding: 0 36px 0 34px; outline: none; transition: border-color .15s, box-shadow .15s; }
.busca input::placeholder { color: var(--tinta-suave); }
.busca input:hover { border-color: var(--borda-forte); }
.busca input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.busca kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); }
.ferramentas .conta { margin-left: auto; font-size: 12px; color: var(--tinta-suave); }
.tab-cab, .tab-lin { display: grid; align-items: center; gap: 12px; padding: 0 16px; }
.tab-cab { height: 34px; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); border-bottom: 1px solid var(--borda-fraca); background: var(--sutil); }
.tab-lin { min-height: 46px; width: 100%; border-top: 1px solid var(--borda-fraca); text-align: left; }
.tab-corpo > :first-child .tab-lin, .tab-corpo > .tab-lin:first-child { border-top: 0; }
button.tab-lin:hover { background: var(--sutil); }
.tab-lin .pos { font-size: 11.5px; font-weight: 700; color: var(--tinta-fraca); text-align: right; }
.tab-lin .nome { min-width: 0; font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-lin .nome .selo { margin-left: 6px; }
.tab-lin .v { text-align: right; font-weight: 600; color: var(--tinta); white-space: nowrap; }
.tab-lin .m { text-align: right; color: var(--tinta-suave); white-space: nowrap; }
.tab-cab .d { text-align: right; }
.parte { display: flex; align-items: center; gap: 8px; justify-content: flex-end; color: var(--tinta-suave); font-size: 12px; }
.parte i { width: 46px; height: 5px; border-radius: 3px; background: var(--realce); overflow: hidden; flex-shrink: 0; }
.parte i b { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.t-prod { grid-template-columns: 22px 16px minmax(0, 1fr) 96px 104px 92px; }
.t-cli { grid-template-columns: 28px minmax(0, 1fr) 64px 104px 112px 92px; }
.marca { width: 16px; height: 16px; border-radius: 5px; box-shadow: inset 0 0 0 1.5px var(--borda-forte); display: grid; place-items: center; color: transparent; }
.marca .ico { width: 12px; height: 12px; }
[aria-pressed="true"] .marca { background: var(--cor); box-shadow: none; color: #fff; }
.spark { width: 96px; height: 24px; overflow: visible; }
.spark polyline { fill: none; stroke: var(--tinta-fraca); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
[aria-pressed="true"] .spark polyline { stroke: var(--cor); stroke-width: 2; }
.mais { display: flex; justify-content: center; padding: 8px; border-top: 1px solid var(--borda-fraca); }

/* gaveta do dia (computador) / folha (celular), a mesma do Início e da Produção */
.gv-veu { position: fixed; inset: 51px 0 0 0; background: rgba(15,23,42,.36); z-index: 60; animation: veuEntra .4s ease-out; }
.dark .gv-veu { background: rgba(0,0,0,.6); }
.gaveta { position: fixed; top: 51px; right: 0; bottom: 0; width: min(500px, 100%); background: var(--fundo); border-left: 1px solid var(--borda); box-shadow: 0 24px 56px -16px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.08); z-index: 61; overflow-y: auto; animation: gavetaEntra .46s cubic-bezier(.22,1,.36,1); outline: none; }
.dark .gaveta { box-shadow: 0 24px 56px -16px rgba(0,0,0,.7); }
.gv-veu.sai { animation: veuSai .3s ease-in forwards; pointer-events: none; }
.gaveta.sai { animation: gavetaSai .3s cubic-bezier(.55,0,1,.45) forwards; pointer-events: none; }
@keyframes gavetaEntra { from { transform: translateX(100%); } }
@keyframes gavetaSai { to { transform: translateX(100%); } }
@keyframes veuEntra { from { opacity: 0; } }
@keyframes veuSai { to { opacity: 0; } }
.det { padding: 0 22px 40px; }
.det-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: 0 -22px; padding: 12px 22px; background: var(--fundo); color: var(--tinta-suave); font-size: 13px; font-weight: 600; transition: box-shadow .2s; }
.gaveta.rolou .det-cab { box-shadow: 0 1px 0 var(--borda); }
.det-ferr { margin-left: auto; display: flex; gap: 2px; }
.det-tit { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); line-height: 1.25; margin-top: 2px; }
.det-valor { font-size: 30px; font-weight: 700; letter-spacing: -.022em; color: var(--tinta); margin-top: 10px; font-variant-numeric: tabular-nums; }
.det-valor small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-right: 4px; letter-spacing: 0; }
.det-sub { font-size: 12.5px; color: var(--tinta-suave); margin-top: 3px; }
.det-sub b { color: var(--tinta-corpo); }
.comp { margin-top: 14px; }
.comp .fatias { margin: 0 0 8px; height: 8px; }
.comp-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--tinta-suave); }
.comp-leg b { color: var(--tinta-corpo); font-weight: 600; }
.dsec { border: 1px solid var(--c-borda); border-radius: 10px; background: var(--superficie); margin-top: 18px; overflow: hidden; }
.dsec-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 12px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.dsec-cab h3 { font-size: 13px; font-weight: 700; color: var(--tinta); }
.dsec-cab .area-meta { margin-left: auto; }
.ped > button { display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 2px 10px; align-items: center; width: 100%; padding: 9px 12px; border-top: 1px solid var(--borda-fraca); text-align: left; }
.ped:first-child > button { border-top: 0; }
.ped > button:hover { background: var(--sutil); }
.ped .cli { font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ped .srv { grid-column: 1; font-size: 12px; color: var(--tinta-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ped .val { font-weight: 600; color: var(--tinta); text-align: right; white-space: nowrap; }
.ped .est { grid-column: 2; font-size: 11.5px; text-align: right; color: var(--tinta-suave); white-space: nowrap; }
.ped .est.falta { color: var(--obs-tinta); font-weight: 600; }
.ped .est.nada { color: var(--perigo); font-weight: 600; }
.ped .chev { grid-row: 1 / 3; grid-column: 3; color: var(--tinta-fraca); transition: transform .2s var(--saida); }
.ped.aberto .chev { transform: rotate(180deg); }
.ped-det { padding: 2px 12px 12px; background: var(--sutil); border-top: 1px solid var(--borda-fraca); }
.ped-meta { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; padding: 9px 0 6px; font-size: 12px; color: var(--tinta-suave); }
.ped-meta b { color: var(--tinta-corpo); }
.ped-meta .btn { margin-left: auto; }
.ped-det dl div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--borda-fraca); font-size: 12.5px; }
.ped-det dl div:first-child { border-top: 0; }
.ped-det dt { min-width: 0; color: var(--tinta-corpo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ped-det dt span { color: var(--tinta-suave); }
.ped-det dd { flex-shrink: 0; font-weight: 600; color: var(--tinta); font-variant-numeric: tabular-nums; }
.ped-det dd.neg { color: var(--perigo); }
.ped-det .grupo { margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); }
.ped-det .nada { color: var(--perigo); font-weight: 600; font-size: 12.5px; padding: 5px 0; }
.btn { height: 30px; padding: 0 11px; border-radius: 7px; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; border: 1px solid var(--borda-forte); color: var(--tinta); background: var(--superficie); transition: background .15s, border-color .15s; }
.btn:hover { background: var(--sutil); border-color: var(--tinta-fraca); }
.btn .ico { width: 14px; height: 14px; }
/* espera: as mesmas linhas da lista, pulsando em onda (DESIGN.md › Espera) */
.espera { padding: 4px 0; }
.espera div { display: flex; justify-content: space-between; gap: 12px; padding: 12px; border-top: 1px solid var(--borda-fraca); }
.espera div:first-child { border-top: 0; }
.espera i { height: 12px; border-radius: 4px; background: var(--borda); animation: pulsa 1.4s ease-in-out infinite; animation-delay: calc(var(--i) * 90ms); }
@keyframes pulsa { 50% { opacity: .4; } }

/* popover do período (o mesmo da nova Baixa: atalhos e calendário de intervalo) */
.pop { position: fixed; z-index: 90; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; padding: 4px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 9px; box-shadow: var(--sombra-pop); animation: pop .16s var(--saida); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.pop button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--tinta-corpo); white-space: nowrap; }
.pop button:hover, .pop button:focus-visible { background: var(--realce); color: var(--tinta); outline: none; }
.pop .ok { margin-left: auto; color: var(--brand-tinta); }
.per-pop { display: flex; gap: 4px; --faixa: color-mix(in srgb, var(--brand) 15%, transparent); --faixa-previa: color-mix(in srgb, var(--brand) 8%, transparent); }

@keyframes folhaEntra { from { transform: translateY(100%); } }

@media (max-width: 520px) {

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<div class="proto">
  <span class="proto-nome">Nova Vendas · protótipo</span>
  <span class="proto-nota">Dados reais, só leitura · cada período é somado no banco quando você escolhe</span>
  <div class="proto-dir">
    <button class="proto-bt" id="tema"><i data-lucide="moon" class="ico ico-s"></i><span class="txt-tema">Escuro</span></button>
  </div>
</div>
<main class="pg" id="tela"></main>
<div id="gv"></div>

<script>
/*VENDAS*/

/* ===== base ===== */
const ico = (n, c = 'ico') => `<i data-lucide="${n}" class="${c}"></i>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HOJE = DADOS.hoje;
const dataLocal = iso => { const [a, m, d] = iso.slice(0, 10).split('-').map(Number); return new Date(a, m - 1, d); };
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const diasEntre = (de, ate) => Math.round((dataLocal(ate) - dataLocal(de)) / 864e5);
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const maiuscula = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const ddmm = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const ddmmaa = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(2, 4)}` : '';
const ultimoDia = (a, m) => new Date(a, m, 0).getDate();
// Dinheiro em centavos. Acima de mil reais o centavo só atrapalha a leitura; o
// valor exato fica no title/tooltip.
const brl = (c, cheio) => { const r = c / 100; return (cheio || Math.abs(r) < 1000 ? r.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round(r).toLocaleString('pt-BR')); };
const reais = (c, cheio) => `${c < 0 ? '−' : ''}R$ ${brl(Math.abs(c), cheio)}`;
const dinheiro = c => `${c < 0 ? '−' : ''}<small>R$</small>${brl(Math.abs(c))}`;
const compacto = c => { const r = c / 100; return Math.abs(r) >= 1000 ? `R$ ${(r / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mil` : `R$ ${Math.round(r)}`; };
const inteiro = n => Number(n || 0).toLocaleString('pt-BR');
const plural = (n, um, varios) => `${inteiro(n)} ${n === 1 ? um : varios}`;
const pctDe = (parte, todo) => todo ? Math.round(parte / todo * 100) : 0;
const pctTxt = (parte, todo) => { if (!todo) return ''; const p = parte / todo * 100; return p > 0 && p < 1 ? '<1%' : `${Math.round(p)}%`; };
// Nomes de produto em caixa normal, como no novo Início: "ADESIVO VINIL BRANCO"
// vira "Adesivo vinil branco"; medidas com número ficam como estão.
function legivel(txt) {
  return String(txt || '').split(/\s*\+\s*/).map(item => {
    const t = item.toLowerCase().split(/\s+/).map(w => /\d/.test(w) ? w.toUpperCase().replace(/(\d)G$/, '$1g') : w).join(' ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }).join(' + ');
}
const soma = (l, f = x => x.centavos) => l.reduce((s, x) => s + (f(x) || 0), 0);
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
// Pedir algo à página: abrir O.S., trocar de período, abrir um dia. O foco sai
// daqui quando a página abre um modal por cima.
const paraPai = msg => { if (window.parent !== window) window.parent.postMessage(msg, '/'); return window.parent !== window; };
const avisoProto = txt => { document.querySelector('.aviso-proto')?.remove(); const t = document.createElement('div'); t.className = 'aviso-proto'; t.textContent = txt; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

// As cores que o sistema já usa: formas de pagamento (o relatório do dia de
// hoje), categorias de conta (CATEGORIAS_CONTA) e situação das O.S.
const COR_FORMA = { 'PIX': '#10b981', 'Cartão de Crédito': '#6366f1', 'Cartão de Débito': '#0ea5e9', 'Link de Pagamento': '#8b5cf6', 'Dinheiro': '#f59e0b', 'Boleto': '#64748b', 'Estorno': '#ef4444' };
const corForma = f => COR_FORMA[f] || '#9ca3af';
const COR_CATEG = { 'Despesa': '#10b981', 'Material': '#3b82f6', 'Manutenção': '#f59e0b', 'Terceirização': '#a855f7', 'Impostos': '#f43f5e' };
// As linhas de produtos: a paleta categórica validada (dataviz), oito cores em
// ordem fixa, com o passo próprio do escuro. Um produto fica com a cor que
// recebeu enquanto estiver no gráfico — tirar outro não repinta os que ficam.
// As oito ficam nos tokens --serie-1…--serie-8 (claro e escuro), e o tema troca sozinho.
const corSlot = k => `var(--serie-${k % 8 + 1})`;

/* ===== estado ===== */
let M = DADOS.atual, ANT = DADOS.anterior, ANT_PER = DADOS.periodoAnterior, CORES_LOCAL = DADOS.cores || {};
const ABAS = [['geral', 'Visão geral', 'layout-dashboard'], ['vendas_produto', 'Produtos', 'package'], ['vendas_cliente', 'Clientes', 'users']]
  .filter(([id]) => !DADOS.abas?.length || DADOS.abas.includes(id));

/* ===== período ===== */
// Os mesmos atalhos da tela de hoje (Este mês, Este ano, 12 meses, Tudo), mais
// o mês e o ano passados. Mês e ano andam pelas setas; o resto, pelo popover.
const mesInteiro = m => { const [a, mm] = m.split('-').map(Number); return { tipo: 'mes', chave: m, inicio: `${m}-01`, fim: `${m}-${String(ultimoDia(a, mm)).padStart(2, '0')}` }; };
const anoInteiro = a => ({ tipo: 'ano', chave: String(a), inicio: `${a}-01-01`, fim: `${a}-12-31` });
const somarMes = (m, n) => { const [a, mm] = m.split('-').map(Number); return isoDe(new Date(a, mm - 1 + n, 1)).slice(0, 7); };
const ATALHOS = [
  ['mes', 'Este mês', () => mesInteiro(HOJE.slice(0, 7))],
  ['mesant', 'Mês passado', () => mesInteiro(somarMes(HOJE.slice(0, 7), -1))],
  ['ano', 'Este ano', () => anoInteiro(HOJE.slice(0, 4))],
  ['anoant', 'Ano passado', () => anoInteiro(+HOJE.slice(0, 4) - 1)],
  ['doze', 'Últimos 12 meses', () => { const ini = somarMes(HOJE.slice(0, 7), -11); const f = mesInteiro(HOJE.slice(0, 7)).fim; return { tipo: 'doze', inicio: `${ini}-01`, fim: f }; }],
  ['tudo', 'Todo o período', () => ({ tipo: 'tudo', inicio: '2000-01-01', fim: '2099-12-31' })],
];
function periodoDe(inicio, fim) {
  for (const [, , f] of ATALHOS) { const p = f(); if (p.inicio === inicio && p.fim === fim) return p; }
  const [a, m] = inicio.split('-');
  if (inicio.endsWith('-01') && mesInteiro(`${a}-${m}`).fim === fim) return mesInteiro(`${a}-${m}`);
  if (inicio.endsWith('-01-01') && fim === `${a}-12-31`) return anoInteiro(a);
  return { tipo: 'livre', inicio, fim };
}
const est = {
  aba: ABAS[0]?.[0] || 'geral', serie: 'dia',
  per: periodoDe(DADOS.inicio, DADOS.fim), carregando: false, pedido: 0, erro: null,
  sel: null, slots: new Map(), buscaProd: '', buscaCli: '', limProd: 30, limCli: 50,
};
const dia = { iso: null, pedidos: null, erro: null, abertos: new Set() };
function rotuloPeriodo(p = est.per) {
  if (p.tipo === 'mes') { const [a, m] = p.chave.split('-').map(Number); return `${maiuscula(MESES[m - 1])} de ${a}`; }
  if (p.tipo === 'ano') return p.chave;
  if (p.tipo === 'doze') return 'Últimos 12 meses';
  if (p.tipo === 'tudo') return 'Todo o período';
  return `${ddmm(p.inicio)} – ${ddmmaa(p.fim)}`;
}
// "1 a 28 de setembro", "1º/01 a 28/10/2025" — o período com que se compara.
function rotuloComparacao() {
  if (!ANT_PER) return '';
  const [i, f] = ANT_PER;
  if (i.slice(0, 7) === f.slice(0, 7)) return `${+i.slice(8)} a ${+f.slice(8)} de ${MESES[+i.slice(5, 7) - 1]}${i.slice(0, 4) !== HOJE.slice(0, 4) ? ` de ${i.slice(0, 4)}` : ''}`;
  if (i.slice(0, 4) === f.slice(0, 4)) return `${ddmm(i)} a ${ddmm(f)}/${f.slice(0, 4)}`;
  return `${ddmmaa(i)} a ${ddmmaa(f)}`;
}
function pedirPeriodo(p) {
  if (p.inicio === est.per.inicio && p.fim === est.per.fim) return;
  est.per = p; est.erro = null;
  if (!paraPai({ tipo: 'pedir-periodo', pedido: ++est.pedido, inicio: p.inicio, fim: p.fim })) { avisoProto('Fora do sistema o protótipo não busca outros períodos.'); return; }
  est.carregando = true;
  render('quieto');
}
function andar(n) {
  if (est.per.tipo === 'mes') pedirPeriodo(mesInteiro(somarMes(est.per.chave, n)));
  else if (est.per.tipo === 'ano') pedirPeriodo(anoInteiro(+est.per.chave + n));
}

/* ===== peças ===== */
function area(cls, icone, titulo, meta, corpo, pe, acao, id) {
  return `<section class="area ${cls}" ${id ? `id="${id}"` : ''}><div class="area-cab"><span class="area-ico">${ico(icone)}</span><h2>${titulo}</h2>${meta ? `<span class="area-meta num">${meta}</span>` : ''}${acao || ''}</div>${corpo}${pe ? `<div class="area-pe">${pe}</div>` : ''}</section>`;
}
const vazio = (txt, icone = 'check-circle-2') => `<div class="vazio">${ico(icone)}${txt}</div>`;
const seg = (rotulo, opcoes, atual, attr) => `<div class="seg" role="group" aria-label="${rotulo}"><span class="seg-trilho"></span>${opcoes.map(([id, rot]) => `<button ${attr}="${id}" aria-pressed="${id === atual}">${rot}</button>`).join('')}</div>`;
function numeros(cels, cls = '') {
  return `<div class="numeros ${cls}" style="--n:${cels.length}">${cels.map(c => `<div class="n-cel a-${c.area || 'dados'} ${c.laranja ? 'laranja' : ''} ${c.leve ? 'leve' : ''}"${c.title ? `title="${esc(c.title)}"` : ''}>
      <span class="n-topo"><span class="n-ico">${ico(c.icone)}</span><span class="n-rot">${c.rot}</span></span>
      <span class="n-linha"><span class="n-val num ${c.alerta ? 'alerta' : ''} ${c.texto ? 'texto' : ''}">${c.val}</span>${c.tend || ''}${c.mini || ''}</span>
      <span class="n-pe">${c.med || ''}<span class="n-ctx">${c.ctx || '&nbsp;'}</span></span>
    </div>`).join('')}</div>`;
}
function tendencia(atual, antes, base) {
  if (!antes || antes <= 0) return '';
  const pct = Math.round((atual - antes) / antes * 100);
  const txt = pct ? `${pct > 0 ? 'a mais' : 'a menos'} que ${base}` : `igual a ${base}`;
  return `<span class="tend ${pct > 0 ? 'sobe' : pct < 0 ? 'desce' : ''}" title="${esc(Math.abs(pct) + '% ' + txt)}">${pct ? ico(pct > 0 ? 'trending-up' : 'trending-down') : ''}${pct ? Math.abs(pct) + '%' : 'igual'}<span class="so-leitor"> ${txt}</span></span>`;
}
// A série recente em colunas pequenas; `aceso` é a coluna em destaque (hoje).
function mini(vals, aceso) {
  const m = Math.max(1, ...vals);
  return `<span class="n-mini" aria-hidden="true">${vals.map((v, i) => `<i class="cy ${i === aceso ? 'aceso' : ''}" style="height:${v ? Math.max(8, v / m * 100) : 0}%;--i:${i}"></i>`).join('')}</span>`;
}
// Partes de um todo num trilho: [{ v, cls }]; o que sobra do trilho fica vazio.
function partes(ps, todo) {
  const usado = ps.reduce((s, p) => s + Math.max(0, p.v), 0);
  return `<span class="medidor rv" aria-hidden="true">${ps.filter(p => p.v > 0).map(p => `<i class="${p.cls || ''}" style="flex:${p.v}"></i>`).join('')}${todo > usado ? `<i class="vazio" style="flex:${todo - usado}"></i>` : ''}</span>`;
}
// A data em bloco, como nas novas Contas: vencida em vermelho, hoje em âmbar.
function dataEmBloco(iso, tom) {
  if (!iso) return '<span class="diaf"><span>sem</span><span>data</span></span>';
  const d = dataLocal(iso), longe = Math.abs(diasEntre(HOJE, iso)) > 6;
  return `<span class="diaf ${tom || ''}" title="${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}"><b class="num">${String(d.getDate()).padStart(2, '0')}</b><span>${iso === HOJE ? 'hoje' : longe ? MESES[d.getMonth()].slice(0, 3) : SEMANA[d.getDay()].slice(0, 3)}</span></span>`;
}
// Eixo em dois degraus redondos (0, passo, 2×passo) que cobrem o maior valor.
function passoDoEixo(maior) {
  const bruto = maior / 100 / 2 || 1, mag = 10 ** Math.floor(Math.log10(bruto));
  return [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= bruto) * 100;
}

/* ===== visão geral ===== */
function telaGeral() {
  const R = M.resumo, D = M.despesas, A = ANT?.resumo;
  const comp = rotuloComparacao();
  const resultado = R.recebido_centavos - D.total_centavos;
  const resAnt = ANT ? ANT.resumo.recebido_centavos - ANT.despesas.total_centavos : 0;
  const aReceber = Math.max(0, R.a_receber_centavos);
  // A segunda faixa: os outros cartões do resumo de hoje, um por número.
  const serie = [...(M.serie_dia || [])].reverse(), ult7 = serie.slice(-7);

// Faturamento no tempo: as séries não seguem o período (como na tela de hoje):
// são sempre os 15 últimos dias, meses ou anos com venda — tendência, não recorte.
// Os três num quadro só, trocando entre dia, mês e ano; o dia abre o relatório.
function blocoFaturamento() {
  return area('a-fin elevado', 'bar-chart-3', 'Faturamento no tempo<small>os 15 últimos com venda · não segue o período escolhido</small>', '',
    `<div class="area-corpo" id="graf-fat">${grafSerie(est.serie)}</div>`, '',
    seg('Agrupar por', [['dia', 'Por dia'], ['mes', 'Por mês'], ['ano', 'Por ano'], ['cal', 'Calendário']], est.serie, 'data-serie'));
}
function grafSerie(modo) {
  if (modo === 'cal') return grafCalendario();
  const [a, m, d] = HOJE.split('-').map(Number);
  const fonte = { dia: M.serie_dia, mes: M.serie_mes, ano: M.serie_ano }[modo] || [];
  let proj = 0, media = 0, rotMedia = '';
  const pontos = [...fonte].reverse().map(s => {
    if (modo === 'dia') { const dt = dataLocal(s.rotulo), atual = s.rotulo === HOJE;
      return { v: s.centavos, atual, iso: s.rotulo, x: atual ? 'hoje' : String(dt.getDate()), tip: `${SEMANA[dt.getDay()]}, ${dt.getDate()} de ${MESES[dt.getMonth()]}${s.rotulo.slice(0, 4) !== HOJE.slice(0, 4) ? ` de ${s.rotulo.slice(0, 4)}` : ''}` }; }
    if (modo === 'mes') { const [ano, mm] = s.rotulo.split('-').map(Number), atual = s.rotulo === HOJE.slice(0, 7);
      return { v: s.centavos, atual, x: mm === 1 ? `jan/${String(ano).slice(2)}` : MESES[mm - 1].slice(0, 3), tip: `${MESES[mm - 1]} de ${ano}${atual ? ' (até hoje)' : ''}` }; }
    const atual = s.rotulo === HOJE.slice(0, 4);
    return { v: s.centavos, atual, x: s.rotulo, tip: `${s.rotulo}${atual ? ' (até hoje)' : ''}` };
  });
  if (!pontos.length) return vazio('Ainda sem vendas registradas.', 'bar-chart-3');
  // A projeção (mês e ano em andamento) segue o ritmo até hoje; é estimativa.
  const ult = pontos.at(-1);
  if (ult.atual && modo === 'mes') proj = Math.round(ult.v / d * ultimoDia(a, m));
  if (ult.atual && modo === 'ano') { const dia = diasEntre(`${a}-01-01`, HOJE) + 1, total = diasEntre(`${a}-01-01`, `${a}-12-31`) + 1; proj = Math.round(ult.v / dia * total); }
  if (modo === 'dia') { media = soma(pontos, p => p.v) / pontos.length; rotMedia = 'média por dia com venda'; }
  else { const f = pontos.filter(p => !p.atual); media = f.length ? soma(f, p => p.v) / f.length : 0; rotMedia = modo === 'mes' ? 'média dos meses fechados' : 'média dos anos fechados'; }
  const passo = passoDoEixo(Math.max(...pontos.map(p => p.v), proj));
  const pct = c => Math.min(100, c / (passo * 2) * 100);
  const ultimo = pontos.length - 1;
  const iMaior = pontos.reduce((k, p, j) => p.v > pontos[k].v ? j : k, 0);
  const fim = pontos.length > 4 ? 'fim' : '';
  const cols = pontos.map((p, j) => {
    const temProj = j === ultimo && proj > p.v;
    const rot = temProj ? `<b class="graf-val suave ${fim}" style="bottom:calc(${pct(proj)}% + 4px)">~ ${compacto(proj)}</b>`
      : (j === ultimo || (j === iMaior && iMaior < ultimo - 1)) ? `<b class="graf-val ${j === ultimo ? fim : 'suave'}" style="bottom:calc(${pct(p.v)}% + 4px)">${compacto(p.v)}</b>` : '';
    const tip = `${esc(p.tip)}${modo === 'dia' ? ' · clique para ver' : ''}|${reais(p.v, true)}${temProj ? ` · ~ ${reais(proj)} no ritmo` : ''}`;
    const dentro = `${temProj ? `<span class="proj" style="bottom:${pct(p.v)}%;height:${pct(proj) - pct(p.v)}%"></span>` : ''}<i class="cy ${j === ultimo ? '' : 'passado'}" style="height:${pct(p.v)}%;--i:${j}"></i>${rot}`;
    return modo === 'dia'
      ? `<button class="graf-col" data-dia="${p.iso}" data-tip="${tip}" aria-label="${esc(p.tip)}: ${reais(p.v, true)}. Ver o que foi vendido">${dentro}</button>`
      : `<div class="graf-col" tabindex="0" data-tip="${tip}">${dentro}</div>`;
  }).join('');
  return `<div class="graf" role="img" aria-label="Faturamento ${modo === 'dia' ? 'por dia' : modo === 'mes' ? 'por mês' : 'por ano'}">
    <div class="graf-area">
      ${[1, 2].map(k => `<div class="graf-grade" style="bottom:${k * 50}%" aria-hidden="true"><span>${compacto(passo * k)}</span></div>`).join('')}
      ${media ? `<div class="graf-media" style="bottom:${pct(media)}%"></div>` : ''}
      <div class="graf-cols">${cols}</div>
    </div>
    <div class="graf-x" aria-hidden="true">${pontos.map(p => `<span class="${p.atual ? 'hoje' : ''}">${p.x}</span>`).join('')}</div>
    <div class="graf-leg">
      <span aria-hidden="true"><i class="m-col"></i>vendido ${modo === 'dia' ? 'no dia' : modo === 'mes' ? 'no mês' : 'no ano'}</span>
      ${proj ? `<span aria-hidden="true"><i class="m-proj"></i>no ritmo até o fim ${modo === 'mes' ? 'do mês' : 'do ano'}</span>` : ''}
      ${media ? `<span><i class="m-media"></i>${rotMedia} <b class="num">${reais(media)}</b></span>` : ''}
      ${modo === 'dia' ? `<span class="dica">${ico('mouse-pointer-click', 'ico ico-s')}clique num dia para ver o que foi vendido</span>` : ''}
    </div>
    <table class="so-leitor"><caption>Faturamento</caption><tbody>${pontos.map(p => `<tr><th>${esc(p.tip)}</th><td>${reais(p.v, true)}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

// Um quadro de composição: o maior pedaço em destaque, a barra fatiada e a
// lista com a cor, o valor e a parte de cada um. O mesmo desenho para local,
// forma de pagamento, instituição, categoria e situação das contas — muda só
// o que se lê. Valor negativo (estorno) aparece na lista e fica fora da barra.
function composicao({ cls, icone, titulo, sub, itens, cor, frase, meta, extra, attrs, vazioTxt, vazioIco }) {
  const pos = itens.filter(x => x.centavos > 0), total = soma(pos);
  const cab = `${titulo}<small>${sub}</small>`;
  if (!total) return area(cls, icone, cab, '', vazio(vazioTxt, vazioIco));
  const topo = pos[0];
  const corpo = `<div class="comp-corpo">
      <div class="comp-topo"><b class="num">${pctDe(topo.centavos, total)}<small>%</small></b><span>${frase(topo)}</span>${extra || ''}</div>
      <div class="fatias" role="img" aria-label="${esc(pos.map(x => `${x.rotulo}: ${pctTxt(x.centavos, total)}`).join(', '))}">${pos.map((x, k) => `<i class="cx" style="flex:${x.centavos};background:${cor(x)};--i:${k}" title="${esc(x.rotulo)}: ${reais(x.centavos, true)}"></i>`).join('')}</div>
    </div>
    <ul class="comp-lista ${attrs ? 'clicavel' : ''}">${itens.map(x => `<li ${attrs ? attrs(x) : ''}><i style="background:${cor(x)}"></i><span class="nome" title="${esc(x.rotulo)}">${esc(x.rotulo)}</span><span class="v num ${x.centavos < 0 ? 'neg' : ''}">${reais(x.centavos)}</span><span class="p num">${x.centavos > 0 ? pctTxt(x.centavos, total) : ''}</span>${attrs ? ico('chevron-right', 'ico ico-s seta') : ''}</li>`).join('')}</ul>`;
  return area(cls, icone, cab, meta ?? reais(soma(itens)), corpo);
}
// Instituição não tem cor no sistema: cada uma fica com uma da paleta validada,
// sempre a mesma (sai do nome, não da posição). Os bancos conhecidos têm a
// sua, distintas entre si; um nome novo pega a primeira livre a partir do
// próprio nome, para dois bancos nunca dividirem a cor. "Indefinido" é cinza.
const SLOT_INST = { 'itau': 1, 'infinite pay': 2, 'infinitepay': 2, 'banco do brasil': 3, 'nubank': 6, 'caixa': 0, 'bradesco': 7, 'santander': 4, 'inter': 5 };
function coresInst(nomes) {
  const usados = new Set(), cor = {};
  nomes.forEach(n => { const k = SLOT_INST[semAcento(n).trim()]; if (k != null) { cor[n] = k; usados.add(k); } });
  nomes.forEach(n => {
    if (cor[n] != null || !n || n === 'Indefinido') return;
    let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    let k = h % 8; for (let i = 0; i < 8 && usados.has(k); i++) k = (k + 1) % 8;
    cor[n] = k; usados.add(k);
  });
  return n => cor[n] != null ? corSlot(cor[n]) : '#9ca3af';
}

function blocoLocais() {
  // O.S. com dois locais divide o valor entre eles (como na tela de hoje).

function blocoMaioresContas() {

  const corpo = l.length ? `<ul class="lista compacta">${l.map(c => `<li><div class="lin">${dataEmBloco(c.vencimento, tom(c))}<span class="lin-txt"><span class="lin-tit" title="${esc(c.descricao || 'Conta')}">${esc(c.descricao || 'Conta')}</span></span><span class="lin-dir num">${c.centavos ? reais(c.centavos) : '<small>a definir</small>'}${sit(c)}</span></div></li>`).join('')}</ul>` : vazio('Nenhuma conta no período.', 'receipt');
  return area('a-dados', 'list-ordered', 'Maiores contas<small>as mais altas do período</small>', '', corpo);
}

/* ===== produtos ===== */
const rotMesLongo = m => { const [a, mm] = m.split('-').map(Number); return `${MESES[mm - 1]} de ${a}`; };
const serieDe = nome => M.serie_produto_mes?.series?.find(s => s.produto === nome)?.valores || null;
// A seleção do gráfico sobrevive à troca de período: fica quem ainda vendeu.
function ajustarSelecao() {
  const nomes = new Set((M.ranking_produto || []).map(r => r.rotulo));
  if (est.sel) est.sel = est.sel.filter(n => nomes.has(n) || serieDe(n));
  if (!est.sel || !est.sel.length) est.sel = (M.ranking_produto || []).filter(r => serieDe(r.rotulo)).slice(0, 5).map(r => r.rotulo);
  for (const n of [...est.slots.keys()]) if (!est.sel.includes(n)) est.slots.delete(n);
  est.sel.forEach(n => { if (!est.slots.has(n)) est.slots.set(n, [0, 1, 2, 3, 4, 5, 6, 7].find(k => ![...est.slots.values()].includes(k))); });
}
const corProd = n => corSlot(est.slots.get(n) ?? 0);
function alternarProduto(nome) {
  if (est.sel.includes(nome)) { est.sel = est.sel.filter(n => n !== nome); est.slots.delete(nome); }
  else {
    if (est.sel.length >= 8) return avisoProto('Até 8 produtos no gráfico. Tire um antes de pôr outro.');
    if (!serieDe(nome)) return avisoProto('Este produto não vendeu nos últimos 12 meses.');
    est.sel = [...est.sel, nome]; ajustarSelecao();
  }
  document.getElementById('graf-prod').innerHTML = grafProdutos(true);
  document.getElementById('tab-prod').innerHTML = linhasProdutos();
  lucide.createIcons();
}
function telaProdutos() {
  const rk = M.ranking_produto || [], total = soma(rk);
  const top5 = soma(rk.slice(0, 5));
  return numeros([
    { rot: 'Produtos com venda', icone: 'package', area: 'itens', val: inteiro(rk.length), ctx: 'do catálogo e digitados, no período' },
    { rot: 'O mais vendido', icone: 'trophy', area: 'itens', val: rk[0] ? esc(legivel(rk[0].rotulo)) : '—', texto: true, ctx: rk[0] ? `<b>${reais(rk[0].centavos)}</b> · ${pctTxt(rk[0].centavos, total)} do vendido em itens` : 'nada no período', title: rk[0] ? legivel(rk[0].rotulo) : '' },
    { rot: 'Os 5 mais vendidos', icone: 'layers', area: 'itens', val: `${pctDe(top5, total)}<small>%</small>`, med: total ? partes([{ v: top5 }], total) : '', ctx: `do vendido em itens · <b>${reais(top5)}</b>` },
  ]) + area('a-itens elevado', 'line-chart', `Por mês<small>${mesesProdutos().ini ? `desde ${rotMesLongo(mesesProdutos().meses[0])}, o primeiro mês com venda` : 'os últimos 12 meses'} · até 8 produtos · não segue o período escolhido</small>`, '', `<div class="area-corpo" id="graf-prod">${grafProdutos()}</div>`)
    + `<div style="height:20px"></div>`
    + area('a-itens', 'list', 'Vendas por produto<small>no período escolhido</small>', rk.length ? reais(total) : '',
      rk.length ? `<div class="ferramentas"><label class="busca">${ico('search')}<input id="busca-prod" value="${esc(est.buscaProd)}" placeholder="Buscar produto" autocomplete="off"><kbd>/</kbd></label><span class="conta" id="conta-prod"></span></div>
        <div class="tab-cab t-prod"><span>#</span><span></span><span>Produto</span><span>Por mês</span><span class="d">Vendido</span><span class="d">Parte</span></div>
        <div class="tab-corpo" id="tab-prod">${linhasProdutos()}</div>` : vazio('Nenhum produto faturado no período.', 'package'));

// Os meses do gráfico de produtos: os 12 últimos, a partir do primeiro com

const serieCortada = nome => { const v = serieDe(nome); return v && v.slice(mesesProdutos().ini); };

// A cruz do gráfico de linhas: o mês sob o mouse, um ponto por produto e a

/* ===== calendário do mês ===== */
// Começa no mês do fim do período escolhido (nunca depois de hoje) e anda com ‹ ›.
// Os dias vêm da página, só quando o calendário abre, e ficam guardados por mês.
const cal = { mes: null, meses: {}, erros: {} };
const mesDoPeriodo = () => { const f = est.per?.fim && est.per.tipo !== 'tudo' ? est.per.fim : HOJE; return (f > HOJE ? HOJE : f).slice(0, 7); };
const somarMesCal = (mes, n) => { const [a, m] = mes.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const TONS_CAL = [14, 32, 52, 76, 100];
function grafCalendario() {
  const mes = cal.mes || mesDoPeriodo();
  const [a, m] = mes.split('-').map(Number), total = ultimoDia(a, m), inicio = new Date(a, m - 1, 1).getDay();
  const dias = cal.meses[mes];
  if (!dias && !cal.erros[mes]) { cal.mes = mes; if (!paraPai({ tipo: 'pedir-calendario', mes })) cal.erros[mes] = 'Fora do sistema o protótipo não busca o mês.'; }
  const lista = dias ? Object.values(dias) : [];
  const maior = Math.max(1, ...lista.map(x => x.centavos)), soma = lista.reduce((t, x) => t + x.centavos, 0);
  const faixa = v => Math.min(4, Math.max(0, Math.ceil(v / maior * 5) - 1));
  const cor = t => t === 100 ? 'var(--fin)' : `color-mix(in srgb, var(--fin) ${t}%, transparent)`;
  let h = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(x => `<span class="sem">${x}</span>`).join('') + '<span></span>'.repeat(inicio);
  for (let d = 1; d <= total; d++) {
    const iso = `${mes}-${String(d).padStart(2, '0')}`, x = dias?.[iso], data = new Date(a, m - 1, d);
    const tit = `${maiuscula(SEMANA[data.getDay()])}, ${d} de ${MESES[m - 1]}`;
    if (!dias) { h += `<span class="calv-dia ${cal.erros[mes] ? 'sem-venda' : 'espera'}"><span class="n">${d}</span></span>`; continue; }
    if (iso > HOJE) { h += `<span class="calv-dia futuro"><span class="n">${d}</span></span>`; continue; }
    if (!x) { h += `<span class="calv-dia sem-venda ${iso === HOJE ? 'hoje' : ''}" title="${tit}: sem venda"><span class="n">${d}</span></span>`; continue; }
    const t = TONS_CAL[faixa(x.centavos)];
    h += `<button class="calv-dia ${t >= 76 ? 'forte' : ''} ${iso === HOJE ? 'hoje' : ''}" style="background:${cor(t)}" data-dia="${iso}" data-tip="${esc(tit)} · ${x.pedidos} ${x.pedidos === 1 ? 'pedido' : 'pedidos'} · clique para ver|${reais(x.centavos, true)}" aria-label="${esc(tit)}: ${reais(x.centavos, true)}. Ver o que foi vendido"><span class="n">${d}</span><span class="v">${compacto(x.centavos)}</span></button>`;
  }
  const escala = dias && lista.length ? TONS_CAL.map((t, k) => `<span><i style="background:${cor(t)}"></i><b>${t}%</b>até ${compacto(maior * (k + 1) / 5)}</span>`).join('') : '';

  return `<div class="calv-topo"><button class="ib" data-cal-mes="-1" aria-label="Mês anterior">${ico('chevron-left')}</button><b>${maiuscula(MESES[m - 1])} de ${a}</b><button class="ib" data-cal-mes="1" aria-label="Próximo mês" ${mes >= HOJE.slice(0, 7) ? 'disabled' : ''}>${ico('chevron-right')}</button><span class="resumo-mes">${resumo}</span></div>`
    + `<div class="calv-grade" role="group" aria-label="Vendido por dia em ${MESES[m - 1]} de ${a}">${h}</div>`
    + (escala ? `<div class="calv-escala" aria-hidden="true">${escala}</div>` : '');
}

/* ===== relatório do dia (gaveta) ===== */
// O que aconteceu num dia: quem comprou, o que levou e como pagou. A página lê

const valorPag = g => g.forma === 'Estorno' ? -g.valor : g.valor;
const gvRaiz = document.getElementById('gv');
function abrirDia(iso) {

      </div>` : ''}</li>`; }).join('');
  return `<div class="det">${cab}
    <div class="det-valor"><small>R$</small>${brl(total, true)}</div>

    ${totForma > 0 ? `<div class="comp"><div class="fatias" role="img" aria-label="${formas.map(([f, v]) => `${f}: ${pctTxt(v, totForma)}`).join(', ')}">${formas.map(([f, v]) => `<i style="flex:${v};background:${corForma(f)}" title="${esc(f)}: ${reais(v, true)}"></i>`).join('')}</div>

/* ===== contas de uma categoria de despesa (a mesma gaveta) ===== */
