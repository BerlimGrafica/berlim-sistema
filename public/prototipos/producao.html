<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produção — 4 opções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Padrão do DESIGN.md: o mesmo mundo do modal de O.S. (opção B) e dos pré-prontos. */
:root {
  --brand: #F69F00; --brand-hover: #d98b00; --brand-tinta: #8A5400; --sobre-brand: #241600;
  --fundo: #EDEFF0; --superficie: #ffffff; --sutil: #f9fafb; --realce: #f3f4f6;
  --borda-fraca: #f0f1f3; --borda: #e5e7eb; --borda-forte: #d1d5db;
  --tinta: #111827; --tinta-corpo: #374151; --tinta-suave: #6b7280; --tinta-fraca: #9ca3af;
  --perigo: #dc2626; --perigo-fundo: #fef2f2; --perigo-borda: #fecaca;
  --sucesso: #059669;
  --sombra: 0 24px 56px -16px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.08);
  --sombra-pop: 0 12px 28px -8px rgba(15,23,42,.24), 0 1px 3px rgba(15,23,42,.08);
  --sombra-leve: 0 1px 2px rgba(15,23,42,.06);
  --dados: #475569; --dados-fundo: #f1f5f9; --dados-borda: #e2e8f0;
  --itens: #2563eb; --itens-tinta: #1d4ed8; --itens-fundo: #eff6ff; --itens-borda: #dbeafe;
  --fin: #059669; --fin-tinta: #047857; --fin-fundo: #ecfdf5; --fin-borda: #c9f2df;
  --obs: #d97706; --obs-tinta: #b45309; --obs-fundo: #fffbeb; --obs-borda: #fdecc4;
  --arte: #2563eb; --arte-fundo: #eff6ff; --entrega: #ea580c; --entrega-fundo: #fff7ed;
  --veu: rgba(15,23,42,.36);
}
.dark {
  --brand-tinta: #FFB938;
  --fundo: #0d1117; --superficie: #161b22; --sutil: #1b2129; --realce: #21262d;
  --borda-fraca: #232a33; --borda: #30363d; --borda-forte: #3d444d;
  --tinta: #EDEDED; --tinta-corpo: #D4D4D8; --tinta-suave: #A1A1AA; --tinta-fraca: #71717a;
  --perigo: #f87171; --perigo-fundo: rgba(239,68,68,.1); --perigo-borda: rgba(239,68,68,.3);
  --sucesso: #34d399;
  --sombra: 0 24px 56px -16px rgba(0,0,0,.7); --sombra-pop: 0 12px 28px -8px rgba(0,0,0,.6); --sombra-leve: 0 1px 2px rgba(0,0,0,.4);
  --dados: #94a3b8; --dados-fundo: rgba(148,163,184,.09); --dados-borda: rgba(148,163,184,.2);
  --itens: #60a5fa; --itens-tinta: #93c5fd; --itens-fundo: rgba(59,130,246,.12); --itens-borda: rgba(59,130,246,.3);
  --fin: #34d399; --fin-tinta: #6ee7b7; --fin-fundo: rgba(16,185,129,.11); --fin-borda: rgba(16,185,129,.28);
  --obs: #fbbf24; --obs-tinta: #fcd34d; --obs-fundo: rgba(245,158,11,.1); --obs-borda: rgba(245,158,11,.26);
  --arte: #60a5fa; --arte-fundo: rgba(59,130,246,.14); --entrega: #fb923c; --entrega-fundo: rgba(249,115,22,.14);
  --veu: rgba(0,0,0,.6);
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; } html.dark { color-scheme: dark; }
body { font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--tinta-corpo); background: var(--fundo); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
input { caret-color: var(--brand); }
::selection { background: rgba(246,159,0,.3); }
::placeholder { color: var(--tinta-suave); opacity: 1; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }
.ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.ico-s { width: 14px; height: 14px; }
.num { font-variant-numeric: tabular-nums; }
kbd { font: 600 10.5px/1 Montserrat, sans-serif; color: var(--tinta-suave); border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--superficie); }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex-shrink: 0; }
mark { background: rgba(246,159,0,.3); color: inherit; border-radius: 2px; }

/* moldura: a barra de cima faz o papel do cabeçalho do sistema (--altura-cabecalho
   no app), e tudo que gruda ao rolar gruda logo abaixo dela */
html { --altura-cabecalho: 51px; --altura-filtros: 42px; }
.proto { position: sticky; top: 0; z-index: 40; height: 51px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.proto-nome { font-weight: 700; color: var(--tinta); white-space: nowrap; }
.proto-nota { color: var(--tinta-suave); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.proto-tema { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--tinta-corpo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; flex-shrink: 0; }
.proto-tema:hover { background: var(--realce); color: var(--tinta); }

/* botões */
.btn { height: 38px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn-pri { background: var(--brand); color: var(--sobre-brand); }
.btn-pri:hover { background: var(--brand-hover); }
.btn-pri kbd { background: rgba(255,255,255,.35); border-color: rgba(36,22,0,.18); color: var(--sobre-brand); }
.btn-sec { border: 1px solid var(--borda-forte); color: var(--tinta); background: var(--superficie); }
.btn-sec:hover { background: var(--sutil); border-color: var(--tinta-fraca); }
.btn-txt { color: var(--tinta-suave); padding: 0 10px; }
.btn-txt:hover { color: var(--tinta); background: var(--realce); }
.btn-p { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 7px; }
.btn-ok { background: var(--fin); color: #fff; } .btn-ok:hover { filter: brightness(.95); } .dark .btn-ok { color: #04140d; }
.btn-ok.conf { background: var(--perigo); color: #fff; }
.ib { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--tinta-suave); transition: background .12s, color .12s; flex-shrink: 0; }
.ib:hover { background: var(--realce); color: var(--tinta); }

/* topo da tela */
.pg { max-width: 1360px; margin: 0 auto; padding: 22px 28px 80px; }
.cab { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
.cab h1 { font-size: 22px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; line-height: 1.2; }
.cab p { color: var(--tinta-suave); font-size: 12.5px; margin-top: 3px; }
.cab .acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.cab .busca { width: 300px; height: 38px; flex: none; }
.cab .busca input { height: 36px; }
.busca { position: relative; display: flex; align-items: center; gap: 10px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px; padding: 0 10px 0 12px; height: 42px; transition: border-color .15s, box-shadow .15s; }

/* filtros como abas: linha que separa o cabeçalho da lista, traço laranja na aba ativa */
.abas-wrap { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--borda); margin-bottom: 4px; height: var(--altura-filtros); background: var(--fundo); }
/* Ao rolar, a faixa de abas gruda no topo e vira a barra da tela: os filtros e a
   ação principal ficam à mão em qualquer ponto da lista. O título com a busca vai
   embora; quando a faixa gruda, "Nova O.S." entra compacto na ponta direita, no
   mesmo lugar onde estava o botão grande. No celular a faixa rola junto e a ação
   fica na barra do rodapé. */
@media (min-width: 761px) {
  html { scroll-padding-top: calc(var(--altura-cabecalho) + var(--altura-filtros) + 48px); }
  .abas-wrap { position: sticky; top: var(--altura-cabecalho); z-index: 6; }
  .pg:has(.abas-wrap.preso) .tab-cab { box-shadow: 0 1px 0 var(--borda); }
  .preso .nova-presa { display: inline-flex; }
}
.nova-presa { display: none; margin-left: 4px; }
.abas { position: relative; display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.abas::-webkit-scrollbar { display: none; }
/* quando há aba escondida para o lado, a borda esmaece em vez de cortar seco */
.abas.corta-esq { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px); mask-image: linear-gradient(to right, transparent, #000 28px); }
.abas.corta-dir { -webkit-mask-image: linear-gradient(to left, transparent, #000 28px); mask-image: linear-gradient(to left, transparent, #000 28px); }
.abas.corta-esq.corta-dir { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
.aba { display: inline-flex; align-items: center; gap: 7px; height: var(--altura-filtros); padding: 0 8px 2px; font-weight: 600; font-size: 13px; color: var(--tinta-suave); white-space: nowrap; border-radius: 6px 6px 0 0; transition: color .15s; }
.aba:hover { color: var(--tinta-corpo); }
.aba[aria-selected="true"] { color: var(--tinta); }
.aba .n { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; background: var(--realce); color: var(--tinta-suave); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; transition: background .15s, color .15s; }
.aba[aria-selected="true"] .n { background: var(--tinta); color: var(--superficie); }
.aba.alerta .n { background: var(--perigo-fundo); color: var(--perigo); }
.aba.alerta[aria-selected="true"] .n { background: var(--perigo); color: #fff; }
.indicador { position: absolute; left: 0; bottom: 0; width: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--brand); transition: left .34s cubic-bezier(.16,1,.3,1), width .34s cubic-bezier(.16,1,.3,1); pointer-events: none; }
.abas-fim { flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding-bottom: 5px; }
.ib.todos[aria-pressed="true"] { color: var(--brand-tinta); }
.busca:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.busca .ico { color: var(--tinta-suave); }
.busca input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 40px; color: var(--tinta); }
.busca .limpar { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--tinta-suave); }
.busca .limpar:hover { background: var(--realce); color: var(--tinta); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-f { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--borda); background: var(--superficie); font-weight: 600; font-size: 12.5px; color: var(--tinta-corpo); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; transition: background .12s, border-color .12s; }
.chip-f:hover { border-color: var(--borda-forte); background: var(--sutil); }
.chip-f .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip-f.alerta .n { color: var(--perigo); font-weight: 700; }
.chip-f[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--superficie); }
.chip-f[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.vazio { padding: 48px 16px; text-align: center; color: var(--tinta-suave); }
.vazio b { display: block; color: var(--tinta); font-size: 14px; margin-bottom: 4px; }

/* átomos da linha */
.pz { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--tinta); white-space: nowrap; font-variant-numeric: tabular-nums; transition: background .12s; }
.pz:hover { background: var(--realce); }
.pz .ico { color: var(--tinta-fraca); }
.pz.vazio { color: var(--tinta-fraca); font-weight: 500; padding: 0 8px; }
.pz.atrasado { color: var(--perigo); background: var(--perigo-fundo); }
.pz.atrasado .ico { color: var(--perigo); }
.pz.hoje { color: var(--obs-tinta); background: var(--obs-fundo); }
.pz.hoje .ico { color: var(--obs); }
.hr { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 5px; font-size: 11.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; border: 1px solid var(--borda-forte); color: var(--tinta-corpo); background: var(--superficie); }
.hr .ico { width: 12px; height: 12px; }
.hr.perto { background: #fbbf24; border-color: #fbbf24; color: #451a03; }
.hr.passou { background: var(--perigo); border-color: var(--perigo); color: #fff; }
.prazo-cel { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.avs { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px; margin-left: -6px; border-radius: 7px; max-width: 100%; transition: background .12s; }
.avs:hover { background: var(--realce); }
.avs .grp-av { display: inline-flex; }
.avs i { width: 25px; height: 25px; border-radius: 99px; display: grid; place-items: center; font: 700 10.5px/1 Montserrat; letter-spacing: -.02em; color: #fff; font-style: normal; border: 2px solid var(--superficie); margin-left: -6px; flex-shrink: 0; }
.avs i:first-child { margin-left: 0; }
.avs .ninguem { color: var(--tinta-fraca); font-size: 12px; font-weight: 500; white-space: nowrap; }
.avs .nomes { font-size: 12px; font-weight: 600; color: var(--tinta-corpo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.st { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--tinta); max-width: 100%; border: 1px solid var(--borda); background: var(--superficie); transition: border-color .12s, background .12s; }
.st:hover { border-color: var(--borda-forte); background: var(--sutil); }
.st .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.st .chev { color: var(--tinta-fraca); margin-left: auto; }
.its { display: flex; flex-wrap: wrap; gap: 4px; }
.it { display: inline-flex; align-items: center; gap: 5px; height: 24px; max-width: 190px; padding: 0 8px 0 6px; border-radius: 6px; border: 1px solid var(--borda); background: var(--superficie); font-size: 12px; font-weight: 600; color: var(--tinta-corpo); transition: background .12s, border-color .12s, color .12s; }
.it span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .ico { width: 13px; height: 13px; color: var(--tinta-fraca); }
.it:hover { border-color: var(--borda-forte); background: var(--sutil); }
.it.ok { background: var(--fin-fundo); border-color: var(--fin-borda); color: var(--fin-tinta); }
.it.ok .ico { color: var(--fin); }
.it.ok span { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--fin) 55%, transparent); }
.resumo { color: var(--tinta-suave); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fls { display: inline-flex; align-items: center; gap: 2px; }
.fl { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--tinta-fraca); transition: background .12s, color .12s; }
.fl:hover { background: var(--realce); color: var(--tinta-corpo); }
.fl.arte.on { background: var(--arte-fundo); color: var(--arte); }
.fl.entrega.on { background: var(--entrega-fundo); color: var(--entrega); }
.fl.concluir { color: var(--fin); }
.fl.concluir:hover { background: var(--fin-fundo); }
.fl.concluir.conf { width: auto; padding: 0 9px; background: var(--fin); color: #fff; font-size: 12px; font-weight: 700; }
.dark .fl.concluir.conf { color: #04140d; }
.fls .sep { width: 1px; height: 18px; background: var(--borda); margin: 0 3px; }
.locs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.loc { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); white-space: nowrap; }
.loc::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--c); }
.cli { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; font-weight: 700; color: var(--tinta); text-align: left; border-radius: 4px; }
.cli .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cli:hover .nome { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--borda-forte); }
.cli.prob { color: var(--perigo); }
.cli .ico { color: var(--perigo); }
.oid { color: var(--tinta-fraca); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.oid:hover { color: var(--brand-tinta); }

/* ============ lista por etapa ============ */
.tab-cab, .lin { display: grid; grid-template-columns: 58px minmax(170px,1.1fr) minmax(210px,1.7fr) 150px 112px 176px 118px; align-items: center; gap: 14px; }
.tab-cab { padding: 8px 12px; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); position: sticky; top: calc(var(--altura-cabecalho) + var(--altura-filtros)); z-index: 5; background: var(--fundo); }
.grp { display: flex; align-items: center; gap: 9px; padding: 18px 4px 8px; }
.grp-btn { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 700; color: var(--tinta); border-radius: 6px; padding: 2px 4px 2px 2px; }
.grp-btn .chev { color: var(--tinta-fraca); transition: transform .2s cubic-bezier(.16,1,.3,1); }
.grp.fechado .chev { transform: rotate(-90deg); }
.grp .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.grp .alerta { font-size: 12px; font-weight: 600; color: var(--perigo); display: inline-flex; gap: 5px; align-items: center; }
.grp .alerta .dot { background: var(--perigo); width: 6px; height: 6px; }
/* abrir/fechar a etapa: a lista encolhe até zero (grid 1fr → 0fr) e some junto */
.grp-corpo { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .36s cubic-bezier(.16,1,.3,1), opacity .26s ease, transform .36s cubic-bezier(.16,1,.3,1); }
.grp-corpo.fechado { grid-template-rows: 0fr; opacity: 0; transform: translateY(-4px); }
.grp-dentro { overflow: hidden; min-height: 0; }
.grp-corpo.fechado .grp-dentro { visibility: hidden; transition: visibility 0s .36s; }
.lista { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
.lin { padding: 9px 12px; border-top: 1px solid var(--borda-fraca); min-height: 54px; cursor: pointer; transition: background .1s; }
.lista > .lin:first-child { border-top: 0; }
.lin:hover { background: var(--sutil); }
.lin.sel { background: var(--realce); }
.lin .c-cli { min-width: 0; }
.lin .resp-in { display: none; }

/* ============ detalhe (gaveta no computador, folha no celular) ============ */
/* cabeçalho: o nº e, à direita, só ícones do mesmo peso (abrir a O.S. inteira e
   fechar). Gruda no topo da gaveta ao rolar, então os dois ficam sempre à mão.
   Abrir a O.S. inteira é só o ⤢ daqui, e o Enter: um botão laranja a mais
   repetia a mesma ação e disputava atenção com o nome do cliente. */
.det-cab { display: flex; align-items: center; gap: 8px; color: var(--tinta-suave); font-size: 12.5px; }
.det-cab .oid { font-size: 13px; }
.det-ferr { margin-left: auto; display: flex; gap: 2px; }
.gaveta .det-cab { position: sticky; top: 0; z-index: 2; margin: -18px -22px 0; padding: 12px 22px; background: var(--fundo); transition: box-shadow .2s; }
.gaveta.rolou .det-cab { box-shadow: 0 1px 0 var(--borda); }
.det-cli { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); line-height: 1.25; margin-top: 4px; }
.det-cli.prob { color: var(--perigo); }
.det-aviso { display: flex; gap: 8px; align-items: center; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--perigo-fundo); border: 1px solid var(--perigo-borda); color: var(--perigo); font-size: 12.5px; font-weight: 600; }
.props { display: grid; grid-template-columns: 96px minmax(0,1fr); align-items: center; row-gap: 4px; margin-top: 16px; }
.props dt { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 7px; align-items: center; }
.props dd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.props .st { border-color: transparent; background: transparent; margin-left: -10px; }
.props .st:hover { background: var(--realce); }
.props .pz { margin-left: -8px; }
.area { border: 1px solid var(--a-borda); border-radius: 10px; background: var(--superficie); margin-top: 16px; }
.area.itens { --a: var(--itens); --a-tinta: var(--itens-tinta); --a-fundo: var(--itens-fundo); --a-borda: var(--itens-borda); }
.area.fin { --a: var(--fin); --a-tinta: var(--fin-tinta); --a-fundo: var(--fin-fundo); --a-borda: var(--fin-borda); }
.area-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; background: var(--a-fundo); border-bottom: 1px solid var(--a-borda); border-radius: 9px 9px 0 0; }
.area-ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--superficie); color: var(--a); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
.area-cab h3 { font-size: 13px; font-weight: 700; color: var(--tinta); }
.area-meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--a-tinta); }
.chk { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 9px 12px; border-top: 1px solid var(--borda-fraca); text-align: left; transition: background .1s; }
.chk:first-child { border-top: 0; }
.chk:hover { background: var(--sutil); }
.chk .caixa { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--borda-forte); display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; color: transparent; transition: background .12s, border-color .12s; }
.chk.ok .caixa { background: var(--fin); border-color: var(--fin); color: #fff; }
.chk .nm { font-weight: 600; color: var(--tinta); }
.chk.ok .nm { color: var(--tinta-suave); text-decoration: line-through; }
.chk .ds { display: block; font-size: 12px; color: var(--tinta-suave); margin-top: 1px; white-space: pre-wrap; }
.sem-itens { padding: 10px 12px; color: var(--tinta-suave); }
.marcas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.marca { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--borda); background: var(--superficie); text-align: left; transition: border-color .12s, background .12s; }
.marca:hover { border-color: var(--borda-forte); }
.marca .mi { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--realce); color: var(--tinta-suave); }
.marca b { display: block; font-size: 12.5px; color: var(--tinta); }
.marca small { font-size: 11.5px; color: var(--tinta-suave); }
.marca.arte.on { border-color: color-mix(in srgb, var(--arte) 35%, transparent); background: var(--arte-fundo); }
.marca.arte.on .mi { background: var(--arte); color: #fff; }
.marca.entrega.on { border-color: color-mix(in srgb, var(--entrega) 35%, transparent); background: var(--entrega-fundo); }
.marca.entrega.on .mi { background: var(--entrega); color: #fff; }
.fin-linhas { padding: 6px 12px 10px; }
.fin-linhas div { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--borda-fraca); font-variant-numeric: tabular-nums; }
.fin-linhas div:last-child { border-bottom: 0; }
.fin-linhas dt { color: var(--tinta-suave); } .fin-linhas dd { font-weight: 600; color: var(--tinta); }
.fin-linhas .falta dd { color: var(--perigo); font-weight: 700; }
.fin-linhas .quitado dd { color: var(--sucesso); }
.det-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.det-acoes .esp { flex: 1; }

/* A gaveta desliza da borda, sem pressa e desacelerando; ao fechar volta pelo
   mesmo caminho, um pouco mais rápida e acelerando para fora. */
.gaveta-veu { position: fixed; inset: var(--altura-cabecalho) 0 0 0; background: var(--veu); z-index: 60; animation: veuEntra .4s ease-out; }
.gaveta { position: fixed; top: var(--altura-cabecalho); right: 0; bottom: 0; width: min(460px, 100%); background: var(--fundo); border-left: 1px solid var(--borda); box-shadow: var(--sombra); z-index: 61; overflow-y: auto; animation: gavetaEntra .46s cubic-bezier(.22,1,.36,1); }
.gaveta-veu.sai { animation: veuSai .3s ease-in forwards; pointer-events: none; }
.gaveta.sai { animation: gavetaSai .3s cubic-bezier(.55,0,1,.45) forwards; pointer-events: none; }
.gaveta .det { padding: 18px 22px 40px; }
@keyframes gavetaEntra { from { transform: translateX(100%); } }
@keyframes gavetaSai { to { transform: translateX(100%); } }
@keyframes veuEntra { from { opacity: 0; } }
@keyframes veuSai { to { opacity: 0; } }

/* popover, menu e toast */
.pop { position: fixed; z-index: 90; min-width: 210px; max-height: min(460px, calc(100vh - 16px)); overflow-y: auto; padding: 4px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 9px; box-shadow: var(--sombra-pop); animation: pop .16s cubic-bezier(.16,1,.3,1); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.pop button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--tinta-corpo); }
.pop button:hover, .pop button:focus-visible { background: var(--realce); color: var(--tinta); outline: none; }
.pop .ok { margin-left: auto; color: var(--brand-tinta); }
.pop hr { border: 0; border-top: 1px solid var(--borda-fraca); margin: 4px 0; }
.pop .rot { font-size: 11px; font-weight: 600; color: var(--tinta-suave); padding: 6px 10px 2px; }
.pop .sub { margin-left: auto; color: var(--tinta-suave); font-size: 12px; }
.pop .perigo { color: var(--perigo); }
.pop .horas { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 6px 4px; }
.pop .horas button { width: auto; padding: 5px 9px; border: 1px solid var(--borda); font-weight: 600; font-variant-numeric: tabular-nums; }
.pop .horas button.ativo { background: var(--obs-fundo); border-color: var(--obs-borda); color: var(--obs-tinta); }
.pop .livre { display: flex; align-items: center; gap: 9px; padding: 5px 10px 7px; color: var(--tinta-suave); font-size: 12.5px; }
.pop .livre input { border: 0; background: transparent; outline: none; color: var(--tinta); font-weight: 600; box-shadow: inset 0 -1px 0 var(--borda-forte); padding: 3px 0; font-variant-numeric: tabular-nums; }
.pop .livre input:focus { box-shadow: inset 0 -2px 0 var(--brand); }
.pop .av { width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font: 700 10px/1 Montserrat; letter-spacing: -.02em; color: #fff; font-style: normal; flex-shrink: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 95; background: var(--tinta); color: var(--superficie); padding: 8px 8px 8px 14px; border-radius: 9px; font-weight: 600; font-size: 12.5px; box-shadow: var(--sombra-pop); display: flex; gap: 10px; align-items: center; animation: sobe .22s cubic-bezier(.16,1,.3,1); max-width: calc(100vw - 32px); }
.toast .ico { color: #34d399; }
.toast button { color: var(--brand); font-weight: 700; padding: 4px 8px; border-radius: 6px; }
.toast button:hover { background: rgba(255,255,255,.1); }
.toast:not(:has(button)) { padding-right: 14px; }
@keyframes sobe { from { opacity: 0; transform: translate(-50%, 8px); } }
.dicas { margin-top: 16px; color: var(--tinta-fraca); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.dicas span { display: inline-flex; gap: 5px; align-items: center; }
.barra-mob { display: none; }
/* troca de tema: a camada escura fica por cima e só o recorte dela anima (trocarTema) */
html[data-troca-tema]::view-transition-old(root), html[data-troca-tema]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html[data-troca-tema].dark::view-transition-new(root), html[data-troca-tema]:not(.dark)::view-transition-old(root) { z-index: 1; }
html[data-troca-tema] *, html[data-troca-tema] *::before, html[data-troca-tema] *::after { transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ============ responsivo ============ */
@media (max-width: 1240px) {
  .tab-cab, .lin { grid-template-columns: 58px minmax(170px,1.1fr) minmax(180px,1.5fr) 146px 168px 118px; }
  .c-resp { display: none; }
  .lin .resp-in { display: flex; margin-top: 2px; }
}
@media (max-width: 960px) {
  .tab-cab { display: none; }
  .lin { grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "cli pz" "its its" "pe pe"; gap: 6px 10px; padding: 11px 12px; }
  .lin .c-id { display: none; }
  .lin .c-cli { grid-area: cli; }
  .lin .c-its { grid-area: its; }
  .lin .c-pz { grid-area: pz; }
  .lin .c-st { grid-area: pe; display: flex; align-items: center; gap: 8px; }
  .lin .c-ac { display: none; }
  .lin .c-st .fls-mob { display: inline-flex !important; margin-left: auto; }
  .prazo-cel { align-items: flex-end; }
}
@media (max-width: 760px) {
  .proto { padding: 0 10px; gap: 8px; }
  .proto-nota, .proto-tema span { display: none; }
  .pg { padding: 14px 12px 96px; }
  .cab { flex-direction: column; align-items: stretch; gap: 12px; }
  .cab .acoes { margin-left: 0; }
  .cab .acoes .btn-pri { display: none; }
  .cab .busca { width: auto; flex: 1; height: 42px; }
  .abas-wrap { margin: 0 -12px 4px; padding-left: 4px; }
  .abas-fim { padding-right: 8px; }
  .dicas { display: none; }
  .barra-mob { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--superficie); border-top: 1px solid var(--borda); }
  .barra-mob .btn { height: 44px; }
  .barra-mob .btn-pri { flex: 1; }
  .gaveta { top: auto; height: 88dvh; width: 100%; border-left: 0; border-radius: 14px 14px 0 0; animation-name: folhaEntra; }
  .gaveta.sai { animation-name: folhaSai; }
  .gaveta .det { padding: 14px 14px 40px; }
  .gaveta .det-cab { margin: -14px -14px 0; padding: 4px 6px 4px 14px; }
  /* no celular não há Enter nem dica no ⤢, que vira o único caminho para a
     O.S. inteira: os dois ícones ganham alvo de dedo */
  .det-ferr .ib { width: 44px; height: 44px; }
  .marcas { grid-template-columns: 1fr; }
  .props { grid-template-columns: 84px minmax(0,1fr); }
}
@keyframes folhaEntra { from { transform: translateY(100%); } }
@keyframes folhaSai { to { transform: translateY(100%); } }
.fls-mob { display: none !important; }
</style>
</head>
<body>
<div class="proto">
  <span class="proto-nome">Nova Produção · protótipo</span>
  <span class="proto-nota" id="nota"></span>
  <button class="proto-tema" id="tema"></button>
</div>
<div id="tela"></div>
<div id="gaveta-raiz"></div>

<script>
/* ===== O.S. reais (injetadas pela página /novaproducao) ===== */
/*PRODUCAO*/

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, cls = 'ico') => `<i data-lucide="${n}" class="${cls}"></i>`;
const semAcento = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const brl = c => 'R$ ' + (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const ler = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };

const D = typeof DADOS !== 'undefined' ? DADOS : { pedidos: [], equipe: [], status: [], permitidos: [], eu: '' };
let PED = D.pedidos.map(p => ({ ...p, itens: p.itens.map(i => [...i]) }));
const STATUS = D.status;
const PERMITIDOS = D.permitidos.length ? D.permitidos : STATUS;
const COR = { 'Aguardando Pagamento': '#10b981', 'Aguardando Retorno': '#84cc16', 'Desenvolvimento de Arte': '#06b6d4', 'Etiqueta Escolar': '#2563eb', 'Produzir': '#a855f7', 'Produção': '#6b7280', 'Avisar Cliente': '#ec4899', 'Retirada': '#0ea5e9', 'Entrega': '#14b8a6', 'Concluído': '#f97316' };
const PALETA = ['#db2777', '#2563eb', '#059669', '#ea580c', '#7c3aed', '#0891b2', '#ca8a04', '#dc2626'];
const COR_LOCAL = { 'berlim': '#f97316', 'futura': '#3b82f6', 'alvo print': '#d946ef', 'atualcard': '#0d9488', 'xexe': '#65a30d', 'stampmix': '#f43f5e', 'gráfica chromeset': '#6366f1', 'outros': '#64748b' };
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// Cores de pessoa e de local: as mesmas da tela atual (corPorNome), mandadas pela página.
const corPessoa = n => D.cores?.[n]?.[0] || PALETA[hash(n) % PALETA.length];
const tintaPessoa = n => D.cores?.[n]?.[1] || '#fff';
const corLocal = n => D.cores?.[n]?.[0] || COR_LOCAL[(n || '').toLowerCase()] || PALETA[hash(n || '?') % PALETA.length];
// Duas letras na bolinha: nome simples vira as duas primeiras (Murilo → Mu); nome
// composto, a inicial do primeiro e do último (Ana Lima → AL).
const iniciais = n => { const p = n.trim().split(/\s+/); return p.length > 1 ? (p[0][0] + p.at(-1)[0]).toUpperCase() : p[0].slice(0, 1).toUpperCase() + p[0].slice(1, 2).toLowerCase(); };
const porId = id => PED.find(p => p.id === +id);

/* ===== datas ===== */
const dataISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const HOJE = dataISO(new Date());
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return dataISO(d); };
const dias = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(HOJE + 'T12:00:00')) / 86400000);
const SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const ddmm = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const diaSem = iso => SEM[new Date(iso + 'T12:00:00').getDay()];
const minutosAte = p => { if (!p.prazo || !p.hora) return null; const [h, m] = p.hora.split(':').map(Number); return Math.round((new Date(p.prazo + 'T00:00:00').getTime() + (h * 60 + m) * 60000 - Date.now()) / 60000); };
// Em Retirada o serviço já está pronto, esperando o cliente buscar: o prazo de
// produção passou a ser história, não atraso. Nessas etapas o prazo aparece
// neutro e a O.S. não entra na contagem nem no filtro de atrasadas.
const ETAPAS_SEM_ATRASO = ['Retirada'];
const semAtraso = p => ETAPAS_SEM_ATRASO.includes(p.status);
function estadoPrazo(p) {
  if (!p.prazo) return { cls: 'vazio', txt: 'Sem prazo' };
  const d = dias(p.prazo);
  if (d < 0) return semAtraso(p) ? { cls: '', txt: ddmm(p.prazo) } : { cls: 'atrasado', txt: `Atrasada · ${ddmm(p.prazo)}` };
  if (d === 0) return { cls: semAtraso(p) ? '' : 'hoje', txt: 'Hoje' };
  if (d === 1) return { cls: '', txt: 'Amanhã' };
  if (d < 7) return { cls: '', txt: `${diaSem(p.prazo)} ${ddmm(p.prazo)}` };
  return { cls: '', txt: ddmm(p.prazo) };
}
const atrasada = p => !semAtraso(p) && p.prazo && (dias(p.prazo) < 0 || (dias(p.prazo) === 0 && minutosAte(p) !== null && minutosAte(p) <= 0));

/* ===== filtros ===== */
const FILTROS = [
  { id: 'atrasadas', nome: 'Atrasadas', f: p => !semAtraso(p) && p.prazo && dias(p.prazo) < 0, alerta: true },
  { id: 'hoje', nome: 'Hoje', f: p => p.prazo === HOJE },
  { id: 'horario', nome: 'Com horário', f: p => p.prazo && p.hora },
  { id: 'minhas', nome: 'Minhas', f: p => D.eu && p.resp.includes(D.eu) },
  { id: 'arte', nome: 'Arte pendente', f: p => !p.arte },
  { id: 'prontas', nome: 'Prontas p/ entrega', f: p => p.entrega },
];

/* ===== estado ===== */
const est = {
  busca: '', filtro: null,
  recolhidos: new Set(), sel: null, gaveta: null, conf: null, pop: null,
  animar: false, preso: false,
};
const termos = () => semAcento(est.busca).split(/\s+/).filter(Boolean);
function visiveis() {
  const ts = termos(); const f = FILTROS.find(x => x.id === est.filtro);
  return PED.filter(p => (!f || f.f(p)) && ts.every(t => semAcento(`${p.id} ${p.cliente} ${p.resp.join(' ')} ${p.itens.map(i => i[1]).join(' ')} ${p.resumo}`).includes(t)));
}
const ordenar = l => l.slice().sort((a, b) => {
  if (!a.prazo) return b.prazo ? 1 : a.id - b.id; if (!b.prazo) return -1;
  return a.prazo.localeCompare(b.prazo) || (a.hora || '99').localeCompare(b.hora || '99') || a.id - b.id;
});
const porStatus = l => STATUS.map(s => ({ chave: s, nome: s, cor: COR[s], itens: ordenar(l.filter(p => p.status === s)) })).filter(g => g.itens.length);
/* ===== átomos ===== */
function seloHora(p) {
  if (!p.prazo || !p.hora) return '';
  const m = minutosAte(p); const cls = semAtraso(p) ? '' : m <= 0 ? 'passou' : m <= 120 ? 'perto' : '';
  return `<span class="hr ${cls}" title="Horário limite">${ico('clock', 'ico')}até ${esc(p.hora)}</span>`;
}
function prazoBtn(p) { const e = estadoPrazo(p); return `<button class="pz ${e.cls}" data-pop="prazo" data-id="${p.id}" title="Mudar prazo">${ico('calendar', 'ico ico-s')}${e.txt}</button>`; }
const prazoCel = p => `<div class="prazo-cel">${prazoBtn(p)}${seloHora(p)}</div>`;
function avs(p, comNomes) {
  if (!p.resp.length) return `<button class="avs" data-pop="resp" data-id="${p.id}"><span class="ninguem">+ Resp.</span></button>`;
  return `<button class="avs" data-pop="resp" data-id="${p.id}" title="${esc(p.resp.join(', '))}"><span class="grp-av">${p.resp.slice(0, 3).map(n => `<i style="background:${corPessoa(n)};color:${tintaPessoa(n)}">${esc(iniciais(n))}</i>`).join('')}</span>${comNomes ? `<span class="nomes">${esc(p.resp.join(', '))}</span>` : (p.resp.length > 3 ? `<span class="nomes">+${p.resp.length - 3}</span>` : '')}</button>`;
}
const statusBtn = p => `<button class="st" data-pop="status" data-id="${p.id}"><span class="dot" style="background:${COR[p.status] || '#6b7280'}"></span><span class="t">${esc(p.status)}</span>${ico('chevron-down', 'ico ico-s chev')}</button>`;
function itensChips(p) {
  if (!p.itens.length) return `<span class="resumo" title="${esc(p.resumo)}">${esc(p.resumo)}</span>`;
  return `<div class="its">${p.itens.map(([iid, nome, ok]) => `<button class="it ${ok ? 'ok' : ''}" data-acao="item" data-id="${p.id}" data-item="${iid}" title="${ok ? 'Feito — marcar como pendente' : 'Marcar como feito'}">${ico(ok ? 'check' : 'circle', 'ico')}<span>${esc(nome)}</span></button>`).join('')}</div>`;
}
function flags(p, cls = '') {
  const conf = est.conf === p.id;
  return `<div class="fls ${cls}">
    <button class="fl arte ${p.arte ? 'on' : ''}" data-acao="arte" data-id="${p.id}" title="${p.arte ? 'Arte aprovada' : 'Arte ainda não aprovada'}" aria-pressed="${p.arte}">${ico('thumbs-up', 'ico')}</button>
    <button class="fl entrega ${p.entrega ? 'on' : ''}" data-acao="entrega" data-id="${p.id}" title="${p.entrega ? 'Pronta para entrega' : 'Ainda não está pronta'}" aria-pressed="${p.entrega}">${ico('package', 'ico')}</button>
    <span class="sep"></span>
    <button class="fl concluir ${conf ? 'conf' : ''}" data-acao="concluir" data-id="${p.id}" title="Concluir O.S.">${conf ? 'Concluir?' : ico('check-circle-2', 'ico')}</button>
  </div>`;
}
const locais = p => `<div class="locs">${p.locais.map(l => `<span class="loc" style="--c:${corLocal(l)}">${esc(l)}</span>`).join('')}</div>`;

// A faixa "presa": a sentinela fica logo acima dela e, quando passa por baixo do

const menosMovimento = matchMedia('(prefers-reduced-motion: reduce)');

const vigiaFaixa = new IntersectionObserver(([e]) => marcarPreso(!e.isIntersecting && e.boundingClientRect.top < e.rootBounds.top),
  { root: document, rootMargin: `-${alturaCabecalho}px 0px 0px 0px` });
function marcarPreso(preso) {
  if (preso === !!est.preso) return;

  const todos = faixa.querySelector('.todos'); const antes = todos?.getBoundingClientRect().left;

// A lista nova entra do lado da aba escolhida, na direção em que o traço laranja anda.
const idxFiltro = id => ['', ...FILTROS.map(f => f.id)].indexOf(id || '');

function posicionarIndicador() {
  const abas = tela.querySelector('.abas'); if (!abas) return;

  const novo = { left: at.offsetLeft + 8, width: at.offsetWidth - 16 };

/* ===== popovers ===== */
function fecharPop() { document.querySelector('.pop')?.remove(); est.pop = null; }
function abrirPop(ancora, html) {
  fecharPop();
  const pop = document.createElement('div'); pop.className = 'pop'; pop.innerHTML = html; document.body.appendChild(pop);
  const r = ancora.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
  const topo = r.bottom + pop.offsetHeight + 6 > innerHeight && r.top > pop.offsetHeight + 6 ? r.top - pop.offsetHeight - 6 : r.bottom + 6;
  pop.style.top = Math.max(8, Math.min(topo, innerHeight - pop.offsetHeight - 8)) + 'px';
  pop.addEventListener('mousedown', e => { if (!e.target.closest('input')) e.preventDefault(); });
  est.pop = { ancora }; lucide.createIcons();
  return pop;
}
const marca = sel => sel ? ico('check', 'ico ico-s ok') : '';
function popStatus(anc, p) {
  const pop = abrirPop(anc, STATUS.filter(s => PERMITIDOS.includes(s)).map(s => `<button data-v="${esc(s)}"><span class="dot" style="background:${COR[s]}"></span>${esc(s)}${marca(s === p.status)}</button>`).join('')

  for (let i = 2, n = 0; n < 4; i++) { const d = somaDias(HOJE, i); const w = new Date(d + 'T12:00:00').getDay(); if (w === 0) continue; atalhos.push([`${diaSem(d)}, ${ddmm(d)}`, d]); n++; }

/* ===== ações ===== */
let toastTimer;
function toast(msg, desfazer) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = ico('check-circle-2') + `<span>${esc(msg)}</span>` + (desfazer ? '<button>Desfazer</button>' : '');
  document.body.appendChild(el); lucide.createIcons();
  if (desfazer) el.querySelector('button').addEventListener('click', () => { desfazer(); el.remove(); });
  toastTimer = setTimeout(() => el.remove(), desfazer ? 5000 : 2400);
}
function acaoSistema(m, p) {
  // Abrir a O.S. completa é de verdade: a página do sistema abre por cima o
  // novo modal de O.S. com a O.S. real (hooks/useAbrirOSDoPrototipo.js). O
  // resto ainda só avisa.
  if (m === 'editar' && p && window.parent !== window) return window.parent.postMessage({ tipo: 'abrir-os', id: p.id }, '/');
  const txt = { editar: `No sistema, abre a O.S. #${p.id} completa`, imprimir: `No sistema, imprime a O.S. #${p.id}`, duplicar: `No sistema, cria uma cópia da O.S. #${p.id}` }[m];
  toast(txt + ' (protótipo)');
}
function mudarStatus(p, s) {
  if (p.status === s) return;
  const antes = p.status; p.status = s; est.animar = true; render();
  toast(`#${p.id} → ${s}`, () => { p.status = antes; est.animar = true; render(); });
}
function concluir(p, direto) {
  if (!direto && est.conf !== p.id) { est.conf = p.id; render(); clearTimeout(concluir.t); concluir.t = setTimeout(() => { if (est.conf === p.id) { est.conf = null; render(); } }, 3500); return; }
  est.conf = null; const i = PED.indexOf(p); PED.splice(i, 1);
  if (est.gaveta === p.id) est.gaveta = null;
  est.animar = true; render();
  toast(`O.S. #${p.id} concluída`, () => { PED.splice(i, 0, p); est.animar = true; render(); });
}

/* ===== render ===== */
const tela = document.getElementById('tela');

function render() {

  renderGaveta();

  lucide.createIcons();

  posicionarIndicador();
  if (naBusca) { const i = tela.querySelector('[data-busca]'); i?.focus(); i?.setSelectionRange(pos, pos); }
  // A linha (ou cartão) que mudou de lugar desliza até a posição nova.
  if (antes) {
    est.animar = false;
    tela.querySelectorAll('[data-pid]').forEach(el => {
      const a = antes[el.dataset.pid]; if (!a) return; const b = el.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.16,1,.3,1)' });
    });
  }
}

// A gaveta mora fora da tela redesenhada: entra uma vez, depois só troca o
// conteúdo (marcar um item ou a arte não a faz entrar de novo) e, ao fechar —
// X, Esc ou clique no véu —, sai pelo mesmo caminho por onde entrou.
function renderGaveta() {
  const p = est.gaveta ? porId(est.gaveta) : null;
  const aberta = gavetaRaiz.querySelector('.gaveta:not(.sai)');
  if (p && aberta) { aberta.setAttribute('aria-label', `O.S. #${p.id}`); aberta.innerHTML = detalhe(p, true); return; }
  if (p) {
    gavetaRaiz.innerHTML = `<div class="gaveta-veu" data-acao="fechar-gaveta"></div><aside class="gaveta" role="dialog" aria-label="O.S. #${p.id}">${detalhe(p, true)}</aside>`;
    return;
  }
  if (!aberta) return;
  const saindo = gavetaRaiz.querySelectorAll('.gaveta-veu, .gaveta');
  if (menosMovimento.matches) { gavetaRaiz.innerHTML = ''; return; }
  saindo.forEach(el => { el.classList.add('sai'); el.addEventListener('animationend', () => el.remove(), { once: true }); });
}
function abrirGaveta(p) {
  est.gaveta = p.id; est.sel = p.id;
  tela.querySelectorAll('.lin.sel').forEach(el => el.classList.remove('sel'));
  tela.querySelector(`.lin[data-pid="${p.id}"]`)?.classList.add('sel');
  renderGaveta(); lucide.createIcons();
}

// Troca só o rótulo do "Recolher todas / Abrir todas", sem redesenhar a lista.
function atualizarTodos() {
  const b = tela.querySelector('[data-acao="todos"]'); if (!b) return;
  const tmp = document.createElement('div'); tmp.innerHTML = botaoTodos(JSON.parse(b.dataset.chaves));
  b.replaceWith(tmp.firstElementChild); lucide.createIcons();
}

/* ===== eventos ===== */
document.addEventListener('click', e => {
  if (est.pop && !e.target.closest('.pop')) { const a = est.pop.ancora; fecharPop(); if (a && a.contains(e.target)) return; }
  const pp = e.target.closest('[data-pop]');
  if (pp && (tela.contains(pp) || gavetaRaiz.contains(pp))) {
    e.stopPropagation(); const p = porId(pp.dataset.id); if (!p) return;
    ({ status: popStatus, resp: popResp, prazo: popPrazo })[pp.dataset.pop](pp, p); return;
  }
  const el = e.target.closest('[data-acao]'); if (!el || !(tela.contains(el) || gavetaRaiz.contains(el))) return;
  const a = el.dataset.acao; const p = el.dataset.id ? porId(el.dataset.id) : null;
  const desarmou = a !== 'concluir' && est.conf != null;
  if (desarmou) est.conf = null;
  // Abrir e fechar mexem só na gaveta: redesenhar a lista inteira atrasava o
  // primeiro quadro da animação. Só redesenha se havia um "Concluir?" armado.
  if (a === 'abrir') {
    if (desarmou) { est.gaveta = p.id; est.sel = p.id; return render(); }
    return abrirGaveta(p);
  }
  if (a === 'fechar-gaveta') { est.gaveta = null; return desarmou ? render() : renderGaveta(); }
  if (a === 'item') { const it = p.itens.find(i => String(i[0]) === el.dataset.item); it[2] = !it[2]; render(); const todos = p.itens.every(i => i[2]); if (todos && it[2]) toast(`Todos os itens da #${p.id} feitos`); return; }
  if (a === 'arte') { p.arte = !p.arte; render(); return toast(p.arte ? `Arte da #${p.id} aprovada` : `Arte da #${p.id} voltou para pendente`); }
  if (a === 'entrega') { p.entrega = !p.entrega; render(); return toast(p.entrega ? `#${p.id} pronta para entrega` : `#${p.id} ainda não está pronta`); }
  if (a === 'concluir') return concluir(p, false);
  if (['editar', 'imprimir', 'duplicar'].includes(a)) return acaoSistema(a, p);
  // Abrir/fechar a etapa mexe só nas classes, sem redesenhar a tela: assim a
  // altura da lista tem de onde partir e a transição acontece.
  if (a === 'grupo') {
    const g = el.dataset.g; const fechar = !est.recolhidos.has(g);
    fechar ? est.recolhidos.add(g) : est.recolhidos.delete(g);
    const grp = el.closest('.grp');
    grp.classList.toggle('fechado', fechar); el.setAttribute('aria-expanded', String(!fechar));
    grp.nextElementSibling?.classList.toggle('fechado', fechar);
    atualizarTodos(); return;
  }
  if (a === 'todos') {
    const chaves = JSON.parse(el.dataset.chaves); const fechar = !chaves.every(c => est.recolhidos.has(c));
    chaves.forEach(c => fechar ? est.recolhidos.add(c) : est.recolhidos.delete(c));
    tela.querySelectorAll('[data-acao="grupo"]').forEach(b => {
      const grp = b.closest('.grp'); grp.classList.toggle('fechado', fechar); b.setAttribute('aria-expanded', String(!fechar));
      grp.nextElementSibling?.classList.toggle('fechado', fechar);
    });
    atualizarTodos(); return;
  }
  if (a === 'filtro') {
    const lado = Math.sign(idxFiltro(el.dataset.f) - idxFiltro(est.filtro));
    est.filtro = el.dataset.f || null; render(); voltarAoInicioDaLista(); return entrarLista(lado);
  }
  if (a === 'limpar') { est.busca = ''; render(); return tela.querySelector('[data-busca]')?.focus(); }
  if (a === 'limpar-tudo') { est.busca = ''; est.filtro = null; return render(); }
  if (a === 'focar-busca') { window.scrollTo({ top: 0, behavior: 'smooth' }); return tela.querySelector('[data-busca]')?.focus(); }
  if (a === 'nova') { try { window.top.location.href = '/novaos'; } catch { toast('Abre a nova O.S.'); } }
});
document.addEventListener('contextmenu', e => {
  const r = e.target.closest('[data-pid]'); if (!r || !tela.contains(r)) return;
  e.preventDefault(); popMenu(e.clientX, e.clientY, porId(r.dataset.pid));
});
tela.addEventListener('input', e => { if (e.target.matches('[data-busca]')) { est.busca = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  const digitando = e.target.matches?.('input, textarea');
  if (e.key === 'Escape') { if (est.pop) return fecharPop(); if (est.gaveta) { est.gaveta = null; return renderGaveta(); } if (est.busca) { est.busca = ''; return render(); } return; }
  if (digitando) return;
  // Com a gaveta aberta, Enter abre a O.S. completa, o mesmo que o ⤢ do topo dela.
  if (est.gaveta && e.key === 'Enter' && !e.target.closest?.('button')) return acaoSistema('editar', porId(est.gaveta));
  if (e.key === '/') { e.preventDefault(); return tela.querySelector('[data-busca]')?.focus(); }
  if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); try { window.top.location.href = '/novaos'; } catch {} return; }
});
addEventListener('resize', fecharPop);
addEventListener('scroll', e => {
  if (est.pop) fecharPop();
  // O cabeçalho preso da gaveta ganha uma linha só quando há conteúdo passando por baixo.
  if (e.target.matches?.('.gaveta')) e.target.classList.toggle('rolou', e.target.scrollTop > 2);
}, true);


const temaBtn = document.getElementById('tema');
function aplicarTema(escuro) { document.documentElement.classList.toggle('dark', escuro); temaBtn.innerHTML = ico(escuro ? 'sun' : 'moon', 'ico ico-s') + `<span>${escuro ? 'Claro' : 'Escuro'}</span>`; lucide.createIcons(); guardar('prod-tema', escuro); }
// Trocar o tema "acende" a partir do botão: o escuro se espalha em círculo
// saindo dele e, ao clarear, se recolhe para dentro dele (no sistema, o mesmo
// está em lib/utils/trocarTema.js).
let trocaAtual = null;
function trocarTema(escuro, origem, aplicar) {
  const raiz = document.documentElement;
  const trocar = () => { raiz.classList.toggle('dark', escuro); aplicar?.(); };
  if (!document.startViewTransition) return trocar();
  const r = origem?.getBoundingClientRect();
  const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top + r.height / 2 : innerHeight / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const reduzido = menosMovimento.matches;
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(trocar); trocaAtual = troca;
  let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate(reduzido ? { opacity: escuro ? [0, 1] : [1, 0] } : { clipPath: escuro ? circulo : circulo.reverse() }, {
      duration: reduzido ? 200 : escuro ? 600 : 450,
      easing: reduzido ? 'ease' : escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)',
      fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)',
    });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); if (trocaAtual === troca) delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}
temaBtn.addEventListener('click', () => { const escuro = !document.documentElement.classList.contains('dark'); trocarTema(escuro, temaBtn, () => aplicarTema(escuro)); });
aplicarTema(ler('prod-tema', false));
render();
// A largura das abas só é certa depois que a Montserrat carrega.
document.fonts?.ready.then(() => { est.ind = null; posicionarIndicador(); });
addEventListener('resize', () => { est.ind = null; posicionarIndicador(); });
</script>
