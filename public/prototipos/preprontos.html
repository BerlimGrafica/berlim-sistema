<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-prontos — 3 opções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Mesmo mundo do protótipo do modal de O.S. (opção B): tokens, Montserrat 13px,
   campos de linha de base, áreas com faixa tingida, kbd, popovers e toast. */
:root {
  --brand: #F69F00; --brand-hover: #d98b00; --brand-tinta: #8A5400; --sobre-brand: #241600;
  --fundo: #EDEFF0; --superficie: #ffffff; --sutil: #f9fafb; --realce: #f3f4f6;
  --borda-fraca: #f0f1f3; --borda: #e5e7eb; --borda-forte: #d1d5db;
  --tinta: #111827; --tinta-corpo: #374151; --tinta-suave: #6b7280; --tinta-fraca: #9ca3af;
  --perigo: #dc2626; --perigo-fundo: #fef2f2; --perigo-borda: #fecaca;
  --sucesso: #059669;
  --sombra: 0 24px 56px -16px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.08);
  --sombra-pop: 0 12px 28px -8px rgba(15,23,42,.24), 0 1px 3px rgba(15,23,42,.08);
  --sombra-leve: 0 1px 2px rgba(15,23,42,.06);
  --fin: #059669; --fin-tinta: #047857; --fin-fundo: #ecfdf5; --fin-borda: #c9f2df;
  --mao: #F69F00; --mao-tinta: #8A5400; --mao-fundo: #fff8eb; --mao-borda: #fbe3b4;
  --berlim: #f97316; --futura: #3b82f6;
  --marca-busca: rgba(246,159,0,.3);
  /* a prévia do WhatsApp usa as cores do próprio WhatsApp: é o que o cliente vê */
  --chat-fundo: #efeae2; --bolha: #d9fdd3; --bolha-tinta: #111b21; --bolha-suave: #667781; --bolha-link: #027eb5; --visto: #53bdeb;
}
.dark {
  --brand-tinta: #FFB938;
  --fundo: #0d1117; --superficie: #161b22; --sutil: #1b2129; --realce: #21262d;
  --borda-fraca: #232a33; --borda: #30363d; --borda-forte: #3d444d;
  --tinta: #EDEDED; --tinta-corpo: #D4D4D8; --tinta-suave: #A1A1AA; --tinta-fraca: #71717a;
  --perigo: #f87171; --perigo-fundo: rgba(239,68,68,.1); --perigo-borda: rgba(239,68,68,.3);
  --sucesso: #34d399;
  --sombra: 0 24px 56px -16px rgba(0,0,0,.7); --sombra-pop: 0 12px 28px -8px rgba(0,0,0,.6); --sombra-leve: 0 1px 2px rgba(0,0,0,.4);
  --fin: #34d399; --fin-tinta: #6ee7b7; --fin-fundo: rgba(16,185,129,.11); --fin-borda: rgba(16,185,129,.28);
  --mao: #FFB938; --mao-tinta: #FFB938; --mao-fundo: rgba(246,159,0,.08); --mao-borda: rgba(246,159,0,.24);
  --berlim: #fb923c; --futura: #60a5fa;
  --chat-fundo: #0b141a; --bolha: #005c4b; --bolha-tinta: #e9edef; --bolha-suave: #8fa9a2; --bolha-link: #53bdeb;
}

* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; }
html.dark { color-scheme: dark; }
body { font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--tinta-corpo); background: var(--fundo); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
input, textarea { caret-color: var(--brand); }
::selection { background: rgba(246,159,0,.3); }
::placeholder { color: var(--tinta-suave); opacity: 1; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.ico-s { width: 14px; height: 14px; }
kbd { font: 600 10.5px/1 Montserrat, sans-serif; color: var(--tinta-suave); border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--superficie); }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex-shrink: 0; }
.dot.berlim { background: var(--berlim); } .dot.futura { background: var(--futura); }
mark { background: var(--marca-busca); color: inherit; border-radius: 2px; padding: 0 1px; }

/* moldura do protótipo */
.proto { position: sticky; top: 0; z-index: 40; height: 51px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.proto-nome { font-weight: 700; color: var(--tinta); white-space: nowrap; }
.proto-nota { color: var(--tinta-suave); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.seg { display: inline-flex; background: var(--realce); border-radius: 8px; padding: 3px; gap: 2px; flex-shrink: 0; }
.seg button { padding: 5px 11px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--tinta-corpo); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--superficie); color: var(--tinta); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.proto-tema { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--tinta-corpo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; flex-shrink: 0; }
.proto-tema:hover { background: var(--realce); color: var(--tinta); }

/* botões */
.btn { height: 38px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn-pri { background: var(--brand); color: var(--sobre-brand); }
.btn-pri:hover { background: var(--brand-hover); }
.btn-sec { border: 1px solid var(--borda-forte); color: var(--tinta); background: var(--superficie); }
.btn-sec:hover { background: var(--sutil); border-color: var(--tinta-fraca); }
.btn-txt { color: var(--tinta-suave); padding: 0 10px; }
.btn-txt:hover { color: var(--tinta); background: var(--realce); }
.btn-p { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 7px; }
.btn kbd { margin-left: 2px; }
.btn-pri kbd { background: rgba(255,255,255,.35); border-color: rgba(36,22,0,.18); color: var(--sobre-brand); }
.btn.copiado, .btn.copiado:hover { background: var(--fin-fundo); border-color: var(--fin-borda); color: var(--fin-tinta); }
.btn-perigo { color: var(--perigo); }
.btn-perigo:hover { background: var(--perigo-fundo); color: var(--perigo); }
.btn-perigo.confirmar { background: var(--perigo); color: #fff; }
.ib { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--tinta-suave); transition: background .12s, color .12s, opacity .12s; }
.ib:hover { background: var(--realce); color: var(--tinta); }
.ib.on { color: var(--mao); }
.ib.copiado { color: var(--fin); background: var(--fin-fundo); }
.link { color: var(--brand-tinta); font-weight: 600; display: inline-flex; gap: 5px; align-items: center; border-radius: 5px; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.emp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--tinta-corpo); white-space: nowrap; }
.emp .dot { width: 7px; height: 7px; }

/* busca e filtros */
.busca { position: relative; display: flex; align-items: center; gap: 10px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; padding: 0 12px; transition: border-color .15s, box-shadow .15s; }
.busca:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.busca .ico { color: var(--tinta-suave); }
.busca input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 40px; color: var(--tinta); }
.busca .limpar { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--tinta-suave); }
.busca .limpar:hover { background: var(--realce); color: var(--tinta); }
.busca.grande { height: 52px; padding: 0 16px; }
.busca.grande input { font-size: 16px; font-weight: 600; height: 50px; }
.busca.grande input::placeholder { font-weight: 500; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-f { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--borda); background: var(--superficie); font-weight: 600; font-size: 12.5px; color: var(--tinta-corpo); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; transition: background .12s, border-color .12s; }
.chip-f:hover { border-color: var(--borda-forte); background: var(--sutil); }
.chip-f .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip-f[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--superficie); }
.chip-f[aria-pressed="true"] .n { color: inherit; opacity: .65; }
.aviso { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 8px; background: var(--mao-fundo); border: 1px solid var(--mao-borda); color: var(--tinta-corpo); font-size: 12.5px; }
.aviso .ico { color: var(--mao); }
.aviso b { color: var(--tinta); }
.aviso .link { margin-left: auto; white-space: nowrap; }
.vazio { padding: 40px 16px; text-align: center; color: var(--tinta-suave); }
.vazio b { display: block; color: var(--tinta); font-size: 14px; margin-bottom: 4px; }

/* texto no formato do WhatsApp */
.zap { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; color: var(--tinta-corpo); }
.zap b { color: var(--tinta); }
.zap a { color: var(--brand-tinta); text-underline-offset: 2px; }

/* editor (o mesmo nas três) */
.editor { display: flex; flex-direction: column; gap: 14px; }
.campo { display: block; }
.campo > span { display: block; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); margin-bottom: 3px; }
.linha-in { width: 100%; border: 0; background: transparent; outline: none; padding: 5px 0; color: var(--tinta); font-weight: 600; box-shadow: inset 0 -1px 0 var(--borda-forte); transition: box-shadow .15s; }
.linha-in:hover { box-shadow: inset 0 -1px 0 var(--tinta-fraca); }
.linha-in:focus { box-shadow: inset 0 -2px 0 var(--brand); }
.linha-in.erro, .ed-txt.erro { box-shadow: inset 0 -2px 0 var(--perigo); border-color: var(--perigo); }
.ed-txt { width: 100%; min-height: 190px; resize: vertical; border: 1px solid var(--borda-forte); border-radius: 8px; padding: 10px 12px; outline: none; background: var(--superficie); color: var(--tinta); line-height: 1.6; transition: border-color .15s, box-shadow .15s; }
.ed-txt:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.ed-dica { font-size: 11.5px; color: var(--tinta-suave); margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
.ed-dica code { font: 600 11.5px Montserrat; color: var(--tinta-corpo); background: var(--realce); border-radius: 4px; padding: 0 4px; }
.ed-linha { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
.ed-linha .campo:first-child { flex: 1; min-width: 220px; }
.ed-pe { display: flex; gap: 8px; align-items: center; }
.ed-pe .esp { flex: 1; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 95; background: var(--tinta); color: var(--superficie); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 12.5px; box-shadow: var(--sombra-pop); display: flex; gap: 8px; align-items: center; animation: sobe .22s cubic-bezier(.16,1,.3,1); max-width: calc(100vw - 32px); }
.toast .ico { color: #34d399; }
@keyframes sobe { from { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes acende { from { background: var(--fin-fundo); } }
/* troca de tema: a camada escura fica por cima e só o recorte dela anima (trocarTema) */
html[data-troca-tema]::view-transition-old(root), html[data-troca-tema]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html[data-troca-tema].dark::view-transition-new(root), html[data-troca-tema]:not(.dark)::view-transition-old(root) { z-index: 1; }
html[data-troca-tema] *, html[data-troca-tema] *::before, html[data-troca-tema] *::after { transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* =================== A · Balcão =================== */
.a-pg { max-width: 1120px; margin: 0 auto; padding: 24px 28px 72px; }
.cab { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
.cab h1 { font-size: 22px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; line-height: 1.2; }
.cab p { color: var(--tinta-suave); font-size: 12.5px; margin-top: 3px; }
.cab .btn { margin-left: auto; }
.a-busca-dica { display: flex; gap: 6px; align-items: center; color: var(--tinta-fraca); font-size: 11.5px; white-space: nowrap; }
.a-pg .chips { margin: 12px 0 16px; }
.mao { background: var(--superficie); border: 1px solid var(--mao-borda); border-radius: 10px; margin-bottom: 8px; }
.mao-linha { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; }
.mao-linha + .mao-linha { border-top: 1px dashed var(--mao-borda); }
.mao-rot { width: 92px; flex-shrink: 0; display: flex; gap: 7px; align-items: center; font-size: 12px; font-weight: 700; color: var(--mao-tinta); padding-top: 7px; }
.mao-itens { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; flex: 1; }
.atalho { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 34px; padding: 0 8px 0 12px; border: 1px solid var(--borda); border-radius: 8px; background: var(--superficie); text-align: left; transition: border-color .12s, background .12s; }
.atalho:hover { border-color: var(--mao); background: var(--mao-fundo); }
.atalho .t { font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.atalho .v { color: var(--tinta-suave); font-size: 12px; white-space: nowrap; }
.atalho .ico { color: var(--tinta-fraca); }
.atalho.copiado { border-color: var(--fin-borda); background: var(--fin-fundo); }
.atalho.copiado .ico { color: var(--fin); }
.mao-vazio { color: var(--tinta-suave); font-size: 12.5px; padding-top: 7px; }
.grupo-cab { display: flex; align-items: center; gap: 8px; padding: 22px 4px 8px; font-size: 13px; font-weight: 700; color: var(--tinta); }
.grupo-cab .ico { color: var(--tinta-suave); }
.grupo-cab .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.lista { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
.lt { display: grid; grid-template-columns: minmax(0,1fr) 160px 132px 150px; align-items: center; gap: 16px; padding: 10px 10px 10px 16px; border-top: 1px solid var(--borda-fraca); cursor: pointer; transition: background .1s; }
.lista > .lt:first-child, .lista > div:first-child > .lt { border-top: 0; }
.lt:hover { background: var(--sutil); }
.lt.ativo { background: var(--realce); box-shadow: inset 0 0 0 1px var(--borda-forte); }
.lt.aberto { background: var(--sutil); }
.lt.flash { animation: acende 1.2s ease-out; }
.lt-tit { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lt-tit .t { font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lt-tit .ico { color: var(--tinta-fraca); transition: transform .2s cubic-bezier(.16,1,.3,1); }
.lt.aberto .lt-tit .chev { transform: rotate(90deg); }
.lt-res { font-size: 12px; color: var(--tinta-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; padding-left: 22px; }
.lt-prazo { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-suave); min-width: 0; }
.lt-prazo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lt-preco { text-align: right; font-weight: 600; color: var(--tinta); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lt-preco small { display: block; font-size: 11px; font-weight: 500; color: var(--tinta-suave); line-height: 1.2; }
.lt-acts { display: flex; gap: 2px; align-items: center; justify-content: flex-end; }
.lt-acts .ib:not(.on) { opacity: 0; }
.lt:hover .lt-acts .ib, .lt.ativo .lt-acts .ib, .lt-acts .ib:focus-visible { opacity: 1; }
.lt-x { padding: 4px 16px 16px 38px; background: var(--sutil); border-top: 0; }
.lt-x .zap { max-width: 75ch; padding: 12px 14px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px; }
.lt-x-pe { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.lt-x-pe .meta { margin-left: auto; color: var(--tinta-suave); font-size: 12px; display: flex; gap: 10px; align-items: center; }
.lt-x .editor { max-width: 760px; padding: 14px 16px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px; }
.a-pe { margin-top: 18px; color: var(--tinta-fraca); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.a-pe span { display: inline-flex; gap: 5px; align-items: center; }

/* =================== B · Tabela de preços =================== */
.b-grade { display: grid; grid-template-columns: 236px minmax(0,1fr); gap: 28px; max-width: 1280px; margin: 0 auto; padding: 22px 28px 72px; align-items: start; }
.rail { position: sticky; top: 71px; display: flex; flex-direction: column; gap: 14px; }
.rail h1 { font-size: 18px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; }
.rail .busca input { height: 38px; }
.rail-nav { display: flex; flex-direction: column; gap: 1px; }
.rail-it { display: flex; gap: 9px; align-items: center; width: 100%; padding: 7px 10px; border-radius: 7px; font-weight: 600; color: var(--tinta-corpo); text-align: left; }
.rail-it .ico { color: var(--tinta-suave); }
.rail-it .n { margin-left: auto; color: var(--tinta-fraca); font-weight: 500; font-size: 12px; font-variant-numeric: tabular-nums; }
.rail-it:hover { background: var(--realce); color: var(--tinta); }
.rail-it[aria-current="true"] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-leve); }
.rail-it[aria-current="true"] .ico { color: var(--brand); }
.alternar { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--borda); background: var(--superficie); }
.alternar b { display: block; color: var(--tinta); font-size: 12.5px; }
.alternar small { color: var(--tinta-suave); font-size: 11.5px; line-height: 1.4; display: block; }
.chave { position: relative; width: 30px; height: 18px; border-radius: 99px; background: var(--borda-forte); transition: background .18s; flex-shrink: 0; margin-top: 1px; }
.chave::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s cubic-bezier(.16,1,.3,1); }
[aria-checked="true"] .chave { background: var(--brand); }
[aria-checked="true"] .chave::after { transform: translateX(12px); }
.b-main { min-width: 0; }
.b-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.b-topo p { color: var(--tinta-suave); font-size: 12.5px; }
.b-topo .btn { margin-left: auto; }
.cat-tit { display: flex; gap: 9px; align-items: center; font-size: 15px; font-weight: 800; color: var(--tinta); letter-spacing: -.01em; margin: 26px 0 10px; }
.cat-tit .ico { color: var(--tinta-suave); }
.cat-tit .n { font-size: 12.5px; font-weight: 500; color: var(--tinta-fraca); }
.prod { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.prod-cab { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; background: var(--sutil); border-bottom: 1px solid var(--borda); }
.prod-cab h3 { font-size: 13.5px; font-weight: 700; color: var(--tinta); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prod-cab .prazo { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--tinta-suave); white-space: nowrap; }
.prod-cab .acts { margin-left: auto; display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
.tp { width: 100%; border-collapse: collapse; }
.tp td { padding: 8px 10px; border-bottom: 1px solid var(--borda-fraca); vertical-align: baseline; }
.tp tr:last-child td { border-bottom: 0; }

<body>
<div class="proto">
  <span class="proto-nome">Pré-prontos</span>
  <div class="seg" role="group" aria-label="Opção">
    <button data-opcao="a">A<span class="longo"> · Balcão</span></button>
    <button data-opcao="b">B<span class="longo"> · Tabela de preços</span></button>
    <button data-opcao="c">C<span class="longo"> · Lista e prévia</span></button>
    <button data-opcao="d">D<span class="longo"> · Montar resposta</span></button>
  </div>
  <span class="proto-nota" id="nota"></span>
  <button class="proto-tema" id="tema"><i data-lucide="moon" class="ico ico-s"></i><span>Escuro</span></button>
</div>
<div id="tela"></div>

<script>
/* ===== textos do banco (injetados pela página /preprontos, com a sessão de quem está logado) ===== */
/*PREPRONTOS*/

const semAcento = s => (s || '').normalize('NFC').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, cls = 'ico') => `<i data-lucide="${n}" class="${cls}"></i>`;
const fmt = c => 'R$ ' + (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const ler = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };

/* Categoria proposta: no protótipo ela sai do título; no sistema vira um campo
   que o administrador escolhe. "Mensagens" são os textos sem preço. */
const CATS = [
  { id: 'mensagens', nome: 'Mensagens', ico: 'message-circle', teste: t => !/R\$/.test(t.texto) },
  { id: 'folhetos',  nome: 'Folhetos', ico: 'files', teste: t => /folheto/.test(t.k) },
  { id: 'cartoes',   nome: 'Cartões e crachás', ico: 'contact', teste: t => /cartao|cracha/.test(t.k) },
  { id: 'banners',   nome: 'Banners e lonas', ico: 'flag', teste: t => /banner|roll|cavalete|plotagem/.test(t.k) },
  { id: 'fotos',     nome: 'Fotos', ico: 'image', teste: t => /foto|polaroid/.test(t.k) },
  { id: 'imas',      nome: 'Ímãs', ico: 'magnet', teste: t => /\bimas?\b/.test(t.k) },
  { id: 'adesivos',  nome: 'Adesivos, etiquetas e tags', ico: 'tag', teste: t => /adesivo|etiqueta|tag|kit|chaveiro/.test(t.k) },
  { id: 'outros',    nome: 'Outros', ico: 'shapes', teste: () => true },
];
const catPorId = id => CATS.find(c => c.id === id);

/* Lê o texto livre e separa o que já está escrito nele: linhas de preço,
   subtítulos ("Somente frente:"), prazo, links de exemplo e notas. */
function analisar(texto) {
  const blocos = []; const links = []; const precos = []; let prazo = null;
  texto.split('\n').forEach((bruta, i) => {
    let l = bruta.trim();
    if (!l) return;
    const urls = l.match(/https?:\/\/\S+/g);
    if (urls) {
      links.push(...urls);
      l = l.replace(/https?:\/\/\S+/g, '').trim();
      if (!l || /^exemplos?:?$/i.test(l.replace(/[*_~]/g, ''))) return;
    }
    const plano = l.replace(/[*_~]/g, '');
    if (/^prazo/i.test(plano) || /^\d[\d\s\-–]*dias?\s+[uú]t(il|eis)/i.test(plano)) { prazo = plano.replace(/^prazo:?\s*/i, ''); return; }
    const m = plano.match(/R\$\s?([\d.]+,\d{2})/);
    if (m) {
      const v = parseInt(m[1].replace(/\./g, '').replace(',', ''), 10);
      precos.push(v);
      const antes = plano.slice(0, m.index).replace(/[\s–\-=:]+$/, '').trim();
      const depois = plano.slice(m.index + m[0].length).trim();
      const segs = antes.split('|').map(s => s.trim()).filter(Boolean);
      blocos.push({ tipo: 'preco', linha: i, raw: bruta.trim(), segs, v, depois });
      return;
    }
    if (/:$/.test(plano) && plano.length < 40 && !/^exemplo/i.test(plano)) { blocos.push({ tipo: 'grupo', txt: plano.replace(/:$/, '') }); return; }
    if (/^exemplos?:?$/i.test(plano)) return;
    blocos.push({ tipo: 'nota', txt: plano });
  });
  return { blocos, prazo, links, min: precos.length ? Math.min(...precos) : null, nPrecos: precos.length };
}

/* O que o WhatsApp faz com o texto: *negrito*, _itálico_, ~riscado~ e links. */
function zap(texto) {
  return String(texto).split(/(https?:\/\/\S+)/g).map((p, i) => i % 2
    ? `<a href="${esc(p)}" target="_blank" rel="noopener">${esc(p)}</a>`
    : esc(p).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,:;!?]|$)/gm, '$1<i>$2</i>').replace(/~([^~\n]+)~/g, '<s>$1</s>')
  ).join('');
}

/* Realce da busca sem ligar para acento: "cartao" acha "Cartão". */
function realce(txt, termos) {
  const s = String(txt).normalize('NFC');
  if (!termos.length) return esc(s);
  const n = semAcento(s); const faixas = [];
  termos.forEach(t => { let i = n.indexOf(t); while (t && i !== -1) { faixas.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } });
  if (!faixas.length) return esc(s);
  faixas.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  faixas.forEach(([a, b]) => { if (a < pos) a = pos; if (b <= a) return; out += esc(s.slice(pos, a)) + '<mark>' + esc(s.slice(a, b)) + '</mark>'; pos = b; });
  return out + esc(s.slice(pos));
}

function preparar(t) {
  t.k = semAcento(t.titulo);
  t.cat = CATS.find(c => c.teste(t)).id;
  t.a = analisar(t.texto);
  t.busca = semAcento(t.titulo + ' ' + t.texto);
  return t;
}
let TEXTOS = (typeof TEXTOS_BANCO !== 'undefined' ? TEXTOS_BANCO : []).map(([id, titulo, empresa, texto]) =>
  preparar({ id, titulo: titulo || 'Sem título', empresa: empresa === 'Futura' ? 'Futura' : 'Berlim', texto: texto || '' }));
const porId = id => TEXTOS.find(t => String(t.id) === String(id));
const coll = new Intl.Collator('pt-BR', { numeric: true, sensitivity: 'base' });

/* Textos repetidos: mesmo conteúdo com títulos diferentes. */
function repetidos() {
  const m = new Map();
  TEXTOS.forEach(t => { const k = semAcento(t.texto).replace(/\s+/g, ' ').trim(); if (!k) return; m.set(k, [...(m.get(k) || []), t]); });
  return [...m.values()].filter(g => g.length > 1).flat();
}

/* ===== estado ===== */
const fixadosExemplo = ['cartao de visita sem acabamento', 'banner 90x120', 'texto de duvida', '100 folhetos 10x14cm - couche 115g'];
const est = {
  opcao: ler('pp-opcao', 'a'),
  busca: '', cat: null, soRep: false,
  ativo: null, aberto: null, editando: null, excluir: null,
  sel: null, detMob: false,
  fixados: new Set(TEXTOS.filter(t => fixadosExemplo.some(f => t.k.startsWith(f))).map(t => t.id)),
  recentes: [], flash: null, prazoNaLinha: true,
  resposta: [], verResp: false,
  rascunho: {}, editBolha: null,
};
// Palavras de ligação não filtram nem marcam: "frente e verso" busca "frente" e "verso".
const LIGACAO = new Set(['e', 'de', 'do', 'da', 'dos', 'das', 'o', 'a', 'os', 'as', 'em', 'no', 'na']);
const termos = () => semAcento(est.busca).split(/\s+/).filter(x => x && !LIGACAO.has(x));
function filtrados() {
  const ts = termos(); const rep = est.soRep ? new Set(repetidos().map(t => t.id)) : null;
  return TEXTOS.filter(t => (!est.cat || t.cat === est.cat) && (!rep || rep.has(t.id)) && ts.every(x => t.busca.includes(x)));
}
function agrupados(lista) {
  return CATS.map(c => ({ cat: c, itens: lista.filter(t => t.cat === c.id).sort((a, b) => coll.compare(a.titulo, b.titulo)) })).filter(g => g.itens.length);
}
const ordem = () => agrupados(filtrados()).flatMap(g => g.itens);
const contagem = id => TEXTOS.filter(t => t.cat === id).length;

/* ===== ações comuns ===== */
let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = ico('check-circle-2') + `<span>${esc(msg)}</span>`;
  document.body.appendChild(el); lucide.createIcons();
  toastTimer = setTimeout(() => el.remove(), 2200);
}
async function paraAreaDeTransferencia(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}
let flashTimer;
async function copiar(t, linhaIdx) {
  const ajuste = est.rascunho['c:' + t.id];
  let txt = ajuste ?? t.texto, rotulo = t.titulo + (ajuste != null ? ' (ajustado)' : '');
  if (linhaIdx != null) {
    const b = t.a.blocos.find(x => x.tipo === 'preco' && x.linha === linhaIdx);
    txt = b.raw + (est.prazoNaLinha && t.a.prazo ? `\nPrazo: ${t.a.prazo}` : '');
    rotulo = `${b.segs[0] || t.titulo} – ${fmt(b.v)}`;
  }
  await paraAreaDeTransferencia(txt);
  est.recentes = [t.id, ...est.recentes.filter(x => x !== t.id)].slice(0, 6);
  est.flash = linhaIdx != null ? `${t.id}:${linhaIdx}` : String(t.id);
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { est.flash = null; render(); }, 1400);
  render(); toast(`Copiado: ${rotulo}`);
}
const copiado = (id, l) => est.flash === (l != null ? `${id}:${l}` : String(id));

function salvar(ed) {
  const tit = ed.querySelector('.ed-tit'), txt = ed.querySelector('.ed-txt');
  tit.classList.toggle('erro', !tit.value.trim()); txt.classList.toggle('erro', !txt.value.trim());
  if (!tit.value.trim() || !txt.value.trim()) { (tit.value.trim() ? txt : tit).focus(); return; }
  const empresa = ed.querySelector('.ed-emp [aria-pressed="true"]')?.textContent.trim() || 'Berlim';
  const id = ed.dataset.editor;
  let t;
  if (id === 'novo') { t = preparar({ id: Math.max(0, ...TEXTOS.map(x => +x.id || 0)) + 1, titulo: tit.value.trim(), empresa, texto: txt.value }); TEXTOS.push(t); }
  else { t = porId(id); Object.assign(t, { titulo: tit.value.trim(), empresa, texto: txt.value }); preparar(t); }
  est.editando = null; est.excluir = null; est.aberto = t.id; est.sel = t.id; est.ativo = t.id;

  TEXTOS = TEXTOS.filter(t => t.id !== id); est.fixados.delete(id); est.recentes = est.recentes.filter(x => x !== id);
  est.excluir = null; est.editando = null; est.aberto = null; if (est.sel === id) est.sel = null;

}
function avisoRepetidos() {

const precoCurto = t => t.a.min == null ? '' : (t.a.nPrecos > 1 ? 'a partir de ' : '') + fmt(t.a.min);
function resumo(t) {
  const p = t.a.blocos.find(b => b.tipo === 'preco');

}

/* Balão do WhatsApp que se edita no lugar. O ajuste fica num rascunho (por
   chave: 'c:<id>' na opção C, 'd' na resposta montada) e vale só para a

function bolhaEditavel(k, original, hora, idSalvar) {
  const r = est.rascunho[k]; const txt = r ?? original; const editando = est.editBolha === k;
  const ajustado = r != null;
  return `<div class="bolha editavel ${editando ? 'editando' : ''}" data-k="${k}" ${editando ? '' : `data-acao="bolha" tabindex="0" role="button" aria-label="Ajustar o texto antes de copiar"`}>`
      + (editando ? `<textarea class="bolha-in" data-bolha="${k}" spellcheck="true" aria-label="Texto da mensagem">${esc(txt)}</textarea>` : `<span class="zap-b">${zap(txt)}</span>`)
      + `<span class="hora"><span class="editada" ${ajustado ? '' : 'hidden'}>editada</span>${hora}${ico('check-check')}</span></div>
    <div class="ajuste" data-ajuste="${k}" ${ajustado ? '' : 'hidden'}>
      <span>${ico('pencil', 'ico ico-s')}Ajustado só para esta cópia</span>
      <button class="link" data-acao="desfazer-bolha" data-k="${k}">Desfazer</button>
      ${idSalvar != null ? `<button class="link" data-acao="salvar-bolha" data-k="${k}" data-id="${idSalvar}">Salvar no texto</button>` : ''}
    </div>`;
}
const ROT_BOLHA = `<span class="dica-ed">clique no balão para ajustar</span>`;
function abrirBolha(k) {
  est.editBolha = k; render();
  const ta = tela.querySelector(`.bolha-in[data-bolha="${k}"]`); if (!ta) return;
  autoAltura(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
const autoAltura = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
// Fecha o campo trocando só o pedaço do balão, sem redesenhar a tela: assim o
// clique em "Desfazer" ou "Salvar no texto" que tirou o foco não se perde.
function fecharBolha(ta) {
  const b = ta.closest('.bolha'); if (!b) return;
  est.editBolha = null;
  const span = document.createElement('span'); span.className = 'zap-b'; span.innerHTML = zap(ta.value);
  ta.replaceWith(span);

}

function avisarRespostaMudou() { if (est.rascunho.d != null) { delete est.rascunho.d; toast('A resposta mudou, então o ajuste no balão foi desfeito'); } }

/* =================== C · Lista e prévia =================== */

    det = `<button class="btn btn-txt btn-p c-voltar" data-acao="voltar">${ico('chevron-left', 'ico ico-s')}Voltar</button>
      <div class="c-tit">${esc(t.titulo)}</div>
      <div class="c-meta"><span class="emp"><span class="dot ${t.empresa.toLowerCase()}"></span>${t.empresa}</span><span>${ico(catPorId(t.cat).ico, 'ico ico-s')}${esc(catPorId(t.cat).nome)}</span>${t.a.prazo ? `<span>${ico('clock', 'ico ico-s')}${esc(t.a.prazo)}</span>` : ''}${t.a.min != null ? `<span class="num">${ico('tag', 'ico ico-s')}${precoCurto(t)}</span>` : ''}</div>
      <div class="c-acts">
        <button class="btn btn-pri ${copiado(t.id) ? 'copiado' : ''}" data-acao="copiar" data-id="${t.id}">${ico(copiado(t.id) ? 'check' : 'copy')}${copiado(t.id) ? 'Copiado' : 'Copiar texto'}<kbd>Enter</kbd></button>
        <button class="btn btn-sec" data-acao="editar" data-id="${t.id}">${ico('pencil')}Editar<kbd>E</kbd></button>
      </div>
      <div class="chat"><div class="chat-rot">${ico('eye', 'ico ico-s')}Como o cliente recebe no WhatsApp${ROT_BOLHA}</div>${bolhaEditavel('c:' + t.id, t.texto, hora, t.id)}</div>
      <div class="c-dicas"><span><kbd>/</kbd> buscar</span><span><kbd>↑</kbd><kbd>↓</kbd> trocar de texto</span><span><kbd>Enter</kbd> copiar</span><span><kbd>E</kbd> editar</span></div>`;
  } else det = `<div class="c-vazio"><div><b style="color:var(--tinta)">Nenhum texto encontrado</b><br>Tente outra palavra, ou crie um texto novo.</div></div>`;
  return `<div class="c-wrap ${est.detMob ? 'det' : ''}">
    <aside class="c-lista">
      <div class="c-cab">
        <div class="c-cab-l"><h1>Pré-prontos</h1><button class="btn btn-pri btn-p" data-acao="novo">${ico('plus', 'ico ico-s')}Novo</button></div>
        ${buscaHTML('', 'Buscar título ou conteúdo', '<kbd>/</kbd>')}
        ${chipsHTML()}
        ${avisoRepetidos()}
      </div>
      <div class="c-itens" role="listbox" aria-label="Textos">
        ${grupos.map(g => `<div class="c-grp">${ico(g.cat.ico, 'ico ico-s')}${esc(g.cat.nome)}</div>${g.itens.map(x => `
          <button class="c-it" role="option" aria-selected="${x.id === est.sel && est.editando !== 'novo'}" data-acao="sel" data-id="${x.id}" data-linha="${x.id}">
            <span class="t">${realce(x.titulo, ts)}</span>
            <span class="s"><span class="dot ${x.empresa.toLowerCase()}"></span><span class="r">${esc(resumo(x))}</span><span class="p">${x.a.min != null ? fmt(x.a.min) : ''}</span></span>
          </button>`).join('')}`).join('') || '<div class="vazio">Nada encontrado.</div>'}
      </div>
    </aside>
    <section class="c-det"><div class="c-det-in">${det}</div></section>
  </div>`;
}

/* =================== D · Montar resposta =================== */
const textoResposta = () => est.resposta.map(porId).filter(Boolean).map(t => t.texto.trim()).join('\n\n');
function renderD() {
  const ts = termos(); const grupos = agrupados(filtrados());
  const resp = est.resposta.map(porId).filter(Boolean);
  const mensagens = TEXTOS.filter(t => t.cat === 'mensagens').sort((a, b) => coll.compare(a.titulo, b.titulo));
  const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const linha = t => {
    const dentro = est.resposta.includes(t.id);
    if (est.editando === t.id) return `<div class="lt-x" style="padding:14px">${editorHTML(t)}</div>`;
    return `<div class="lt ${est.ativo === t.id ? 'ativo' : ''} ${dentro ? 'na-resp' : ''}" data-acao="add" data-id="${t.id}" data-linha="${t.id}" title="${dentro ? 'Tirar da resposta' : 'Pôr na resposta'}">
      <div style="min-width:0">
        <div class="lt-tit"><span class="dot ${t.empresa.toLowerCase()}" title="${t.empresa}"></span><span class="t">${realce(t.titulo, ts)}</span></div>
        <div class="lt-res">${precoCurto(t) ? `<span class="lt-mob-preco num">${precoCurto(t)} · </span>` : ''}${esc(resumo(t))}</div>
      </div>
      <div class="lt-preco">${t.a.min != null ? (t.a.nPrecos > 1 ? '<small>a partir de</small>' : '') + fmt(t.a.min) : ''}</div>
      <div class="d-add">
        <button class="ib" data-acao="editar" data-id="${t.id}" aria-label="Editar" title="Editar">${ico('pencil', 'ico ico-s')}</button>
        <button class="btn btn-sec ${dentro ? 'dentro' : ''}" data-acao="add" data-id="${t.id}">${ico(dentro ? 'check' : 'plus', 'ico ico-s')}${dentro ? 'Na resposta' : 'Adicionar'}</button>
      </div>
    </div>`;
  };
  const painel = `<aside class="resp ${est.verResp ? 'aberta' : ''}" aria-label="Resposta">
    <div class="resp-cab">${ico('message-square-text', 'ico')}<h2>Resposta para o cliente</h2><span class="n">${resp.length ? resp.length + (resp.length > 1 ? ' textos' : ' texto') : ''}</span>
      ${est.verResp ? `<button class="ib" data-acao="ver-resp" aria-label="Fechar">${ico('x', 'ico ico-s')}</button>` : ''}</div>
    <div class="resp-corpo">
      ${resp.length ? `<ol class="resp-blocos">${resp.map((t, i) => `<li><span class="ordem">${i + 1}</span><span class="t">${esc(t.titulo)}</span>
        <button class="ib" data-acao="mover" data-id="${t.id}" data-d="-1" aria-label="Subir" ${i === 0 ? 'disabled style="opacity:.3"' : ''}>${ico('arrow-up', 'ico ico-s')}</button>
        <button class="ib" data-acao="mover" data-id="${t.id}" data-d="1" aria-label="Descer" ${i === resp.length - 1 ? 'disabled style="opacity:.3"' : ''}>${ico('arrow-down', 'ico ico-s')}</button>
        <button class="ib" data-acao="add" data-id="${t.id}" aria-label="Tirar">${ico('x', 'ico ico-s')}</button></li>`).join('')}</ol>`
      : `<div class="resp-vazio"><b>Junte os textos que o cliente pediu</b>Clique nos itens da lista: eles entram aqui na ordem, separados por uma linha em branco.</div>`}
      ${mensagens.length ? `<div class="resp-rapidos"><span>Fechar com:</span>${mensagens.map(m => `<button class="chip-f" data-acao="add" data-id="${m.id}" aria-pressed="${est.resposta.includes(m.id)}">${ico(est.resposta.includes(m.id) ? 'check' : 'plus', 'ico ico-s')}${esc(m.titulo)}</button>`).join('')}</div>` : ''}
      ${resp.length ? `<div class="chat"><div class="chat-rot">${ico('eye', 'ico ico-s')}Como o cliente vai receber${ROT_BOLHA}</div>${bolhaEditavel('d', textoResposta(), hora, null)}</div>` : ''}
    </div>
    <div class="resp-pe">
      <button class="btn btn-txt" data-acao="limpar-resp" ${resp.length ? '' : 'disabled style="opacity:.4"'}>Limpar</button>
      <button class="btn btn-pri ${est.flash === 'resp' ? 'copiado' : ''}" data-acao="copiar-resp" ${resp.length ? '' : 'disabled style="opacity:.5"'}>${ico(est.flash === 'resp' ? 'check' : 'copy', 'ico ico-s')}${est.flash === 'resp' ? 'Copiado' : 'Copiar resposta'}</button>
    </div>
  </aside>`;
  return `<div class="d-grade">
    <div class="d-lista">
      <div class="cab"><div><h1>Montar resposta</h1><p>Junte um ou mais textos e copie tudo de uma vez</p></div>
        <button class="btn btn-sec" data-acao="novo">${ico('plus')}<span class="txt">Novo texto</span></button></div>
      ${buscaHTML('grande', 'O que o cliente pediu?', '<span class="a-busca-dica"><kbd>Enter</kbd> adiciona</span>')}
      ${chipsHTML()}
      ${avisoRepetidos()}
      ${est.editando === 'novo' ? `<div class="grupo-cab">${ico('plus', 'ico ico-s')}Novo texto</div><div class="lista"><div class="lt-x" style="padding:14px">${editorHTML(null)}</div></div>` : ''}
      ${grupos.length ? grupos.map(g => `<div class="grupo-cab">${ico(g.cat.ico, 'ico ico-s')}${esc(g.cat.nome)} <span class="n">${g.itens.length}</span></div><div class="lista">${g.itens.map(linha).join('')}</div>`).join('')
      : `<div class="vazio"><b>Nenhum texto com “${esc(est.busca)}”</b>Tente outra palavra, ou crie um texto novo.</div>`}
    </div>
    ${painel}
    <div class="resp-barra">
      <button class="btn btn-sec" data-acao="ver-resp">${ico('message-square-text', 'ico ico-s')}${resp.length} ${resp.length === 1 ? 'texto' : 'textos'}</button>
      <button class="btn btn-pri ${est.flash === 'resp' ? 'copiado' : ''}" data-acao="copiar-resp" ${resp.length ? '' : 'disabled style="opacity:.5"'}>${ico(est.flash === 'resp' ? 'check' : 'copy', 'ico ico-s')}${est.flash === 'resp' ? 'Copiado' : 'Copiar resposta'}</button>
    </div>
  </div>`;
}
function alternarResposta(id) {
  est.resposta = est.resposta.includes(id) ? est.resposta.filter(x => x !== id) : [...est.resposta, id];
  est.ativo = id; avisarRespostaMudou(); render();
}
async function copiarResposta() {
  const n = est.resposta.length; if (!n) return;
  const ajuste = est.rascunho.d;
  await paraAreaDeTransferencia(ajuste ?? textoResposta());
  est.flash = 'resp'; clearTimeout(flashTimer); flashTimer = setTimeout(() => { est.flash = null; render(); }, 1400);
  render(); toast(`Copiado: resposta com ${n} ${n === 1 ? 'texto' : 'textos'}${ajuste != null ? ' (ajustada)' : ''}`);
}

/* ===== render e eventos ===== */
const tela = document.getElementById('tela');
function render() {
  const foco = document.activeElement; const naBusca = foco && foco.matches && foco.matches('[data-busca]');
  const pos = naBusca ? foco.selectionStart : null;
  const scrollC = document.querySelector('.c-itens')?.scrollTop;
  tela.innerHTML = est.opcao === 'b' ? renderB() : est.opcao === 'c' ? renderC() : est.opcao === 'd' ? renderD() : renderA();
  document.querySelectorAll('[data-opcao]').forEach(b => b.setAttribute('aria-pressed', b.dataset.opcao === est.opcao));
  document.getElementById('nota').textContent = `${TEXTOS.length} textos reais do banco · categorias sugeridas pelo título · nada aqui grava no sistema`;
  lucide.createIcons();
  if (naBusca) { const i = tela.querySelector('[data-busca]'); i?.focus(); i?.setSelectionRange(pos, pos); }
  if (scrollC != null && document.querySelector('.c-itens')) document.querySelector('.c-itens').scrollTop = scrollC;
  if (est.editando && !naBusca) { const ed = tela.querySelector('[data-editor] .ed-tit'); if (ed && !ed.dataset.foi) { ed.dataset.foi = 1; } }
}
function mostrarAtivo() { tela.querySelector(`[data-linha="${est.opcao === 'c' ? est.sel : est.ativo}"]`)?.scrollIntoView({ block: 'nearest' }); }

tela.addEventListener('click', e => {
  const el = e.target.closest('[data-acao]'); if (!el) return;
  const id = el.dataset.id != null ? (isNaN(+el.dataset.id) ? el.dataset.id : +el.dataset.id) : null;
  const t = id != null ? porId(id) : null;
  const a = el.dataset.acao;
  if (a !== 'excluir') est.excluir = null;
  if (a === 'emp') { el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if (a === 'copiar') { e.stopPropagation(); copiar(t); return; }
  if (a === 'copiar-linha') { e.stopPropagation(); copiar(t, +el.dataset.l); return; }
  if (a === 'abrir') { est.aberto = est.aberto === id ? null : id; est.ativo = id; if (est.editando && est.editando !== id) est.editando = null; render(); return; }
  if (a === 'sel') { if (est.sel !== id) descartarRascunho('c:'); est.sel = id; est.editando = null; est.detMob = true; render(); return; }
  if (a === 'bolha') { if (!e.target.closest('a') && est.editBolha !== el.dataset.k) abrirBolha(el.dataset.k); return; }
  if (a === 'desfazer-bolha') { delete est.rascunho[el.dataset.k]; est.editBolha = null; render(); toast('Ajuste desfeito'); return; }
  if (a === 'salvar-bolha') {
    t.texto = est.rascunho[el.dataset.k]; preparar(t); delete est.rascunho[el.dataset.k]; est.editBolha = null;
    render(); toast('Salvo no texto — no protótipo, só nesta tela'); return;
  }
  if (a === 'voltar') { est.detMob = false; est.editando = null; render(); return; }
  if (a === 'fixar') { e.stopPropagation(); est.fixados.has(id) ? est.fixados.delete(id) : est.fixados.add(id); render(); toast(est.fixados.has(id) ? 'Fixado no topo' : 'Desafixado'); return; }
  if (a === 'editar') { e.stopPropagation(); est.editando = id; est.aberto = id; est.sel = id; est.detMob = true; render(); tela.querySelector('.ed-txt')?.focus(); return; }
  if (a === 'novo') { est.editando = 'novo'; est.detMob = true; render(); tela.querySelector('.ed-tit')?.focus(); tela.querySelector('[data-editor]')?.scrollIntoView({ block: 'nearest' }); return; }
  if (a === 'cancelar') { est.editando = null; if (est.opcao === 'c' && !est.sel) est.detMob = false; render(); return; }
  if (a === 'salvar') { salvar(el.closest('[data-editor]')); return; }
  if (a === 'excluir') { excluir(id); return; }
  if (a === 'cat') { est.cat = el.dataset.cat || null; est.soRep = false; render(); return; }
  if (a === 'rep') { est.soRep = !est.soRep; est.cat = null; render(); return; }
  if (a === 'limpar') { est.busca = ''; render(); tela.querySelector('[data-busca]')?.focus(); return; }
  if (a === 'prazo') { est.prazoNaLinha = !est.prazoNaLinha; render(); return; }
  if (a === 'add') { e.stopPropagation(); alternarResposta(id); return; }
  if (a === 'mover') {
    const i = est.resposta.indexOf(id), j = i + +el.dataset.d;
    if (j >= 0 && j < est.resposta.length) { const r = [...est.resposta]; [r[i], r[j]] = [r[j], r[i]]; est.resposta = r; avisarRespostaMudou(); render(); }
    return;
  }
  if (a === 'copiar-resp') { copiarResposta(); return; }
  if (a === 'limpar-resp') { est.resposta = []; delete est.rascunho.d; est.editBolha = null; render(); return; }
  if (a === 'ver-resp') { est.verResp = !est.verResp; render(); return; }
});
tela.addEventListener('input', e => {
  if (e.target.matches('[data-busca]')) {
    est.busca = e.target.value; const o = ordem();
    est.ativo = est.busca ? o[0]?.id ?? null : null;
    if (est.opcao === 'c' && o.length && !o.some(t => t.id === est.sel)) est.sel = o[0].id;
    render(); return;
  }
  if (e.target.matches('.ed-txt')) {
    e.target.classList.remove('erro');
    const p = tela.querySelector('[data-previa] .zap-b'); if (p) p.innerHTML = zap(e.target.value);
  }
  if (e.target.matches('.ed-tit')) e.target.classList.remove('erro');
  if (e.target.matches('.bolha-in')) {
    const k = e.target.dataset.bolha;
    const original = k === 'd' ? textoResposta() : porId(k.slice(2))?.texto;
    if (e.target.value === original) delete est.rascunho[k]; else est.rascunho[k] = e.target.value;
    const ajustado = est.rascunho[k] != null;
    tela.querySelector(`[data-ajuste="${k}"]`)?.toggleAttribute('hidden', !ajustado);
    e.target.closest('.bolha')?.querySelector('.editada')?.toggleAttribute('hidden', !ajustado);
    autoAltura(e.target);
  }
});
tela.addEventListener('focusout', e => { if (e.target.matches('.bolha-in')) fecharBolha(e.target); });
document.addEventListener('keydown', e => {
  const alvo = e.target; const digitando = alvo.matches && alvo.matches('input, textarea');
  const naBusca = alvo.matches && alvo.matches('[data-busca]');
  if (e.key === '/' && !digitando) { e.preventDefault(); tela.querySelector('[data-busca]')?.focus(); return; }
  // no balão: Esc fecha (mantendo o ajuste), Ctrl+Enter fecha e já copia
  if (alvo.matches?.('.bolha-in')) {
    if (e.key === 'Escape') { e.preventDefault(); alvo.blur(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault(); const k = alvo.dataset.bolha; alvo.blur();
      k === 'd' ? copiarResposta() : copiar(porId(k.slice(2))); return;
    }
    return;
  }
  if (e.key === 'Enter' && alvo.matches?.('.bolha.editavel')) { e.preventDefault(); abrirBolha(alvo.dataset.k); return; }
  if (e.key === 'Escape') {
    if (est.editando) { est.editando = null; render(); return; }
    if (est.busca) { est.busca = ''; render(); return; }
    if (est.opcao === 'a' && est.aberto) { est.aberto = null; render(); return; }
    alvo.blur?.(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && alvo.closest?.('[data-editor]')) { e.preventDefault(); salvar(alvo.closest('[data-editor]')); return; }
  if (digitando && !naBusca) return;
  if (est.opcao === 'b') return;
  const o = ordem(); if (!o.length) return;
  const atual = est.opcao === 'c' ? est.sel : est.ativo;
  const i = o.findIndex(t => t.id === atual);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const n = o[Math.max(0, Math.min(o.length - 1, i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (est.opcao === 'c') { if (est.sel !== n.id) descartarRascunho('c:'); est.sel = n.id; est.editando = null; } else est.ativo = n.id;
    render(); mostrarAtivo(); return;
  }
  if (e.key === 'Enter' && i >= 0) { e.preventDefault(); est.opcao === 'd' ? alternarResposta(o[i].id) : copiar(o[i]); return; }
  if (est.opcao === 'a' && !naBusca && i >= 0 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { est.aberto = e.key === 'ArrowRight' ? o[i].id : null; render(); return; }
  if (est.opcao === 'c' && !naBusca && i >= 0 && (e.key === 'e' || e.key === 'E')) { e.preventDefault(); est.editando = o[i].id; render(); tela.querySelector('.ed-txt')?.focus(); }
});

document.querySelectorAll('[data-opcao]').forEach(b => b.addEventListener('click', () => {
  est.opcao = b.dataset.opcao; est.editando = null; est.excluir = null; est.detMob = false; est.rascunho = {}; est.editBolha = null; guardar('pp-opcao', est.opcao); render(); window.scrollTo(0, 0);
}));
const temaBtn = document.getElementById('tema');
function aplicarTema(escuro) {
  document.documentElement.classList.toggle('dark', escuro);
  temaBtn.innerHTML = ico(escuro ? 'sun' : 'moon', 'ico ico-s') + `<span>${escuro ? 'Claro' : 'Escuro'}</span>`;
  lucide.createIcons(); guardar('pp-tema', escuro);
}
// Trocar o tema "acende" a partir do botão: o escuro se espalha em círculo
// saindo dele e, ao clarear, se recolhe para dentro dele (no sistema, o mesmo
// está em lib/utils/trocarTema.js).
let trocaAtual = null;
function trocarTema(escuro, origem, aplicar) {
  const raiz = document.documentElement;
  const trocar = () => { raiz.classList.toggle('dark', escuro); aplicar?.(); };
  if (!document.startViewTransition) return trocar();
  const r = origem?.getBoundingClientRect();
  const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top + r.height / 2 : innerHeight / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(trocar); trocaAtual = troca;
  let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate(reduzido ? { opacity: escuro ? [0, 1] : [1, 0] } : { clipPath: escuro ? circulo : circulo.reverse() }, {
      duration: reduzido ? 200 : escuro ? 600 : 450,
      easing: reduzido ? 'ease' : escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)',
      fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)',
    });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); if (trocaAtual === troca) delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}
temaBtn.addEventListener('click', () => { const escuro = !document.documentElement.classList.contains('dark'); trocarTema(escuro, temaBtn, () => aplicarTema(escuro)); });
aplicarTema(ler('pp-tema', false));
render();
</script>
