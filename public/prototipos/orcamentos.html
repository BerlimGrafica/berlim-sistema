<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Padrão do DESIGN.md: o mesmo mundo dos pré-prontos, da nova Produção e do novo Financeiro. */
:root {
  --brand: #F69F00; --brand-hover: #d98b00; --brand-tinta: #8A5400; --sobre-brand: #241600;
  --fundo: #EDEFF0; --superficie: #ffffff; --sutil: #f9fafb; --realce: #f3f4f6;
  --borda-fraca: #f0f1f3; --borda: #e5e7eb; --borda-forte: #d1d5db;
  --tinta: #111827; --tinta-corpo: #374151; --tinta-suave: #6b7280; --tinta-fraca: #9ca3af;
  --perigo: #dc2626; --perigo-fundo: #fef2f2; --perigo-borda: #fecaca;
  --sombra: 0 24px 56px -16px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.08);
  --sombra-pop: 0 12px 28px -8px rgba(15,23,42,.24), 0 1px 3px rgba(15,23,42,.08);
  --sombra-leve: 0 1px 2px rgba(15,23,42,.06);
  --veu: rgba(15,23,42,.36);
  --dados: #475569; --dados-tinta: #334155; --dados-fundo: #f8fafc; --dados-borda: #e2e8f0;
  --itens: #2563eb; --itens-tinta: #1d4ed8; --itens-fundo: #eff6ff; --itens-borda: #dbeafe;
  --fin: #059669; --fin-tinta: #047857; --fin-fundo: #ecfdf5; --fin-borda: #c9f2df;
  --obs: #d97706; --obs-tinta: #b45309; --obs-fundo: #fffbeb; --obs-borda: #fdecc4;
  --saida: cubic-bezier(.16, 1, .3, 1);
}
.dark {
  --brand-tinta: #FFB938;
  --fundo: #0d1117; --superficie: #161b22; --sutil: #1b2129; --realce: #21262d;
  --borda-fraca: #232a33; --borda: #30363d; --borda-forte: #3d444d;
  --tinta: #EDEDED; --tinta-corpo: #D4D4D8; --tinta-suave: #A1A1AA; --tinta-fraca: #71717a;
  --perigo: #f87171; --perigo-fundo: rgba(239,68,68,.1); --perigo-borda: rgba(239,68,68,.3);
  --sombra: 0 24px 56px -16px rgba(0,0,0,.7); --sombra-pop: 0 12px 28px -8px rgba(0,0,0,.6); --sombra-leve: 0 1px 2px rgba(0,0,0,.4);
  --veu: rgba(0,0,0,.6);
  --dados: #94a3b8; --dados-tinta: #cbd5e1; --dados-fundo: rgba(148,163,184,.08); --dados-borda: rgba(148,163,184,.22);
  --itens: #60a5fa; --itens-tinta: #93c5fd; --itens-fundo: rgba(59,130,246,.12); --itens-borda: rgba(59,130,246,.3);
  --fin: #34d399; --fin-tinta: #6ee7b7; --fin-fundo: rgba(16,185,129,.11); --fin-borda: rgba(16,185,129,.28);
  --obs: #fbbf24; --obs-tinta: #fcd34d; --obs-fundo: rgba(245,158,11,.1); --obs-borda: rgba(245,158,11,.26);
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; } html.dark { color-scheme: dark; }
body { font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--tinta-corpo); background: var(--fundo); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
input { caret-color: var(--brand); }
::placeholder { color: var(--tinta-suave); opacity: 1; }
::selection { background: rgba(246,159,0,.3); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }
mark { background: rgba(246,159,0,.3); color: inherit; border-radius: 2px; padding: 0 1px; }
.ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.ico-s { width: 14px; height: 14px; }
.num { font-variant-numeric: tabular-nums; }
kbd { font: 600 10.5px/1 Montserrat, sans-serif; color: var(--tinta-suave); border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--superficie); }

/* moldura do protótipo */
.proto { position: sticky; top: 0; z-index: 40; height: 51px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.proto-nome { font-weight: 700; color: var(--tinta); white-space: nowrap; }
.proto-nota { color: var(--tinta-suave); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.proto-tema { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--tinta-corpo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; flex-shrink: 0; }
.proto-tema:hover { background: var(--realce); color: var(--tinta); }

/* botões */
.btn { height: 38px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, filter .15s; }
.btn-pri { background: var(--brand); color: var(--sobre-brand); }
.btn-pri:hover { background: var(--brand-hover); }
.btn-pri kbd { background: rgba(255,255,255,.35); border-color: rgba(36,22,0,.18); color: var(--sobre-brand); }
.btn-sec { border: 1px solid var(--borda-forte); color: var(--tinta); background: var(--superficie); }
.btn-sec:hover { background: var(--sutil); border-color: var(--tinta-fraca); }
.btn-txt { color: var(--tinta-suave); padding: 0 10px; }
.btn-txt:hover { color: var(--tinta); background: var(--realce); }
.btn-ok { background: var(--fin); color: #fff; } .btn-ok:hover { filter: brightness(.95); } .dark .btn-ok { color: var(--fundo); }
.btn-perigo { color: var(--perigo); }
.btn-perigo:hover { background: var(--perigo-fundo); color: var(--perigo); }
.btn-p { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 7px; }
.ib { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--tinta-suave); transition: background .12s, color .12s; flex-shrink: 0; }
.ib:hover { background: var(--realce); color: var(--tinta); }
/* aprovar: a ação que fecha o orçamento, em verde, como o concluir da Produção */
.ib.aprovar { color: var(--fin); }
.ib.aprovar:hover { background: var(--fin-fundo); }

/* página */
.pg { max-width: 1120px; margin: 0 auto; padding: 24px 28px 72px; }
.cab { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
.cab h1 { font-size: 22px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; line-height: 1.2; }
.cab p { color: var(--tinta-suave); font-size: 12.5px; margin-top: 3px; }
.cab .btn { margin-left: auto; }
.busca { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
.busca:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.busca .ico { color: var(--tinta-suave); }
.busca input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 50px; font-size: 16px; font-weight: 600; color: var(--tinta); }
.busca input::placeholder { font-weight: 500; }
.busca .limpar { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--tinta-suave); }
.busca .limpar:hover { background: var(--realce); color: var(--tinta); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.chip { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--borda); background: var(--superficie); font-weight: 600; font-size: 12.5px; color: var(--tinta-corpo); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; transition: background .12s, border-color .12s; }
.chip:hover { border-color: var(--borda-forte); background: var(--sutil); }
.chip .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--superficie); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .65; }

/* lista agrupada pela idade do orçamento */
.grupo-cab { display: flex; align-items: center; gap: 8px; padding: 22px 4px 8px; font-size: 13px; font-weight: 700; color: var(--tinta); }
.grupo-cab .ico { color: var(--tinta-suave); }
.grupo-cab .n { color: var(--tinta-fraca); font-weight: 500; font-variant-numeric: tabular-nums; }
.grupo-cab .tot { margin-left: auto; color: var(--tinta-suave); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
.lista { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
.lin { display: grid; grid-template-columns: 64px 40px minmax(0,1fr) 130px 140px 116px 66px; align-items: center; gap: 14px; padding: 10px 10px 10px 14px; border-top: 1px solid var(--borda-fraca); cursor: pointer; transition: background .1s; }
.lista > .lin:first-child { border-top: 0; }
.lin:hover { background: var(--sutil); }
.lin.ativo, .lin.aberta { background: var(--realce); }
.diaf { width: 40px; height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--borda); background: var(--superficie); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; flex-shrink: 0; }
.diaf b { font-size: 13.5px; font-weight: 700; color: var(--tinta); font-variant-numeric: tabular-nums; }
.diaf span { font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); }
.lin-txt { min-width: 0; }
.lin-tit { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lin-tit .t { font-size: 14px; font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lin-tit .prob { color: var(--perigo); flex-shrink: 0; display: inline-flex; }
.lin-tit .prob .ico { width: 14px; height: 14px; }
.lin-sub { font-size: 12px; color: var(--tinta-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
/* o nº do orçamento é o canhoto do talão: a primeira coluna tem o fundo de
   papel um tom abaixo e o picote (furinhos) separando do resto, de uma linha à
   outra; "Nº" em laranja-tinta em cima, o número embaixo */
.num-orc { display: inline-flex; align-items: baseline; gap: 4px; color: var(--tinta); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.num-orc small { font-size: 10px; font-weight: 800; color: var(--brand); letter-spacing: .03em; }
.num-orc .dig { font-size: 13px; }
.lin > .num-orc {
  align-self: stretch; margin: -10px 0 -10px -14px; padding: 6px 10px 6px 12px;
  flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.1;
  background: var(--sutil); border-right: 2px dotted var(--tinta-fraca);
}
.lin > .num-orc .dig { font-size: 15px; }
.lin-prazo { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-corpo); min-width: 0; }
.lin-prazo .ico { width: 14px; height: 14px; color: var(--tinta-fraca); }
.lin-prazo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lin-prazo .sem { color: var(--tinta-fraca); }
.pessoa { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--tinta-corpo); }
.pessoa .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 24px; height: 24px; border-radius: 99px; display: inline-grid; place-items: center; font: 700 10px/1 Montserrat; letter-spacing: -.02em; flex-shrink: 0; }
.lin-v { text-align: right; font-weight: 700; color: var(--fin); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lin-acts { display: flex; gap: 2px; justify-content: flex-end; }
.vazio { padding: 40px 16px; text-align: center; color: var(--tinta-suave); }
.vazio b { display: block; color: var(--tinta); font-size: 14px; }
.folha { display: block; width: 76px; height: 84px; margin: 0 auto 14px; }
.folha .f-papel { fill: var(--superficie); stroke: var(--borda-forte); }
.folha .f-marca { fill: none; stroke: var(--tinta-fraca); }
.dicas { margin-top: 18px; color: var(--tinta-fraca); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.dicas span { display: inline-flex; gap: 5px; align-items: center; }

/* gaveta (computador) / folha (celular), a mesma da nova Produção e do Financeiro */
.gv-veu { position: fixed; inset: 51px 0 0 0; background: var(--veu); z-index: 60; animation: veuEntra .4s ease-out; }
.gaveta { position: fixed; top: 51px; right: 0; bottom: 0; width: min(460px, 100%); background: var(--fundo); border-left: 1px solid var(--borda); box-shadow: var(--sombra); z-index: 61; overflow-y: auto; animation: gavetaEntra .46s cubic-bezier(.22,1,.36,1); }
/* Com a gaveta aberta, a página de trás fica parada: a roda do mouse rola só a
   gaveta, e chegar ao fim dela (ou de uma lista aberta) não leva a página junto. */
.gaveta, .pop { overscroll-behavior: contain; }
html:has(.gaveta:not(.sai)) { overflow: hidden; scrollbar-gutter: stable; }
.gv-veu.sai { animation: veuSai .3s ease-in forwards; pointer-events: none; }
.gaveta.sai { animation: gavetaSai .3s cubic-bezier(.55,0,1,.45) forwards; pointer-events: none; }
@keyframes gavetaEntra { from { transform: translateX(100%); } }
@keyframes gavetaSai { to { transform: translateX(100%); } }
@keyframes veuEntra { from { opacity: 0; } }
@keyframes veuSai { to { opacity: 0; } }
.det { padding: 0 22px 40px; }
.det-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: 0 -22px; padding: 12px 22px; background: var(--fundo); color: var(--tinta-suave); font-size: 13px; font-weight: 600; transition: box-shadow .2s; }
.gaveta.rolou .det-cab { box-shadow: 0 1px 0 var(--borda); }
.det-ferr { margin-left: auto; display: flex; gap: 2px; }
/* "Orçamento", o "Nº" laranja e o número na mesma linha de base; o bloco
   todo centralizado com os ícones da direita */
.det-num { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
.det-num .rot { font-size: 13px; font-weight: 600; color: var(--tinta-suave); }
.det-num small { font-size: 11px; font-weight: 800; color: var(--brand); letter-spacing: .03em; margin-right: -2px; }
.det-num b { font-size: 18px; font-weight: 800; color: var(--tinta); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.det-tit { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); line-height: 1.25; margin-top: 2px; }
.det-aviso { display: flex; gap: 8px; align-items: center; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--perigo-fundo); border: 1px solid var(--perigo-borda); color: var(--perigo); font-size: 12.5px; font-weight: 600; }
.det-valor { font-size: 30px; font-weight: 700; letter-spacing: -.022em; color: var(--fin); margin-top: 10px; font-variant-numeric: tabular-nums; }
.det-valor small { font-size: 13.5px; font-weight: 600; color: var(--fin-tinta); margin-right: 4px; letter-spacing: 0; }
.dprops { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; row-gap: 2px; margin-top: 14px; }
.dprops dt { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 7px; align-items: center; min-height: 32px; }
.dprops dd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-weight: 600; color: var(--tinta); }
.dprops .mudo { color: var(--tinta-suave); font-weight: 500; }
.dprops dd .ib { width: 26px; height: 26px; }
.area { border: 1px solid var(--c-borda); border-radius: 10px; background: var(--superficie); margin-top: 18px; overflow: hidden; }
.a-itens { --c: var(--itens); --c-tinta: var(--itens-tinta); --c-fundo: var(--itens-fundo); --c-borda: var(--itens-borda); }
.a-obs { --c: var(--obs); --c-tinta: var(--obs-tinta); --c-fundo: var(--obs-fundo); --c-borda: var(--obs-borda); }
.area-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.area-ico { width: 26px; height: 26px; border-radius: 7px; background: var(--superficie); display: grid; place-items: center; color: var(--c); box-shadow: var(--sombra-leve); flex-shrink: 0; }
.area-cab h3 { font-size: 13px; font-weight: 700; color: var(--tinta); }
.area-meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--c-tinta); white-space: nowrap; font-variant-numeric: tabular-nums; }
.it { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 4px 10px; padding: 10px 12px; border-top: 1px solid var(--borda-fraca); }
.it:first-child { border-top: 0; }
.it .n { font-size: 11.5px; font-weight: 700; color: var(--tinta-fraca); padding-top: 1px; font-variant-numeric: tabular-nums; }
.it .nm { font-weight: 600; color: var(--tinta); min-width: 0; }
.it .ds { grid-column: 2 / 4; font-size: 12px; color: var(--tinta-suave); white-space: pre-wrap; overflow-wrap: anywhere; }
.it .v { text-align: right; font-weight: 600; color: var(--tinta); white-space: nowrap; font-variant-numeric: tabular-nums; }
.it .v small { display: block; font-size: 11px; font-weight: 600; color: var(--brand-tinta); }
.loc { display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); white-space: nowrap; }
.loc i { width: 7px; height: 7px; border-radius: 99px; background: var(--c-loc, var(--tinta-fraca)); }
.obs-txt { padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--tinta-corpo); line-height: 1.55; }
.det-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
.det-acoes .esp { flex: 1; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 95; background: var(--tinta); color: var(--superficie); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 12.5px; box-shadow: var(--sombra-pop); display: flex; gap: 8px; align-items: center; animation: sobe .22s var(--saida); max-width: calc(100vw - 32px); }
.toast .ico { color: #34d399; }
@keyframes sobe { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (max-width: 1080px) {
  .lin { grid-template-columns: 64px 40px minmax(0,1fr) 120px 108px 66px; }
  .lin .pessoa { display: none; }
}
@media (max-width: 900px) {
  .lin { grid-template-columns: 64px 40px minmax(0,1fr) 108px 66px; }
  .lin .lin-prazo { display: none; }
}
@media (max-width: 760px) {
  .proto { padding: 0 10px; gap: 8px; }
  .proto-nota, .proto-tema span { display: none; }
  .pg { padding: 16px 12px 96px; }
  .cab .btn .txt, .cab .btn kbd, .busca kbd, .dicas { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -12px; margin-right: -12px; padding: 0 12px; }
  .lin { grid-template-columns: 40px minmax(0,1fr) auto; gap: 10px; padding: 10px 8px 10px 12px; }
  .lin-v, .lin > .num-orc { display: none; }
  .lin-sub .n-mob { display: inline !important; }
  .lin-sub .v-mob { display: inline !important; color: var(--fin); font-weight: 700; }
  .gv-veu { inset: 0; }
  .gaveta { top: auto; height: 88dvh; width: 100%; border-left: 0; border-radius: 12px 12px 0 0; animation-name: folhaEntra; }
  .gaveta.sai { animation-name: folhaSai; }
  .det { padding: 0 14px 40px; }
  .det-cab { margin: 0 -14px; padding: 8px 6px 8px 14px; }
  .det-cab .ib { width: 44px; height: 44px; }
}
.lin-sub .v-mob, .lin-sub .n-mob { display: none; }
@keyframes folhaEntra { from { transform: translateY(100%); } }
@keyframes folhaSai { to { transform: translateY(100%); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
html[data-troca-tema]::view-transition-old(root), html[data-troca-tema]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html[data-troca-tema].dark::view-transition-new(root), html[data-troca-tema]:not(.dark)::view-transition-old(root) { z-index: 1; }
html[data-troca-tema] *, html[data-troca-tema] *::before, html[data-troca-tema] *::after { transition: none !important; }
</style>
</head>
<body>
<div class="proto">
  <span class="proto-nome">Orçamentos</span>
  <span class="proto-nota">Dados reais · as ações abrem as telas de hoje, que gravam</span>
  <button class="proto-tema" id="tema"><i data-lucide="moon" class="ico ico-s"></i><span>Escuro</span></button>
</div>
<main class="pg" id="tela"></main>

<script>
/*ORCAMENTOS*/

/* ===== base ===== */
const ico = (n, c = 'ico') => `<i data-lucide="${n}" class="${c}"></i>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const HOJE = DADOS.hoje;
const dataLocal = iso => { const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d); };
const diasEntre = (de, ate) => Math.round((dataLocal(ate) - dataLocal(de)) / 864e5);
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const reais = c => 'R$ ' + (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const dataLonga = iso => { if (!iso) return ''; const d = dataLocal(iso); return `${SEMANA[d.getDay()].slice(0, 3)}, ${d.getDate()} de ${MESES[d.getMonth()]}${d.getFullYear() !== +HOJE.slice(0, 4) ? ' de ' + d.getFullYear() : ''}`; };
const haDias = iso => { const n = diasEntre(iso, HOJE); return n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`; };
// Pessoas: duas letras na cor fixa do nome (a mesma do chat e das etiquetas).
const iniciais = n => { const p = String(n).trim().split(/\s+/); return p.length > 1 ? (p[0][0] + p.at(-1)[0]).toUpperCase() : p[0].slice(0, 1).toUpperCase() + p[0].slice(1, 2).toLowerCase(); };
const pessoa = n => n ? `<span class="pessoa" title="${esc(n)}"><i class="av" style="background:${DADOS.cores[n]?.[0] || '#64748b'};color:${DADOS.cores[n]?.[1] || '#fff'}">${esc(iniciais(n))}</i><span class="nm">${esc(n)}</span></span>` : '<span class="pessoa"><span class="nm" style="color:var(--tinta-fraca)">—</span></span>';
// Locais: a cor fixa de cada um (a mesma da Produção).
const COR_LOCAL = { 'berlim': '#f97316', 'futura': '#3b82f6', 'alvo print': '#d946ef', 'atualcard': '#0d9488', 'xexe': '#65a30d', 'stampmix': '#f43f5e', 'gráfica chromeset': '#6366f1', 'outros': '#64748b' };
const FOLHA = `<svg class="folha" viewBox="0 0 76 84" aria-hidden="true"><rect class="f-papel" x="18.5" y="14.5" width="39" height="55" rx="1.5"/><g class="f-marca"><path d="M6 14.5h8M18.5 2v8M62 14.5h8M57.5 2v8M6 69.5h8M18.5 74v8M62 69.5h8M57.5 74v8M2 42h12M8 36v12M62 42h12M68 36v12"/><circle cx="8" cy="42" r="3.5"/><circle cx="68" cy="42" r="3.5"/></g></svg>`;
// As ações abrem as telas de hoje, na página: o foco sai daqui junto, senão o
// teclado fica preso atrás do modal.
const paraPai = msg => { if (window.parent !== window) { document.activeElement?.blur(); window.parent.postMessage(msg, '/'); } };
let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = ico('check-circle-2') + `<span>${esc(msg)}</span>`;
  document.body.appendChild(el); lucide.createIcons(); toastTimer = setTimeout(() => el.remove(), 2200);
}

/* ===== dados ===== */
const ORC = (DADOS.orcamentos || []).map(o => ({ ...o, busca: semAcento([o.cliente, o.id, o.criadoPor, ...o.itens.map(i => i.nome + ' ' + i.descricao)].join(' ')) }));
const porId = id => ORC.find(o => o.id === id);
const resumoItens = o => o.itens.map(i => i.nome || 'Item').join(' · ') || 'Sem itens';

/* ===== estado ===== */
const est = { busca: '', filtro: '', ativo: null, gaveta: null };
const termos = () => semAcento(est.busca).split(/\s+/).filter(Boolean);
function filtrados() {
  const ts = termos();
  return ORC.filter(o => (est.filtro !== 'meus' || o.criadoPor === DADOS.eu) && ts.every(t => o.busca.includes(t)));
}
// Pela idade: orçamento é proposta, e o que importa é o que ainda está quente.
function grupos(l) {
  const idade = o => o.criado ? diasEntre(o.criado, HOJE) : 999;
  const ord = l.slice().sort((a, b) => (b.criado || '').localeCompare(a.criado || '') || b.id - a.id);
  return [
    { id: 'semana', rot: 'Esta semana', icone: 'calendar-days', itens: ord.filter(o => idade(o) <= 7) },
    { id: 'mes', rot: 'Até 30 dias', icone: 'calendar-range', itens: ord.filter(o => idade(o) > 7 && idade(o) <= 30) },
    { id: 'antigos', rot: 'Mais antigos', icone: 'archive', itens: ord.filter(o => idade(o) > 30) },
  ].filter(g => g.itens.length);
}
const ordem = () => grupos(filtrados()).flatMap(g => g.itens);

/* ===== desenho ===== */
function realce(txt, ts) {
  const s = String(txt); if (!ts.length) return esc(s);
  const n = semAcento(s); const faixas = [];
  ts.forEach(t => { let i = n.indexOf(t); while (t && i !== -1) { faixas.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } });
  if (!faixas.length) return esc(s);
  faixas.sort((a, b) => a[0] - b[0]); let out = '', pos = 0;
  faixas.forEach(([a, b]) => { if (a < pos) a = pos; if (b <= a) return; out += esc(s.slice(pos, a)) + '<mark>' + esc(s.slice(a, b)) + '</mark>'; pos = b; });
  return out + esc(s.slice(pos));
}
// Nº do orçamento no canhoto do talão: "Nº" em cima, o número embaixo.
function numeroOrc(id) {
  return `<span class="num-orc" title="Orçamento nº ${id}"><small>Nº</small><span class="dig">${id}</span></span>`;
}
// Quadrinho de data: dia e mês. A data de criação não é prazo, então fica neutro.
function quadrinho(iso) {
  if (!iso) return '<span class="diaf"><span>sem</span><span>data</span></span>';
  const d = dataLocal(iso);
  return `<span class="diaf" title="Criado ${esc(dataLonga(iso))}"><b class="num">${String(d.getDate()).padStart(2, '0')}</b><span>${MESES[d.getMonth()].slice(0, 3)}</span></span>`;
}
function linha(o, ts) {
  return `<div class="lin ${est.ativo === o.id ? 'ativo' : ''} ${est.gaveta === o.id ? 'aberta' : ''}" data-orc="${o.id}" tabindex="0" role="button" aria-label="Orçamento ${o.id}, ${esc(o.cliente)}, ${reais(o.valor)}">
    ${numeroOrc(o.id)}
    ${quadrinho(o.criado)}
    <div class="lin-txt">
      <div class="lin-tit"><span class="t">${realce(o.cliente, ts)}</span>${o.problema ? `<span class="prob" title="Cliente com pendência">${ico('alert-triangle')}</span>` : ''}</div>
      <div class="lin-sub"><span class="n-mob">#${o.id} · </span><span class="v-mob">${reais(o.valor)} · </span>${realce(resumoItens(o), ts)}</div>
    </div>
    <span class="lin-prazo" title="Prazo de produção">${o.prazo ? `${ico('clock')}<span>${esc(o.prazo)}</span>` : '<span class="sem">sem prazo</span>'}</span>
    ${pessoa(o.criadoPor)}
    <div class="lin-v">${reais(o.valor)}</div>
    <div class="lin-acts">
      <button class="ib aprovar" data-acao="aprovar" data-id="${o.id}" aria-label="Aprovar e virar O.S." title="Aprovar e virar O.S.">${ico('check-circle-2')}</button>
      <button class="ib" data-acao="imprimir" data-id="${o.id}" aria-label="Imprimir" title="Imprimir">${ico('printer')}</button>
    </div>
  </div>`;
}
const tela = document.getElementById('tela');
function render() {
  const foco = document.activeElement; const naBusca = foco?.id === 'busca'; const pos = naBusca ? foco.selectionStart : null;
  const ts = termos(); const l = filtrados(); const gs = grupos(l);
  const meus = ORC.filter(o => o.criadoPor === DADOS.eu).length;
  tela.innerHTML = `
    <div class="cab"><div><h1>Orçamentos</h1><p class="num">${plural(ORC.length, 'orçamento', 'orçamentos')}</p></div>
      <button class="btn btn-pri" data-acao="novo" title="Novo orçamento (N)">${ico('plus')}<span class="txt">Novo orçamento</span><kbd>N</kbd></button></div>
    <label class="busca">${ico('search')}<input id="busca" value="${esc(est.busca)}" placeholder="Buscar cliente, nº ou item" autocomplete="off">${est.busca ? `<button class="limpar" data-acao="limpar" aria-label="Limpar busca">${ico('x', 'ico ico-s')}</button>` : '<kbd>/</kbd>'}</label>
    <div class="chips" role="group" aria-label="De quem">
      <button class="chip" data-filtro="" aria-pressed="${!est.filtro}">Todos <span class="n">${ORC.length}</span></button>
      ${DADOS.eu ? `<button class="chip" data-filtro="meus" aria-pressed="${est.filtro === 'meus'}">Meus <span class="n">${meus}</span></button>` : ''}
    </div>
    ${gs.length ? gs.map(g => `<div class="grupo-cab">${ico(g.icone, 'ico ico-s')}${g.rot} <span class="n">${g.itens.length}</span><span class="tot">${reais(g.itens.reduce((s, o) => s + o.valor, 0))}</span></div>
      <div class="lista">${g.itens.map(o => linha(o, ts)).join('')}</div>`).join('')
    : `<div class="vazio">${FOLHA}<b>${est.busca ? `Nada com “${esc(est.busca)}”` : 'Nenhum orçamento'}</b></div>`}
    <div class="dicas"><span><kbd>/</kbd> buscar</span><span><kbd>↑</kbd><kbd>↓</kbd> escolher</span><span><kbd>Enter</kbd> abrir</span><span><kbd>N</kbd> novo</span></div>`;
  lucide.createIcons();
  if (naBusca) { const i = document.getElementById('busca'); i.focus(); i.setSelectionRange(pos, pos); }
}

/* ===== gaveta: o orçamento inteiro e o que fazer com ele ===== */
const gavetaRaiz = document.createElement('div'); document.body.appendChild(gavetaRaiz);
function detalhe(o) {
  const total = o.itens.length;
  return `<div class="det">
    <div class="det-cab"><span class="det-num"><span class="rot">Orçamento</span><small>Nº</small><b>${o.id}</b></span><span class="det-ferr"><button class="ib" data-acao="editar" data-id="${o.id}" aria-label="Editar" title="Editar">${ico('pencil', 'ico ico-s')}</button><button class="ib" data-acao="fechar" aria-label="Fechar" title="Fechar (Esc)">${ico('x', 'ico ico-s')}</button></span></div>
    <div class="det-tit">${esc(o.cliente)}</div>
    ${o.problema ? `<div class="det-aviso">${ico('alert-triangle', 'ico ico-s')}Cliente com pendência</div>` : ''}
    <div class="det-valor"><small>R$</small>${(o.valor / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
    <dl class="dprops">
      <dt>${ico('clock', 'ico ico-s')}Prazo</dt><dd>${o.prazo ? esc(o.prazo) : '<span class="mudo">sem prazo</span>'}</dd>
      <dt>${ico('calendar', 'ico ico-s')}Criado</dt><dd>${o.criado ? `${esc(dataLonga(o.criado))} <span class="mudo">${haDias(o.criado)}</span>` : '<span class="mudo">sem data</span>'}</dd>
      <dt>${ico('user', 'ico ico-s')}Por</dt><dd>${pessoa(o.criadoPor)}</dd>
      ${o.telefone ? `<dt>${ico('phone', 'ico ico-s')}Telefone</dt><dd>${esc(o.telefone)}<button class="ib" data-acao="copiar-tel" data-id="${o.id}" aria-label="Copiar telefone" title="Copiar">${ico('copy', 'ico ico-s')}</button></dd>` : ''}
    </dl>
    <section class="area a-itens"><div class="area-cab"><span class="area-ico">${ico('shopping-bag', 'ico ico-s')}</span><h3>Itens</h3><span class="area-meta">${total ? plural(total, 'item', 'itens') : ''}</span></div>
      ${total ? o.itens.map((i, k) => `<div class="it"><span class="n">${k + 1}</span><span class="nm">${esc(i.nome || 'Item')}${i.local ? `<span class="loc" style="--c-loc:${COR_LOCAL[semAcento(i.local)] || '#64748b'}"><i></i>${esc(i.local)}</span>` : ''}</span>
        <span class="v">${i.valor ? 'R$ ' + esc(i.valor) : ''}${i.desconto ? `<small>−${esc(i.desconto)}%</small>` : ''}</span>${i.descricao ? `<span class="ds">${esc(i.descricao)}</span>` : ''}</div>`).join('')
      : '<div class="obs-txt" style="color:var(--tinta-suave)">Sem itens</div>'}
    </section>
    ${o.obs ? `<section class="area a-obs"><div class="area-cab"><span class="area-ico">${ico('sticky-note', 'ico ico-s')}</span><h3>Observações</h3></div><div class="obs-txt">${esc(o.obs)}</div></section>` : ''}
    <div class="det-acoes">
      <button class="btn btn-ok btn-p" data-acao="aprovar" data-id="${o.id}">${ico('check-circle-2', 'ico ico-s')}Aprovar e virar O.S.</button>
      <button class="btn btn-sec btn-p" data-acao="imprimir" data-id="${o.id}">${ico('printer', 'ico ico-s')}Imprimir</button>
      <span class="esp"></span>
      ${DADOS.admin ? `<button class="btn btn-txt btn-p btn-perigo" data-acao="excluir" data-id="${o.id}">${ico('trash-2', 'ico ico-s')}Excluir</button>` : ''}
    </div>
  </div>`;
}
function renderGaveta() {
  const o = est.gaveta != null ? porId(est.gaveta) : null;
  document.querySelectorAll('.lin.aberta').forEach(x => x.classList.remove('aberta'));
  if (o) {
    document.querySelector(`.lin[data-orc="${o.id}"]`)?.classList.add('aberta');
    const aberta = gavetaRaiz.querySelector('.gaveta:not(.sai)');
    if (aberta) aberta.innerHTML = detalhe(o);
    else {
      gavetaRaiz.innerHTML = `<div class="gv-veu" data-acao="fechar"></div><aside class="gaveta" role="dialog" aria-label="Orçamento">${detalhe(o)}</aside>`;
      const g = gavetaRaiz.querySelector('.gaveta');
      g.addEventListener('scroll', () => g.classList.toggle('rolou', g.scrollTop > 4), { passive: true });
    }
    lucide.createIcons(); gavetaRaiz.querySelector('.det-ferr .ib')?.focus({ preventScroll: true });
    return;
  }
  const saindo = gavetaRaiz.querySelectorAll('.gv-veu, .gaveta'); if (!saindo.length) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { gavetaRaiz.innerHTML = ''; return; }
  saindo.forEach(x => x.classList.add('sai'));
  setTimeout(() => { if (est.gaveta == null) gavetaRaiz.innerHTML = ''; }, 300);
}
function abrirGaveta(id) { est.gaveta = id; est.ativo = id; renderGaveta(); }
function fecharGaveta() { const id = est.gaveta; est.gaveta = null; renderGaveta(); document.querySelector(`.lin[data-orc="${id}"]`)?.focus({ preventScroll: true }); }

/* ===== ações: cada uma chama a tela de hoje, na página ===== */
function agir(a, id) {
  if (a === 'novo') return paraPai({ tipo: 'novo-orcamento' });
  if (a === 'editar') return paraPai({ tipo: 'editar-orcamento', id });
  if (a === 'aprovar') return paraPai({ tipo: 'aprovar-orcamento', id });
  if (a === 'imprimir') return paraPai({ tipo: 'imprimir-orcamento', id });
  if (a === 'excluir') return paraPai({ tipo: 'excluir-orcamento', id });
  if (a === 'copiar-tel') { navigator.clipboard?.writeText(porId(id)?.telefone || ''); return toast('Telefone copiado'); }
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#tema')) return;
  const acao = t.closest('[data-acao]');
  if (acao) {
    e.stopPropagation();
    const a = acao.dataset.acao, id = acao.dataset.id != null ? +acao.dataset.id : null;
    if (a === 'fechar') return fecharGaveta();
    if (a === 'limpar') { est.busca = ''; render(); return document.getElementById('busca')?.focus(); }
    return agir(a, id);
  }
  const f = t.closest('[data-filtro]'); if (f) { est.filtro = f.dataset.filtro; return render(); }
  const lin = t.closest('[data-orc]'); if (lin) return abrirGaveta(+lin.dataset.orc);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'busca') return;
  est.busca = e.target.value; est.ativo = est.busca ? ordem()[0]?.id ?? null : null; render();
});
document.addEventListener('keydown', e => {
  const alvo = e.target; const digitando = alvo.matches?.('input, textarea'); const naBusca = alvo.id === 'busca';
  if (e.key === 'Escape') {
    if (est.gaveta != null) { e.preventDefault(); return fecharGaveta(); }
    if (est.busca) { est.busca = ''; return render(); }
    return alvo.blur?.();
  }
  if (e.key === '/' && !digitando) { e.preventDefault(); return document.getElementById('busca')?.focus(); }
  if (!digitando && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); return agir('novo'); }
  if (digitando && !naBusca) return;
  if (est.gaveta != null) return;
  const o = ordem(); if (!o.length) return;
  const i = o.findIndex(x => x.id === est.ativo);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    est.ativo = o[Math.max(0, Math.min(o.length - 1, i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1)))].id;
    render(); document.querySelector(`.lin[data-orc="${est.ativo}"]`)?.scrollIntoView({ block: 'nearest' }); return;
  }
  if (e.key === 'Enter' && i >= 0) { e.preventDefault(); return abrirGaveta(o[i].id); }
});

/* ===== troca de tema (a mesma do sistema) ===== */
const temaBtn = document.getElementById('tema');
function trocarTema(escuro) {
  const raiz = document.documentElement;
  const trocar = () => { raiz.classList.toggle('dark', escuro); temaBtn.innerHTML = ico(escuro ? 'sun' : 'moon', 'ico ico-s') + `<span>${escuro ? 'Claro' : 'Escuro'}</span>`; lucide.createIcons(); };
  if (!document.startViewTransition) return trocar();
  const r = temaBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(trocar); let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate({ clipPath: escuro ? circulo : circulo.reverse() }, { duration: escuro ? 600 : 450, easing: escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)', fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)' });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}
temaBtn.addEventListener('click', () => trocarTema(!document.documentElement.classList.contains('dark')));
render();
</script>
</body>
</html>
