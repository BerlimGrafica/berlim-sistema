<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Padrão do DESIGN.md: o mesmo mundo do novo Início, da nova Produção e da nova O.S. */
:root {
  --brand: #F69F00; --brand-hover: #d98b00; --brand-tinta: #8A5400; --sobre-brand: #241600;
  --fundo: #EDEFF0; --superficie: #ffffff; --sutil: #f9fafb; --realce: #f3f4f6;
  --borda-fraca: #f0f1f3; --borda: #e5e7eb; --borda-forte: #d1d5db;
  --tinta: #111827; --tinta-corpo: #374151; --tinta-suave: #6b7280; --tinta-fraca: #9ca3af;
  --perigo: #dc2626; --perigo-fundo: #fef2f2; --perigo-borda: #fecaca;
  --sucesso: #059669;
  --sombra: 0 24px 56px -16px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.08);
  --sombra-pop: 0 12px 28px -8px rgba(15,23,42,.24), 0 1px 3px rgba(15,23,42,.08);
  --sombra-leve: 0 1px 2px rgba(15,23,42,.06);
  --veu: rgba(15,23,42,.36);
  --dados: #475569; --dados-tinta: #334155; --dados-fundo: #f8fafc; --dados-borda: #e2e8f0;
  --itens: #2563eb; --itens-tinta: #1d4ed8; --itens-fundo: #eff6ff; --itens-borda: #dbeafe;
  --fin: #059669; --fin-tinta: #047857; --fin-fundo: #ecfdf5; --fin-borda: #c9f2df;
  --obs: #d97706; --obs-tinta: #b45309; --obs-fundo: #fffbeb; --obs-borda: #fdecc4;
  --saida: cubic-bezier(.16, 1, .3, 1);
}
.dark {
  --brand-tinta: #FFB938;
  --fundo: #0d1117; --superficie: #161b22; --sutil: #1b2129; --realce: #21262d;
  --borda-fraca: #232a33; --borda: #30363d; --borda-forte: #3d444d;
  --tinta: #EDEDED; --tinta-corpo: #D4D4D8; --tinta-suave: #A1A1AA; --tinta-fraca: #71717a;
  --perigo: #f87171; --perigo-fundo: rgba(239,68,68,.1); --perigo-borda: rgba(239,68,68,.3);
  --sucesso: #34d399;
  --sombra: 0 24px 56px -16px rgba(0,0,0,.7); --sombra-pop: 0 12px 28px -8px rgba(0,0,0,.6); --sombra-leve: 0 1px 2px rgba(0,0,0,.4);
  --veu: rgba(0,0,0,.6);
  --dados: #94a3b8; --dados-tinta: #cbd5e1; --dados-fundo: rgba(148,163,184,.08); --dados-borda: rgba(148,163,184,.22);
  --itens: #60a5fa; --itens-tinta: #93c5fd; --itens-fundo: rgba(59,130,246,.12); --itens-borda: rgba(59,130,246,.3);
  --fin: #34d399; --fin-tinta: #6ee7b7; --fin-fundo: rgba(16,185,129,.11); --fin-borda: rgba(16,185,129,.28);
  --obs: #fbbf24; --obs-tinta: #fcd34d; --obs-fundo: rgba(245,158,11,.1); --obs-borda: rgba(245,158,11,.26);
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; } html.dark { color-scheme: dark; }
body { font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--tinta-corpo); background: var(--fundo); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
input { caret-color: var(--brand); }
::placeholder { color: var(--tinta-suave); opacity: 1; }
::selection { background: rgba(246,159,0,.3); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }
[hidden] { display: none !important; }
.ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.ico-s { width: 14px; height: 14px; }
.num { font-variant-numeric: tabular-nums; }
kbd { font: 600 10.5px/1 Montserrat, sans-serif; color: var(--tinta-suave); border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--superficie); }

.a-dados { --c: var(--dados); --c-tinta: var(--dados-tinta); --c-fundo: var(--dados-fundo); --c-borda: var(--dados-borda); }
.a-fin { --c: var(--fin); --c-tinta: var(--fin-tinta); --c-fundo: var(--fin-fundo); --c-borda: var(--fin-borda); }
.a-obs { --c: var(--obs); --c-tinta: var(--obs-tinta); --c-fundo: var(--obs-fundo); --c-borda: var(--obs-borda); }
.a-perigo { --c: var(--perigo); --c-tinta: var(--perigo); --c-fundo: var(--perigo-fundo); --c-borda: var(--perigo-borda); }
.a-itens { --c: var(--itens); --c-tinta: var(--itens-tinta); --c-fundo: var(--itens-fundo); --c-borda: var(--itens-borda); }

/* abas do Financeiro: o traço laranja corre até a aba escolhida (DESIGN.md › Abas de filtro) */
.faixa { display: flex; align-items: flex-end; border-bottom: 1px solid var(--borda); margin: 0 0 22px; }
.abas { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.abas::-webkit-scrollbar { display: none; }
.aba { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 10px 2px; font-weight: 600; font-size: 13px; color: var(--tinta-suave); white-space: nowrap; border-radius: 6px 6px 0 0; transition: color .15s; }
.aba:hover { color: var(--tinta-corpo); }
.aba[aria-selected="true"] { color: var(--tinta); }
.aba .n { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; background: var(--realce); color: var(--tinta-suave); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; transition: background .15s, color .15s; }
.aba[aria-selected="true"] .n { background: var(--tinta); color: var(--superficie); }
.aba .n.alerta { background: var(--perigo-fundo); color: var(--perigo); }
.indicador { position: absolute; left: 0; bottom: 0; width: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--brand); transition: left .34s var(--saida), width .34s var(--saida); pointer-events: none; }

/* contas a receber */
/* Nos quadros de baixo, o valor de cada linha (e do ranking) vai no verde do
   Financeiro (DESIGN.md › Verde — pagamentos, totais, quitado). Os números do
   topo e a gaveta ficam como são. "body" na frente: as regras de base dessas
   peças vêm depois no arquivo. */
body .lin-dir .v, body .rank .v, body .prox b { color: var(--fin); }
/* cor da categoria de conta (CATEGORIAS_CONTA): a bolinha ao lado do nome,
   como a dos locais terceiros, e o ícone do seletor do modal */
.cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: var(--cat, var(--tinta-fraca)); flex-shrink: 0; }
.chip .cat-dot { margin-right: 1px; }
.chip[aria-pressed="true"] .cat-dot { box-shadow: 0 0 0 2px var(--superficie); }
.mc-cats button .ico { color: var(--cat, currentColor); }
.lin-sub .st { color: var(--tinta-corpo); font-weight: 600; }
.lin-sub .mudo, .itens-l .mudo { color: var(--tinta-suave); font-weight: 500; }
.selo.ok { background: var(--fin-fundo); color: var(--fin-tinta); }
.dprops dd .ib { width: 26px; height: 26px; }
/* campos do boleto: sem caixa até a mão chegar (DESIGN.md › campos sem caixa) */
.rot-campos { display: flex; align-items: center; gap: 6px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--borda-fraca); font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); }
.rot-campos .ico { width: 13px; height: 13px; }
.dprops.campos-bol { margin-top: 6px; }
.campo-in { width: 100%; max-width: 230px; height: 32px; padding: 0 8px; margin-left: -8px; border: 1px solid transparent; border-radius: 7px; background: transparent; font: inherit; font-weight: 600; color: var(--tinta); outline: none; transition: background .12s, border-color .12s, box-shadow .12s; }
.campo-in:hover { background: var(--realce); }
.campo-in:focus { background: var(--superficie); border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.campo-in::placeholder { color: var(--tinta-fraca); font-weight: 500; }
.campo-in.salvo, .prop.salvo { animation: salvo 1.4s var(--saida); }
@keyframes salvo { 0%, 50% { border-color: var(--fin); box-shadow: 0 0 0 3px var(--fin-fundo); } }
.campos-bol .pre { font-weight: 600; color: var(--tinta-suave); margin-right: 6px; }
.campos-bol .pre + .campo-in { margin-left: 0; max-width: 160px; }
/* dado copiável: o texto quebra à vontade e o botão fica no fim da linha */
.dprops dd.copiavel { flex-wrap: nowrap; align-items: flex-start; }
.dprops dd.copiavel span { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 6px; }
.dprops dd.copiavel .ib { color: var(--tinta-fraca); margin-top: 2px; }
.dprops dd.copiavel .ib:hover { color: var(--tinta); }
.dprops dd.copiavel.copiou .ib { color: var(--fin); }
.lin-dir small.boleto { color: var(--obs-tinta); font-weight: 600; }
.rank.clica li { cursor: pointer; border-radius: 0; transition: background .1s; }
.rank.clica li:hover { background: var(--sutil); }
.rank.clica li[aria-pressed="true"] { background: var(--realce); }
.rank .v small.n-os { margin-left: 0; display: block; font-size: 11.5px; text-align: right; }
/* composição do valor: recebido / em boleto / falta — uma barra só, sem barra por linha */
.compo { display: flex; height: 8px; border-radius: 5px; background: var(--realce); overflow: hidden; margin-top: 12px; gap: 2px; }
.compo i { height: 100%; }
.compo .rec { background: var(--fin); } .compo .bol { background: var(--obs); } .compo .falta { background: var(--perigo); opacity: .75; }
.compo-leg { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; color: var(--tinta-suave); }
.compo-leg span { display: inline-flex; align-items: center; gap: 6px; }
.compo-leg b { color: var(--tinta); font-weight: 600; font-variant-numeric: tabular-nums; }
.compo-leg i { width: 8px; height: 8px; border-radius: 2px; }
.itens-l { list-style: none; padding: 0; }
.itens-l li { padding: 7px 12px; border-top: 1px solid var(--borda-fraca); font-weight: 600; color: var(--tinta); }
.itens-l li:first-child { border-top: 0; }
/* esperando a resposta do banco: o desenho da tela, sem números */
.esq { display: block; border-radius: 6px; background: var(--realce); animation: piscar 1.2s ease-in-out infinite; }
@keyframes piscar { 50% { opacity: .5; } }
.erro-faixa { display: flex; gap: 10px; align-items: center; margin: 18px 0; padding: 10px 14px; border-radius: 10px; background: var(--perigo-fundo); border: 1px solid var(--perigo-borda); color: var(--perigo); font-weight: 600; font-size: 12.5px; }
.erro-faixa .btn { margin-left: auto; }
/* período: o mesmo seletor da tela de O.S. (baixa.html) — atalhos à esquerda,
   calendário de intervalo à direita. Cada escolha busca no banco. */
.per { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--borda); background: var(--superficie); font-weight: 600; font-size: 12.5px; color: var(--tinta-corpo); white-space: nowrap; transition: border-color .12s, color .12s; }
.per:hover { border-color: var(--borda-forte); color: var(--tinta); }
.per .chev { color: var(--tinta-fraca); }
.per.ativo { color: var(--tinta); border-color: var(--borda-forte); }
.per.ativo .ico:first-child { color: var(--brand-tinta); }
.per-nota { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 0 -4px; font-size: 12.5px; line-height: 1.4; color: var(--tinta-suave); }
.per-nota .ico { width: 14px; height: 14px; }
.per-nota b { color: var(--tinta-corpo); font-weight: 600; }
.per-nota.alerta { color: var(--perigo); } .per-nota.alerta b { color: var(--perigo); }
.pop { position: fixed; z-index: 90; min-width: 210px; max-width: calc(100vw - 16px); max-height: min(460px, calc(100vh - 16px)); overflow-y: auto; padding: 4px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 9px; box-shadow: var(--sombra-pop); animation: popEntra .16s var(--saida); }
@keyframes popEntra { from { opacity: 0; transform: translateY(-4px); } }
.pop button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--tinta-corpo); white-space: nowrap; }
.pop button:hover, .pop button:focus-visible { background: var(--realce); color: var(--tinta); outline: none; }
.pop .ok { margin-left: auto; color: var(--brand-tinta); }
.per-pop { display: flex; gap: 4px; --faixa: color-mix(in srgb, var(--brand) 15%, transparent); --faixa-previa: color-mix(in srgb, var(--brand) 8%, transparent); }
.atalhos { display: flex; flex-direction: column; gap: 1px; min-width: 156px; padding-right: 4px; border-right: 1px solid var(--borda-fraca); }
.pcal { width: 268px; padding: 4px 6px 2px 8px; }
.pop .pcal button { width: auto; padding: 0; gap: 0; justify-content: center; border-radius: 6px; font-size: 12.5px; color: var(--tinta-corpo); }
.pop .pcal button:hover { background: var(--realce); color: var(--tinta); }
.pcal-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.pop .pcal .pcal-nav { width: 30px; height: 30px; display: grid; place-items: center; color: var(--tinta-suave); }
.pop .pcal .pcal-tit { height: 30px; padding: 0 10px; font-weight: 700; font-size: 13px; color: var(--tinta); }
.pcal-sem, .pcal-dias { display: grid; grid-template-columns: repeat(7, 1fr); }
.pcal-sem span { height: 26px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--tinta-fraca); }
.pcal-dias { row-gap: 2px; }
.pop .pcal .pd { position: relative; height: 34px; display: grid; place-items: center; border-radius: 0; }
.pop .pcal .pd:hover { background: none; }
.pd b { position: relative; z-index: 1; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; font-weight: 500; font-variant-numeric: tabular-nums; transition: background .1s, color .1s; }
.pop .pcal .pd:hover b { background: var(--realce); color: var(--tinta); }
.pd.hoje b { font-weight: 700; color: var(--brand-tinta); box-shadow: inset 0 0 0 1px var(--borda-forte); }
.pd::before { position: absolute; top: 1px; bottom: 1px; left: 0; right: 0; background: var(--faixa); }
.pd.meio::before, .pd.com-fim::before, .pd.fim::before { content: ""; }
.pd.com-fim::before { left: 50%; }
.pd.fim::before { right: 50%; }
.pd.ini.fim::before { content: none; }
.pcal-dias > :nth-child(7n+1).meio::before { left: 2px; border-radius: 8px 0 0 8px; }
.pcal-dias > :nth-child(7n).meio::before { right: 2px; border-radius: 0 8px 8px 0; }
.pcal-dias > :nth-child(7n).com-fim::before, .pcal-dias > :nth-child(7n+1).fim::before { content: none; }
.pcal-dias.previa .pd::before { background: var(--faixa-previa); }
.pd.meio b { color: var(--brand-tinta); }
.pop .pcal .pd.meio:hover b { background: var(--faixa); }
.pd.ini b, .pd.fim b, .pop .pcal .pd.ini:hover b, .pop .pcal .pd.fim:hover b { background: var(--brand); color: var(--sobre-brand); font-weight: 700; box-shadow: none; }
.pcal-grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px 0 4px; }
.pop .pcal .pcal-op { height: 40px; font-weight: 600; text-transform: capitalize; }
.pop .pcal .pcal-op.on, .pop .pcal .pcal-op.on:hover { background: var(--brand); color: var(--sobre-brand); }
.pcal-pe { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; margin-top: 6px; padding: 6px 2px 0; border-top: 1px solid var(--borda-fraca); font-size: 12px; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.pcal-pe b { color: var(--tinta); font-weight: 700; }
.pop .pcal .pcal-limpar { padding: 4px 8px; font-weight: 600; color: var(--tinta-suave); }
@media (max-width: 520px) {
  .per-pop { flex-direction: column; }
  .atalhos { flex-direction: row; flex-wrap: wrap; gap: 4px; min-width: 0; padding: 4px 4px 8px; border-right: 0; border-bottom: 1px solid var(--borda-fraca); }
  .pop .atalhos button { width: auto; padding: 5px 10px; border: 1px solid var(--borda); border-radius: 99px; font-size: 12px; }
  .pop .atalhos .ok { display: none; }
  .pop .atalhos button.on { background: var(--tinta); border-color: var(--tinta); color: var(--superficie); }
  .pcal { width: 100%; padding: 6px 4px 2px; }
}
.esperando { opacity: .45; pointer-events: none; transition: opacity .2s; }
.em-breve { padding: 36px 20px; text-align: center; color: var(--tinta-suave); }
.em-breve b { display: block; font-size: 15px; color: var(--tinta); margin-bottom: 4px; }

/* moldura do protótipo */
.proto { position: sticky; top: 0; z-index: 40; height: 51px; display: flex; align-items: center; gap: 14px; padding: 8px 20px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.proto-nome { font-weight: 700; color: var(--tinta); white-space: nowrap; }
.proto-nota { color: var(--tinta-suave); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.proto-bt { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--tinta-corpo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 7px; white-space: nowrap; }
.proto-bt:hover { background: var(--realce); color: var(--tinta); }

/* botões */
.btn { height: 38px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, filter .15s; }
.btn-pri { background: var(--brand); color: var(--sobre-brand); }
.btn-pri:hover { background: var(--brand-hover); }
.btn-pri kbd { background: rgba(255,255,255,.35); border-color: rgba(36,22,0,.18); color: var(--sobre-brand); }
.btn-sec { border: 1px solid var(--borda-forte); color: var(--tinta); background: var(--superficie); }
.btn-sec:hover { background: var(--sutil); border-color: var(--tinta-fraca); }
.btn-txt { color: var(--tinta-suave); padding: 0 10px; }
.btn-txt:hover { color: var(--tinta); background: var(--realce); }
.btn-p { height: 34px; padding: 0 13px; font-size: 12.5px; border-radius: 7px; }
.btn-ok { background: var(--fin); color: #fff; } .btn-ok:hover { filter: brightness(.95); } .dark .btn-ok { color: var(--fundo); }
.btn-ok.conf { background: var(--perigo); color: #fff; }
.btn-sec.conf { background: var(--tinta); border-color: var(--tinta); color: var(--superficie); }
.ib { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--tinta-suave); transition: background .12s, color .12s; flex-shrink: 0; }
.ib:hover { background: var(--realce); color: var(--tinta); }

/* página */
.pg { max-width: 1280px; margin: 0 auto; padding: 26px 28px 64px; }
.cab { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.cab h1 { font-size: 22px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; line-height: 1.2; }
.cab .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: 7px; color: var(--tinta-suave); font-size: 12.5px; }
.cab-dir { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.selo { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; white-space: nowrap; background: var(--realce); color: var(--tinta-corpo); }
.selo .ico { width: 12px; height: 12px; }
.selo.atraso { background: var(--perigo-fundo); color: var(--perigo); }
.selo.hoje { background: var(--obs-fundo); color: var(--obs-tinta); }

/* navegador de mês: ‹ outubro de 2026 › */

/* busca grande + chips de categoria (DESIGN.md › telas de lista) */
.busca-linha { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.busca { position: relative; flex: 1 1 320px; max-width: 520px; }
.busca .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--tinta-suave); pointer-events: none; }
.busca input { width: 100%; height: 40px; border: 1px solid var(--borda); border-radius: 9px; background: var(--superficie); padding: 0 40px 0 36px; outline: none; transition: border-color .15s, box-shadow .15s; }
.busca input:hover { border-color: var(--borda-forte); }
.busca input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(246,159,0,.16); }
.busca kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--borda); background: var(--superficie); color: var(--tinta-corpo); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s, color .12s; }
.chip:hover { border-color: var(--borda-forte); }
.chip[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--superficie); }
.chip .ico { width: 13px; height: 13px; }

/* números do topo: rótulo, número e uma linha de texto; clicar leva ao grupo */
.numeros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; margin: 18px 0 20px; overflow: hidden; }
.n-cel { padding: 15px 18px 14px; border-left: 1px solid var(--borda-fraca); display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: background .12s; }
.n-cel:first-child { border-left: 0; }
a.n-cel:hover { background: var(--sutil); }
.n-topo { display: flex; align-items: center; gap: 10px; }
.n-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--c-fundo); color: var(--c); box-shadow: inset 0 0 0 1px var(--c-borda); flex-shrink: 0; }
.n-rot { font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.n-val { font-size: 30px; font-weight: 700; color: var(--tinta); letter-spacing: -.022em; line-height: 1.15; white-space: nowrap; }
.n-val small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-right: 3px; letter-spacing: 0; }
.n-val.alerta { color: var(--perigo); }
.n-ctx { font-size: 12px; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n-ctx b { color: var(--tinta-corpo); font-weight: 600; }
.medidor { display: flex; height: 6px; border-radius: 5px; background: var(--realce); overflow: hidden; }
.medidor i { height: 100%; background: var(--fin); border-radius: 5px; transition: width .5s var(--saida); }

/* grade: a lista à esquerda, o resumo do mês à direita */
.grade { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.area { background: var(--superficie); border: 1px solid var(--c-borda); border-radius: 10px; overflow: hidden; min-width: 0; scroll-margin-top: 70px; }
.area-cab { display: flex; align-items: center; gap: 10px; min-height: 47px; padding: 9px 14px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.area-ico { width: 26px; height: 26px; border-radius: 7px; background: var(--superficie); display: grid; place-items: center; color: var(--c); box-shadow: var(--sombra-leve); flex-shrink: 0; }
.area-cab h2 { font-size: 13.5px; font-weight: 700; color: var(--tinta); line-height: 1.3; }
.area-meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--c-tinta); white-space: nowrap; }

/* lista agrupada: o rótulo do grupo separa a urgência sem outro card */
.lista { list-style: none; padding: 0; }
.grupo-rot { display: flex; align-items: center; gap: 8px; padding: 10px 16px 5px; font-size: 11.5px; font-weight: 700; color: var(--tinta-suave); border-top: 1px solid var(--borda-fraca); scroll-margin-top: 70px; }
.lista > .grupo-rot:first-child { border-top: 0; }
.grupo-rot .ico { width: 13px; height: 13px; }
.grupo-rot .tot { margin-left: auto; font-weight: 700; }
.grupo-rot.atraso { color: var(--perigo); }
.grupo-rot.hoje { color: var(--obs-tinta); }
.grupo-rot.pagas { cursor: pointer; }
.grupo-rot.pagas:hover { color: var(--tinta); }
.grupo-rot.pagas .chev { transition: transform .2s var(--saida); }
.grupo-rot.pagas[aria-expanded="true"] .chev { transform: rotate(180deg); }
.grupo-rot.chegou { animation: chegou 1.1s var(--saida); }
@keyframes chegou { 0%, 35% { background: var(--realce); } }
.grupo-rot + li .lin { border-top: 0; }
.lin { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-top: 1px solid var(--borda-fraca); min-width: 0; cursor: pointer; transition: background .1s; }
.lin:hover { background: var(--sutil); }
/* Filete de prioridade (DESIGN.md › Selos de prazo): 3px por dentro da linha,
   vermelho para vencido ou vence hoje, âmbar para amanhã. */
.lin.pri-alta { box-shadow: inset 3px 0 0 var(--perigo); }
.lin.pri-media { box-shadow: inset 3px 0 0 var(--obs); }
.lin.aberta { background: var(--realce); }
.lin.paga { opacity: .62; }
.lin-txt { min-width: 0; flex: 1; }
.lin-tit { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--tinta); min-width: 0; }
.lin-tit span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin-tit .rep { color: var(--itens); flex-shrink: 0; }
.lin-sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.lin-sub .ico { width: 12px; height: 12px; }
.lin-dir { margin-left: auto; text-align: right; flex-shrink: 0; }
.lin-dir .v { font-weight: 700; color: var(--tinta); }
.lin-dir small { display: block; font-size: 11.5px; font-weight: 500; color: var(--tinta-suave); }
.lin-dir small.atraso { color: var(--perigo); font-weight: 600; }
.lin-dir small.hoje { color: var(--obs-tinta); font-weight: 600; }
.lin-dir small.ok { color: var(--sucesso); font-weight: 600; }
/* pagar sem abrir: aparece ao passar o mouse */
/* Ações da linha: o mesmo botão da nova Produção (.fl), sempre à mostra na
   ponta da linha. Concluir é verde; o primeiro clique vira a pergunta e o
   segundo confirma. Linha já paga/concluída guarda o lugar, sem o botão. */
.fls { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
.fl { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--tinta-fraca); transition: background .12s, color .12s; white-space: nowrap; }
.fl:hover { background: var(--realce); color: var(--tinta-corpo); }
.fl.concluir { color: var(--fin); }
.fl.concluir:hover { background: var(--fin-fundo); }
.fl-lugar { width: 30px; height: 30px; }
.fl.conf { width: auto; padding: 0 9px; background: var(--tinta); color: var(--superficie); font-size: 12px; font-weight: 700; }
.fl.conf:hover { background: var(--tinta); color: var(--superficie); }
.fl.concluir.conf { width: auto; padding: 0 9px; background: var(--fin); color: #fff; font-size: 12px; font-weight: 700; }
.dark .fl.concluir.conf { color: #04140d; }
.lin.paga .fl.concluir { visibility: hidden; }




.diaf { width: 40px; height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--borda); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; flex-shrink: 0; }
.diaf b { font-size: 13.5px; font-weight: 700; color: var(--tinta); }
.diaf span { font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); }
.diaf.atraso { background: var(--perigo-fundo); box-shadow: inset 0 0 0 1px var(--perigo-borda); }
.diaf.atraso b, .diaf.atraso span { color: var(--perigo); }
.diaf.hoje { background: var(--obs-fundo); box-shadow: inset 0 0 0 1px var(--obs-borda); }
.diaf.hoje b, .diaf.hoje span { color: var(--obs-tinta); }
.vazio { display: flex; align-items: center; gap: 10px; padding: 18px 16px; color: var(--tinta-suave); font-size: 12.5px; }
.vazio .ico { color: var(--sucesso); }
.dicas { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; color: var(--tinta-suave); font-size: 12px; }
.dicas span { display: inline-flex; gap: 5px; align-items: center; }

/* por categoria: posição, nome, valor e a parte; uma cor só, o comprimento é o dado */
.rank { list-style: none; padding: 6px 0; }
.rank li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 8px 16px; }
.rank .cat-ico { color: var(--tinta-suave); }
.rank .nome { min-width: 0; font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .v { font-weight: 600; color: var(--tinta); text-align: right; white-space: nowrap; }
.rank .v small { color: var(--tinta-suave); font-weight: 500; margin-left: 6px; }
.rank .trilho { grid-column: 2 / -1; height: 6px; border-radius: 5px; background: var(--realce); overflow: hidden; }
.rank .trilho i { display: block; height: 100%; border-radius: 5px; background: var(--c); }
.rank li:not(:first-child) .trilho i { opacity: .55; }
.prox { padding: 14px 16px; }
.prox b { display: block; font-size: 22px; font-weight: 700; color: var(--tinta); letter-spacing: -.02em; }
.prox span { font-size: 12px; color: var(--tinta-suave); }

/* gaveta (computador) / folha (celular), a mesma da nova Produção */
.gv-veu { position: fixed; inset: 51px 0 0 0; background: var(--veu); z-index: 60; animation: veuEntra .4s ease-out; }
.gaveta { position: fixed; top: 51px; right: 0; bottom: 0; width: min(460px, 100%); background: var(--fundo); border-left: 1px solid var(--borda); box-shadow: var(--sombra); z-index: 61; overflow-y: auto; animation: gavetaEntra .46s cubic-bezier(.22,1,.36,1); }
.gv-veu.sai { animation: veuSai .3s ease-in forwards; pointer-events: none; }
.gaveta.sai { animation: gavetaSai .3s cubic-bezier(.55,0,1,.45) forwards; pointer-events: none; }
@keyframes gavetaEntra { from { transform: translateX(100%); } }
@keyframes gavetaSai { to { transform: translateX(100%); } }
@keyframes veuEntra { from { opacity: 0; } }
@keyframes veuSai { to { opacity: 0; } }
.det { padding: 0 22px 40px; }
.det-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: 0 -22px; padding: 12px 22px; background: var(--fundo); color: var(--tinta-suave); font-size: 13px; font-weight: 600; transition: box-shadow .2s; }
.gaveta.rolou .det-cab { box-shadow: 0 1px 0 var(--borda); }
.det-ferr { margin-left: auto; display: flex; gap: 2px; }
.det-tit { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); line-height: 1.25; margin-top: 2px; }
.det-valor { font-size: 30px; font-weight: 700; letter-spacing: -.022em; color: var(--tinta); margin-top: 10px; }
.det-valor small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-right: 4px; letter-spacing: 0; }
.dprops { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; row-gap: 2px; margin-top: 16px; }
.dprops dt { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 7px; align-items: center; min-height: 32px; }
.dprops dd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-weight: 600; color: var(--tinta); }
.dprops .mudo { color: var(--tinta-suave); font-weight: 500; }
.dprops .atraso { color: var(--perigo); } .dprops .hoje { color: var(--obs-tinta); } .dprops .ok { color: var(--sucesso); }
.det-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.det-acoes .esp { flex: 1; }
.det-nota { font-size: 12px; color: var(--tinta-suave); margin-top: 12px; }
.dsec { border: 1px solid var(--c-borda); border-radius: 10px; background: var(--superficie); margin-top: 20px; overflow: hidden; }
.dsec-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.dsec-cab h3 { font-size: 13px; font-weight: 700; color: var(--tinta); }
.hist li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--borda-fraca); font-variant-numeric: tabular-nums; }
.hist li:first-child { border-top: 0; }
.hist .q { color: var(--tinta-corpo); }
.hist .v { font-weight: 600; color: var(--tinta); }
.hist .v small { font-weight: 500; color: var(--tinta-suave); margin-left: 6px; }

/* ============ modal de conta (novo) ============
   Janela 12px; categoria num seletor no topo; descrição (ou fornecedor) como
   título editável; valor grande; o resto são propriedades editáveis no lugar,
   com popover — nenhum campo em caixa (DESIGN.md › campos sem caixa). */
.mc-veu { position: fixed; inset: 0; z-index: 70; background: var(--veu); animation: veuEntra .3s ease-out; }
.mc { position: fixed; z-index: 71; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(600px, calc(100% - 32px));
  /* Altura FIXA: abrir calendário, aparecer erro ou nota não mexe no tamanho da
     janela. Cabe o caso mais cheio sem rolar; só numa tela muito baixa o corpo
     rola, e aí o espaço da barra já está reservado (nada pula de lado). */
  height: min(560px, calc(100dvh - 32px)); display: flex; flex-direction: column; background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; box-shadow: var(--sombra); animation: mcEntra .32s var(--saida); }
@keyframes mcEntra { from { opacity: 0; transform: translate(-50%, calc(-50% + 10px)) scale(.985); } }
.mc-cab { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 22px; height: 54px; border-bottom: 1px solid var(--borda); flex-shrink: 0; }
.mc-cab h2 { font-size: 14px; font-weight: 700; color: var(--tinta); }
.mc-cab .ib { margin-left: auto; }
.mc-corpo { flex: 1; min-height: 0; padding: 18px 22px 22px; overflow-y: auto; scrollbar-gutter: stable; }
/* categoria: um seletor de cinco, com o ícone de cada uma */
.mc-cats { display: flex; gap: 2px; padding: 3px; background: var(--realce); border-radius: 9px; overflow-x: auto; scrollbar-width: none; }
.mc-cats button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--tinta-suave); white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s; }
.mc-cats button:hover { color: var(--tinta); }
.mc-cats button[aria-checked="true"] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-leve); }
.mc-cats .ico { width: 14px; height: 14px; }
.mc-rot { display: block; font-size: 11.5px; font-weight: 600; color: var(--tinta-suave); margin: 18px 0 2px; }
.mc-campo { position: relative; }
.mc-grande { width: 100%; border: 0; background: transparent; outline: none; padding: 4px 0 6px; font-size: 22px; font-weight: 700; color: var(--tinta); letter-spacing: -.018em; line-height: 1.25; box-shadow: inset 0 -2px 0 transparent; transition: box-shadow .15s; }
.mc-grande::placeholder { color: var(--tinta-fraca); font-weight: 600; }
.mc-grande:hover { box-shadow: inset 0 -2px 0 var(--borda); }
.mc-grande:focus { box-shadow: inset 0 -2px 0 var(--brand); }
.mc-grande.erro { box-shadow: inset 0 -2px 0 var(--perigo); }
.mc-campo .chev { position: absolute; right: 0; top: 12px; color: var(--tinta-suave); pointer-events: none; }
/* erro e aviso moram na linha do rótulo: não acrescentam linha nem empurram nada */
.mc-rot .mc-erro-i { color: var(--perigo); font-weight: 600; }
.mc-rot .mc-aviso-i { color: var(--obs-tinta); font-weight: 600; }
.mc-valor { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
.mc-valor small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); }
.mc-valor input { width: 100%; border: 0; background: transparent; outline: none; font-size: 30px; font-weight: 700; color: var(--tinta); letter-spacing: -.022em; font-variant-numeric: tabular-nums; padding: 2px 0 4px; box-shadow: inset 0 -2px 0 transparent; transition: box-shadow .15s; }
.mc-valor input::placeholder { color: var(--tinta-fraca); }
.mc-valor input:hover { box-shadow: inset 0 -2px 0 var(--borda); }
.mc-valor input:focus { box-shadow: inset 0 -2px 0 var(--brand); }
.mc-valor input.erro { box-shadow: inset 0 -2px 0 var(--perigo); }
.mc-ultima { font-size: 12px; color: var(--tinta-suave); margin-top: 4px; min-height: 18px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mc-ultima b { color: var(--tinta-corpo); font-weight: 600; }
.mc-link { color: var(--brand-tinta); font-weight: 600; border-radius: 5px; }
.mc-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.mc .dprops { margin-top: 14px; border-top: 1px solid var(--borda-fraca); padding-top: 8px; }
.prop { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 8px; margin-left: -8px; border-radius: 7px; font-weight: 600; color: var(--tinta); transition: background .12s; }
.prop:hover, .prop[aria-expanded="true"] { background: var(--realce); }
.prop .mudo { font-weight: 500; color: var(--tinta-suave); }
.prop .atraso { color: var(--perigo); }
.prop .vazio-p { color: var(--tinta-suave); font-weight: 500; }
.chave { position: relative; width: 30px; height: 18px; border-radius: 99px; background: var(--borda-forte); transition: background .18s; flex-shrink: 0; }
.chave::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 99px; background: #fff; box-shadow: var(--sombra-leve); transition: transform .2s var(--saida); }
[aria-checked="true"] > .chave { background: var(--fin); }
[aria-checked="true"] > .chave::after { transform: translateX(12px); }
.seg-mini { display: inline-flex; gap: 2px; padding: 3px; background: var(--realce); border-radius: 8px; }
.seg-mini button { padding: 4px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--tinta-suave); white-space: nowrap; }
.seg-mini button[aria-checked="true"] { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-leve); }
.passo { display: inline-flex; align-items: center; gap: 2px; margin-left: 8px; }
.passo .ib { width: 26px; height: 26px; }
.passo b { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
.passo span { color: var(--tinta-suave); font-weight: 500; font-size: 12.5px; margin-left: 2px; }
.mc-nota { font-size: 12px; color: var(--tinta-suave); margin-top: 8px; min-height: 36px; }   /* espaço reservado: aparecer não empurra nada */
.mc-pe { display: flex; align-items: center; gap: 8px; padding: 12px 14px 12px 22px; border-top: 1px solid var(--borda); flex-shrink: 0; flex-wrap: wrap; }
.mc-pe .esp { flex: 1; }
.mc-proto { font-size: 12px; color: var(--tinta-suave); display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
/* listas suspensas do modal: sugestões, fornecedores, vencimento */
/* listas e calendário flutuam por cima da janela, fora do corpo que rola */
.mc-flutua { position: fixed; z-index: 75; }
.mc-lista { max-height: 260px; overflow-y: auto; padding: 4px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 9px; box-shadow: var(--sombra-pop); }
.mc-lista button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border-radius: 7px; text-align: left; font-size: 13px; color: var(--tinta-corpo); }
.mc-lista button:hover, .mc-lista button.ativo { background: var(--realce); color: var(--tinta); }
.mc-lista .sub { margin-left: auto; font-size: 12px; color: var(--tinta-suave); white-space: nowrap; padding-left: 12px; }
.mc-lista .rot-l { font-size: 11px; font-weight: 600; color: var(--tinta-suave); padding: 6px 10px 2px; }
.cal { width: 300px; max-width: calc(100vw - 16px); padding: 10px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 9px; box-shadow: var(--sombra-pop); }
.cal-atalhos { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--borda-fraca); }
.cal-atalhos button { padding: 4px 9px; border-radius: 7px; border: 1px solid var(--borda); font-size: 12px; font-weight: 600; color: var(--tinta-corpo); }
.cal-atalhos button:hover { border-color: var(--borda-forte); color: var(--tinta); }
.cal-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-cab b { font-size: 13px; color: var(--tinta); }
.cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-grade .sem { font-size: 11px; font-weight: 600; color: var(--tinta-suave); padding: 4px 0; }
.cal-grade button { height: 32px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--tinta-corpo); font-variant-numeric: tabular-nums; }
.cal-grade button:hover { background: var(--realce); color: var(--tinta); }
.cal-grade button.fora { color: var(--tinta-fraca); font-weight: 500; }
.cal-grade button.hoje { box-shadow: inset 0 0 0 1px var(--brand); }
.cal-grade button.sel { background: var(--brand); color: var(--sobre-brand); }
/* O mesmo calendário num popover (datas do boleto): sem moldura dupla e sem o
   jeito de lista que o .pop dá aos botões. */
.pop.pop-cal { padding: 0; overflow: visible; max-height: none; }
.pop-cal .cal { border: 0; box-shadow: none; background: none; }
.pop-cal .cal button { width: auto; gap: 0; padding: 0; justify-content: center; }
.pop-cal .cal button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.pop-cal .cal-atalhos { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.pop-cal .cal-atalhos button { flex-direction: column; gap: 1px; padding: 5px 4px; line-height: 1.2; }
.pop-cal .cal-cab .ib { width: 30px; height: 30px; display: grid; place-items: center; color: var(--tinta-suave); }
.pop-cal .cal-grade button { width: 100%; }
.pop-cal .cal-grade button.sel:hover { background: var(--brand); color: var(--sobre-brand); }
.cal-atalhos small { font-size: 11.5px; font-weight: 500; color: var(--tinta-suave); }
.cal-atalhos button.sel { border-color: var(--brand); color: var(--tinta); }
.cal-pe { display: flex; align-items: center; gap: 8px; min-height: 26px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--borda-fraca); font-size: 12px; color: var(--tinta-suave); }
.pop-cal .cal-pe button { margin-left: auto; padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.lin.chegou { animation: linChegou 1.6s var(--saida); }
@keyframes linChegou { 0%, 40% { background: var(--fin-fundo); } }
@media (max-width: 760px) {
  .mc { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100%; height: 92dvh; border-radius: 12px 12px 0 0; animation-name: folhaEntra; }
  .mc-cab { padding-left: 16px; }
  .mc-corpo { padding: 14px 16px 18px; }
  .mc-cats button { flex: 0 0 auto; }
  .mc-pe { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .mc-pe .btn { height: 44px; }
  .mc-pe .btn-pri { flex: 1; }
  .mc-pe .btn-pri kbd, .mc-proto .txt { display: none; }
}
.aviso-proto { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 96; background: var(--tinta); color: var(--superficie); padding: 9px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; box-shadow: var(--sombra-pop); animation: pop .2s var(--saida); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 4px); } }

@media (max-width: 1100px) { .grade { grid-template-columns: minmax(0, 1fr) 280px; } }
@media (max-width: 960px) {
  .grade { grid-template-columns: 1fr; }
  .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .n-cel:nth-child(3) { border-left: 0; }
  .n-cel:nth-child(n+3) { border-top: 1px solid var(--borda-fraca); }
}
@media (max-width: 760px) {
  .proto { padding: 8px 12px; }
  .proto-nota, .proto-bt .txt { display: none; }
  .pg { padding: 18px 12px 48px; }
  .cab-dir { margin-left: 0; width: 100%; justify-content: space-between; }
  .cab-dir .btn-pri kbd { display: none; }
  .busca { max-width: none; flex-basis: 100%; }
  .busca kbd { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
  .n-cel { padding: 13px 14px; }
  .n-val { font-size: 22px; }
  .lin { padding: 10px 14px; gap: 10px; }

  .dicas { display: none; }
  .gv-veu { inset: 0; }
  .gaveta { top: auto; height: 88dvh; width: 100%; border-left: 0; border-radius: 12px 12px 0 0; animation-name: folhaEntra; }
  .gaveta.sai { animation-name: folhaSai; }
  .det { padding: 0 14px 40px; }
  .det-cab { margin: 0 -14px; padding: 8px 6px 8px 14px; }
}
@keyframes folhaEntra { from { transform: translateY(100%); } }
@keyframes folhaSai { to { transform: translateY(100%); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
html[data-troca-tema]::view-transition-old(root), html[data-troca-tema]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html[data-troca-tema].dark::view-transition-new(root), html[data-troca-tema]:not(.dark)::view-transition-old(root) { z-index: 1; }
html[data-troca-tema] *, html[data-troca-tema] *::before, html[data-troca-tema] *::after { transition: none !important; }
</style>
</head>
<body>
<div class="proto">
  <span class="proto-nome">Financeiro · protótipo</span>
  <span class="proto-nota">Dados reais · os dados e o “pago” do boleto gravam de verdade, como na tela de hoje; o resto não grava (“Abrir O.S.” e “Abrir no modal atual” levam para as telas de hoje)</span>
  <button class="proto-bt" id="tema"><i data-lucide="moon" class="ico ico-s"></i><span class="txt">Escuro</span></button>
</div>
<main class="pg"><div id="abas"></div><div id="tela"></div></main>

<script>
/*FINANCEIRO*/

/* ===== base ===== */
const ico = (n, c = 'ico') => `<i data-lucide="${n}" class="${c}"></i>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HOJE = DADOS.hoje;
const dataLocal = iso => { const [a, m, d] = iso.slice(0, 10).split('-').map(Number); return new Date(a, m - 1, d); };
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const somarDias = (iso, n) => { const d = dataLocal(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const diasEntre = (de, ate) => Math.round((dataLocal(ate) - dataLocal(de)) / 864e5);
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const ddmm = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const brl = c => (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const reais = c => `R$ ${brl(c)}`;
// No número grande, acima de mil o centavo só atrapalha; o exato fica no title.
const curto = c => Math.abs(c) >= 100000 ? Math.round(c / 100).toLocaleString('pt-BR') : brl(c);
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const CATEG = DADOS.categorias;
const cat = c => CATEG[c.categoria] || { label: c.categoria || 'Despesa', icone: 'dollar-sign' };
// A bolinha na cor da categoria (a cor vem do sistema, CATEGORIAS_CONTA).
const catDot = k => `<span class="cat-dot" style="--cat:${(CATEG[k] || CATEG.Despesa || {}).cor || '#9ca3af'}"></span>`;
const mesDe = iso => (iso || '').slice(0, 7);
const rotuloMes = m => { if (!m) return 'Todo o período'; const [a, mm] = m.split('-').map(Number); return `${MESES[mm - 1]} de ${a}`; };
const somarMes = (m, n) => { const [a, mm] = m.split('-').map(Number); const d = new Date(a, mm - 1 + n, 1); return isoDe(d).slice(0, 7); };
// Pedir algo à página (abrir O.S., editar conta) abre um modal lá fora: o foco
// sai daqui junto, senão o Esc e o teclado ficam presos atrás do modal.
const paraPai = msg => { if (window.parent !== window) { document.activeElement?.blur(); window.parent.postMessage(msg, '/'); } };
const avisoProto = txt => { document.querySelector('.aviso-proto')?.remove(); const t = document.createElement('div'); t.className = 'aviso-proto'; t.textContent = txt; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
const CONTAS = DADOS.contas;

/* ===== estado ===== */
// A aba fica guardada na sessão: gravar uma conta lá fora redesenha o protótipo
// inteiro, e ele não pode voltar sempre para a primeira aba.
const lerSessao = (k, padrao) => { try { return sessionStorage.getItem(k) || padrao; } catch { return padrao; } };
const gravarSessao = (k, v) => { try { sessionStorage.setItem(k, v); } catch { /* sem armazenamento: só não lembra */ } };
// O período de Contas a pagar nasce em "Este mês", logo depois dos PERIODOS.
const est = { aba: lerSessao('fin-aba', 'receber'), periodo: null, busca: '', categoria: '', verPagas: false, gaveta: null, conf: null };

/* ===== situação de uma conta ===== */
const paga = c => c.status === 'Pago';
const vencida = c => !paga(c) && c.vencimento && c.vencimento < HOJE;
// O padrão do sistema para vencimento (o mesmo do campo de prazo de hoje):
// vencido ou vencendo HOJE é vermelho; vence AMANHÃ é âmbar; o resto, neutro.
// As classes: "atraso" pinta de vermelho, "hoje" pinta de âmbar.
const tomVence = iso => !iso ? '' : iso <= HOJE ? 'atraso' : iso === somarDias(HOJE, 1) ? 'hoje' : '';
// O filete no canto esquerdo da linha segue o mesmo tom.
const priDe = tom => tom === 'atraso' ? 'pri-alta' : tom === 'hoje' ? 'pri-media' : '';
function quando(c) {
  if (paga(c)) return '<small class="ok">paga</small>';
  if (!c.vencimento) return '<small>sem vencimento</small>';
  const d = diasEntre(HOJE, c.vencimento);
  if (d < 0) return `<small class="atraso">venceu há ${plural(-d, 'dia', 'dias')}</small>`;
  if (d === 0) return '<small class="atraso">vence hoje</small>';
  if (d === 1) return '<small class="hoje">vence amanhã</small>';
  return `<small>em ${d} dias</small>`;
}
function dataEmBloco(c) {
  if (!c.vencimento) return '<span class="diaf"><span>sem</span><span>data</span></span>';
  const d = dataLocal(c.vencimento), longe = Math.abs(diasEntre(HOJE, c.vencimento)) > 6;
  const tom = paga(c) ? '' : tomVence(c.vencimento);
  return `<span class="diaf ${tom}" title="${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}"><b class="num">${String(d.getDate()).padStart(2, '0')}</b><span>${MESES[d.getMonth()].slice(0, 3)}</span></span>`;
}
const repete = c => c.recorrente ? (c.parcelas ? `parcela ${c.parcela || 1} de ${c.parcelas}` : 'todo mês') : '';

/* ===== filtros ===== */
// Contas a pagar já está toda na memória: o período (pelo vencimento) só filtra
// a tela, sem consulta. Sem vencimento, a conta só aparece em "Todo o período".
function doPeriodo() {
  const { de, ate } = est.periodo;
  return CONTAS.filter(c => !comPeriodo(est.periodo) || (c.vencimento && (!de || c.vencimento >= de) && (!ate || c.vencimento <= ate)));
}
// As vencidas de antes do período não somem: o topo conta e uma linha avisa.
const vencidasAntes = () => est.periodo.de ? CONTAS.filter(c => vencida(c) && c.vencimento < est.periodo.de).length : 0;
function filtradas() {
  const q = semAcento(est.busca.trim());
  return doPeriodo().filter(c => (!est.categoria || (c.categoria || 'Despesa') === est.categoria)
    && (!q || semAcento(c.descricao).includes(q) || semAcento(c.fornecedor).includes(q) || semAcento(cat(c).label).includes(q)));
}

/* ===== peças ===== */
const soma = l => l.reduce((s, c) => s + (c.valor || 0), 0);
function linha(c) {
  const conf = est.conf === c.id;
  // Nas categorias com fornecedor a descrição já é o nome dele: não repetir.
  const fornDiferente = c.fornecedor && semAcento(c.fornecedor).trim() !== semAcento(c.descricao).trim();
  const sub = [`${catDot(c.categoria || 'Despesa')}${esc(cat(c).label)}`, fornDiferente ? esc(c.fornecedor) : '', repete(c)].filter(Boolean).join(' · ');
  return `<li><div class="lin ${paga(c) ? 'paga' : priDe(tomVence(c.vencimento))} ${est.gaveta === c.id ? 'aberta' : ''}" data-conta="${c.id}" tabindex="0" role="button" aria-label="${esc(c.descricao)}, ${reais(c.valor)}">
    ${dataEmBloco(c)}
    <span class="lin-txt"><span class="lin-tit"><span>${esc(c.descricao)}</span>${c.recorrente ? `<i data-lucide="repeat" class="ico ico-s rep" title="Repete"></i>` : ''}</span><span class="lin-sub">${sub}</span></span>
    <span class="lin-dir"><span class="v num">${c.valor ? reais(c.valor) : '<small>a definir</small>'}</span>${quando(c)}</span>
    <span class="fls"><button class="fl concluir ${conf ? 'conf' : ''}" data-pagar="${c.id}" aria-label="Marcar como paga" title="${conf ? 'Clique de novo para confirmar' : 'Marcar como paga'}">${conf ? 'Pagar?' : ico('check-circle-2', 'ico')}</button></span>
  </div></li>`;
}

function grupos(lista) {
  const fim7 = somarDias(HOJE, 7), amanha = somarDias(HOJE, 1);
  const abertas = lista.filter(c => !paga(c)).sort((a, b) => (a.vencimento || '9').localeCompare(b.vencimento || '9') || b.valor - a.valor);
  return [
    { id: 'g-vencidas', tom: 'atraso', icone: 'alert-triangle', rot: 'Vencidas', itens: abertas.filter(vencida) },
    { id: 'g-hoje', tom: 'atraso', icone: 'clock', rot: 'Vencem hoje', itens: abertas.filter(c => c.vencimento === HOJE) },
    { id: 'g-amanha', tom: 'hoje', icone: 'calendar', rot: 'Amanhã', itens: abertas.filter(c => c.vencimento === amanha) },
    { id: 'g-semana', icone: 'calendar-range', rot: 'Próximos 7 dias', itens: abertas.filter(c => c.vencimento > amanha && c.vencimento <= fim7) },
    { id: 'g-depois', icone: 'calendar-days', rot: mesDoPeriodo(est.periodo) ? 'Mais tarde no mês' : 'Mais à frente', itens: abertas.filter(c => !c.vencimento || c.vencimento > fim7) },
  ].filter(g => g.itens.length);
}

function blocoLista() {
  const lista = filtradas();
  const pagas = lista.filter(paga).sort((a, b) => (b.vencimento || '').localeCompare(a.vencimento || ''));
  const gs = grupos(lista);
  const filtro = est.busca || est.categoria;
  const mes = mesDoPeriodo(est.periodo), comP = comPeriodo(est.periodo);
  let corpo = '';
  if (!lista.length) corpo = `<div class="vazio">${ico('search')}${filtro ? 'Nenhuma conta com esse filtro.' : mes ? `Nenhuma conta em ${rotuloMes(mes)}.` : comP ? 'Nenhuma conta no período.' : 'Nenhuma conta lançada.'}</div>`;
  else {
    corpo = `<ul class="lista">${gs.map(g => `<li class="grupo-rot ${g.tom || ''}" id="${g.id}">${ico(g.icone)}${g.rot}<span class="tot num">${plural(g.itens.length, 'conta', 'contas')} · ${reais(soma(g.itens))}</span></li>${g.itens.map(linha).join('')}`).join('')}
      ${!gs.length && pagas.length ? `<li><div class="vazio">${ico('check-circle-2')}Tudo pago${mes ? ' neste mês' : comP ? ' no período' : ''}.</div></li>` : ''}
      ${pagas.length ? `<li class="grupo-rot pagas" id="g-pagas" data-pagas aria-expanded="${est.verPagas}">${ico('check-circle-2')}Pagas${est.verPagas ? '' : ' · clique para ver'}<span class="tot num">${plural(pagas.length, 'conta', 'contas')} · ${reais(soma(pagas))}</span>${ico('chevron-down', 'ico ico-s chev')}</li>${est.verPagas ? pagas.map(linha).join('') : ''}` : ''}
      </ul>`;
  }
  const titulo = mes ? `Contas de ${rotuloMes(mes).replace(/ de \d+$/, '')}` : comP ? 'Contas no período' : 'Todas as contas';
  return `<section class="area a-dados" id="bloco-lista"><div class="area-cab"><span class="area-ico">${ico('receipt')}</span><h2>${titulo}</h2><span class="area-meta num">${plural(lista.length, 'conta', 'contas')}</span></div>${corpo}</section>
    <div class="dicas"><span><kbd>/</kbd> buscar</span><span><kbd>N</kbd> nova conta</span><span>clique na conta para ver tudo</span></div>`;
}

function blocoNumeros() {
  const l = filtradas();
  const venc = l.filter(vencida), aVencer = l.filter(c => !paga(c) && !vencida(c)), pagas = l.filter(paga);
  const total = soma(l), pago = soma(pagas), pct = total ? Math.round(pago / total * 100) : 0;
  const maisAntiga = venc.length ? Math.max(...venc.map(c => diasEntre(c.vencimento, HOJE))) : 0;
  const prox7 = aVencer.filter(c => c.vencimento && c.vencimento <= somarDias(HOJE, 7));
  const cel = (alvo, area, icone, rot, valor, ctx, alerta, extra = '') => `<a class="n-cel a-${area}" href="#${alvo}" data-rolar="${alvo}" title="${reais(valor)}">
    <span class="n-topo"><span class="n-ico">${ico(icone)}</span><span class="n-rot">${rot}</span></span>
    <span class="n-val num ${alerta ? 'alerta' : ''}"><small>R$</small>${curto(valor)}</span>${extra}<span class="n-ctx">${ctx}</span></a>`;
  return `<div class="numeros">
    ${cel('g-vencidas', venc.length ? 'perigo' : 'dados', 'alert-triangle', 'Vencidas', soma(venc), venc.length ? `${plural(venc.length, 'conta', 'contas')} · a mais antiga há <b>${plural(maisAntiga, 'dia', 'dias')}</b>` : 'nenhuma atrasada', venc.length > 0)}
    ${cel(prox7.length ? 'g-hoje' : 'g-depois', 'obs', 'calendar-clock', 'A vencer', soma(aVencer), aVencer.length ? `${plural(aVencer.length, 'conta', 'contas')}${prox7.length ? ` · <b>${reais(soma(prox7))}</b> em 7 dias` : ''}` : 'nada a vencer')}
    ${cel('g-pagas', 'fin', 'check-circle-2', 'Pago', pago, pagas.length ? `${plural(pagas.length, 'conta', 'contas')} · <b>${pct}%</b> do total` : 'nada pago ainda', false, `<span class="medidor" aria-hidden="true"><i style="width:${pct}%"></i></span>`)}
    ${cel('bloco-lista', 'dados', 'sigma', mesDoPeriodo(est.periodo) ? 'Total do mês' : 'Total', total, plural(l.length, 'conta', 'contas'))}
  </div>`;
}

function blocoCategorias() {
  const l = filtradas(), total = soma(l);
  const porCat = Object.entries(l.reduce((o, c) => { const k = c.categoria || 'Despesa'; o[k] = (o[k] || 0) + (c.valor || 0); return o; }, {})).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...porCat.map(x => x[1]));
  const corpo = porCat.length ? `<ul class="rank">${porCat.map(([k, v]) => `<li><span class="cat-ico">${catDot(k)}</span><span class="nome">${esc(CATEG[k]?.label || k)}</span><span class="v num">${reais(v)}<small>${total ? Math.round(v / total * 100) : 0}%</small></span><span class="trilho"><i style="width:${Math.max(2, v / max * 100)}%;background:${CATEG[k]?.cor || 'var(--c)'};opacity:1"></i></span></li>`).join('')}</ul>` : '<div class="vazio">Nada no período.</div>';
  return `<section class="area a-dados"><div class="area-cab"><span class="area-ico">${ico('pie-chart')}</span><h2>Por categoria</h2></div>${corpo}</section>`;
}
function blocoProximo() {
  const mes = mesDoPeriodo(est.periodo);
  if (!mes) return '';
  const prox = somarMes(mes, 1), l = CONTAS.filter(c => mesDe(c.vencimento) === prox);
  return `<section class="area a-dados"><div class="area-cab"><span class="area-ico">${ico('calendar-plus')}</span><h2>Já lançado para ${rotuloMes(prox).replace(/ de \d+$/, '')}</h2></div>
    <div class="prox">${l.length ? `<b class="num">${reais(soma(l))}</b><span>${plural(l.length, 'conta', 'contas')}${l.some(c => c.recorrente) ? ` · ${l.filter(c => c.recorrente).length} que repetem` : ''}</span>` : '<span>Nada lançado ainda. As que repetem entram quando a deste mês é paga.</span>'}</div></section>`;
}

/* ===== tela ===== */
const tela = document.getElementById('tela');
const abasEl = document.getElementById('abas');

/* ===== abas ===== */
// Cada parte do Financeiro é um módulo com o seu desenho; render() desenha a
// aba aberta. Receber e Boletos vêm do banco, pedidos quando a aba abre.
const ABAS = [
  ['pagar', 'Contas a pagar', 'receipt'],
  ['receber', 'Contas a receber', 'hand-coins'],
  ['boletos', 'Boletos', 'barcode'],
  ['faturamento', 'Faturamento', 'building-2'],
  ['notas', 'Notas fiscais', 'file-text'],
];
const MODULOS = {};
function numeroDaAba(id) {
  if (id === 'pagar') { const v = CONTAS.filter(vencida).length; return v ? [v, true, plural(v, 'conta vencida', 'contas vencidas')] : null; }
  return MODULOS[id]?.numero?.() || null;
}
let indicadorAnt = null;
function renderAbas() {
  abasEl.innerHTML = `<div class="faixa"><div class="abas" role="tablist" aria-label="Partes do Financeiro">${ABAS.map(([id, rot, ic]) => {
    const n = numeroDaAba(id);
    return `<button class="aba" role="tab" data-aba="${id}" aria-selected="${est.aba === id}">${ico(ic, 'ico ico-s')}${rot}${n ? `<span class="n num ${n[1] ? 'alerta' : ''}" title="${esc(n[2] || '')}">${n[0]}</span>` : ''}</button>`;
  }).join('')}<span class="indicador"></span></div></div>`;

function trocarTema(escuro, origem, aplicar) {
  const raiz = document.documentElement;
  const trocar = () => { raiz.classList.toggle('dark', escuro); aplicar?.(); };
  if (!document.startViewTransition) return trocar();
  const r = origem?.getBoundingClientRect();
  const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top + r.height / 2 : innerHeight / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(trocar);
  let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate(reduzido ? { opacity: escuro ? [0, 1] : [1, 0] } : { clipPath: escuro ? circulo : circulo.reverse() }, {
      duration: reduzido ? 200 : escuro ? 600 : 450, easing: reduzido ? 'ease' : escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)',
      fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)',
    });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}

// Ranking com barra: uma cor só, o comprimento é o dado. Clicar filtra.
function ranking(itens, attr, atual) {
  itens = itens.filter(x => x.v > 0);
  if (!itens.length) return '<div class="vazio">Nada aqui.</div>';
  const max = Math.max(1, ...itens.map(x => x.v));
  return `<ul class="rank clica">${itens.map((x, i) => `<li data-${attr}="${esc(x.k)}" aria-pressed="${atual === x.k}" tabindex="0" role="button"><span class="cat-ico num" style="font-size:11.5px;font-weight:700">${i + 1}</span><span class="nome" title="${esc(x.nome)}">${esc(x.nome)}</span><span class="v num">${reais(x.v)}<small class="n-os">${x.sub}</small></span><span class="trilho"><i style="width:${Math.max(2, x.v / max * 100)}%"></i></span></li>`).join('')}</ul>`;
}

  { id: 'mespassado', nome: 'Mês passado', de: () => somarMes(HOJE.slice(0, 7), -1) + '-01', ate: () => ultimoDia(somarMes(HOJE.slice(0, 7), -1) + '-01') },
  { id: '30', nome: 'Últimos 30 dias', de: () => somarDias(HOJE, -29), ate: () => HOJE },

const periodoDoMes = mes => { const de = mes + '-01', ate = ultimoDia(de), x = PERIODOS.find(p => p.id && p.de() === de && p.ate() === ate); return { id: x ? x.id : 'livre', de, ate }; };

// Setas desenhadas aqui: o calendário se redesenha a cada dia sob o mouse, e
// chamar o lucide toda vez varreria a página inteira.
const seta = d => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const SETA_E = seta('m15 18-6-6 6-6'), SETA_D = seta('m9 18 6-6-6-6');
const SEM_CAL = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
function calPeriodo(c, p) {
  const y = c.base.getFullYear(), m = c.base.getMonth();
  const cab = (passo, titulo, vista) => `<div class="pcal-cab"><button class="pcal-nav" data-nav="${-passo}" aria-label="Anterior">${SETA_E}</button>${vista ? `<button class="pcal-tit" data-vista="${vista}">${titulo}</button>` : `<span class="pcal-tit">${titulo}</span>`}<button class="pcal-nav" data-nav="${passo}" aria-label="Próximo">${SETA_D}</button></div>`;
  if (c.vista === 'meses') return cab(12, y, 'anos') + `<div class="pcal-grade">${MESES.map((n, i) => `<button class="pcal-op ${i === m ? 'on' : ''}" data-pmes="${i}">${n.slice(0, 3)}</button>`).join('')}</div>`;
  if (c.vista === 'anos') { const anos = Array.from({ length: 12 }, (_, i) => y - 5 + i);
    return cab(144, `${anos[0]} – ${anos[11]}`) + `<div class="pcal-grade">${anos.map(a => `<button class="pcal-op ${a === y ? 'on' : ''}" data-pano="${a}">${a}</button>`).join('')}</div>`; }

  let cel = '';
  for (let i = new Date(y, m, 1).getDay(); i > 0; i--) cel += '<span></span>';
  for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const cls = [iso === HOJE && 'hoje', iso === p.de && 'ini', iso === p.de && fim && fim !== p.de && 'com-fim', fim && iso === fim && 'fim', p.de && fim && iso > p.de && iso < fim && 'meio'].filter(Boolean).join(' ');
    cel += `<button class="pd ${cls}" data-pdia="${iso}" aria-label="${d} de ${MESES[m]}"><b>${d}</b></button>`;
  }

  return cab(1, `${MESES[m][0].toUpperCase() + MESES[m].slice(1)} de ${y}`, 'meses')
    + `<div class="pcal-sem">${SEM_CAL.map(s => `<span>${s}</span>`).join('')}</div>`
    + `<div class="pcal-dias ${p.de && !p.ate && fim ? 'previa' : ''}">${cel}</div>`

// Abre o seletor junto do botão. `aoEscolher` só é chamado com um período

// `futuro` liga os atalhos de datas que ainda vão chegar.
function abrirPeriodo(anc, atual, aoEscolher, futuro = false) {
  let sel = { ...atual };
  // Abre no mês de hoje quando o período o inclui ("Este ano" não abre em dezembro).
  const ref = sel.de && sel.ate && sel.de <= HOJE && HOJE <= sel.ate ? HOJE : sel.ate || sel.de || HOJE;
  const c = { vista: 'dias', base: new Date(ref.slice(0, 7) + '-01T12:00:00'), hover: null };
  const marca = on => on ? ico('check', 'ico ico-s ok') : '';
  const atalhos = () => PERIODOS.filter(x => futuro || !x.futuro).map(x => { const on = x.id ? sel.id === x.id : !comPeriodo(sel); return `<button class="${on ? 'on' : ''}" data-p="${x.id}">${x.nome}${marca(on)}</button>`; }).join('');
  const pop = abrirPop(anc, `<div class="per-pop"><div class="atalhos">${atalhos()}</div><div class="pcal">${calPeriodo(c, sel)}</div></div>`);
  const desenhar = () => { pop.querySelector('.pcal').innerHTML = calPeriodo(c, sel); };
  const escolher = p => { fecharPop(); aoEscolher(p); };
  pop.addEventListener('click', e => {
    // O clique redesenha o calendário e o alvo sai do documento: sem parar aqui,
    // o clique "de fora" fecharia o popover.
    e.stopPropagation();
    const at = e.target.closest('[data-p]'); if (at) return escolher(periodoDe(at.dataset.p));
    const nav = e.target.closest('[data-nav]'); if (nav) { c.base.setMonth(c.base.getMonth() + +nav.dataset.nav); return desenhar(); }
    const vista = e.target.closest('[data-vista]'); if (vista) { c.vista = vista.dataset.vista; return desenhar(); }
    const mes = e.target.closest('[data-pmes]'); if (mes) { c.base.setMonth(+mes.dataset.pmes); c.vista = 'dias'; return desenhar(); }
    const ano = e.target.closest('[data-pano]'); if (ano) { c.base.setFullYear(+ano.dataset.pano); c.vista = 'meses'; return desenhar(); }
    if (e.target.closest('[data-plimpar]')) return escolher(periodoDe(''));
    const dia = e.target.closest('[data-pdia]'); if (!dia) return;
    const iso = dia.dataset.pdia;
    // Primeiro clique marca o início; o segundo, o fim (antes do início recomeça).
    if (!sel.de || sel.ate || iso < sel.de) { sel = { id: 'livre', de: iso, ate: '' }; c.hover = null; pop.querySelector('.atalhos').innerHTML = atalhos(); lucide.createIcons(); return desenhar(); }
