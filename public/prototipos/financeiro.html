        ctx: ent.length ? `${plural(ent.length, 'O.S.', 'O.S.')} · até <b>${plural(maisAntiga, 'dia', 'dias')}</b>` : 'nenhuma' }),
      celula({ alvo: 'g-pronta', area: 'itens', icone: 'package-check', rot: 'Prontas', val: dinheiro(somaPor(pro, o => o.saldo)), ctx: pro.length ? plural(pro.length, 'O.S.', 'O.S.') : 'nenhuma' }),
      celula({ alvo: 'g-boleto', area: venc.length ? 'perigo' : 'obs', icone: 'barcode', rot: 'Em boleto', val: dinheiro(somaPor(bol, o => o.boleto)),
        ctx: venc.length ? `<b>${plural(venc.length, 'vencido', 'vencidos')}</b>` : prox ? `próximo ${ddmm(prox.vence)}` : bol.length ? plural(bol.length, 'boleto', 'boletos') : 'nenhum' }),
    ]);
  }
  function blocoClientes(l) {
    const m = new Map();
    l.forEach(o => { const k = chaveCli(o), x = m.get(k) || { k, nome: nomeCli(o), v: 0, n: 0 }; x.v += falta(o); x.n++; m.set(k, x); });
    const top = [...m.values()].sort((a, b) => b.v - a.v).slice(0, 8).map(x => ({ ...x, sub: plural(x.n, 'O.S.', 'O.S.') }));
    return area('a-dados', 'users', 'Quem mais deve', ranking(top, 'cli', R.cliente), R.cliente ? '<button class="mc-link" data-cli="">limpar</button>' : '');
  }
  function blocoNaEntrega(l) {
    const x = l.filter(o => ['producao', 'antes'].includes(grupoDe(o)));
    if (!x.length) return '';
    return area('a-dados', 'calendar-clock', 'Entra na entrega', `<div class="prox"><b class="num">${reais(somaPor(x, o => o.saldo))}</b><span>${plural(x.length, 'O.S.', 'O.S.')} ainda na produção</span></div>`);
  }

  function detalhe(o) {
    const g = grupoDe(o), f = falta(o);
    const pct = v => o.total ? Math.max(0, v / o.total * 100) : 0;
    const linhaData = (rot, iso, extra = '') => iso ? `<dt>${ico('calendar', 'ico ico-s')}${rot}</dt><dd>${dataLonga(iso)} ${extra}</dd>` : '';
    const venceTxt = !o.vence ? '' : (() => { const n = diasEntre(HOJE, o.vence); return n < 0 ? `<span class="atraso">venceu há ${plural(-n, 'dia', 'dias')}</span>` : n === 0 ? '<span class="atraso">hoje</span>' : n === 1 ? '<span class="hoje">amanhã</span>' : `<span class="mudo">em ${plural(n, 'dia', 'dias')}</span>`; })();
    const itens = o.itens ? o.itens.split(' · ') : [];
    return `<div class="det">
      <div class="det-cab">O.S. ${o.id}<span class="det-ferr"><button class="ib" data-gv="abrir" aria-label="Abrir O.S." title="Abrir O.S.">${ico('maximize-2', 'ico ico-s')}</button><button class="ib" data-gv="fechar" aria-label="Fechar" title="Fechar (Esc)">${ico('x', 'ico ico-s')}</button></span></div>
      <div class="det-tit">${esc(nomeCli(o))}</div>
      <div class="det-valor num"><small>R$</small>${brl(f)}</div>
      <div class="compo" role="img" aria-label="Recebido ${reais(o.recebido)}, em boleto ${reais(o.boleto)}, falta ${reais(o.saldo)}">${o.recebido > 0 ? `<i class="rec" style="width:${pct(o.recebido)}%"></i>` : ''}${o.boleto > 0 ? `<i class="bol" style="width:${pct(o.boleto)}%"></i>` : ''}${o.saldo > 0 ? `<i class="falta" style="width:${pct(o.saldo)}%"></i>` : ''}</div>
      <div class="compo-leg"><span><i style="background:var(--fin)"></i>Recebido <b>${reais(o.recebido)}</b></span>${o.boleto > 0 ? `<span><i style="background:var(--obs)"></i>Em boleto <b>${reais(o.boleto)}</b></span>` : ''}<span><i style="background:var(--perigo)"></i>Falta <b>${reais(o.saldo)}</b></span><span>de <b>${reais(o.total)}</b></span></div>
      <dl class="dprops">
        <dt>${ico('circle-dot', 'ico ico-s')}Situação</dt><dd>${esc(o.status)}${g === 'entregue' ? ' <span class="atraso">· sem pagar</span>' : ''}</dd>
        ${linhaData('Pedido', o.pedido)}
        ${linhaData(g === 'entregue' ? 'Concluída' : 'Entrega', o.prazo, g === 'entregue' && o.prazo ? `<span class="mudo">${haDias(o.prazo)}</span>` : '')}
        ${linhaData('Retirada', o.retirada)}
        ${o.boleto > 0 ? `<dt>${ico('barcode', 'ico ico-s')}Boleto</dt><dd>${o.vence ? `vence ${dataLonga(o.vence)} ${venceTxt}` : '<span class="mudo">sem vencimento</span>'}</dd>` : ''}
        ${o.ultimo ? `<dt>${ico('check-circle-2', 'ico ico-s')}Último pag.</dt><dd>${dataLonga(o.ultimo)} <span class="mudo">${haDias(o.ultimo)}</span></dd>` : ''}
        ${o.formas.length ? `<dt>${ico('credit-card', 'ico ico-s')}Formas</dt><dd>${o.formas.map(esc).join(', ')}</dd>` : ''}
      </dl>
      <div class="det-acoes">
        <button class="btn btn-pri btn-p" data-gv="abrir">${ico('maximize-2')}Abrir O.S.</button>
        <span class="esp"></span>
        <button class="btn btn-txt btn-p" data-gv="copiar">${ico('copy')}Copiar linha</button>
      </div>
      <p class="det-nota">O pagamento se registra na O.S.</p>
      ${itens.length ? `<section class="dsec a-itens"><div class="dsec-cab"><span class="area-ico">${ico('list', 'ico ico-s')}</span><h3>${plural(o.nItens, 'item', 'itens')}</h3></div><ul class="itens-l">${itens.map(i => `<li>${esc(i)}</li>`).join('')}${o.nItens > itens.length ? `<li class="mudo">+ ${o.nItens - itens.length}</li>` : ''}</ul></section>` : ''}
    </div>`;
  }

  MODULOS.receber = {
    gaveta: { porId: id => R.lista?.find(o => o.id === id), detalhe, rotulo: 'Conta a receber', attr: 'os' },
    numero() {
      if (!R.lista) return null;
      const e = R.lista.filter(o => grupoDe(o) === 'entregue').length;
      return e ? [e, true, plural(e, 'entregue sem pagar', 'entregues sem pagar')] : [R.lista.length, false, 'O.S. a receber'];
    },
    carregar(forcar) {
      if ((R.lista || R.carregando) && !forcar) return;
      R.carregando = true; R.erro = null; R.parciais.clear(); R.pedido = pedirAoBanco('pedir-receber', { de: R.periodo.de, ate: R.periodo.ate });
      if (est.aba === 'receber') render();
    },
    aoReceber(msg) {
      if (msg.tipo === 'pedidos-mudaram') return aoMudarPedidos(R, MODULOS.receber, 'pedir-receber', msg);
      if (!['receber', 'receber-erro'].includes(msg.tipo)) return;
      if (msg.ids) {
        // Releitura do tempo real. Se falhar, a lista fica como estava.
        if (!R.parciais.delete(msg.pedido) || msg.tipo !== 'receber') return;
        const antes = R.lista.length;
        R.lista = trocarLinhas(R.lista, msg.ids, msg.lista || [], o => o.id);
        R.total += R.lista.length - antes; R.antes = msg.antes || 0;
        return aposReleitura('receber', msg.ids);
      }
      if (msg.pedido !== R.pedido) return;
      R.carregando = false;
      if (msg.tipo === 'receber') { R.lista = msg.lista || []; R.total = msg.total ?? R.lista.length; R.antes = msg.antes || 0; } else R.erro = msg.erro;
      if (est.aba === 'receber') { render(); renderGaveta(); } else renderAbas();
    },
    render() {
      const todas = filtradas(false), l = filtradas();
      const ent = (R.lista || []).filter(o => grupoDe(o) === 'entregue').length, venc = (R.lista || []).filter(vencido).length, hoje = (R.lista || []).filter(o => o.boleto > 0 && o.vence === HOJE).length;
      // O que ficou de fora: as O.S. a receber pedidas antes do período (só a
      // contagem veio do banco) e, se passou do limite de uma leitura, o aviso.
      const nota = !R.lista ? ''
        : R.antes ? notaPeriodo(`Mais <b>${plural(R.antes, 'O.S.', 'O.S.')}</b> a receber de antes de ${dataCurta(R.periodo.de)}`, true, 'Ver todo o período')
        : R.total > R.lista.length ? notaPeriodo(`Mostrando ${R.lista.length} de ${R.total} O.S. Escolha um período menor.`) : '';
      tela.innerHTML = cabTela('Contas a receber', !R.lista ? ['<span>Lendo do banco…</span>'] : [
          ent && seloDe('atraso', 'alert-triangle', plural(ent, 'entregue sem pagar', 'entregues sem pagar')),
          venc && seloDe('atraso', 'barcode', plural(venc, 'boleto vencido', 'boletos vencidos')),
          hoje && seloDe('atraso', 'clock', plural(hoje, 'boleto vence hoje', 'boletos vencem hoje')),
        ])
        + `<div class="busca-linha">${buscaCampo('Buscar cliente, nº da O.S. ou item')}${botaoPeriodo(R.periodo, 'Filtrar pela data do pedido')}${chipsDe('sit', R.situacao, [['', 'Todas'], ...GRUPOS.map(g => [g.id, g.chip, g.icone])])}</div>`
        + nota
        + (R.erro ? faixaErro(R.erro, 'receber') : '')
        + (!R.lista ? (R.erro ? '' : esqueleto()) : `<div class="${R.carregando ? 'esperando' : ''}">${blocoNumeros(todas)}<div class="grade"><div class="col">${blocoLista(l)}</div><div class="col">${blocoClientes(todas)}${blocoNaEntrega(todas)}</div></div></div>`);
    },
    clique(t) {
      const per = t.closest('[data-periodo]');
      if (per) return abrirPeriodo(per, R.periodo, p => { R.periodo = p; R.cliente = ''; MODULOS.receber.carregar(true); });
      if (t.closest('[data-per-todo]')) { R.periodo = periodoDe(''); return MODULOS.receber.carregar(true); }
      const os = t.closest('[data-os]'); if (os) return abrirGaveta(+os.dataset.os);
      const s = t.closest('[data-sit]'); if (s) { R.situacao = s.dataset.sit; return render(); }
      const c = t.closest('[data-cli]'); if (c) { R.cliente = R.cliente === c.dataset.cli ? '' : c.dataset.cli; return render(); }
      const m = t.closest('[data-mais]'); if (m) { R.abertos.add(m.dataset.mais); return render(); }
    },
    acao(a, o) {
      if (a === 'abrir') return paraPai({ tipo: 'abrir-os', id: o.id });
      if (a === 'copiar') return copiar([`#${o.id}`, nomeCli(o), o.status, reais(o.total), reais(o.recebido), reais(o.boleto), reais(o.saldo)].join('\t'), 'Linha copiada');
    },
    antesDeRolar() { if (R.situacao) { R.situacao = ''; render(); } },
  };
})();

/* ===== Boletos ===== */
// Um registro por boleto (não por O.S.), lido do banco quando a aba abre e a
// cada período escolhido (pelo vencimento). Os sem vencimento vêm sempre; dos
// vencidos de antes do período vem só a contagem, para o aviso.
(() => {
  const B = { lista: null, carregando: false, erro: null, pedido: 0, parciais: new Set(), verPagos: false, cliente: '', conf: null, abertos: new Set(), periodo: periodoDe('mes'), antes: 0 };
  const pago = b => b.pago;
  const vencido = b => !pago(b) && b.vence && b.vence < HOJE;
  const faltaDado = b => !pago(b) && (!b.valor || !b.numero || !b.emissao || !b.cnpj);
  const chaveCli = b => semAcento(b.cliente || 'sem cliente').trim();
  function filtrados() {
    const q = semAcento(est.busca.trim());
    return (B.lista || []).filter(b => (!B.cliente || chaveCli(b) === B.cliente)
      && (!q || casa(b.cliente, q) || String(b.os).includes(q) || casa(b.numero, q) || casa(b.cnpj, q)));
  }
  function quando(b) {
    if (pago(b)) return `<small class="ok">pago${b.pagoEm ? ' ' + ddmm(b.pagoEm) : ''}</small>`;
    if (!b.vence) return '<small>sem vencimento</small>';
    const n = diasEntre(HOJE, b.vence);
    return n < 0 ? `<small class="atraso">venceu há ${plural(-n, 'dia', 'dias')}</small>` : n === 0 ? '<small class="atraso">vence hoje</small>' : n === 1 ? '<small class="hoje">vence amanhã</small>' : `<small>em ${n} dias</small>`;
  }
  function linha(b) {
    const tom = pago(b) ? '' : tomVence(b.vence);
    const sub = [`O.S. ${b.os}`, b.numero ? `nº ${esc(b.numero)}` : '<span class="st">sem número</span>', b.banco ? esc(b.banco) : '', b.parcelas > 1 ? `${b.parcelas}x` : ''].filter(Boolean).join(' · ');
    return `<li><div class="lin ${pago(b) ? 'paga' : priDe(tom)} ${est.gaveta === b.id ? 'aberta' : ''}" data-bol="${b.id}" tabindex="0" role="button" aria-label="Boleto da O.S. ${b.os}, ${esc(b.cliente)}, ${reais(b.valor)}">
      ${blocoData(b.vence, tom, 'Vencimento')}
      <span class="lin-txt"><span class="lin-tit"><span>${esc(b.cliente || 'Sem cliente')}</span>${b.protesto ? '<span class="selo atraso" style="flex-shrink:0">protesto</span>' : ''}</span><span class="lin-sub">${sub}</span></span>
      <span class="lin-dir"><span class="v num">${b.valor ? reais(b.valor) : "<small>a definir</small>"}</span>${quando(b)}</span>
      <span class="fls"><button class="fl concluir ${B.conf === b.id ? 'conf' : ''}" data-bol-pagar="${b.id}" aria-label="Marcar boleto como pago" title="${B.conf === b.id ? 'Clique de novo para confirmar' : 'Marcar boleto como pago'}">${B.conf === b.id ? 'Pago?' : ico('check-circle-2', 'ico')}</button></span>
    </div></li>`;
  }
  function grupos(l) {
    const abertos = l.filter(b => !pago(b)).sort((a, b) => (a.vence || '9').localeCompare(b.vence || '9'));
    const fim7 = somarDias(HOJE, 7), amanha = somarDias(HOJE, 1);
    return [
      { id: 'b-vencidos', tom: 'atraso', icone: 'alert-triangle', rot: 'Vencidos', itens: abertos.filter(vencido) },
      { id: 'b-hoje', tom: 'atraso', icone: 'clock', rot: 'Vencem hoje', itens: abertos.filter(b => b.vence === HOJE) },
      { id: 'b-amanha', tom: 'hoje', icone: 'calendar', rot: 'Vencem amanhã', itens: abertos.filter(b => b.vence === amanha) },
      { id: 'b-semana', icone: 'calendar-range', rot: 'Próximos 7 dias', itens: abertos.filter(b => b.vence > amanha && b.vence <= fim7) },
      { id: 'b-depois', icone: 'calendar-days', rot: 'Mais à frente', itens: abertos.filter(b => b.vence > fim7) },
      { id: 'b-sem', icone: 'calendar-off', rot: 'Sem vencimento', itens: abertos.filter(b => !b.vence) },
    ].filter(g => g.itens.length).map(g => {
      const todos = B.abertos.has(g.id) || g.itens.length <= MAX_GRUPO + 5;
      return { ...g, tot: `${plural(g.itens.length, 'boleto', 'boletos')} · ${reais(somaPor(g.itens, b => b.valor))}`,
        mais: todos ? '' : `<li><button class="grupo-rot pagas" data-mais="${g.id}" style="width:100%">${ico('chevrons-down')}Mostrar mais ${g.itens.length - MAX_GRUPO}</button></li>`,
        itens: todos ? g.itens : g.itens.slice(0, MAX_GRUPO) };
    });
  }
  function blocoLista(l) {
    const gs = grupos(l), pagos = l.filter(pago).sort((a, b) => (b.pagoEm || '').localeCompare(a.pagoEm || ''));
    const filtro = est.busca || B.cliente;
    const corpo = !l.length ? `<div class="vazio">${ico('search')}${filtro ? 'Nenhum boleto com esse filtro.' : 'Nenhum boleto em aberto.'}</div>`
      : listaEmGrupos(gs, linha).replace(/<\/ul>$/, '')
        + (!gs.length ? `<li><div class="vazio">${ico('check-circle-2')}Nenhum boleto em aberto${filtro ? ' com esse filtro' : ''}.</div></li>` : '')
        + (pagos.length ? `<li class="grupo-rot pagas" id="b-pagos" data-pagos aria-expanded="${B.verPagos}">${ico('check-circle-2')}Pagos${B.verPagos ? '' : ' · clique para ver'}<span class="tot num">${plural(pagos.length, 'boleto', 'boletos')} · ${reais(somaPor(pagos, b => b.valor))}</span>${ico('chevron-down', 'ico ico-s chev')}</li>${B.verPagos ? pagos.map(linha).join('') : ''}` : '')
        + '</ul>';
    return area('a-dados', 'barcode', 'Boletos', corpo, plural(l.filter(b => !pago(b)).length, 'em aberto', 'em aberto'), 'bloco-boletos')
      + '<div class="dicas"><span><kbd>/</kbd> buscar</span><span>clique no boleto para ver tudo</span></div>';
  }
  function blocoNumeros(l) {
    const ab = l.filter(b => !pago(b)), venc = ab.filter(vencido), prox = ab.filter(b => b.vence >= HOJE && b.vence <= somarDias(HOJE, 7)), pagos = l.filter(pago);
    const maisAntigo = venc.length ? Math.max(...venc.map(b => diasEntre(b.vence, HOJE))) : 0;
    return numeros([
      celula({ alvo: 'bloco-boletos', area: 'dados', icone: 'barcode', rot: 'Em aberto', val: dinheiro(somaPor(ab, b => b.valor)), ctx: ab.length ? plural(ab.length, 'boleto', 'boletos') : 'nenhum' }),
      celula({ alvo: 'b-vencidos', area: venc.length ? 'perigo' : 'dados', icone: 'alert-triangle', rot: 'Vencidos', val: dinheiro(somaPor(venc, b => b.valor)), alerta: venc.length > 0,
        ctx: venc.length ? `${plural(venc.length, 'boleto', 'boletos')} · até <b>${plural(maisAntigo, 'dia', 'dias')}</b>` : 'nenhum' }),
      celula({ alvo: prox.length ? (prox.some(b => b.vence === HOJE) ? 'b-hoje' : 'b-semana') : 'bloco-boletos', area: 'obs', icone: 'calendar-clock', rot: 'Em 7 dias', val: dinheiro(somaPor(prox, b => b.valor)), ctx: prox.length ? plural(prox.length, 'boleto', 'boletos') : 'nenhum' }),
      celula({ alvo: 'b-pagos', area: 'fin', icone: 'check-circle-2', rot: 'Pagos', val: dinheiro(somaPor(pagos, b => b.valor)), ctx: pagos.length ? plural(pagos.length, 'boleto', 'boletos') : 'nenhum' }),
    ]);
  }
  function blocoFaltando(l) {
    const f = l.filter(faltaDado);
    if (!f.length) return area('a-fin', 'check-circle-2', 'Dados dos boletos', `<div class="vazio">${ico('check-circle-2')}Todos com valor, número, emissão e CNPJ.</div>`);
    const falta = b => [!b.valor && 'valor', !b.numero && 'número', !b.emissao && 'emissão', !b.cnpj && 'CNPJ'].filter(Boolean).join(', ');
    return area('a-obs', 'clipboard-list', 'Faltando dados', `<ul class="lista">${f.slice(0, 6).map(b => `<li><div class="lin" data-bol="${b.id}" tabindex="0" role="button"><span class="lin-txt"><span class="lin-tit"><span>${esc(b.cliente || 'Sem cliente')}</span></span><span class="lin-sub">O.S. ${b.os} · sem ${falta(b)}</span></span></div></li>`).join('')}</ul>`, plural(f.length, 'boleto', 'boletos'));
  }
  function blocoClientes(l) {
    const m = new Map();
    l.filter(b => !pago(b)).forEach(b => { const k = chaveCli(b), x = m.get(k) || { k, nome: b.cliente || 'Sem cliente', v: 0, n: 0 }; x.v += b.valor; x.n++; m.set(k, x); });
    // Boleto ainda sem valor não entra: sem nenhum com valor, o quadro some.
    const top = [...m.values()].filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 6).map(x => ({ ...x, sub: plural(x.n, 'boleto', 'boletos') }));
    return top.length ? area('a-dados', 'users', 'Por cliente', ranking(top, 'cli', B.cliente), B.cliente ? '<button class="mc-link" data-cli="">limpar</button>' : '') : '';
  }
  function detalhe(b) {
    const conf = B.conf === b.id;
    const ou = (v, txt = 'não informado') => v ? esc(v) : `<span class="mudo">${txt}</span>`;
    return `<div class="det">
      <div class="det-cab">Boleto · O.S. ${b.os}<span class="det-ferr"><button class="ib" data-gv="abrir" aria-label="Abrir O.S." title="Abrir O.S.">${ico('maximize-2', 'ico ico-s')}</button><button class="ib" data-gv="fechar" aria-label="Fechar" title="Fechar (Esc)">${ico('x', 'ico ico-s')}</button></span></div>
      <div class="det-tit">${esc(b.cliente || 'Sem cliente')}</div>
      <div class="det-valor num"><small>R$</small>${brl(b.valor)}</div>
      <dl class="dprops">
        <dt>${ico(pago(b) ? 'check-circle-2' : 'circle', 'ico ico-s')}Situação</dt><dd>${pago(b) ? `<span class="ok">Pago${b.pagoEm ? ' em ' + dataLonga(b.pagoEm) : ''}</span>` : 'Em aberto'}</dd>
      </dl>
      <p class="rot-campos">${ico('pencil', 'ico ico-s')}Dados do boleto · gravam ao sair do campo</p>

      if (a === 'editar') return paraPai({ tipo: 'editar-empresa', id: e.id });
      if (a === 'copiar') return copiar(e.cnpj, 'CNPJ copiado');
      if (a === 'sit') { e.status = el.dataset.v; render(); renderGaveta(); return avisoProto(`${e.nome}: ${SIT[e.status].rot.replace(/s$/, '').toLowerCase()} (protótipo: não grava)`); }
    },
    tecla(e) { if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); paraPai({ tipo: 'nova-empresa' }); } },
    antesDeRolar() { if (F.filtro) { F.filtro = ''; render(); } },
  };
})();

/* ===== Notas fiscais ===== */
// Os pedidos de nota que os clientes mandam pelo formulário. As pendentes vêm
// da memória (são poucas, e os alertas já as usam); as concluídas, do banco,
// pelo período escolhido (dia em que a nota foi pedida).
(() => {
  const N = { pend: DADOS.notas || [], conc: null, total: 0, periodo: periodoDe('mes'), carregando: false, erro: null, pedido: 0, ver: 'pendentes', tipo: '', conf: null, gerar: null };
  const todas = () => [...N.pend, ...(N.conc || [])];
  const nome = n => n.cliente || n.razao || 'Sem identificação';
  const tipos = () => [...new Set(todas().map(n => n.tipo).filter(Boolean))];
  function filtradas() {
    const q = semAcento(est.busca.trim()), qd = est.busca.replace(/\D/g, '');
    return (N.ver === 'pendentes' ? N.pend : (N.conc || [])).filter(n => (N.ver === 'pendentes' ? !n.concluida : n.concluida) && (!N.tipo || n.tipo === N.tipo)
      && (!q || casa(n.cliente, q) || casa(n.razao, q) || (qd && String(n.cnpj || '').replace(/\D/g, '').includes(qd)) || casa(n.servico, q)));
  }
  // Numa nota concluída, a ação da linha é gerar uma nova com os dados da
  // empresa, como na tela de hoje (Administrador e Financeiro). Quem não pode,
  // vê a linha guardando o lugar, sem botão.
  const botaoGerar = n => !DADOS.podeNotas ? '<span class="fl-lugar" aria-hidden="true"></span>' : `<button class="fl ${N.gerar === n.id ? 'conf' : ''}" data-nota-gerar="${n.id}" aria-label="Gerar nova nota com estes dados" title="${N.gerar === n.id ? 'Clique de novo para gerar' : 'Gerar nova nota com estes dados'}">${N.gerar === n.id ? 'Gerar?' : ico('file-plus', 'ico')}</button>`;
  function linha(n) {
    const dias = n.criado ? diasEntre(n.criado, HOJE) : 0;
    const tom = !n.concluida && dias > 7 ? 'atraso' : '';
    const sub = [n.tipo ? `<span class="st">${esc(n.tipo)}</span>` : '', n.servico ? esc(n.servico) : '<span class="mudo">serviço a preencher</span>', n.razao && n.cliente ? esc(n.razao) : ''].filter(Boolean).join(' · ');
    return `<li><div class="lin ${n.concluida ? 'paga' : ''} ${est.gaveta === n.id ? 'aberta' : ''}" data-nota="${n.id}" tabindex="0" role="button" aria-label="Nota de ${esc(nome(n))}">
      ${blocoData(n.criado, tom, 'Pedida')}
      <span class="lin-txt"><span class="lin-tit"><span>${esc(nome(n))}</span></span><span class="lin-sub">${sub}</span></span>
      <span class="lin-dir"><span class="v num">${n.valor ? reais(n.valor) : '<small>sem valor</small>'}</span><small class="${tom === 'atraso' ? 'atraso' : ''}">${n.concluida ? 'concluída' : n.criado ? haDias(n.criado) : ''}</small></span>
      <span class="fls">${n.concluida ? botaoGerar(n) : `<button class="fl concluir ${N.conf === n.id ? 'conf' : ''}" data-nota-concluir="${n.id}" aria-label="Concluir nota" title="${N.conf === n.id ? 'Clique de novo para confirmar' : 'Concluir nota'}">${N.conf === n.id ? 'Concluir?' : ico('check-circle-2', 'ico')}</button>`}</span>
    </div></li>`;
  }
  function grupos(l) {
    if (N.ver === 'pendentes') {
      const ord = l.slice().sort((a, b) => (a.criado || '').localeCompare(b.criado || ''));
      const d = n => n.criado ? diasEntre(n.criado, HOJE) : 0;
      return [
        { id: 'n-antigas', tom: 'atraso', icone: 'alert-triangle', rot: 'Há mais de 7 dias', itens: ord.filter(n => d(n) > 7) },
        { id: 'n-semana', icone: 'calendar-range', rot: 'Nesta semana', itens: ord.filter(n => d(n) > 0 && d(n) <= 7) },
        { id: 'n-hoje', icone: 'clock', rot: 'Hoje', itens: ord.filter(n => d(n) <= 0) },
      ].filter(g => g.itens.length).map(g => ({ ...g, tot: `${plural(g.itens.length, 'nota', 'notas')} · ${reais(somaPor(g.itens, n => n.valor))}` }));
    }
    // Concluídas: por mês do pedido, as mais recentes primeiro.
    const meses = new Map();
    l.slice().sort((a, b) => (b.criado || '').localeCompare(a.criado || '')).forEach(n => { const m = mesDe(n.criado) || 'sem'; if (!meses.has(m)) meses.set(m, []); meses.get(m).push(n); });
    return [...meses].map(([m, itens], i) => ({ id: 'n-m' + i, icone: 'calendar-days', rot: m === 'sem' ? 'Sem data' : rotuloMes(m).replace(/^./, x => x.toUpperCase()), itens, tot: `${plural(itens.length, 'nota', 'notas')} · ${reais(somaPor(itens, n => n.valor))}` }));
  }
  function detalhe(n) {
    const conf = N.conf === n.id;
    const p = (icone, rot, v) => v ? `<dt>${ico(icone, 'ico ico-s')}${rot}</dt><dd>${v}</dd>` : '';
    // Um dado da nota com o botão de copiar ao lado, como no modal de hoje: quem
    // emite a nota copia campo por campo para o sistema da prefeitura/Sefaz.
    const pc = (icone, rot, v) => v ? `<dt>${ico(icone, 'ico ico-s')}${rot}</dt><dd class="copiavel"><span>${esc(v)}</span><button class="ib" data-gv="copiar-campo" data-v="${esc(v)}" data-rot="${esc(rot)}" aria-label="Copiar ${esc(rot)}" title="Copiar">${ico('copy', 'ico ico-s')}</button></dd>` : '';
    return `<div class="det">
      <div class="det-cab">Nota fiscal${n.tipo ? ' · ' + esc(n.tipo) : ''}<span class="det-ferr"><button class="ib" data-gv="editar" aria-label="Editar" title="Editar">${ico('pencil', 'ico ico-s')}</button><button class="ib" data-gv="fechar" aria-label="Fechar" title="Fechar (Esc)">${ico('x', 'ico ico-s')}</button></span></div>
      <div class="det-tit">${esc(nome(n))}</div>
      <div class="det-valor num">${n.valor ? `<small>R$</small>${brl(n.valor)}` : '<small>valor a preencher</small>'}</div>
      <dl class="dprops">
        ${pc('user', 'Cliente', n.cliente)}
        ${pc('building-2', 'Razão social', n.razao)}
        ${pc('hash', 'CPF/CNPJ', n.cnpj)}
        ${pc(n.envio === 'E-mail' ? 'mail' : 'phone', 'Contato', n.contato)}
        ${pc('map-pin', 'Endereço', n.endereco)}
        ${pc('wrench', 'Serviço', n.servico) || p('wrench', 'Serviço', '<span class="mudo">a preencher</span>')}
        ${pc('banknote', 'Valor', n.valor ? brl(n.valor) : '')}
        ${pc('credit-card', 'Pagamento', n.pagamento)}
        ${pc('truck', 'Transporte', n.transporte)}
        ${pc('message-square', 'Do cliente', n.obsCliente)}
        ${pc('sticky-note', 'Observações', n.obs)}
        ${p('circle-dot', 'Situação', n.concluida ? '<span class="ok">Concluída</span>' : `Pendente <span class="mudo">· ${n.criado ? haDias(n.criado) : ''}</span>`)}
        ${p('calendar', 'Pedida', n.criado ? dataLonga(n.criado) : '')}
      </dl>
      <div class="det-acoes">
        ${n.concluida ? '' : `<button class="btn btn-ok btn-p ${conf ? 'conf' : ''}" data-gv="concluir">${ico('check-circle-2')}${conf ? 'Clique de novo para confirmar' : 'Concluir nota'}</button>`}
        ${n.concluida && DADOS.podeNotas ? `<button class="btn btn-sec btn-p ${N.gerar === n.id ? 'conf' : ''}" data-gv="gerar">${ico('file-plus')}${N.gerar === n.id ? 'Clique de novo para gerar' : 'Gerar nova nota'}</button>` : ''}
        <button class="btn btn-sec btn-p" data-gv="editar">${ico('pencil')}Editar no modal atual</button>
      </div>
    </div>`;
  }
  MODULOS.notas = {
    gaveta: { porId: id => todas().find(n => n.id === id), detalhe, rotulo: 'Nota fiscal', attr: 'nota' },
    numero() { const p = N.pend.filter(n => !n.concluida); return p.length ? [p.length, p.some(n => n.criado && diasEntre(n.criado, HOJE) > 7), plural(p.length, 'nota pendente', 'notas pendentes')] : null; },
    carregar(forcar) {
      if ((N.conc || N.carregando) && !forcar) return;
      N.carregando = true; N.erro = null; N.pedido = pedirAoBanco('pedir-notas', { de: N.periodo.de, ate: N.periodo.ate });
      if (est.aba === 'notas') render();
    },
    aoReceber(msg) {
      if (msg.pedido !== N.pedido || !['notas', 'notas-erro'].includes(msg.tipo)) return;
      N.carregando = false;
      if (msg.tipo === 'notas') { N.conc = msg.lista || []; N.total = msg.total ?? N.conc.length; } else N.erro = msg.erro;
      if (est.aba === 'notas') { render(); renderGaveta(); }
    },
    render() {
      const l = filtradas(), pend = N.pend.filter(n => !n.concluida), conc = N.conc;
      const maisAntiga = pend.filter(n => n.criado).sort((a, b) => a.criado.localeCompare(b.criado))[0];
      const dias = maisAntiga ? diasEntre(maisAntiga.criado, HOJE) : 0;
      const nasConcluidas = N.ver === 'concluidas';
      const lendo = nasConcluidas && !conc;
      const corpo = lendo ? (N.erro ? '' : `<div class="vazio">${ico('loader')}Lendo do banco…</div>`)
        : l.length ? listaEmGrupos(grupos(l), linha)
        : `<div class="vazio">${ico(!nasConcluidas && !est.busca && !N.tipo ? 'check-circle-2' : 'search')}${!nasConcluidas && !est.busca && !N.tipo ? 'Nenhuma nota esperando.' : nasConcluidas && !est.busca && !N.tipo ? `Nenhuma nota concluída em ${rotuloPeriodo(N.periodo).toLowerCase()}.` : 'Nenhuma nota com esse filtro.'}</div>`;
      const rotPer = rotuloPeriodo(N.periodo);
      tela.innerHTML = cabTela('Notas fiscais', [!pend.length ? '<span>Nenhuma nota esperando.</span>' : seloDe(dias > 7 ? 'atraso' : 'hoje', 'file-text', plural(pend.length, 'pendente', 'pendentes'))],
          `<button class="btn btn-sec" data-link-nota title="Copiar o link do formulário">${ico('link')}Copiar link</button><button class="btn btn-pri" data-form-nota>${ico('external-link')}Formulário</button>`)
        + `<div class="busca-linha">${buscaCampo('Buscar cliente, razão social ou CNPJ')}${chipsDe('nver', N.ver, [['pendentes', `Pendentes · ${pend.length}`, 'clock'], ['concluidas', 'Concluídas', 'check-circle-2']])}${nasConcluidas ? botaoPeriodo(N.periodo, 'Filtrar pelo dia em que a nota foi pedida') : ''}${chipsDe('ntipo', N.tipo, [['', 'Todos os tipos'], ...tipos().map(t => [t, t])])}</div>`
        + (nasConcluidas && conc && N.total > conc.length ? notaPeriodo(`Mostrando as ${conc.length} mais recentes de ${N.total}. Escolha um período menor.`) : '')
        + (nasConcluidas && N.erro ? faixaErro(N.erro, 'notas') : '')
        + numeros([
          celula({ alvo: 'bloco-notas', area: pend.length ? 'obs' : 'dados', icone: 'file-text', rot: 'Pendentes', val: pend.length, ctx: pend.length ? reais(somaPor(pend, n => n.valor)) : 'nenhuma' }),
          celula({ alvo: maisAntiga && dias > 7 ? 'n-antigas' : 'bloco-notas', area: dias > 7 ? 'perigo' : 'dados', icone: 'hourglass', rot: 'Esperando há mais tempo', val: maisAntiga ? `${dias}<small style="margin-left:4px">${dias === 1 ? 'dia' : 'dias'}</small>` : '—', alerta: dias > 7, ctx: maisAntiga ? esc(nome(maisAntiga)) : 'nenhuma' }),
          celula({ alvo: 'bloco-notas', area: 'fin', icone: 'check-circle-2', rot: `Concluídas · ${rotPer.toLowerCase()}`, val: conc ? N.total : '…', ctx: conc && conc.length ? reais(somaPor(conc, n => n.valor)) : conc ? 'nenhuma' : 'lendo…' }),
        ])
        + `<div class="col ${N.carregando && conc ? 'esperando' : ''}">${area('a-dados', 'file-text', nasConcluidas ? 'Concluídas' : 'Esperando emissão', corpo, lendo ? '' : plural(l.length, 'nota', 'notas'), 'bloco-notas')}</div>`;
    },
    clique(t) {
      const per = t.closest('[data-periodo]');
      if (per) return abrirPeriodo(per, N.periodo, p => { N.periodo = p; MODULOS.notas.carregar(true); });
      const nc = t.closest('[data-nota-concluir]'); if (nc) { const n = todas().find(x => x.id === +nc.dataset.notaConcluir); return n && MODULOS.notas.acao('concluir', n); }
      const ng = t.closest('[data-nota-gerar]'); if (ng) { const n = todas().find(x => x.id === +ng.dataset.notaGerar); return n && MODULOS.notas.acao('gerar', n); }
      const n = t.closest('[data-nota]'); if (n) return abrirGaveta(+n.dataset.nota);
      const v = t.closest('[data-nver]'); if (v) { N.ver = v.dataset.nver; return render(); }
      const tp = t.closest('[data-ntipo]'); if (tp) { N.tipo = tp.dataset.ntipo; return render(); }
      // "Formulário" abre o formulário novo (protótipo); "Copiar link" segue
      // copiando o de hoje, que é o que vai para os clientes.
      const origem = parent.location?.origin || location.origin, link = `${origem}/solicitar-nota`;
      if (t.closest('[data-form-nota]')) return window.open(`${origem}/prototipos/solicitar-nota.html`, '_blank');
      if (t.closest('[data-link-nota]')) return copiar(link, 'Link do formulário copiado');
    },
    acao(a, n, el) {
      if (a === 'editar') return paraPai({ tipo: 'editar-nota', id: n.id });
      if (a === 'copiar-campo') return copiar(el.dataset.v, `${el.dataset.rot} copiado`);
      if (a === 'gerar') {
        if (!DADOS.podeNotas || !n.concluida) return;
        if (N.gerar !== n.id) { N.gerar = n.id; render(); return renderGaveta(); }
        // Grava de verdade, pela função da tela de hoje; a página abre a nota
        // nova no modal de hoje para preencher serviço e valor.
        N.gerar = null; render(); renderGaveta();
        return paraPai({ tipo: 'gerar-nota', id: n.id });
      }
      if (a === 'concluir') {
        if (N.conf !== n.id) { N.conf = n.id; render(); return renderGaveta(); }
        n.concluida = true; N.conf = null;
        N.pend = N.pend.filter(x => x !== n); if (N.conc) { N.conc.unshift(n); N.total++; }
        if (!N.conc) N.pend.push(n);   // sem a lista de concluídas lida, ela fica achável pela gaveta
        render(); renderGaveta();
        return avisoProto('Nota concluída (protótipo: não grava)');
      }
    },
    antesDeRolar() { if (N.ver !== 'pendentes') { N.ver = 'pendentes'; render(); } },
  };
})();

render();
if (est.aba !== 'pagar') MODULOS[est.aba].carregar?.();
</script>
</body>
