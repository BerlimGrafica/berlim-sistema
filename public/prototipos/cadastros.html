/* ===== as telas que um usuário abre (as mesmas regras de lib/acesso/telas.js) ===== */
// O servidor confere tudo de novo ao gravar; aqui é para a pessoa ver, na hora,
// o que cada cargo e cada marcação liberam.
const CAT = DADOS.catalogo || [];
const FIXAS = CAT.filter(t => t.fixa).map(t => t.id);
const idSub = (t, s) => `${t}:${s}`;
const SO_ADMIN = new Set(CAT.flatMap(t => (t.subtelas || []).filter(s => s.soAdmin).map(s => idSub(t.id, s.id))));
function normalizarTelas(lista) {
  const pedidas = new Set([...lista, ...FIXAS]); const saida = [];
  for (const t of CAT) {
    if (!pedidas.has(t.id)) continue;
    saida.push(t.id);
    const todas = t.subtelas || [], marcadas = todas.filter(s => pedidas.has(idSub(t.id, s.id)));
    for (const s of (marcadas.length ? marcadas : todas)) saida.push(idSub(t.id, s.id));
  }
  return saida;
}
const padraoDoCargo = nivel => (DADOS.cargos || []).find(c => c.valor === nivel)?.padrao || [...FIXAS];
function telasEfetivas(nivel, telas) {
  const base = Array.isArray(telas) ? normalizarTelas(telas) : padraoDoCargo(nivel);
  if (nivel === 'Administrador') return base;
  const resta = new Set(base.filter(id => !SO_ADMIN.has(id)));
  for (const t of CAT) {
    if (!resta.has(t.id) || t.fixa) continue;
    const subs = t.subtelas || [];
    if (subs.length && !subs.some(s => resta.has(idSub(t.id, s.id)))) resta.delete(t.id);
  }
  return base.filter(id => resta.has(id));
}
function htmlTelas() {
  const pers = Array.isArray(mc.v.telas), ef = new Set(telasEfetivas(mc.v.nivel, mc.v.telas));
  const n = CAT.filter(t => ef.has(t.id)).length;
  return `<button type="button" class="mc-inter" role="switch" data-mc="personalizar" aria-checked="${pers}">${ico('sliders-horizontal')}<span class="txt"><b>Escolher as telas uma a uma</b><small>${pers ? 'Lista própria desta pessoa' : 'Desligado: abre as telas do cargo'}</small></span><span class="chave"></span></button>
    <div class="mc-rot">Telas que abre<span class="dica">${n} de ${CAT.length}</span></div>
    <div class="mc-telas ${pers ? '' : 'trava'}">${CAT.map(t => {
      const liga = ef.has(t.id), subs = (t.subtelas || []).filter(s => !s.soAdmin || mc.v.nivel === 'Administrador'), mexe = pers && !t.fixa;
      return `<div class="mc-tela ${liga ? 'liga' : ''}"><button type="button" class="mc-tela-lin" data-tela="${t.id}" aria-pressed="${liga}" ${mexe ? '' : 'tabindex="-1" aria-disabled="true"'}><span class="caixa">${ico('check', 'ico')}</span>${ico(t.icone || 'square', 'ico ico-s')}${esc(t.rotulo)}${t.fixa ? `<span class="sempre">${ico('lock', 'ico ico-s')}sempre</span>` : ''}</button>
        ${liga && subs.length > 1 ? `<div class="mc-subs">${subs.map(s => `<button type="button" class="mc-sub" data-tela="${t.id}" data-sub="${s.id}" aria-pressed="${ef.has(idSub(t.id, s.id))}" ${pers ? '' : 'tabindex="-1" aria-disabled="true"'}>${esc(s.rotulo)}</button>`).join('')}</div>` : ''}</div>`;
    }).join('')}</div>`;
}
// Ligar ou desligar uma tela leva as sub-abas junto; desmarcar a última sub-aba
// apaga a tela (como no modal de hoje).
function alternarTelaMc(telaId, subId) {
  const t = CAT.find(x => x.id === telaId); if (!t || !Array.isArray(mc.v.telas)) return;
  const atual = new Set(normalizarTelas(mc.v.telas)), subs = (t.subtelas || []).map(s => idSub(t.id, s.id));
  if (!subId) {
    if (t.fixa) return;
    if (atual.has(t.id)) { atual.delete(t.id); subs.forEach(id => atual.delete(id)); } else { atual.add(t.id); subs.forEach(id => atual.add(id)); }
  } else {
    const id = idSub(t.id, subId);
    if (atual.has(id)) { atual.delete(id); if (!subs.some(s => atual.has(s)) && !t.fixa) atual.delete(t.id); }
    else { atual.add(id); atual.add(t.id); }
  }
  mc.v.telas = normalizarTelas([...atual]);
}

/* ===== os campos de cada janela dos Cadastros ===== */
const COR_TIPO = t => DADOS.categorias[t] || 'var(--tinta-fraca)';
const FORMS = {
  cliente: {
    titulo: m => m.id != null ? 'Cliente' : 'Novo cliente', criar: 'Cadastrar', criado: 'Cliente cadastrado', salvo: 'Cliente salvo',
    valores: c => ({ nome: c?.nome || '', empresa: c?.empresa || '', telefone: c?.telefone || '', email: c?.email || '', obs: c?.obs || '', problema: !!c?.problema }),
    campos: () => [
      { k: 'nome', tipo: 'grande', rot: 'Nome', ph: 'Nome do cliente' },
      { k: 'empresa', tipo: 'texto', rot: 'Empresa', ph: 'Se o cliente é de uma empresa' },
      { tipo: 'par', campos: [{ k: 'telefone', tipo: 'telefone', rot: 'WhatsApp', ph: '(11) 99999-9999', max: 20 }, { k: 'email', tipo: 'email', rot: 'E-mail', ph: 'nome@empresa.com' }] },
      { k: 'obs', tipo: 'area', rot: 'Observações', ph: 'CNPJ, endereço de entrega, como prefere ser atendido' },
      { k: 'problema', tipo: 'interruptor', perigo: true, icone: 'alert-triangle', rot: 'Cliente com pendência', dica: 'Aparece em vermelho na O.S. e nos orçamentos' },
    ],
    validar: v => { const e = {}; if (!v.nome.trim()) e.nome = 'diga o nome'; const d = v.telefone.replace(/\D/g, ''); if (d && d.length < 10) e.telefone = 'com DDD'; if (v.email.trim() && !/^\S+@\S+\.\S+$/.test(v.email.trim())) e.email = 'confira'; return e; },
    dados: v => ({ nome: v.nome.trim(), empresa: v.empresa.trim(), telefone: v.telefone.trim(), email: v.email.trim(), observacoes: v.obs.trim(), cliente_problema: v.problema }),
    // A página de clientes na tela é relida: o cliente salvo aparece como ficou.
    depois: () => { if (est.aba === 'clientes') pedirClientes(1); },
  },
  produto: {
    titulo: m => m.id != null ? 'Produto' : 'Novo produto', criar: 'Cadastrar', criado: 'Produto cadastrado', salvo: 'Produto salvo',
    valores: p => ({ nome: p?.nome || '', preco: p?.preco || 0, texto: p?.texto || '' }),
    campos: () => [
      { k: 'nome', tipo: 'grande', rot: 'Produto', ph: 'Banner, cartão de visita, adesivo…' },
      { k: 'preco', tipo: 'valor', rot: 'Preço base' },
      { k: 'texto', tipo: 'area', grande: true, rot: 'Texto padrão', dica: 'entra na descrição do item da O.S.', ph: '1000 cartões | 9x5cm | couché 300g | 4x4 cores' },
    ],
    validar: v => v.nome.trim() ? {} : { nome: 'diga o nome do produto' },
    dados: v => ({ nome: v.nome.trim(), preco_base: v.preco || 0, texto_padrao: v.texto.trim() }),
  },
  fornecedor: {
    titulo: m => m.id != null ? 'Fornecedor' : 'Novo fornecedor', criar: 'Cadastrar', criado: 'Fornecedor cadastrado', salvo: 'Fornecedor salvo',
    valores: f => ({ nome: f?.nome || '', tipo: f?.tipo || 'Terceirização', contato: f?.contato || '', obs: f?.obs || '' }),
    campos: m => [
      { k: 'nome', tipo: 'grande', rot: 'Nome', ph: 'Nome do fornecedor' },
      { k: 'tipo', tipo: 'opcoes', rot: 'Tipo', opcoes: [...new Set(['Terceirização', 'Material', 'Manutenção', m.v.tipo])].map(t => [t, t, `<span class="bol" style="--c-bol:${COR_TIPO(t)}"></span>`]) },
      { k: 'contato', tipo: 'texto', rot: 'Contato', ph: 'Telefone, e-mail ou site' },
      { k: 'obs', tipo: 'area', rot: 'Observações', ph: 'O que fornece, prazo, condições' },
    ],
    validar: v => v.nome.trim() ? {} : { nome: 'diga o nome' },
    dados: v => ({ nome: v.nome.trim(), tipo: v.tipo, contato: v.contato.trim(), observacoes: v.obs.trim() }),
  },
  usuario: {
    titulo: m => m.id != null ? 'Usuário' : 'Novo usuário', mostraId: false, larga: true, criar: 'Criar acesso', criado: 'Usuário criado', salvo: 'Usuário salvo',
    valores: u => ({ nome: u?.nome || '', email: '', senha: '', nivel: u?.nivel || 'Atendimento', telas: u ? (u.telasProprias ?? null) : null }),
    campos: m => [
      { k: 'nome', tipo: 'grande', rot: 'Nome', ph: 'Como aparece no sistema' },
      m.id == null
        ? { tipo: 'par', campos: [{ k: 'email', tipo: 'email', rot: 'E-mail de acesso', ph: 'nome@empresa.com' }, { k: 'senha', tipo: 'senha', rot: 'Senha', ph: 'pelo menos 6 letras ou números' }] }
        : { k: 'senha', tipo: 'senha', rot: 'Nova senha', dica: 'em branco, continua a de hoje', ph: '' },
      { tipo: 'html', html: () => `<div class="mc-rot">Cargo</div><div class="mc-cargos" role="radiogroup" aria-label="Cargo">${(DADOS.cargos || []).map(c => `<button type="button" class="mc-cargo" role="radio" data-k="nivel" data-v="${esc(c.valor)}" aria-checked="${mc.v.nivel === c.valor}">${ico(c.icone || 'user')}<span><b>${esc(c.rotulo)}</b><small>${esc(c.resumo)}</small></span></button>`).join('')}</div>` },
      { tipo: 'html', html: htmlTelas },
    ],
    validar: (v, m) => {
      const e = {}; if (!v.nome.trim()) e.nome = 'diga o nome';
      if (m.id == null && !/^\S+@\S+\.\S+$/.test(v.email.trim())) e.email = v.email.trim() ? 'confira' : 'obrigatório';
      if (m.id == null ? v.senha.length < 6 : (v.senha && v.senha.length < 6)) e.senha = 'pelo menos 6';
      return e;
    },
    dados: v => ({ nome: v.nome.trim(), email: v.email.trim(), senha: v.senha, nivel: v.nivel, telas: Array.isArray(v.telas) ? normalizarTelas(v.telas) : null }),
    clique: (t, m) => {
      if (t.closest('[data-mc="personalizar"]')) { m.v.telas = Array.isArray(m.v.telas) ? null : [...padraoDoCargo(m.v.nivel)]; m.descartar = false; return renderJanela(); }
      const el = t.closest('[data-tela]'); if (!el || !Array.isArray(m.v.telas)) return;
      alternarTelaMc(el.dataset.tela, el.dataset.sub || null); m.descartar = false; renderJanela();
    },
  },
};

/* ===== ações ===== */
let confTimer;
function armar(k) { est.conf = k; clearTimeout(confTimer); confTimer = setTimeout(() => { est.conf = null; redesenhar(); }, 4000); redesenhar(); }
function redesenhar() { render(); if (est.gaveta != null) renderGaveta(true); }
function excluir(tipo, id) {
  const k = `x:${tipo}:${id}`;
  if (est.conf !== k) return armar(k);
  est.conf = null; clearTimeout(confTimer);
  paraPai({ tipo: `excluir-${tipo}`, id });
  // Some na hora; se o banco recusar, a resposta (ou o tempo real) traz de volta.
  if (tipo === 'produto') PROD = PROD.filter(x => x.id !== id);
  if (tipo === 'fornecedor') FORN = FORN.filter(x => x.id !== id);
  if (tipo === 'cliente' && est.cli.lista) { est.cli.lista = est.cli.lista.filter(x => x.id !== id); if (est.cli.total) est.cli.total--; }
  fecharGaveta(true); render();
  toast({ cliente: 'Cliente excluído', produto: 'Produto excluído', fornecedor: 'Fornecedor excluído' }[tipo]);
}
// Catálogo: muda a posição na hora e manda gravar a ordem nova.
function moverProduto(id, para) {
  const de = PROD.findIndex(p => p.id === id); if (de < 0 || para < 0 || para >= PROD.length || de === para) return;
  const [p] = PROD.splice(de, 1); PROD.splice(para, 0, p);
  paraPai({ tipo: 'mover-produto', id, para });
  render();
  const lin = document.querySelector(`.lin[data-reg="${id}"]`); lin?.classList.add('movido');
  return lin;
}
function agir(a, el) {
  const id = idDe(el?.dataset.id), tipo = el?.dataset.tipo || abaAtual().tipo;
  const x = id != null ? porId(id) : null;
  if (a === 'grupo' || a === 'todos') return agirGrupo(a, el);
  // Novo e editar abrem a janela nova, aqui mesmo; quem grava é a página.
  if (a === 'novo') return abrirJanela(abaAtual().tipo, null);
  if (a === 'editar') { const x = porId(id); return x && abrirJanela(abaAtual().tipo, x); }
  if (a === 'duplicar') { paraPai({ tipo: `duplicar-${abaAtual().tipo}`, id }); return toast('Duplicando…'); }
  if (a === 'excluir') return excluir(tipo, id);
  if (a === 'copiar-tel') return x?.telefone && copiar(x.telefone, el);
  if (a === 'copiar-email') return x?.email && copiar(x.email, el);
  if (a === 'copiar-contato') return x?.contato && copiar(x.contato, el);
  if (a === 'copiar-texto') return x?.texto && copiar(x.texto, el);
  if (a === 'mais') return pedirClientes(est.cli.pagina + 1);
  if (a === 'tentar') return pedirClientes(est.cli.lista ? est.cli.pagina + 1 : 1);
  if (a === 'problema') { est.cli.problema = !est.cli.problema; return pedirClientes(1); }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#tema')) return;
  const acao = t.closest('[data-acao]');
  if (acao) {
    if (acao.tagName === 'A') return;
    e.stopPropagation();
    const a = acao.dataset.acao;
    if (a === 'fechar') return fecharGaveta();
    if (a === 'limpar') { est.busca = ''; if (est.aba === 'clientes') pedirClientes(1); else render(); return document.getElementById('busca')?.focus(); }
    return agir(a, acao);
  }
  const aba = t.closest('[data-aba]'); if (aba) return trocarAba(aba.dataset.aba);
  const ft = t.closest('[data-ftipo]'); if (ft) { est.ftipo = ft.dataset.ftipo; est.ativo = null; return render(); }
  const fc = t.closest('[data-fcargo]'); if (fc) { est.fcargo = fc.dataset.fcargo; est.ativo = null; return render(); }
  const letra = t.closest('[data-letra]'); if (letra) { est.cli.letra = letra.dataset.letra; est.ativo = null; return pedirClientes(1); }
  if (t.closest('.alca')) return;
  const lin = t.closest('[data-reg]'); if (lin && !lin.classList.contains('espera')) return abrirGaveta(idDe(lin.dataset.reg));
});
document.addEventListener('input', e => {
  if (e.target.id !== 'busca') return;
  est.busca = e.target.value;
  if (est.aba === 'clientes') {
    // A busca de clientes é no banco: espera a pessoa parar de digitar.
    render(); clearTimeout(buscaTimer); buscaTimer = setTimeout(() => pedirClientes(1), 300); return;
  }
  est.ativo = est.busca ? ordem()[0]?.id ?? null : null; render();
});
document.addEventListener('keydown', e => {
  const alvo = e.target; const digitando = alvo.matches?.('input, textarea'); const naBusca = alvo.id === 'busca';
  if (e.key === 'Escape') {
    if (est.conf) { est.conf = null; return redesenhar(); }
    if (est.gaveta != null) { e.preventDefault(); return fecharGaveta(); }
    if (est.busca) { est.busca = ''; if (est.aba === 'clientes') pedirClientes(1); else render(); return; }
    return alvo.blur?.();
  }
  if (alvo.closest?.('.abas') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault(); const ids = ABAS.map(a => a.id), i = ids.indexOf(est.aba);
    trocarAba(ids[(i + (e.key === 'ArrowRight' ? 1 : -1) + ids.length) % ids.length]);
    return tela.querySelector('.aba[aria-selected="true"]')?.focus();
  }
  if (e.key === '/' && !digitando) { e.preventDefault(); return document.getElementById('busca')?.focus(); }
  if (!digitando && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); return agir('novo'); }
  if (digitando && !naBusca) return;
  if (est.gaveta != null) return;
  const lin = alvo.closest?.('[data-reg]');
  if (lin && alvo === lin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return abrirGaveta(idDe(lin.dataset.reg)); }
  // Alt + ↑ ↓ no catálogo: leva o produto ativo uma posição acima ou abaixo.
  if (est.aba === 'produtos' && e.altKey && !est.busca && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && est.ativo != null) {
    e.preventDefault(); const i = PROD.findIndex(p => p.id === est.ativo);
    moverProduto(est.ativo, i + (e.key === 'ArrowDown' ? 1 : -1))?.scrollIntoView({ block: 'nearest' }); return;
  }
  const o = ordem(); if (!o.length) return;
  const i = o.findIndex(x => x.id === est.ativo);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    est.ativo = o[Math.max(0, Math.min(o.length - 1, i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1)))].id;
    render(); document.querySelector(`.lin[data-reg="${est.ativo}"]`)?.scrollIntoView({ block: 'nearest' }); return;
  }
  if (e.key === 'Enter' && i >= 0) { e.preventDefault(); return abrirGaveta(o[i].id); }
});

/* ===== catálogo: arrastar pela alça ===== */
let alvoArraste = null;
document.addEventListener('dragstart', e => {
  const lin = e.target.closest?.('.l-prod[draggable="true"]'); if (!lin) return;
  est.arrastando = +lin.dataset.reg; lin.classList.add('arrastando');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', lin.dataset.reg);
});
document.addEventListener('dragover', e => {
  if (est.arrastando == null) return;
  const lin = e.target.closest?.('.l-prod'); if (!lin) return;
  e.preventDefault();
  const r = lin.getBoundingClientRect(), baixo = e.clientY > r.top + r.height / 2;
  document.querySelectorAll('.alvo-cima, .alvo-baixo').forEach(x => x.classList.remove('alvo-cima', 'alvo-baixo'));
  lin.classList.add(baixo ? 'alvo-baixo' : 'alvo-cima'); alvoArraste = { id: +lin.dataset.reg, baixo };
});
document.addEventListener('drop', e => {
  if (est.arrastando == null || !alvoArraste) return;
  e.preventDefault();
  const de = PROD.findIndex(p => p.id === est.arrastando); let para = PROD.findIndex(p => p.id === alvoArraste.id) + (alvoArraste.baixo ? 1 : 0);
  if (para > de) para--;
  const id = est.arrastando; est.arrastando = null; alvoArraste = null;
  moverProduto(id, para);
});
document.addEventListener('dragend', () => { est.arrastando = null; alvoArraste = null; document.querySelectorAll('.arrastando, .alvo-cima, .alvo-baixo').forEach(x => x.classList.remove('arrastando', 'alvo-cima', 'alvo-baixo')); });

// Mensagens da página: a memória mudou (tempo real), a página de clientes
// chegou, ou um cliente foi salvo no modal.
window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  const m = e.data || {};
  if (m.tipo === 'dados') {
    if (est.arrastando != null) return;   // não redesenha no meio de um arraste
    aplicarDados(m.dados); render();
    if (est.gaveta != null && est.aba !== 'clientes') { if (porId(est.gaveta)) renderGaveta(true); else fecharGaveta(true); }
    return;
  }
  if (m.tipo === 'salvo') return aoSalvarJanela(m);
  if (m.tipo === 'clientes' || m.tipo === 'clientes-erro') return aoReceberClientes(m);
  if (m.tipo === 'clientes-mudaram') { if (est.cli.lista) pedirClientes(1); return; }
  if (m.tipo === 'excluido' && m.erro) { toast('Não deu para excluir: ' + m.erro); if (m.alvo === 'cliente') pedirClientes(1); }
});

/* ===== troca de tema (a mesma do sistema) ===== */
const temaBtn = document.getElementById('tema');
const pintarTema = escuro => { document.documentElement.classList.toggle('dark', escuro); temaBtn.innerHTML = ico(escuro ? 'sun' : 'moon', 'ico ico-s') + `<span>${escuro ? 'Claro' : 'Escuro'}</span>`; lucide.createIcons(); };
function trocarTema(escuro) {
  const raiz = document.documentElement;
  if (!document.startViewTransition) return pintarTema(escuro);
  const r = temaBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(() => pintarTema(escuro)); let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate({ clipPath: escuro ? circulo : circulo.reverse() }, { duration: escuro ? 600 : 450, easing: escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)', fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)' });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}
temaBtn.addEventListener('click', () => trocarTema(!document.documentElement.classList.contains('dark')));
if (DADOS.escuro) pintarTema(true);
render();
paraPai({ tipo: 'pronto' });
if (est.aba === 'clientes') pedirClientes(1);
</script>
