  return `<div class="det">
    <div class="det-cab">O.S. #${p.id}<span class="det-ferr"><button class="ib" data-gv="abrir-os" aria-label="Abrir O.S. completa" title="Abrir O.S. completa (Enter)">${ico('maximize-2', 'ico ico-s')}</button><button class="ib" data-gv="fechar" aria-label="Fechar" title="Fechar (Esc)">${ico('x', 'ico ico-s')}</button></span></div>
    <div class="det-tit ${p.problema ? 'prob' : ''}">${esc(p.cliente)}</div>
    ${p.problema ? `<div class="det-aviso">${ico('alert-triangle', 'ico ico-s')}Cliente com pendência: confira antes de entregar.</div>` : ''}
    <dl class="dprops">
      <dt>${ico('circle-dot', 'ico ico-s')}Etapa</dt><dd><span class="dot" style="background:${COR[p.status] || '#6b7280'}"></span>${esc(p.status)}</dd>
      <dt>${ico('flag', 'ico ico-s')}Prazo</dt><dd>${p.prazo ? `${prazoTexto(p)}<span class="mudo">${dataLonga(p.prazo)}</span>` : '<span class="mudo">sem prazo</span>'}</dd>
      ${p.venda ? `<dt>${ico('calendar', 'ico ico-s')}Venda</dt><dd><span class="mudo">${dataLonga(p.venda)}</span></dd>` : ''}
      <dt>${ico('users', 'ico ico-s')}Resp.</dt><dd>${p.resp.length ? p.resp.map(n => `${bolinha(n)}${esc(n)}`).join('<span class="mudo">,</span> ') : '<span class="mudo">ninguém</span>'}</dd>
      <dt>${ico('map-pin', 'ico ico-s')}Local</dt><dd>${esc(p.locais.join(', '))}</dd>
      <dt>${ico('thumbs-up', 'ico ico-s')}Arte</dt><dd>${p.arte ? 'Aprovada' : '<span class="mudo">Aguardando aprovação</span>'}</dd>
      <dt>${ico('package', 'ico ico-s')}Entrega</dt><dd>${p.entrega ? 'Vai por entrega' : '<span class="mudo">Retira no balcão</span>'}</dd>
    </dl>
    <section class="dsec a-itens"><div class="dsec-cab"><span class="area-ico">${ico('shopping-bag', 'ico ico-s')}</span><h3>Itens</h3><span class="area-meta">${p.itens.length ? `${feitos} de ${p.itens.length} feitos` : ''}</span></div>
      ${p.itens.length ? p.itens.map(([, nome, ok, desc]) => `<div class="ditem ${ok ? 'ok' : ''}"><span class="cx">${ico('check', 'ico ico-s')}</span><span><span class="nm">${esc(legivel(nome))}</span>${desc ? `<span class="ds">${esc(desc)}</span>` : ''}</span></div>`).join('') : `<div class="ditem"><span class="ds">${esc(legivel(p.resumo))}</span></div>`}
    </section>
    <section class="dsec a-fin"><div class="dsec-cab"><span class="area-ico">${ico('wallet', 'ico ico-s')}</span><h3>Pagamento</h3><span class="area-meta">${falta <= 0 ? 'Quitado' : ''}</span></div>
      <dl class="dfin"><div><dt>Total</dt><dd>${reais(p.valor, true)}</dd></div><div><dt>Pago</dt><dd>${reais(p.pago, true)}</dd></div><div class="${falta > 0 ? 'falta' : 'quitado'}"><dt>${falta > 0 ? 'Falta' : 'Saldo'}</dt><dd>${reais(Math.max(0, falta), true)}</dd></div></dl>
    </section>
    <div class="det-acoes"><button class="btn btn-sec" data-gv="abrir-os">${ico('maximize-2')}Abrir O.S. completa</button></div>
    <p class="det-nota">Para mudar etapa, itens ou pagamento, abra a O.S. completa.</p>
  </div>`;
}

const CATEG = DADOS.categorias || {};
function relativoVenc(c) {
  if (c.status === 'Pago') return '<span class="mudo">paga</span>';
  if (!c.vencimento) return '<span class="mudo">sem vencimento</span>';
  const d = diasEntre(HOJE, c.vencimento);
  if (d < 0) return `<span class="pz atraso">venceu há ${plural(-d, 'dia', 'dias')}</span>`;
  if (d === 0) return '<span class="pz atraso">vence hoje</span>';
  if (d === 1) return '<span class="pz hoje">vence amanhã</span>';
  return `<span class="mudo">em ${d} dias</span>`;
}
function detalheConta(c) {
  const cat = CATEG[c.categoria] || { label: c.categoria || 'Despesa', icone: 'dollar-sign' };
  const paga = c.status === 'Pago', conf = gaveta.conf === c.id;
  const recorr = c.recorrente ? (c.parcelas ? `Parcela ${c.parcela || 1} de ${c.parcelas}` : 'Todo mês') : '';
  return `<div class="det">
    <div class="det-cab">Conta a pagar<span class="det-ferr"><button class="ib" data-gv="editar-conta" aria-label="Editar conta" title="Editar no modal atual">${ico('pencil', 'ico ico-s')}</button><button class="ib" data-gv="fechar" aria-label="Fechar" title="Fechar (Esc)">${ico('x', 'ico ico-s')}</button></span></div>
    <div class="det-tit">${esc(c.descricao)}</div>
    <div class="det-valor">${c.valor ? `<small>R$</small>${brl(c.valor, true)}` : '<small>valor a definir</small>'}</div>
    <dl class="dprops">
      <dt>${ico('calendar', 'ico ico-s')}Vencimento</dt><dd>${c.vencimento ? `${esc(dataLonga(c.vencimento))} ${relativoVenc(c)}` : '<span class="mudo">sem vencimento</span>'}</dd>
      <dt>${ico(paga ? 'check-circle-2' : 'circle', 'ico ico-s')}Situação</dt><dd>${paga ? '<span style="color:var(--sucesso)">Paga</span>' : 'Pendente'}</dd>
      <dt>${ico(cat.icone, 'ico ico-s')}Categoria</dt><dd><span class="cat-dot" style="--cat:${cat.cor || '#9ca3af'}"></span>${esc(cat.label)}</dd>
      ${c.fornecedor ? `<dt>${ico('building-2', 'ico ico-s')}Fornecedor</dt><dd>${esc(c.fornecedor)}</dd>` : ''}
      <dt>${ico('repeat', 'ico ico-s')}Repete</dt><dd>${recorr ? esc(recorr) : '<span class="mudo">Não</span>'}</dd>
    </dl>
    <div class="det-acoes">
      ${paga ? '' : `<button class="btn btn-ok ${conf ? 'conf' : ''}" data-gv="pagar">${ico('check-circle-2')}${conf ? 'Clique de novo para confirmar' : 'Marcar como paga'}</button>`}
      <button class="btn btn-sec" data-gv="editar-conta">${ico('pencil')}Editar</button>
      <span class="esp"></span>
      <button class="btn btn-txt" data-gv="copiar">${ico('copy')}Copiar linha</button>
    </div>
    ${c.recorrente && !paga ? '<p class="det-nota">Ao pagar, a próxima já entra no mês seguinte.</p>' : ''}
  </div>`;
}

const gavetaRaiz = document.createElement('div'); document.body.appendChild(gavetaRaiz);
function renderGaveta() {
  const item = gaveta.tipo === 'os' ? porIdOS(gaveta.id) : gaveta.tipo === 'conta' ? porIdConta(gaveta.id) : null;
  document.querySelectorAll('.lin.aberta').forEach(x => x.classList.remove('aberta'));
  if (item) {
    document.querySelector(`[data-${gaveta.tipo === 'os' ? 'os' : 'conta'}="${item.id}"]`)?.classList.add('aberta');
    const corpo = gaveta.tipo === 'os' ? detalheOS(item) : detalheConta(item);
    const aberta = gavetaRaiz.querySelector('.gaveta:not(.sai)');
    if (aberta) aberta.innerHTML = corpo;
    else {
      gavetaRaiz.innerHTML = `<div class="gv-veu" data-gv="fechar"></div><aside class="gaveta" role="dialog" aria-label="${gaveta.tipo === 'os' ? 'O.S. #' + item.id : 'Conta a pagar'}">${corpo}</aside>`;
      const g = gavetaRaiz.querySelector('.gaveta');
      g.addEventListener('scroll', () => g.classList.toggle('rolou', g.scrollTop > 4), { passive: true });
    }
    lucide.createIcons(); gavetaRaiz.querySelector('.det-ferr .ib')?.focus({ preventScroll: true });
    return;
  }
  const saindo = gavetaRaiz.querySelectorAll('.gv-veu, .gaveta');
  if (!saindo.length) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { gavetaRaiz.innerHTML = ''; return; }
  saindo.forEach(x => x.classList.add('sai'));
  setTimeout(() => { if (!gaveta.tipo) gavetaRaiz.innerHTML = ''; }, 300);
}
function abrirGaveta(tipo, id) { gaveta.tipo = tipo; gaveta.id = id; gaveta.conf = null; renderGaveta(); }
function fecharGaveta() { const volta = document.querySelector(`.lin.aberta`); gaveta.tipo = null; gaveta.id = null; gaveta.conf = null; renderGaveta(); volta?.focus({ preventScroll: true }); }
function acaoGaveta(a) {
  if (a === 'fechar') return fecharGaveta();
  if (a === 'abrir-os') return paraPai({ tipo: 'abrir-os', id: gaveta.id });
  const c = porIdConta(gaveta.id); if (!c) return;
  if (a === 'editar-conta') return paraPai({ tipo: 'editar-conta', id: c.id });
  if (a === 'copiar') { navigator.clipboard?.writeText([ddmm(c.vencimento), c.descricao, (CATEG[c.categoria]?.label || c.categoria || 'Despesa'), reais(c.valor, true), c.status].join('\t')); return avisoProto('Linha copiada'); }
  if (a === 'pagar') {
    if (gaveta.conf !== c.id) { gaveta.conf = c.id; return renderGaveta(); }
    c.status = 'Pago'; gaveta.conf = null; renderGaveta(); render();
    return avisoProto('Marcada como paga (protótipo: não grava)');
  }
}

/* ===== uma tela por cargo ===== */
// Dois quadros lado a lado viram duas pilhas: cada assunto tem lugar fixo na
// coluna dele, e um quadro vazio (que encolhe) não deixa buraco ao lado de um
// cheio. No celular as pilhas se empilham, a primeira em cima.
const pilhas = (a, b) => `<div class="par solto"><div class="col">${a.join('')}</div><div class="col">${b.join('')}</div></div>`;
// Os quadradinhos só entram quando separam mais de uma cor; de uma cor só,
// repetem o número que já está escrito em cima.
const unidSe = (lista, cor, titulo) => lista.length && new Set(lista.map(cor)).size > 1 ? MED.unidades(lista, cor, titulo) : '';
// A legenda das partes: [cor, texto, quantos, frase]. Com uma parte só, a frase
// dela ("todas em Produção") diz mais que uma legenda de um item.
const partesOu = itens => { const com = itens.filter(([, , n]) => n); return com.length === 1 ? com[0][3] : legenda(itens); };

const TELAS = {
  // O dono: como está a gráfica hoje. Primeiro o que pede ação no dia — os
  // prazos, o que vence e o que falta cobrar e emitir —, depois as vendas do
  // mês. Os rankings de clientes e de produtos ficam na tela de Vendas.
  Administrador(eu) {
    const V = DADOS.vendas.mes, A = DADOS.vendas.anterior;
    const [a, m, dia] = HOJE.split('-').map(Number);
    const aReceber = abertas.filter(p => saldo(p) > 0);
    const totalReceber = aReceber.reduce((s, p) => s + saldo(p), 0);
    const prontoCobrar = aReceber.filter(p => PRONTAS.includes(p.status)).reduce((s, p) => s + saldo(p), 0);
    const prontasNaoPagas = PEDIDOS.filter(p => [...PRONTAS, 'Concluído'].includes(p.status) && saldo(p) > 0).sort((x, y) => saldo(y) - saldo(x));
    const atr = abertas.filter(atrasada).length;
    const hoje = abertas.filter(urgeHoje).length;
    const fatN = DADOS.faturamento.length, emitirN = DADOS.notas.filter(n => n.pronta).length;
    const mesNome = MESES[m - 1], mesAnt = MESES[(m + 10) % 12];
    const serie = [...V.serieDia].reverse();
    const mediaDia = serie.length ? serie.reduce((s, x) => s + x.centavos, 0) / serie.length : 0;
    const ult7 = serie.slice(-7);
    const fechouAnt = V.serieMes.find(s => s.rotulo === isoDe(new Date(a, m - 2, 1)).slice(0, 7))?.centavos || 0;
    const [cardFat, cardNotas] = blocoFiscal();
    return {
      // Os selos levam ao quadro do assunto, que fica no módulo dele. O vendido
      // hoje não entra: é o primeiro número, logo abaixo.
      resumo: [atr && ['atraso', 'alert-triangle', plural(atr, 'O.S. atrasada', 'O.S. atrasadas'), 'bloco-esteira'], hoje && ['hoje', 'calendar-clock', plural(hoje, 'prazo hoje', 'prazos hoje'), 'card-hoje'],
        fatN && ['fin', 'badge-check', plural(fatN, 'faturamento para aprovar', 'faturamentos para aprovar'), 'card-faturamento'], emitirN && ['', 'file-text', plural(emitirN, 'nota para emitir', 'notas para emitir'), 'card-notas']],
      numeros: numeros([
        // Sem seta de comparação: até o dia fechar, a venda parcial contra a
        // média de um dia inteiro apareceria sempre como queda. A média fica
        // escrita embaixo, e a série dos últimos dias ao lado.
        { rot: 'Vendas hoje', icone: 'shopping-bag', area: 'fin', laranja: true, val: dinheiro(V.hoje),
          mini: ult7.length > 1 ? MED.mini(ult7.map(s => s.centavos), ult7.at(-1).rotulo === HOJE ? ult7.length - 1 : -1) : '',
          // Embaixo, só o essencial; a frase inteira fica na dica.
          ctx: `média/dia <b>${reais(mediaDia)}</b>`, href: '/vendas', title: `${reais(V.hoje, true)} até agora · média de ${reais(mediaDia)} por dia com venda` },
        { rot: `Vendas em ${mesNome}`, icone: 'trending-up', area: 'fin', val: dinheiro(V.bruto), tend: tendencia(V.bruto, A.bruto, `1 a ${Math.min(dia, new Date(a, m - 1, 0).getDate())} de ${mesAnt}`),
          med: fechouAnt ? MED.partes([{ v: Math.min(V.bruto, fechouAnt) }], fechouAnt) : '',
          ctx: fechouAnt ? `<b>${pctDe(V.bruto, fechouAnt)}%</b> de ${mesAnt} · ${reais(fechouAnt)}` : '',
          href: '/vendas', title: `${reais(V.bruto, true)}${fechouAnt ? ` · ${pctDe(V.bruto, fechouAnt)}% do que ${mesAnt} fechou (${reais(fechouAnt)})` : ''}` },
        { rot: 'Recebido no mês', icone: 'wallet', area: 'fin', val: dinheiro(V.recebido),
          med: V.bruto ? MED.partes([{ v: Math.min(V.recebido, V.bruto) }], V.bruto) : '',
          ctx: V.bruto ? `<b>${pctDe(V.recebido, V.bruto)}%</b> do vendido` : '', href: '/vendas', title: `${reais(V.recebido, true)} recebidos das vendas de ${mesNome}` },
        // A barra continua mostrando a parte já pronta para cobrar (o trecho
        // escuro); o valor dela fica na dica.
        { rot: 'A receber', icone: 'hand-coins', area: 'fin', val: dinheiro(totalReceber),
          med: totalReceber ? MED.partes([{ v: prontoCobrar }, { v: totalReceber - prontoCobrar, cls: 'claro' }], totalReceber) : '',
          ctx: plural(aReceber.length, 'O.S.', 'O.S.'), href: '/baixa',
          title: `${reais(totalReceber, true)} a receber em ${plural(aReceber.length, 'O.S. aberta', 'O.S. abertas')}${prontoCobrar ? ` · ${reais(prontoCobrar)} já prontos para cobrar` : ''}` },
      ]),
      // Do que pede ação hoje ao que é acompanhamento: a produção (os prazos
      // do dia e a esteira), o caixa (contas, o que cobrar, faturamento e
      // notas) e, por fim, as vendas do mês. Ao lado, só os avisos.
      principal: [
        secao('Produção', 'layers', [blocoHoje(), blocoEsteira()]),
        secao('Financeiro', 'wallet', [pilhas([blocoContas(), blocoCobrar(prontasNaoPagas, 'Prontas e não pagas')], [cardFat, cardNotas])]),
        secao('Vendas', 'trending-up', [blocoVendas(), blocoCriacao()]),
      ],
      // A visão Geral é só do Administrador: os avisos da gráfica e o que está
      // no nome da pessoa, juntos na coluna que acompanha a rolagem.
      lado: [secao('Avisos', 'bell', [blocoPendencias(eu, { so: AVISOS_GERAIS, titulo: 'Avisos gerais', vazioTxt: 'Nenhum aviso geral agora.', contasNoCard: 'card-contas' }), blocoNoSeuNome(eu)])],
    };
  },

  // Atendimento. Regra para o que entra: muda o que a pessoa do balcão vai
  // fazer hoje? Regra para como mostrar: quantidade vira número (que leva ao
  // card), coisa para resolver uma a uma vira lista, e cada linha traz à
  // direita só o dado que decide a ação daquela lista, com cor só se urge.
  // Cada assunto tem card próprio e lugar fixo; card vazio encolhe. Cada fato
  // aparece uma vez como número e uma vez como lista: sem selo no topo e sem
  // repetir no "Precisa de você" o que já tem card.
  Atendimento(eu) {
    const amanha = somarDias(HOJE, 1);
    const minhasFila = abertas.filter(p => FILA.includes(p.status) && doLado(p, eu));
    const mAtr = minhasFila.filter(atrasada).length, mHoje = minhasFila.filter(ehHoje).length, mAmanha = minhasFila.filter(p => p.prazo === amanha).length;
    const cobrar = mAtr + mHoje + mAmanha;
    const avisar = abertas.filter(p => p.status === 'Avisar Cliente').sort(porPrazo);
    const avisarSaldo = avisar.filter(p => saldo(p) > 0).length;
    const entregar = abertas.filter(p => p.status === 'Entrega').sort(porPrazo);
    const entAtr = entregar.filter(atrasada).length, entHoje = entregar.filter(ehHoje).length;
    const futura = abertas.filter(p => p.locais.some(l => l.toLowerCase().includes('futura')) && !PRONTAS.includes(p.status)).sort(porPrazo);
    const buscar = futura.filter(p => p.prazo && p.prazo <= amanha).length;
    const parada = abertas.filter(p => p.status === 'Retirada' && p.retirada && diasEntre(p.retirada, HOJE) > 7).sort((x, y) => x.retirada.localeCompare(y.retirada));
    // Paradas antes de entrar na produção, esperando o cliente pagar ou
    // responder: acompanhar é do balcão. A mais antiga em cima.
    const esperando = abertas.filter(p => ['Aguardando Pagamento', 'Aguardando Retorno'].includes(p.status)).sort((x, y) => (x.venda || '9999').localeCompare(y.venda || '9999') || x.id - y.id);
    // "1 atrasada · 2 hoje": só as partes que existem; a primeira pode ir em vermelho
    const partes = (...ps) => ps.filter(([n]) => n).map(([n, txt, cls]) => `<span class="${cls || ''}">${n} ${txt}</span>`).join(' · ');

    // Um card por assunto. Vazio, encolhe para o cabeçalho com "nada agora".
    const card = (id, cls, icone, titulo, lista, linha, meta, urgente) => lista.length
      ? area(`${cls}${urgente ? ' elevado' : ''}`, icone, titulo, meta || String(lista.length), `<ul class="lista">${lista.slice(0, 5).map(linha).join('')}</ul>`, lista.length > 5 ? ver(`Ver as ${lista.length}`, '/producao') : '', '', id)
      : area(`${cls} compacto`, icone, titulo, 'nada agora', '', '', '', id);

    return {
      resumo: [],
      numeros: numeros([
        // O número tem o nome do card a que leva; o que vence até amanhã (o
        // "cobrar a produção") vai escrito embaixo.
        { rot: 'Sua fila na produção', icone: 'layers', area: mAtr ? 'perigo' : 'obs', laranja: cobrar > 0 && !mAtr, val: minhasFila.length, alvo: 'bloco-produzir',
          ctx: cobrar ? partes([mAtr, mAtr === 1 ? 'atrasada' : 'atrasadas', 'desce'], [mHoje, 'hoje'], [mAmanha, 'amanhã']) : minhasFila.length ? 'nada vencendo até amanhã' : 'nada no seu nome' },
        { rot: 'Avisar cliente', icone: 'megaphone', area: 'itens', val: avisar.length, alvo: 'card-avisar',
          ctx: avisar.length ? (avisarSaldo ? `${avisarSaldo} com saldo a receber` : 'todas pagas') : 'nada pronto agora' },
        { rot: 'Entregar', icone: 'package-check', area: 'fin', val: entregar.length, alvo: 'card-entregar',
          ctx: entregar.length ? (entAtr || entHoje ? partes([entAtr, entAtr === 1 ? 'atrasada' : 'atrasadas', 'desce'], [entHoje, 'hoje']) : 'todas no prazo') : 'nada saindo' },
        { rot: 'Na Futura', icone: 'truck', area: 'dados', val: futura.length, alvo: 'card-futura',
          ctx: futura.length ? (buscar ? `<span class="${futura.some(p => p.prazo && p.prazo <= HOJE) ? 'desce' : ''}">${buscar} para buscar até amanhã</span>` : 'nenhuma vencendo') : 'nada lá agora' },
      ]),
      // Embaixo da fila, duas pilhas: à esquerda o que sai (avisar, buscar na
      // Futura); à direita o que entrega e o que está parado esperando o
      // cliente, antes da produção ou depois de pronto.
      principal: [
        blocoProduzir(eu),
        pilhas([
          card('card-avisar', 'a-itens', 'megaphone', 'Avisar cliente', avisar,
            p => linhaLimpa(p, saldo(p) > 0 ? `<span class="pz amanha">falta ${reais(saldo(p))}</span>` : '<span class="pz">pago</span>'), '', avisar.length > 0),
          card('card-futura', 'a-dados', 'truck', 'Prazos da Futura', futura, p => linhaLimpa(p, prazoTexto(p)), buscar ? `${buscar} para buscar de ${futura.length}` : '', futura.some(p => p.prazo && p.prazo <= HOJE)),
        ], [
          card('card-entregar', 'a-fin', 'package-check', 'Entregar', entregar, p => linhaLimpa(p, prazoTexto(p)), '', entAtr + entHoje > 0),
          card('card-esperando', 'a-dados', 'hourglass', 'Esperando o cliente', esperando,
            p => linhaLimpa(p, `<span class="pz">${p.venda ? 'aberta ' + haQuanto(p.venda) : ''}</span><small>${esc(CURTO[p.status] || p.status)}</small>`)),
          card('card-retirada', 'a-obs', 'package-open', 'Parado na retirada', parada, p => linhaLimpa(p, `<span class="pz">${diasEntre(p.retirada, HOJE)} dias</span>`), parada.length ? `${parada.length} há mais de 7 dias` : ''),
        ]),
      ],
      // O que os cards já mostram não se repete aqui.
      lado: [blocoPendencias(eu, { tirar: ['retirada', 'futura', 'avisar'] })],
    };
  },

  // Produção: a fila — o que fazer agora, na ordem do prazo e do horário.
  // Aqui "na fila" não conta Produzir: o que vai para o nome de quem faz a mão
  // de obra já está em Produção. As terceirizadas continuam olhando a fila toda.
  Produção(eu) {
    const fila = abertas.filter(p => FILA_PRODUCAO.includes(p.status)).sort(porPrazo);
    const daProducao = p => !FORA_DA_PRODUCAO.includes(p.status);
    // Para hoje: o que está na fila e o que já ficou pronto e ainda sai
    // (Entrega). Quem espera o cliente, Produzir, Avisar e Retirada ficam de fora.
    const hoje = abertas.filter(p => urgeHoje(p) && daProducao(p) && (FILA_PRODUCAO.includes(p.status) || PRONTAS.includes(p.status))).sort(porPrazo);
    const hojeNaFila = hoje.filter(p => FILA_PRODUCAO.includes(p.status)).length, hojeProntas = hoje.length - hojeNaFila;
    const fora = abertas.filter(p => FILA.includes(p.status) && foraDeCasa(p).length).sort(porPrazo);
    // A fila em duas: a da pessoa, que é o trabalho dela, e a do resto da
    // equipe (com as bolinhas de quem está com cada uma; sem ninguém, avisa).
    const minhas = fila.filter(p => doLado(p, eu));
    const outras = fila.filter(p => !doLado(p, eu));
    const terceirizadas = area('a-dados', 'truck', 'Terceirizadas', fora.length ? String(fora.length) : '', fora.length ? `<ul class="lista">${fora.slice(0, 8).map(p => linhaOS(p, `${seloPrazo(p)}<small>${esc(foraDeCasa(p).join(', '))}</small>`)).join('')}</ul>` : vazio('Nada fora da casa.'), fora.length > 8 ? ver(`Ver as ${fora.length}`, '/producao') : '');
    const porLocal = {};
    fora.forEach(p => foraDeCasa(p).forEach(l => { (porLocal[l] ||= []).push(p); }));
    const comHora = hoje.filter(p => p.hora).length;
    const urgente = p => atrasada(p) || urgeHoje(p);
    const minhasHoje = minhas.filter(urgente).length, minhasAmanha = minhas.filter(p => p.prazo === somarDias(HOJE, 1)).length;
    const corUrgencia = p => urgente(p) ? 'var(--perigo)' : urgeAmanha(p) ? 'var(--obs)' : 'var(--itens)';
    // Quem produz abre a tela pelo que é dela: o número em destaque é "suas
    // para hoje", e o da equipe vem ao lado. Quem só acompanha a fila (o
    // administrador nesta visão) continua vendo primeiro o da equipe.
    const pessoal = EQUIPE[eu]?.nivel === 'Produção';
    const celMinhas = pessoal
      ? { rot: 'Suas para hoje', icone: 'calendar-clock', area: minhasHoje ? 'perigo' : 'dados', laranja: true, val: minhasHoje, alvo: 'bloco-suas',
          ctx: minhas.length ? [minhasAmanha ? `${minhasAmanha} amanhã` : '', `${minhas.length} no seu nome`].filter(Boolean).join(' · ') : 'nada no seu nome' }
      // Quantas da fila estão no nome da pessoa: as de hoje (e atrasadas) em
      // vermelho, as de amanhã em âmbar, como na lista. Leva a "Suas próximas".
      : { rot: 'No seu nome', icone: 'user-check', area: 'itens', val: minhas.length, alvo: 'bloco-suas',
          med: unidSe(minhas, corUrgencia, tituloOS),
          ctx: minhas.length ? ([[minhasHoje, 'hoje'], [minhasAmanha, 'amanhã']].filter(([n]) => n).map(([n, t]) => `${n} ${t}`).join(' · ') || 'nenhuma para hoje') : 'nada agora' };
    const celEquipe = { rot: pessoal ? 'Para hoje na equipe' : 'Para hoje', icone: pessoal ? 'users' : 'calendar-clock', area: pessoal ? 'itens' : hoje.length ? 'perigo' : 'dados', laranja: !pessoal, val: hoje.length, href: '/producao',
      ctx: hoje.length ? [partesOu([['var(--obs)', `${hojeNaFila} na fila`, hojeNaFila, 'todas na fila'], ['var(--fin)', plural(hojeProntas, 'pronta', 'prontas'), hojeProntas, hojeProntas === 1 ? 'já pronta' : 'todas prontas']]), comHora ? `${comHora} com horário` : ''].filter(Boolean).join(' · ') : 'nenhuma' };
    return {
      // Sem selo no topo: o que ele diria está nos números logo abaixo.
      resumo: [],
      numeros: numeros([
        ...(pessoal ? [celMinhas, celEquipe] : [celEquipe, celMinhas]),
        { rot: 'Na fila', icone: 'layers', area: 'itens', val: fila.length, href: '/producao',
          med: unidSe(fila, p => COR[p.status], tituloOS),
          ctx: partesOu(FILA_PRODUCAO.map(e => { const n = fila.filter(p => p.status === e).length; return [COR[e], `${CURTO[e] || e} ${n}`, n, `todas em ${CURTO[e] || e}`]; })) || 'vazia' },
        { rot: 'Em terceirizadas', icone: 'truck', area: 'dados', val: fora.length, href: '/producao',
          med: unidSe(fora, p => corLocal(foraDeCasa(p)[0]), p => `${tituloOS(p)} · ${foraDeCasa(p).join(', ')}`),
          ctx: partesOu(Object.entries(porLocal).map(([l, ps]) => [corLocal(l), `${esc(l)} ${ps.length}`, ps.length, `só ${esc(l)}`])) || 'nenhuma' },
      ]),
      // No quadro grande, o que está no nome da pessoa; embaixo, o resto da
      // fila, com quem está cada uma. As terceirizadas vão para a coluna ao lado.
      principal: [
        area('a-itens elevado', 'list-ordered', 'Suas próximas<small>no seu nome, pelo prazo</small>', minhas.length ? plural(minhas.length, 'O.S.', 'O.S.') : '',
          minhas.length ? listaEmGrupos(gruposDePrazo(minhas, linhaProducao)) : vazio('Nada no seu nome na fila.'), ver('Abrir a Produção', '/producao'), '', 'bloco-suas'),
        area('a-itens', 'users', 'Com outras pessoas<small>o resto da fila</small>', outras.length ? plural(outras.length, 'O.S.', 'O.S.') : '',
          outras.length ? `<ul class="lista">${outras.slice(0, 8).map(linhaOutraProducao).join('')}</ul>` : vazio('Nada com o resto da equipe.'), outras.length > 8 ? ver(`Ver as ${outras.length}`, '/producao') : ''),
        // A esteira só marca atraso nas etapas da produção.
        blocoEsteira(ETAPAS.filter(e => !FILA_PRODUCAO.includes(e))),
        area('a-obs', 'shopping-cart', 'Material pedido', DADOS.requisicoes.length ? String(DADOS.requisicoes.length) : '', DADOS.requisicoes.length ? `<ul class="lista">${DADOS.requisicoes.slice(0, 6).map(r => `<li><a class="lin" href="#" data-ir="/comunicacao">${r.quando ? dataEmBloco(r.quando, true) : ''}<span class="lin-txt"><span class="lin-tit">${esc(r.itens)}</span><span class="lin-sub">${!r.quando ? 'pedido' : diasEntre(r.quando, HOJE) ? `pedido há ${plural(diasEntre(r.quando, HOJE), 'dia', 'dias')}` : 'pedido hoje'}</span></span></a></li>`).join('')}</ul>` : vazio('Nenhum material pendente.')),
      ],
      // O caixa e o fiscal não competem a quem produz: saem do "Precisa de você".
      lado: [blocoPendencias(eu, { tirar: ['conta', 'boleto', 'faturamento', 'nf-emitir', 'nf-preencher', 'link'] }), terceirizadas],
      // No celular a fila vem antes dos avisos: é o trabalho da pessoa.
      filaPrimeiro: true,
    };
  },

  // Financeiro: o caixa — o que vence, o que falta receber, o que falta baixar.
  Financeiro(eu) {
    const V = DADOS.vendas.mes;
    const [a, m] = HOJE.split('-').map(Number);
    const limite = somarDias(HOJE, 7);
    const fimMes = isoDe(new Date(a, m, 0));
    const naoPagas = DADOS.contas.filter(c => c.status !== 'Pago');
    const vencidas = naoPagas.filter(c => c.vencimento && c.vencimento < HOJE);
    const vencValor = vencidas.reduce((s, c) => s + c.valor, 0), vencSemValor = vencidas.filter(c => !c.valor).length;
    const semana = naoPagas.filter(c => c.vencimento && c.vencimento >= HOJE && c.vencimento <= limite);
    const darBaixa = PEDIDOS.filter(p => p.status === 'Concluído' && saldo(p) <= 0);
    const prontasNaoPagas = PEDIDOS.filter(p => [...PRONTAS, 'Concluído'].includes(p.status) && saldo(p) > 0).sort((x, y) => saldo(y) - saldo(x));
    // O caixa do mês: o que entrou das vendas menos o que já saiu em despesas.
    // Não é lucro — o que ainda vence até o fim do mês vai na terceira linha,
    // tirado das contas em aberto (as vencidas entram: continuam por pagar).
    const caixa = V.recebido - V.despesas.pago;
    const aPagarMes = naoPagas.filter(c => c.vencimento && c.vencimento <= fimMes);
    const aPagarValor = aPagarMes.reduce((s, c) => s + c.valor, 0), aPagarSemValor = aPagarMes.filter(c => !c.valor).length;
    const sobra = caixa - aPagarValor;
    const mesNome = MESES[m - 1];
    // A semana dia a dia: quanto vence em cada um dos próximos oito dias.
    const dias = Array.from({ length: 8 }, (_, k) => somarDias(HOJE, k));
    const porDia = dias.map(d => semana.filter(c => c.vencimento === d).reduce((s, c) => s + c.valor, 0));
    const totalFormas = V.formas.reduce((s, f) => s + f.centavos, 0);
    const linhasCaixa = [['Recebido das vendas', V.recebido, ''], ['Despesas pagas', V.despesas.pago, 'var(--tinta-fraca)'], [`A pagar até ${ddmm(fimMes)}`, aPagarValor, 'var(--obs)']];
    const maiorCaixa = Math.max(1, ...linhasCaixa.map(x => x[1]));
    const cardCaixa = area('a-fin', 'scale', `Caixa de ${mesNome}`, '', `<div class="area-corpo">
        <div class="saldo-grande"><b class="num ${caixa < 0 ? 'desce' : ''}">${reais(caixa)}</b><span>entrou − saiu, até hoje</span></div>
        <ul class="rank" style="padding:4px 0 0">
        ${linhasCaixa.map(([r, v, cor], k) => `<li style="padding:7px 0;grid-template-columns:minmax(0,1fr) auto"><span class="nome">${r}</span><span class="v num">${reais(v)}</span><span class="trilho" style="grid-column:1/-1"><i class="cx" style="width:${Math.max(2, v / maiorCaixa * 100)}%;--i:${k};${cor ? `opacity:1;background:${cor}` : ''}"></i></span></li>`).join('')}
        </ul>
        <p class="nota">${ico('info')}<span>${aPagarMes.length ? `Pagando tudo o que vence até ${ddmm(fimMes)}, ${sobra >= 0 ? `sobram <b>${reais(sobra)}</b>` : `faltam <b>${reais(-sobra)}</b>`}${aPagarSemValor ? ` · ${plural(aPagarSemValor, 'conta ainda sem valor', 'contas ainda sem valor')}` : ''}` : `Nenhuma conta em aberto até ${ddmm(fimMes)}`}</span></p>
        ${V.semBaixa.qtd ? `<p class="nota">${ico('info')}<span>${plural(V.semBaixa.qtd, 'O.S. concluída', 'O.S. concluídas')} sem pagamento lançado · <b>${reais(V.semBaixa.centavos)}</b></span></p>` : ''}</div>`, ver('Abrir Vendas', '/vendas'));
    // Dar baixa é uma ação em lote: basta dizer quantas são e levar até lá.
    const cardBaixa = darBaixa.length
      ? area('a-dados', 'check-check', 'Para dar baixa', String(darBaixa.length), `<div class="area-corpo">${plural(darBaixa.length, 'O.S. concluída e quitada', 'O.S. concluídas e quitadas')}, somando <b class="num">${reais(darBaixa.reduce((s, p) => s + p.valor, 0))}</b>. Só falta encerrar.</div>`, ver('Dar baixa', '/baixa'), '', 'card-baixa')
      : area('a-dados compacto', 'check-check', 'Para dar baixa', 'nada agora', '', '', '', 'card-baixa');
    return {
      // Sem selo no topo: o que ele diria está nos números logo abaixo.
      resumo: [],
      numeros: numeros([
        { rot: 'A pagar em 7 dias', icone: 'receipt', area: 'fin', laranja: true, val: dinheiro(semana.reduce((s, c) => s + c.valor, 0)), alvo: 'card-contas',
          mini: semana.length ? MED.mini(porDia, 0) : '',
          ctx: semana.length ? `${plural(semana.length, 'conta', 'contas')} · hoje ${porDia[0] ? reais(porDia[0]) : 'nada'}` : 'nenhuma conta' },
        // O valor em atraso só quando existe: conta vencida "a definir" não
        // soma, e "R$ 0,00 em atraso" ao lado de 3 vencidas parecia erro.
        { rot: 'Contas vencidas', icone: 'alert-triangle', area: vencidas.length ? 'perigo' : 'dados', val: vencidas.length, alerta: vencidas.length > 0, alvo: 'card-contas',
          ctx: vencidas.length ? (vencValor ? `<b>${reais(vencValor)}</b> em atraso${vencSemValor ? ` · ${vencSemValor} sem valor` : ''}` : 'valor a definir') : 'nenhuma' },
        { rot: 'Prontas e não pagas', icone: 'hand-coins', area: 'fin', val: dinheiro(prontasNaoPagas.reduce((s, p) => s + saldo(p), 0)), alvo: 'card-cobrar',
          ctx: plural(prontasNaoPagas.length, 'O.S. pronta esperando pagamento', 'O.S. prontas esperando pagamento') },
        { rot: 'Para dar baixa', icone: 'check-check', area: 'dados', val: darBaixa.length, href: '/baixa',
          ctx: darBaixa.length ? 'concluídas e quitadas' : 'nenhuma' },
      ]),
      // Duas pilhas: à esquerda o que sai e o que falta cobrar; à direita o
      // caixa do mês, os boletos a receber e a baixa.
      principal: [
        pilhas([blocoContas(true), blocoCobrar(prontasNaoPagas, 'Prontas e não pagas')], [cardCaixa, blocoBoletos(), cardBaixa]),
      ],
      // Só o que é do caixa: produção, Futura e balcão ficam nas visões deles.
      lado: [blocoPendencias(eu, { tirar: ['futura', 'atrasada', 'retirada', 'avisar'], contasNoCard: 'card-contas' }),
        composicao({ cls: 'a-fin', icone: 'wallet', titulo: `Como pagaram em ${mesNome}`, itens: V.formas, rotulo: f => f.rotulo, cor: f => corForma(f.rotulo),
          frase: i => `pago em <b>${esc(i.rot)}</b>`, todo: totalFormas, pe: ver('Ver tudo', '/vendas') })],
    };
  },
};

/* ===== render ===== */
const tela = document.getElementById('tela');
function saudacao() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
// O fundo do controle de segmentos desliza até o botão escolhido; `de` é o
// botão de onde ele sai (sem `de`, já aparece no lugar).
function moverTrilho(segEl, de) {
  const tr = segEl?.querySelector('.seg-trilho'), alvo = segEl?.querySelector('[aria-pressed="true"]');
  if (!tr || !alvo) return;
  const por = el => { tr.style.width = `${el.offsetWidth}px`; tr.style.transform = `translateX(${el.offsetLeft}px)`; };
  if (de) { tr.style.transition = 'none'; por(de); tr.offsetWidth; tr.style.transition = ''; }
  else { tr.style.transition = 'none'; por(alvo); tr.offsetWidth; tr.style.transition = ''; return; }
  por(alvo);
}
// A coluna ao lado acompanha a rolagem. Mais alta que a janela, ela sobe até o
// fim aparecer e para ali: o lado direito não fica vazio numa tela comprida.
function ajustarLado() {
  const lado = tela.querySelector('.lado');
  if (!lado) return;
  const fixo = innerWidth > 960;
  lado.classList.toggle('fixo', fixo);
  lado.style.top = fixo ? `${Math.min(71, innerHeight - lado.offsetHeight - 16)}px` : '';
}
function render(anterior) {
  const p = EQUIPE[est.eu] || { nome: est.eu, nivel: 'Administrador' };
  const doCargo = TELAS[p.nivel] ? p.nivel : 'Administrador';
  const podeTrocar = p.nivel === 'Administrador';
  const visao = podeTrocar && est.visao ? est.visao : doCargo;
  const t = TELAS[visao](p.nome);
  const d = dataLocal(HOJE);
  const ordem = VISOES.findIndex(([id]) => id === visao);
  tela.innerHTML = `
    <div class="cab"><div><h1>${saudacao()}, ${esc(p.nome.split(' ')[0])}</h1>
      <p class="sub"><span>${maiuscula(SEMANA[d.getDay()])}, ${d.getDate()} de ${MESES[d.getMonth()]}</span>${t.resumo.filter(Boolean).map(([tom, ic, txt, alvo]) => alvo
        ? `<a class="selo ${tom}" href="#${alvo}" data-rolar="${alvo}">${ico(ic)}${txt}</a>`
        : `<span class="selo ${tom}">${ico(ic)}${txt}</span>`).join('')}</p></div>
      ${podeTrocar ? seg('Visão do Início', VISOES, visao, 'data-visao') : ''}</div>
    ${t.numeros}
    <div class="grade ${t.filaPrimeiro ? 'fila-primeiro' : ''}"><div class="col">${t.principal.join('')}</div><div class="col lado">${t.lado.join('')}</div></div>`;
  document.getElementById('vercomo').innerHTML = `${ico('eye', 'ico ico-s')}<span class="rot">Ver como</span>${bolinha(p.nome)}<span>${esc(p.nome)}</span>${ico('chevron-down', 'ico ico-s chev')}`;
  lucide.createIcons();
  const segVisao = tela.querySelector('.cab .seg');
  moverTrilho(segVisao, anterior != null ? segVisao?.querySelectorAll('button')[anterior] : null);
  tela.querySelectorAll('.seg.peq').forEach(x => moverTrilho(x));
  ajustarLado();
  animarEntrada(anterior == null ? 0 : Math.sign(ordem - anterior));
}

// A entrada da tela. `lado` 0 = abrindo (os quadros sobem); 1 ou -1 = troca
// de visão (vêm da direita ou da esquerda, como nas abas). A ordem é a de
// leitura — de cima para baixo, da esquerda para a direita — e a espera para
// no décimo quadro, para nada ficar esperando por quem está lá embaixo.
function animarEntrada(lado) {
  tela.classList.toggle('lateral', lado !== 0);
  tela.style.setProperty('--dx', `${lado < 0 ? -16 : 16}px`);
  const marcar = (el, d) => { el.style.setProperty('--d', `${d}ms`); el.classList.add('entra'); };
  let t = 0;
  if (lado === 0) { marcar(tela.querySelector('.cab'), 0); t = 70; }
  const faixa = tela.querySelector('.numeros');
  if (faixa) { marcar(faixa, t); faixa.querySelectorAll('.n-cel').forEach((c, k) => marcar(c, t + 60 + k * 55)); t += 200; }
  const linha = el => Math.round(el.getBoundingClientRect().top / 12);
  [...tela.querySelectorAll('.grade .area')]
    .sort((a, b) => linha(a) - linha(b) || a.getBoundingClientRect().left - b.getBoundingClientRect().left)
    .forEach((el, k) => marcar(el, t + Math.min(k, 9) * 60));
}

/* ===== Ver como ===== */
let popAberto = null;
function fecharPop() { if (!popAberto) return; popAberto.el.remove(); popAberto.ancora.setAttribute('aria-expanded', 'false'); popAberto = null; }
function abrirVerComo(ancora) {
  if (popAberto) return fecharPop();
  const ordem = ['Administrador', 'Atendimento', 'Produção', 'Financeiro'];
  const grupos = ordem.map(c => [c, DADOS.equipe.filter(p => p.nivel === c)]).filter(([, l]) => l.length);
  const el = document.createElement('div');
  el.className = 'pop'; el.setAttribute('role', 'menu');
  el.innerHTML = grupos.map(([c, l]) => `<div class="rot">${c}</div>${l.map(p => `<button role="menuitem" data-pessoa="${esc(p.nome)}">${bolinha(p.nome)}${esc(p.nome)}${p.nome === est.eu ? ico('check', 'ico ico-s ok') : ''}</button>`).join('')}`).join('');
  document.body.appendChild(el);
  const r = ancora.getBoundingClientRect();
  el.style.top = `${r.bottom + 6}px`;
  el.style.left = `${Math.max(8, Math.min(r.right - el.offsetWidth, innerWidth - el.offsetWidth - 8))}px`;
  ancora.setAttribute('aria-expanded', 'true');
  popAberto = { el, ancora };
  lucide.createIcons();
  el.querySelector('button')?.focus();
}

/* ===== dica dos gráficos ===== */
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
function mostrarDica(alvo) {
  const [tit, val] = alvo.dataset.tip.split('|');
  tip.innerHTML = ''; const b = document.createElement('b'); b.textContent = val; tip.append(b, document.createTextNode(tit));
  tip.hidden = false;
  const r = alvo.getBoundingClientRect();
  tip.style.left = `${Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2))}px`;
  tip.style.top = `${Math.max(56, r.top - tip.offsetHeight - 6)}px`;
}
document.addEventListener('pointerover', e => {
  const a = e.target.closest?.('[data-tip]'); if (a) mostrarDica(a);
  const pe = e.target.closest?.('.rosca-wrap [data-p]'), wrap = e.target.closest?.('.rosca-wrap');
  if (wrap) {
    wrap.classList.toggle('focando', !!pe);
    wrap.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('aceso', !!pe && x.dataset.p === pe.dataset.p));
  }
});
document.addEventListener('pointerout', e => { const w = e.target.closest?.('.rosca-wrap'); if (w && !w.contains(e.relatedTarget)) w.classList.remove('focando'); });
document.addEventListener('pointerout', e => { if (e.target.closest?.('[data-tip]')) tip.hidden = true; });
document.addEventListener('focusin', e => { const a = e.target.closest?.('[data-tip]'); if (a) mostrarDica(a); else tip.hidden = true; });
addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

/* ===== troca de tema (a mesma do sistema) ===== */
let trocaAtual = null;
function trocarTema(escuro, origem, aplicar) {
  const raiz = document.documentElement;
  const trocar = () => { raiz.classList.toggle('dark', escuro); aplicar?.(); };
  if (!document.startViewTransition) return trocar();
  const r = origem?.getBoundingClientRect();
  const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top + r.height / 2 : innerHeight / 2;
  const raio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  raiz.dataset.trocaTema = '';
  const troca = document.startViewTransition(trocar); trocaAtual = troca;
  let anim;
  troca.ready.then(() => {
    const circulo = [`circle(0px at ${x}px ${y}px)`, `circle(${raio}px at ${x}px ${y}px)`];
    anim = raiz.animate(reduzido ? { opacity: escuro ? [0, 1] : [1, 0] } : { clipPath: escuro ? circulo : circulo.reverse() }, {
      duration: reduzido ? 200 : escuro ? 600 : 450, easing: reduzido ? 'ease' : escuro ? 'cubic-bezier(.45,0,.2,1)' : 'cubic-bezier(.8,0,.55,1)',
      fill: 'forwards', pseudoElement: escuro ? '::view-transition-new(root)' : '::view-transition-old(root)',
    });
  }).catch(() => {});
  const fim = () => { anim?.cancel(); if (trocaAtual === troca) delete raiz.dataset.trocaTema; };
  troca.finished.then(fim, fim);
}

/* ===== eventos ===== */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#vercomo')) return abrirVerComo(t.closest('#vercomo'));
  const pessoa = t.closest('[data-pessoa]');
  if (pessoa) { est.eu = pessoa.dataset.pessoa; est.visao = null; fecharPop(); render(); scrollTo(0, 0); return; }
  const vis = t.closest('[data-visao]');
  if (vis) {
    if (vis.getAttribute('aria-pressed') === 'true') return;
    const antes = [...vis.parentElement.querySelectorAll('button')].findIndex(b => b.getAttribute('aria-pressed') === 'true');
    est.visao = vis.dataset.visao; render(antes); return;
  }
  // Por dia / por mês: troca só o gráfico, sem redesenhar a tela.
  const serie = t.closest('[data-serie]');
  if (serie) {
    if (serie.getAttribute('aria-pressed') === 'true') return;
    const s = serie.parentElement, de = s.querySelector('[aria-pressed="true"]');
    est.serie = serie.dataset.serie;
    s.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === serie)));
    moverTrilho(s, de);
    const graf = document.getElementById('graf-vendas');
    graf.style.setProperty('--d', '-150ms');
    graf.innerHTML = grafVendas(est.serie);
    lucide.createIcons();
    return;
  }
  // Um dia do gráfico: a página abre o relatório do dia da tela de Vendas.
  const colDia = t.closest('[data-dia]');
  if (colDia) {
    tip.hidden = true;
    if (window.parent === window) return avisoProto('Fora do sistema o protótipo não abre o relatório do dia.');
    return paraPai({ tipo: 'abrir-dia', dia: colDia.dataset.dia });
  }
  const gv = t.closest('[data-gv]');
  if (gv) { e.preventDefault(); return acaoGaveta(gv.dataset.gv); }
  const linOS = t.closest('[data-os]');
  if (linOS && tela.contains(linOS)) { e.preventDefault(); return abrirGaveta('os', +linOS.dataset.os); }
  const linConta = t.closest('[data-conta]');
  if (linConta && tela.contains(linConta)) { e.preventDefault(); return abrirGaveta('conta', +linConta.dataset.conta); }
  const rolar = t.closest('[data-rolar]');
  if (rolar) {
    e.preventDefault();
    const alvo = document.getElementById(rolar.dataset.rolar);
    const card = alvo?.matches('.area') ? alvo : alvo?.querySelector('.area');
    if (card) {
      card.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      card.classList.remove('chegou'); void card.offsetWidth; card.classList.add('chegou');
    }
    return;
  }
  const esc_ = t.closest('[data-escopo]');
  if (esc_) {
    if (esc_.getAttribute('aria-pressed') === 'true') return;
    const de = est.escopo;
    est.escopo = esc_.dataset.escopo;
    const p = EQUIPE[est.eu] || { nome: est.eu };
    document.getElementById('bloco-produzir').outerHTML = blocoProduzir(p.nome);
    const s = document.getElementById('bloco-produzir').querySelector('.seg');
    moverTrilho(s, s.querySelector(`[data-escopo="${de}"]`));
    lucide.createIcons();
    return;
  }
  const per = t.closest('[data-criacao]');
  if (per) {
    if (per.getAttribute('aria-pressed') === 'true') return;
    const de = per.parentElement.querySelector('[aria-pressed="true"]')?.dataset.criacao;
    est.criacao = per.dataset.criacao;
    const bloco = document.getElementById('bloco-criacao');
    bloco.outerHTML = blocoCriacao();
    const novo = document.getElementById('bloco-criacao'), s = novo.querySelector('.seg');
    moverTrilho(s, s.querySelector(`[data-criacao="${de}"]`));
    lucide.createIcons();
    return;
  }
  if (popAberto && !t.closest('.pop')) fecharPop();
  if (t.closest('#tema')) {
    const bt = t.closest('#tema'), escuro = !document.documentElement.classList.contains('dark');
    trocarTema(escuro, bt, () => { bt.innerHTML = `<i data-lucide="${escuro ? 'sun' : 'moon'}" class="ico ico-s"></i><span class="txt-tema">${escuro ? 'Claro' : 'Escuro'}</span>`; lucide.createIcons(); });
    return;
  }
  const ir = t.closest('[data-ir]');
  if (ir) { e.preventDefault(); irPara(ir.dataset.ir); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && popAberto) { const a = popAberto.ancora; fecharPop(); a.focus(); return; }
  if (gaveta.tipo && e.key === 'Escape') { e.preventDefault(); return fecharGaveta(); }
  if (gaveta.tipo === 'os' && e.key === 'Enter' && !e.target.closest('button, a, input')) { e.preventDefault(); return acaoGaveta('abrir-os'); }
  if (popAberto && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const bs = [...popAberto.el.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus();
  }
});
addEventListener('resize', () => { fecharPop(); ajustarLado(); moverTrilho(tela.querySelector('.cab .seg')); tela.querySelectorAll('.seg.peq').forEach(x => moverTrilho(x)); });
render();
document.fonts?.ready.then(() => { moverTrilho(tela.querySelector('.cab .seg')); tela.querySelectorAll('.seg.peq').forEach(x => moverTrilho(x)); });
</script>
