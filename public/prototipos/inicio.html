<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novo Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Padrão do DESIGN.md: o mesmo mundo do modal de O.S., da nova Produção e da nova O.S. */
:root {
  --brand: #F69F00; --brand-hover: #d98b00; --brand-tinta: #8A5400; --sobre-brand: #241600;
  --fundo: #EDEFF0; --superficie: #ffffff; --sutil: #f9fafb; --realce: #f3f4f6;
  --borda-fraca: #f0f1f3; --borda: #e5e7eb; --borda-forte: #d1d5db;
  --tinta: #111827; --tinta-corpo: #374151; --tinta-suave: #6b7280; --tinta-fraca: #9ca3af;
  --perigo: #dc2626; --perigo-fundo: #fef2f2; --perigo-borda: #fecaca;
  --sucesso: #059669;
  --sombra-pop: 0 12px 28px -8px rgba(15,23,42,.24), 0 1px 3px rgba(15,23,42,.08);
  --sombra-leve: 0 1px 2px rgba(15,23,42,.06);
  /* cores de área: só no cabeçalho de cada bloco, no ícone e na meta dele */
  --dados: #475569; --dados-tinta: #334155; --dados-fundo: #f8fafc; --dados-borda: #e2e8f0;
  --itens: #2563eb; --itens-tinta: #1d4ed8; --itens-fundo: #eff6ff; --itens-borda: #dbeafe;
  --fin: #059669; --fin-tinta: #047857; --fin-fundo: #ecfdf5; --fin-borda: #c9f2df;
  --obs: #d97706; --obs-tinta: #b45309; --obs-fundo: #fffbeb; --obs-borda: #fdecc4;
  /* gravidade das pendências: as mesmas do sino */
  --g-critico: #dc2626; --g-atencao: #f59e0b; --g-tarefa: #3b82f6;
  --saida: cubic-bezier(.16, 1, .3, 1);
  /* paleta categórica (validada): fatias de quem não tem cor no sistema, em ordem fixa */
  --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a; --serie-4: #eda100; --serie-5: #e87ba4; --serie-6: #008300; --serie-7: #6250d6; --serie-8: #e34948;
}
.dark {
  --brand-tinta: #FFB938;
  --fundo: #0d1117; --superficie: #161b22; --sutil: #1b2129; --realce: #21262d;
  --borda-fraca: #232a33; --borda: #30363d; --borda-forte: #3d444d;
  --tinta: #EDEDED; --tinta-corpo: #D4D4D8; --tinta-suave: #A1A1AA; --tinta-fraca: #71717a;
  --perigo: #f87171; --perigo-fundo: rgba(239,68,68,.1); --perigo-borda: rgba(239,68,68,.3);
  --sucesso: #34d399;
  --sombra-pop: 0 12px 28px -8px rgba(0,0,0,.6); --sombra-leve: 0 1px 2px rgba(0,0,0,.4);
  --dados: #94a3b8; --dados-tinta: #cbd5e1; --dados-fundo: rgba(148,163,184,.08); --dados-borda: rgba(148,163,184,.22);
  --itens: #60a5fa; --itens-tinta: #93c5fd; --itens-fundo: rgba(59,130,246,.12); --itens-borda: rgba(59,130,246,.3);
  --fin: #34d399; --fin-tinta: #6ee7b7; --fin-fundo: rgba(16,185,129,.11); --fin-borda: rgba(16,185,129,.28);
  --obs: #fbbf24; --obs-tinta: #fcd34d; --obs-fundo: rgba(245,158,11,.1); --obs-borda: rgba(245,158,11,.26);
  --g-critico: #f87171; --g-atencao: #fbbf24; --g-tarefa: #60a5fa;
  --serie-1: #3987e5; --serie-2: #d95926; --serie-3: #199e70; --serie-4: #c98500; --serie-5: #d55181; --serie-6: #008300; --serie-7: #9085e9; --serie-8: #e66767;
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light; } html.dark { color-scheme: dark; }
body { font-family: Montserrat, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--tinta-corpo); background: var(--fundo); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: rgba(246,159,0,.3); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }
[hidden] { display: none !important; }
.ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.ico-s { width: 14px; height: 14px; }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex-shrink: 0; }
.num { font-variant-numeric: tabular-nums; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* cada área responde pela cor dela: faixa, ícone e meta (DESIGN.md › Áreas) */
.a-dados { --c: var(--dados); --c-tinta: var(--dados-tinta); --c-fundo: var(--dados-fundo); --c-borda: var(--dados-borda); }
.a-itens { --c: var(--itens); --c-tinta: var(--itens-tinta); --c-fundo: var(--itens-fundo); --c-borda: var(--itens-borda); }
.a-fin { --c: var(--fin); --c-tinta: var(--fin-tinta); --c-fundo: var(--fin-fundo); --c-borda: var(--fin-borda); }
.a-obs { --c: var(--obs); --c-tinta: var(--obs-tinta); --c-fundo: var(--obs-fundo); --c-borda: var(--obs-borda); }
.a-perigo { --c: var(--perigo); --c-tinta: var(--perigo); --c-fundo: var(--perigo-fundo); --c-borda: var(--perigo-borda); }

/* o único movimento da tela: ao abrir, as marcas crescem da linha de base */
@keyframes crescerY { from { transform: scaleY(0); } }
@keyframes crescerX { from { transform: scaleX(0); } }
@keyframes revelar { from { clip-path: inset(0 100% 0 0); } }
@keyframes surgir { from { opacity: 0; transform: scale(.3); } }
/* A tela entra: cada quadro sobe 14px e acende, um depois do outro, na ordem
   de leitura (--d, posto pelo render). Na troca de visão eles vêm do lado da
   opção escolhida (--dx). As marcas de dentro crescem depois que o quadro chegou. */
@keyframes entrarY { from { opacity: 0; transform: translateY(14px); } }
@keyframes entrarX { from { opacity: 0; transform: translateX(var(--dx, 16px)); } }
.entra { animation: entrarY .56s var(--saida) both; animation-delay: var(--d, 0ms); }
.lateral .entra { animation-name: entrarX; animation-duration: .44s; }
.cy { transform-origin: bottom; animation: crescerY .75s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 200ms + var(--i, 0) * 28ms); }
.cx { transform-origin: left; animation: crescerX .8s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 220ms + var(--i, 0) * 45ms); }
.rv { animation: revelar .9s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 220ms + var(--i, 0) * 45ms); }

/* moldura do protótipo */
.proto { position: sticky; top: 0; z-index: 40; height: 51px; display: flex; align-items: center; gap: 14px; padding: 8px 20px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.proto-nome { font-weight: 700; color: var(--tinta); white-space: nowrap; }
.proto-nota { color: var(--tinta-suave); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.proto-dir { margin-left: auto; display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
.proto-bt { display: inline-flex; align-items: center; gap: 6px; color: var(--tinta-corpo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
.proto-bt:hover, .proto-bt[aria-expanded="true"] { background: var(--realce); color: var(--tinta); }
.proto-bt .rot { color: var(--tinta-suave); font-weight: 500; }
.proto-bt .chev { color: var(--tinta-fraca); }

/* popover (Ver como) */
.pop { position: fixed; z-index: 90; min-width: 230px; max-height: min(460px, calc(100vh - 70px)); overflow-y: auto; padding: 4px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 9px; box-shadow: var(--sombra-pop); animation: pop .16s var(--saida); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.pop .rot { font-size: 11px; font-weight: 600; color: var(--tinta-suave); padding: 8px 10px 3px; }
.pop button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--tinta-corpo); }
.pop button:hover, .pop button:focus-visible { background: var(--realce); color: var(--tinta); outline: none; }
.pop .ok { margin-left: auto; color: var(--brand-tinta); }
.av { width: 22px; height: 22px; border-radius: 99px; display: inline-grid; place-items: center; font: 700 9.5px/1 Montserrat, sans-serif; flex-shrink: 0; }
.av.g { width: 30px; height: 30px; font-size: 11px; }

/* página */
.pg { max-width: 1280px; margin: 0 auto; padding: 26px 28px 64px; }
.cab { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.cab h1 { font-size: 22px; font-weight: 800; color: var(--tinta); letter-spacing: -.02em; line-height: 1.2; }
.cab .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: 7px; color: var(--tinta-suave); font-size: 12.5px; }
/* visão: quem é Administrador troca entre as quatro; os outros ficam na do cargo */
.seg { position: relative; margin-left: auto; display: inline-flex; background: var(--realce); border-radius: 8px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { position: relative; z-index: 1; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--tinta-suave); white-space: nowrap; transition: color .2s; }
.seg button:hover, .seg button[aria-pressed="true"] { color: var(--tinta); }
.seg-trilho { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 6px; background: var(--superficie); box-shadow: var(--sombra-leve); transition: transform .34s var(--saida), width .34s var(--saida); }
.seg.peq { margin-left: auto; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--c-borda); }
.seg.peq button { padding: 3px 10px; font-size: 12px; }
.seg.peq .seg-trilho { background: var(--c-fundo); box-shadow: inset 0 0 0 1px var(--c-borda); }

.selo { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; white-space: nowrap; background: var(--realce); color: var(--tinta-corpo); }
.selo .ico { width: 12px; height: 12px; }
a.selo:hover { text-decoration: underline; text-underline-offset: 2px; }
.selo.atraso { background: var(--perigo-fundo); color: var(--perigo); }
.selo.hoje { background: var(--obs-fundo); color: var(--obs-tinta); }
.selo.fin { background: var(--fin-fundo); color: var(--fin-tinta); }
.selo.itens { background: var(--itens-fundo); color: var(--itens-tinta); }

/* números do topo: uma peça só, dividida por fios. Cada número traz o
   contexto que o explica — a comparação, a parte, as O.S. uma a uma. */
.numeros { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; margin: 20px 0 22px; overflow: hidden; }
.n-cel { padding: 16px 18px 15px; border-left: 1px solid var(--borda-fraca); display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: background .12s; }
.n-cel:first-child { border-left: 0; }
a.n-cel:hover { background: var(--sutil); }
.n-topo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.n-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--c-fundo); color: var(--c); box-shadow: inset 0 0 0 1px var(--c-borda); flex-shrink: 0; }
.n-rot { font-size: 12px; font-weight: 600; color: var(--tinta-suave); line-height: 1.3; min-width: 0; }
.n-linha { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 36px; }
.n-val { font-size: 30px; font-weight: 700; color: var(--tinta); letter-spacing: -.022em; line-height: 1.15; white-space: nowrap; }
.n-val small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-right: 3px; letter-spacing: 0; }
.n-val.alerta { color: var(--perigo); }
.n-pe { margin-top: auto; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.n-ctx { font-size: 12px; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n-ctx b { color: var(--tinta-corpo); font-weight: 600; }
.leg-i { display: inline-flex; align-items: center; gap: 5px; }
.leg-i i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
/* subiu/desceu: palavra e ícone, não só a cor */
.tend { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; white-space: nowrap; background: var(--realce); color: var(--tinta-corpo); }
.tend .ico { width: 13px; height: 13px; }
.tend.sobe { background: var(--fin-fundo); color: var(--fin-tinta); }
.tend.desce { background: var(--perigo-fundo); color: var(--perigo); }
.sobe { color: var(--sucesso); font-weight: 600; }
.desce { color: var(--perigo); font-weight: 600; }
/* medidores: colunas da série recente, barra de proporção, uma marca por O.S. */
.n-mini { margin-left: auto; display: flex; align-items: flex-end; gap: 3px; height: 34px; flex-shrink: 0; }
.n-mini i { width: 7px; min-height: 2px; background: var(--c); opacity: .3; border-radius: 2px 2px 0 0; }
.n-mini i.aceso { opacity: 1; }
.medidor { display: flex; gap: 2px; height: 6px; border-radius: 3px; background: var(--realce); overflow: hidden; }
.medidor i { height: 100%; background: var(--c); border-radius: 3px; }
.medidor i.claro { opacity: .35; }
.medidor i.atr { background: var(--perigo); }
.medidor i.vazio { background: transparent; }
.unid { display: flex; flex-wrap: wrap; gap: 3px; }
.unid i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); animation: surgir .4s var(--saida) both; animation-delay: calc(var(--d, 0ms) + 240ms + var(--i, 0) * 14ms); }
.unid span { font-size: 11px; font-weight: 700; color: var(--tinta-suave); line-height: 9px; margin-left: 2px; }

/* grade: o trabalho à esquerda, "o que é seu agora" à direita */
.grade { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.cab + .grade { margin-top: 20px; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.lado.fixo { position: sticky; top: 71px; }
/* quem está com a O.S. ao lado do prazo, e não empilhado embaixo dele */
.lin-dir.junto { display: flex; align-items: center; gap: 10px; }
.lin-dir.junto .resp-mini { margin-top: 0; }
.lin-dir small.sem { color: var(--obs-tinta); }
/* quadrinho de data sem data: tracejado */
.diaf.sem { box-shadow: none; border: 1px dashed var(--borda-forte); }
.diaf.sem b { color: var(--tinta-fraca); }
.par { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
/* Visão Geral: os quadros andam juntos por módulo (Vendas, Financeiro,
   Produção e, ao lado, Avisos), cada grupo com um rótulo leve em cima. */
.secao { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.secao + .secao { margin-top: 12px; }
.secao-tit { display: flex; align-items: center; gap: 7px; margin-bottom: -10px; font-size: 13px; font-weight: 700; color: var(--tinta-suave); }
.secao-tit .ico { width: 15px; height: 15px; }

/* área: borda e faixa do cabeçalho na cor da área, corpo neutro */
.area { background: var(--superficie); border: 1px solid var(--c-borda); border-radius: 10px; overflow: hidden; min-width: 0; }
.area-cab { display: flex; align-items: center; gap: 10px; min-height: 47px; padding: 9px 14px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.area-ico { width: 26px; height: 26px; border-radius: 7px; background: var(--superficie); display: grid; place-items: center; color: var(--c); box-shadow: var(--sombra-leve); flex-shrink: 0; }
.area-cab h2 { font-size: 13.5px; font-weight: 700; color: var(--tinta); line-height: 1.3; }
.area-cab h2 small { display: block; font-size: 12px; font-weight: 500; color: var(--tinta-suave); }
/* Quadros que saem da mesa: o principal de cada visão e as pendências quando
   há atraso. Sombra no lugar da borda (nunca as duas), canto de janela,
   cabeçalho mais alto com uma linha de contexto e o ícone cheio. */
/* o número leva ao card sem escondê-lo sob a barra fixa do topo */
.area { scroll-margin-top: 76px; }
.area.compacto .area-cab { border-bottom: 0; }
.area.compacto .area-meta { color: var(--tinta-suave); font-weight: 500; }
.par:has(.compacto) { align-items: start; }
/* Par de listas de tamanhos muito diferentes: cada card na altura do que tem,
   em vez de esticar o menor e sobrar um bloco em branco. */
.par.solto { align-items: start; }
.area.chegou { animation: chegou 1.1s var(--saida); }
@keyframes chegou { 0%, 35% { box-shadow: 0 0 0 3px var(--c-borda), 0 0 0 6px color-mix(in srgb, var(--c) 18%, transparent); } }
.area.elevado { border: 0; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 16px 36px -18px rgba(15,23,42,.34); }
.area.elevado .area-cab { min-height: 60px; padding: 11px 16px; }
.area.elevado .area-cab h2 { font-size: 15px; }
.area.elevado .area-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--c); color: var(--superficie); box-shadow: none; }
.area.elevado .area-ico .ico { width: 18px; height: 18px; }
/* no escuro a sombra some no fundo: quem marca a borda é um fio da cor da área */
.dark .area.elevado { box-shadow: 0 0 0 1px var(--c-borda), 0 18px 40px -16px rgba(0,0,0,.8); }
/* O número laranja: o primeiro da faixa, o que a pessoa olha antes de tudo.
   Degradê leve da marca e texto Sobre-marca (branco sobre esse laranja não
   passa contraste). Por dentro os tokens são trocados para valer sobre o
   laranja — tintas e trilhos em marrom translúcido, vermelho mais escuro, e
   nas marcas o verde vira marrom e o âmbar vira creme —, e o resto acompanha. */
.n-cel.laranja {
  --tinta: #241600; --tinta-corpo: #3a2400; --tinta-suave: rgba(36,22,0,.78); --tinta-fraca: rgba(36,22,0,.66);
  --borda-fraca: rgba(36,22,0,.12); --realce: rgba(255,255,255,.34); --sutil: rgba(255,255,255,.2);
  --perigo: #8f1d10; --fin: #241600; --obs: #FFF6E3;
  --c: #241600; --c-tinta: #241600; --c-fundo: #241600; --c-borda: transparent;
  color: var(--tinta-corpo);
  background: linear-gradient(155deg, #FFB429 0%, #F69F00 55%, #F29400 100%);
  border-left: 0;
}
.dark .n-cel.laranja { background: linear-gradient(155deg, #F7A81B 0%, #E89600 55%, #DB8A00 100%); }
a.n-cel.laranja:hover { background: linear-gradient(155deg, #FFBA3B 0%, #F7A510 55%, #F39A0C 100%); }
.n-cel.laranja + .n-cel { border-left: 0; }
.n-cel.laranja .n-ico { color: #FFF6E3; }
.n-cel.laranja .tend, .n-cel.laranja .tend.sobe, .n-cel.laranja .tend.desce { background: rgba(255,255,255,.5); color: #241600; }
.n-cel.laranja .tend.desce { color: var(--perigo); }
.n-cel.laranja .unid i, .n-cel.laranja .leg-i i { box-shadow: 0 0 0 1px rgba(36,22,0,.2); }
.n-cel.laranja ::selection { background: rgba(255,255,255,.55); }
.n-cel.laranja:focus-visible { outline-color: #241600; outline-offset: -3px; }
/* com seletor no cabeçalho, contador e seletor andam juntos à direita */
.area-meta + .seg { margin-left: 12px; }
.area-meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--c-tinta); white-space: nowrap; }
.area-corpo { padding: 14px 16px; }
.area-pe { display: flex; padding: 4px 8px 8px; }
.ver { display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--tinta-suave); }
.ver:hover { background: var(--realce); color: var(--tinta); }

/* linhas de lista */
.lista { list-style: none; padding: 0; }
.lin { display: flex; align-items: center; gap: 11px; padding: 9px 16px; border-top: 1px solid var(--borda-fraca); min-width: 0; }
.lista > li:first-child .lin { border-top: 0; }
a.lin:hover { background: var(--sutil); }
/* cor da categoria de conta (CATEGORIAS_CONTA), como a bolinha dos locais */
.cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: var(--cat, var(--tinta-fraca)); flex-shrink: 0; margin-right: 6px; vertical-align: 1px; }
/* Filete de prioridade (DESIGN.md › Selos de prazo): 3px por dentro da linha,
   vermelho para vencido ou vence hoje, âmbar para amanhã. */
.lin.pri-alta { box-shadow: inset 3px 0 0 var(--perigo); }
.lin.pri-media { box-shadow: inset 3px 0 0 var(--obs); }
/* as linhas dos grupos de prazo (fundo tingido) ganham o filete também */
.lista > li.tom-atraso > .lin { box-shadow: inset 3px 0 0 var(--perigo); }
.lista > li.tom-hoje > .lin { box-shadow: inset 3px 0 0 var(--obs); }
.lin-txt { min-width: 0; flex: 1; }
.lin-tit, .lin-sub { display: block; }
.lin-tit { font-size: 14px; font-weight: 600; color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin-tit .oid { color: var(--tinta-fraca); font-weight: 600; font-size: 12px; margin-right: 6px; }
.lin-sub { font-size: 12px; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin-dir { margin-left: auto; text-align: right; flex-shrink: 0; font-weight: 600; color: var(--tinta); }
.lin-dir small { display: block; font-size: 11.5px; font-weight: 500; color: var(--tinta-suave); }
.vazio { display: flex; align-items: center; gap: 8px; padding: 14px 16px; color: var(--tinta-suave); font-size: 12.5px; }
/* rótulo de grupo dentro de uma lista: a urgência separa as O.S. sem precisar de outro card */
.grupo-rot { display: flex; align-items: center; gap: 8px; padding: 9px 16px 5px; font-size: 11.5px; font-weight: 700; color: var(--tinta-suave); border-top: 1px solid var(--borda-fraca); }
.lista > .grupo-rot:first-child { border-top: 0; }
.grupo-rot .ico { width: 13px; height: 13px; }
.grupo-rot b { margin-left: auto; font-weight: 700; }
.grupo-rot.atraso { color: var(--perigo); }
.grupo-rot.hoje { color: var(--obs-tinta); }
.grupo-rot + li .lin { border-top: 0; }
.mais-grupo { padding: 6px 16px 10px; font-size: 12px; color: var(--tinta-suave); }
/* o prazo em texto: neutro por padrão, cor só para o que precisa de ação */
.pz { font-size: 12.5px; font-weight: 500; color: var(--tinta-suave); white-space: nowrap; }
.pz.atraso { color: var(--perigo); font-weight: 600; }
.pz.hoje { color: var(--obs-tinta); font-weight: 600; }
.pz.amanha { color: var(--tinta); font-weight: 600; }
.lin-dir .pz + small { margin-top: 1px; }
/* de quem é a O.S., nas listas que mostram a equipe toda */
.resp-mini { display: inline-flex; justify-content: flex-end; margin-top: 3px; }
.resp-mini .av { width: 20px; height: 20px; box-shadow: 0 0 0 2px var(--superficie); }
.resp-mini .av + .av { margin-left: -4px; }
.vazio .ico { color: var(--sucesso); }
.nota { display: flex; align-items: center; gap: 8px; padding-top: 12px; font-size: 12px; color: var(--tinta-suave); }
.nota b { color: var(--tinta); font-weight: 600; }
/* data em bloco: o dia grande, a semana embaixo; vencida em vermelho, hoje em âmbar */
.diaf { width: 40px; height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--borda); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; flex-shrink: 0; }
.diaf b { font-size: 13.5px; font-weight: 700; color: var(--tinta); }
.diaf span { font-size: 10.5px; font-weight: 600; color: var(--tinta-suave); }
.diaf.atraso { background: var(--perigo-fundo); box-shadow: inset 0 0 0 1px var(--perigo-borda); }
.diaf.atraso b, .diaf.atraso span { color: var(--perigo); }
.diaf.hoje { background: var(--obs-fundo); box-shadow: inset 0 0 0 1px var(--obs-borda); }
.diaf.hoje b, .diaf.hoje span { color: var(--obs-tinta); }
/* Visão Produção: a lista em grupos de prazo, e cada O.S. mostrando só o que
   produzir — os itens, um por linha. */
.lin.prod { align-items: flex-start; gap: 14px; padding: 11px 16px; }
.prod-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.prod-item { display: block; font-size: 14px; font-weight: 700; color: var(--tinta); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prod-feitos { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--tinta-fraca); }
.prod-feitos .ico { color: var(--sucesso); }
.prod-rodape { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--tinta-suave); }
.prod-rodape .oid { color: var(--tinta-fraca); }
.tag-entrega { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 5px; background: var(--fin-fundo); color: var(--fin-tinta); }
.tag-entrega .ico { width: 12px; height: 12px; }
.prod-dir { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
.prod-dir .quando { font-size: 12.5px; font-weight: 600; color: var(--tinta-corpo); white-space: nowrap; }
.prod-dir small { font-size: 12px; color: var(--tinta-suave); white-space: nowrap; }
.prod-rodape { margin-top: 2px; }
/* Hoje e atrasadas num bloco de fundo claro, na cor do estado — o cabeçalho do
   grupo e as linhas juntos —, que se vê de longe; os outros dias ficam no
   branco. Tinta clara, sem faixa saturada nem borda lateral (DESIGN.md). */
/* A cor do prazo fica no cabeçalho do grupo e no filete da linha; a linha em si
   é neutra. Com a lista quase toda de hoje e de amanhã, o fundo tingido em
   todas as linhas deixava de avisar. */
.lista > .grupo-rot.hoje { background: var(--obs-fundo); border-top-color: var(--obs-borda); }
.lista > .grupo-rot.atraso { background: var(--perigo-fundo); border-top-color: var(--perigo-borda); }

/* pendências: ícone e cor dizem a gravidade, a palavra repete no title */
.g-ico { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex-shrink: 0; align-self: flex-start; }
.g-ico .ico { width: 15px; height: 15px; }
.g-ico.critico { background: var(--perigo-fundo); color: var(--g-critico); }
.g-ico.atencao { background: var(--obs-fundo); color: var(--obs); }
.g-ico.tarefa { background: var(--itens-fundo); color: var(--g-tarefa); }
.tudo-ok { display: flex; align-items: center; gap: 12px; padding: 16px; }
.tudo-ok .ok-ico { width: 38px; height: 38px; border-radius: 99px; display: grid; place-items: center; background: var(--fin-fundo); color: var(--fin); flex-shrink: 0; }
.tudo-ok b { display: block; color: var(--tinta); font-size: 13.5px; }
.tudo-ok span { font-size: 12px; color: var(--tinta-suave); }

/* vendas: o resumo do mês em cima, o gráfico embaixo */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--borda-fraca); }
.stats > div { padding: 13px 16px 12px; border-left: 1px solid var(--borda-fraca); min-width: 0; }
.stats > div:first-child { border-left: 0; }
.stats span { display: block; font-size: 12px; color: var(--tinta-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats b { display: block; font-size: 22px; font-weight: 700; color: var(--tinta); letter-spacing: -.02em; line-height: 1.25; white-space: nowrap; }
/* colunas finas de uma cor só, a mais recente acesa, fios de grade e a média;
   em HTML, para os rótulos não esticarem */
.graf-area { position: relative; height: 190px; margin-top: 22px; border-bottom: 1px solid var(--borda); }
.graf-grade { position: absolute; left: 0; right: 0; border-top: 1px solid var(--borda-fraca); }
.graf-grade span { position: absolute; left: 0; top: -17px; font-size: 10.5px; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
/* A média em laranja: a referência contra a qual cada coluna é lida. */
.graf-media { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--brand); z-index: 1; pointer-events: none; }
.graf-cols { position: absolute; inset: 0; display: flex; align-items: flex-end; }
.graf-col { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 4px 4px 0 0; }
.graf-col:hover, .graf-col:focus-visible { outline: none; background: var(--sutil); }
button.graf-col { cursor: pointer; }
.graf-col i { position: relative; width: min(24px, 58%); min-height: 2px; background: var(--fin); border-radius: 4px 4px 0 0; }
.graf-col i.passado { opacity: .42; transition: opacity .12s; }
.graf-col:hover i.passado, .graf-col:focus-visible i.passado { opacity: .8; }
/* projeção do mês corrente: o que falta, em contorno tracejado em cima do vendido */
.graf-col .proj { position: absolute; width: min(24px, 58%); border: 1.5px dashed var(--fin); border-bottom: 0; border-radius: 4px 4px 0 0; opacity: .7; }
.graf-val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--tinta); white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 2; }
.graf-val.suave { color: var(--tinta-suave); font-weight: 600; }
.graf-val.fim { left: auto; right: 0; transform: none; }   /* o último não passa da borda */
.graf-x { display: flex; margin-top: 6px; }
.graf-x span { flex: 1; text-align: center; font-size: 10.5px; color: var(--tinta-suave); font-variant-numeric: tabular-nums; white-space: nowrap; }
.graf-x span.hoje { color: var(--tinta); font-weight: 700; }
.graf-leg { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; color: var(--tinta-suave); }
.graf-leg > span { display: inline-flex; align-items: center; gap: 7px; }
.graf-leg b { color: var(--tinta); font-weight: 600; }
.graf-leg .m-col { width: 9px; height: 12px; border-radius: 2px 2px 0 0; background: var(--fin); }
.graf-leg .m-proj { width: 9px; height: 12px; border: 1.5px dashed var(--fin); border-bottom: 0; border-radius: 2px 2px 0 0; }
/* mês que veio da planilha (antes do sistema): hachura a 135°, como em Vendas */
.graf-col i.pl, .graf-leg .m-pl { background: repeating-linear-gradient(135deg, var(--fin) 0 2px, color-mix(in srgb, var(--fin) 30%, var(--superficie)) 2px 5px); }
.graf-leg .m-pl { width: 9px; height: 12px; border-radius: 2px 2px 0 0; }
.graf-leg .m-media { width: 16px; border-top: 1.5px dashed var(--brand); }
.graf-leg .dica { margin-left: auto; color: var(--brand-tinta); font-weight: 600; }
/* ============ gaveta (computador) / folha (celular), como na nova Produção ============ */
.gv-veu { position: fixed; inset: 51px 0 0 0; background: rgba(15,23,42,.36); z-index: 60; animation: veuEntra .4s ease-out; }
.dark .gv-veu { background: rgba(0,0,0,.6); }
.gaveta { position: fixed; top: 51px; right: 0; bottom: 0; width: min(460px, 100%); background: var(--fundo); border-left: 1px solid var(--borda); box-shadow: 0 24px 56px -16px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.08); z-index: 61; overflow-y: auto; animation: gavetaEntra .46s cubic-bezier(.22,1,.36,1); }
/* Com a gaveta aberta, a página de trás fica parada: a roda do mouse rola só a
   gaveta, e chegar ao fim dela (ou de uma lista aberta) não leva a página junto. */
.gaveta, .pop { overscroll-behavior: contain; }
html:has(.gaveta:not(.sai)) { overflow: hidden; scrollbar-gutter: stable; }
.dark .gaveta { box-shadow: 0 24px 56px -16px rgba(0,0,0,.7); }
.gv-veu.sai { animation: veuSai .3s ease-in forwards; pointer-events: none; }
.gaveta.sai { animation: gavetaSai .3s cubic-bezier(.55,0,1,.45) forwards; pointer-events: none; }
@keyframes gavetaEntra { from { transform: translateX(100%); } }
@keyframes gavetaSai { to { transform: translateX(100%); } }
@keyframes veuEntra { from { opacity: 0; } }
@keyframes veuSai { to { opacity: 0; } }
.det { padding: 0 22px 40px; }
/* cabeçalho: o que é e, à direita, só ícones do mesmo peso; gruda no topo ao rolar */
.det-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: 0 -22px; padding: 12px 22px; background: var(--fundo); color: var(--tinta-suave); font-size: 13px; font-weight: 600; transition: box-shadow .2s; }
.gaveta.rolou .det-cab { box-shadow: 0 1px 0 var(--borda); }
.det-ferr { margin-left: auto; display: flex; gap: 2px; }
.ib { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--tinta-suave); transition: background .12s, color .12s; flex-shrink: 0; }
.ib:hover { background: var(--realce); color: var(--tinta); }
.det-tit { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); line-height: 1.25; margin-top: 2px; }
.det-tit.prob { color: var(--perigo); }
.det-sub { font-size: 12.5px; color: var(--tinta-suave); margin-top: 3px; }
.det-valor { font-size: 30px; font-weight: 700; letter-spacing: -.022em; color: var(--tinta); margin-top: 10px; font-variant-numeric: tabular-nums; }
.det-valor small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-right: 4px; letter-spacing: 0; }
.det-aviso { display: flex; gap: 8px; align-items: center; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--perigo-fundo); border: 1px solid var(--perigo-borda); color: var(--perigo); font-size: 12.5px; font-weight: 600; }
.dprops { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; row-gap: 2px; margin-top: 16px; }
.dprops dt { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 7px; align-items: center; min-height: 32px; }
.dprops dd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-weight: 600; color: var(--tinta); }
.dprops dd .mudo { color: var(--tinta-suave); font-weight: 500; }
.dsec { border: 1px solid var(--c-borda); border-radius: 10px; background: var(--superficie); margin-top: 16px; overflow: hidden; }
.dsec-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; background: var(--c-fundo); border-bottom: 1px solid var(--c-borda); }
.dsec-cab h3 { font-size: 13px; font-weight: 700; color: var(--tinta); }
.dsec-cab .area-meta { margin-left: auto; }
.ditem { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-top: 1px solid var(--borda-fraca); }
.ditem:first-of-type { border-top: 0; }
.ditem .cx { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--borda-forte); display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; color: transparent; }
.ditem.ok .cx { background: var(--fin); border-color: var(--fin); color: #fff; }
.ditem .nm { font-weight: 600; color: var(--tinta); }
.ditem.ok .nm { color: var(--tinta-suave); text-decoration: line-through; }
.ditem .ds { display: block; font-size: 12px; color: var(--tinta-suave); margin-top: 1px; white-space: pre-wrap; }
.dfin { padding: 4px 12px 8px; }
.dfin div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--borda-fraca); font-variant-numeric: tabular-nums; }
.dfin div:last-child { border-bottom: 0; }
.dfin dt { color: var(--tinta-suave); } .dfin dd { font-weight: 600; color: var(--tinta); }
.dfin .falta dd { color: var(--perigo); font-weight: 700; } .dfin .quitado dd { color: var(--sucesso); }
.det-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.det-acoes .esp { flex: 1; }
.det-nota { font-size: 12px; color: var(--tinta-suave); margin-top: 12px; }
.btn { height: 34px; padding: 0 13px; border-radius: 8px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, filter .15s; }
.btn .ico { width: 15px; height: 15px; }
.btn-sec { border: 1px solid var(--borda-forte); color: var(--tinta); background: var(--superficie); }
.btn-sec:hover { background: var(--sutil); border-color: var(--tinta-fraca); }
.btn-txt { color: var(--tinta-suave); }
.btn-txt:hover { color: var(--tinta); background: var(--realce); }
.btn-ok { background: var(--fin); color: #fff; } .btn-ok:hover { filter: brightness(.95); } .dark .btn-ok { color: var(--fundo); }
.btn-ok.conf { background: var(--perigo); color: #fff; }
.aviso-proto { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 96; background: var(--tinta); color: var(--superficie); padding: 9px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; box-shadow: 0 12px 28px -8px rgba(15,23,42,.4); animation: pop .2s var(--saida); }
.lin.aberta { background: var(--realce); }
@media (max-width: 760px) {
  .gv-veu { inset: 0; }
  .gaveta { top: auto; height: 88dvh; width: 100%; border-left: 0; border-radius: 12px 12px 0 0; animation-name: folhaEntra; }
  .gaveta.sai { animation-name: folhaSai; }
  .det { padding: 0 14px 40px; }
  .det-cab { margin: 0 -14px; padding: 8px 6px 8px 14px; }
}
@keyframes folhaEntra { from { transform: translateY(100%); } }
@keyframes folhaSai { to { transform: translateY(100%); } }
.tip { position: fixed; z-index: 95; pointer-events: none; background: var(--tinta); color: var(--superficie); border-radius: 7px; padding: 6px 9px; font-size: 12px; box-shadow: var(--sombra-pop); white-space: nowrap; }
.tip b { font-size: 13px; display: block; }

/* a esteira: as etapas na ordem em que a O.S. anda, agrupadas pela fase */
.est { display: grid; grid-template-columns: 2fr 4fr 3fr; gap: 22px; padding: 16px 16px 14px; }
.est-fase { display: flex; flex-direction: column; min-width: 0; }
.est-cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.est-et { display: flex; flex-direction: column; min-width: 0; border-radius: 6px; }
.est-et:hover, .est-et:focus-visible { background: var(--sutil); outline: none; }
.est-plot { height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; border-bottom: 1px solid var(--borda); }
.est-q { font-size: 22px; font-weight: 700; color: var(--tinta); letter-spacing: -.02em; line-height: 1; }
.est-barra { width: min(24px, 56%); height: calc(var(--p) * 80px); min-height: 3px; background: var(--cor); border-radius: 4px 4px 0 0; }
.est-et.zero .est-q { color: var(--tinta-fraca); }
.est-et.zero .est-barra { background: var(--borda); min-height: 2px; height: 2px; }
.est-txt { display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 46px; padding: 7px 2px 6px; text-align: center; min-width: 0; }
.est-nome { font-size: 12px; font-weight: 600; color: var(--tinta-corpo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.est-atr { font-size: 11px; font-weight: 600; color: var(--perigo); white-space: nowrap; }
.est-fase-rot { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 7px 2px 0; border-top: 2px solid var(--borda); font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.est-fase-rot b { margin-left: auto; color: var(--tinta); }

/* quem abriu O.S.: rosca (parte de cada pessoa no total) e legenda ao lado,
   que é também a tabela — nome, quantidade e parte, nunca só a cor */
.rosca-wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); align-items: center; gap: 32px; padding: 22px 24px; }
.rosca { position: relative; width: 200px; height: 200px; flex-shrink: 0; }
.rosca svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.rosca circle { fill: none; stroke-width: 20; }
.rosca .trilho { stroke: var(--realce); }
.rosca .fatia { transition: stroke-dasharray .5s var(--saida), stroke-dashoffset .5s var(--saida), opacity .15s; cursor: default; }
.rosca-centro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.rosca-centro b { font-size: 30px; font-weight: 700; color: var(--tinta); letter-spacing: -.02em; line-height: 1.1; }
.rosca-centro span { font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.rosca-leg { list-style: none; padding: 0; display: flex; flex-direction: column; }
.rosca-leg li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 44px; align-items: center; gap: 4px 12px; padding: 10px 2px; border-top: 1px solid var(--borda-fraca); transition: opacity .15s; }
.rosca-leg li:first-child { border-top: 0; }
.rosca-leg .sw { width: 12px; height: 12px; border-radius: 3px; }
.rosca-leg .nome { font-weight: 600; font-size: 13.5px; color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rosca-leg .q { font-size: 13.5px; font-weight: 700; color: var(--tinta); text-align: right; }
.rosca-leg .pct { font-size: 12px; font-weight: 600; color: var(--tinta-suave); text-align: right; }
.rosca-leg .tend { grid-column: 2 / -1; justify-self: start; font-size: 11.5px; }
/* passar o mouse numa pessoa (fatia ou linha) apaga as outras */
.rosca-wrap.focando [data-p]:not(.aceso) { opacity: .3; }
.rosca-nota { font-size: 11.5px; color: var(--tinta-suave); padding: 6px 4px 0; }
.av-sem { width: 30px; height: 30px; border-radius: 99px; display: grid; place-items: center; background: var(--realce); color: var(--tinta-suave); flex-shrink: 0; }

/* rankings: posição, nome, valor e a parte do total; uma cor só, o comprimento é o dado */
/* composição (o padrão de Vendas): o maior pedaço em destaque, a barra
   fatiada e a lista com a cor, o valor e a parte de cada um */
.comp-corpo { padding: 14px 16px 12px; }
.comp-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.comp-topo > b { font-size: 22px; font-weight: 700; color: var(--tinta); letter-spacing: -.02em; line-height: 1.15; }
.comp-topo > b small { font-size: 13.5px; font-weight: 600; color: var(--tinta-suave); margin-left: 1px; letter-spacing: 0; }
.comp-topo > span { font-size: 12.5px; color: var(--tinta-suave); min-width: 0; }
.comp-topo > span b { color: var(--tinta); font-weight: 600; }
.fatias { display: flex; gap: 2px; height: 10px; }
.fatias i { border-radius: 3px; min-width: 3px; }
.comp-lista { list-style: none; padding: 0 0 6px; }
.comp-lista li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 40px; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--borda-fraca); }
.comp-lista li > i { width: 10px; height: 10px; border-radius: 3px; }
.comp-lista .nome { font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-lista .nome small { font-weight: 500; color: var(--tinta-suave); margin-left: 6px; font-size: 12px; }
.comp-lista li.resto .nome { font-weight: 500; color: var(--tinta-suave); }
.comp-lista .v { font-weight: 600; color: var(--tinta); text-align: right; white-space: nowrap; }
.comp-lista .v.neg { color: var(--perigo); }
.comp-lista .p { text-align: right; color: var(--tinta-suave); font-size: 12px; }
.rank { list-style: none; padding: 6px 0; }
.rank li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: baseline; gap: 4px 10px; padding: 7px 16px; }
.rank .pos { font-size: 11.5px; font-weight: 700; color: var(--tinta-fraca); }
.rank li:first-child .pos { color: var(--c-tinta); }
.rank .nome { min-width: 0; font-weight: 600; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .v { font-weight: 600; color: var(--tinta); text-align: right; white-space: nowrap; }
.rank .v small { color: var(--tinta-suave); font-weight: 500; margin-left: 6px; }
.rank .trilho { grid-column: 2 / -1; height: 6px; border-radius: 3px; background: var(--realce); overflow: hidden; }
.rank .trilho i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
.rank li:not(:first-child) .trilho i { opacity: .55; }
.saldo-grande { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--borda-fraca); }
.saldo-grande b { font-size: 30px; font-weight: 700; color: var(--tinta); letter-spacing: -.022em; line-height: 1.15; }
.saldo-grande span { color: var(--tinta-suave); font-size: 12px; }

@media (max-width: 1100px) {
  .grade { grid-template-columns: minmax(0, 1fr) 300px; }
  .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .n-cel:nth-child(3) { border-left: 0; }
  .n-cel:nth-child(n+3) { border-top: 1px solid var(--borda-fraca); }
}
@media (max-width: 960px) {
  .grade { grid-template-columns: 1fr; }
  .grade > .lado { order: -1; }   /* no celular, primeiro o que é seu agora */
  .grade > .lado:has(.tudo-ok):not(:has(.lin)) { order: 0; }   /* "tudo em dia" não ocupa o topo */
  .est { grid-template-columns: 1fr; gap: 14px; }
}
/* No celular a esteira deita: uma linha por etapa, a barra cresce para a direita. */
@media (max-width: 960px) {
  .est-fase { flex-direction: column-reverse; }
  .est-fase-rot { margin: 0 0 4px; padding: 0 0 6px; border-top: 0; border-bottom: 2px solid var(--borda); }
  .est-cols { grid-auto-flow: row; grid-auto-columns: auto; }
  .est-et { flex-direction: row; align-items: center; gap: 10px; padding: 6px 4px; }
  .est-txt { order: -1; min-height: 0; width: 92px; flex-direction: row; justify-content: space-between; align-items: center; flex-shrink: 0; padding: 0; text-align: left; }
  .est-plot { height: auto; flex: 1; flex-direction: row-reverse; justify-content: flex-end; gap: 10px; border-bottom: 0; }
  .est-q { font-size: 13.5px; }
  .est-barra { height: 10px; min-height: 0; width: calc(var(--p) * (100% - 40px)); min-width: 3px; border-radius: 0 4px 4px 0; }
  .est-barra.cy { transform-origin: left; animation-name: crescerX; }
  .est-et.zero .est-barra { height: 2px; width: 3px; }
  .est-txt .est-atr { display: none; }
}
@media (max-width: 760px) {
  .proto { padding: 8px 12px; gap: 8px; }
  .proto-nome, .proto-nota, .proto-bt .txt-tema, .proto-bt .rot { display: none; }
  .pg { padding: 18px 12px 48px; }
  .seg:not(.peq) { margin-left: 0; width: 100%; }
  .seg:not(.peq) button { flex: 1; padding: 6px 8px; }
  .n-cel { padding: 13px 13px 12px; gap: 8px; }
  .n-topo { gap: 8px; }
  .n-ico { width: 26px; height: 26px; border-radius: 7px; }
  .n-ico .ico { width: 14px; height: 14px; }
  .n-val { font-size: 24px; }
  .n-linha { flex-wrap: wrap; gap: 4px 8px; }
  .n-mini { display: none; }
  .n-ctx { white-space: normal; }
  .par { grid-template-columns: 1fr; }
  .lin { padding: 11px 14px; }
  /* no celular o resumo vira linhas: rótulo à esquerda, valor à direita */
  .stats { grid-template-columns: 1fr; }
  .stats > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 14px; border-left: 0; border-top: 1px solid var(--borda-fraca); }
  .stats > div:first-child { border-top: 0; }
  .stats b { font-size: 13.5px; }
  .graf-area { height: 160px; }
  .graf-x span:nth-child(even):not(.hoje) { visibility: hidden; }
  .graf-leg .dica { margin-left: 0; }
  .rosca-wrap { grid-template-columns: 1fr; justify-items: center; gap: 16px; padding: 18px 16px 14px; }
  .rosca { width: 176px; height: 176px; }
  .rosca-wrap > div:last-child { width: 100%; }
  /* no celular o período desce para uma linha própria, inteiro */
  :is(#bloco-criacao, #bloco-produzir) .area-cab { flex-wrap: wrap; }
  :is(#bloco-criacao, #bloco-produzir) .area-cab .seg { margin-left: 0; width: 100%; }
  :is(#bloco-criacao, #bloco-produzir) .area-cab .seg button { flex: 1; }
}
@media (max-width: 960px) {
  /* na visão Produção a fila vem antes dos avisos */
  .grade.fila-primeiro > .lado { order: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
html[data-troca-tema]::view-transition-old(root), html[data-troca-tema]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html[data-troca-tema].dark::view-transition-new(root), html[data-troca-tema]:not(.dark)::view-transition-old(root) { z-index: 1; }
html[data-troca-tema] *, html[data-troca-tema] *::before, html[data-troca-tema] *::after { transition: none !important; }
