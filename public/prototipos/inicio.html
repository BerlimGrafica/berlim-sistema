<body>
<div class="proto">
  <span class="proto-nome">Novo Início · protótipo</span>
  <span class="proto-nota">Dados reais, só leitura · cada pessoa vê o Início do próprio cargo</span>
  <div class="proto-dir">
    <button class="proto-bt" id="vercomo" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="proto-bt" id="tema"><i data-lucide="moon" class="ico ico-s"></i><span class="txt-tema">Escuro</span></button>
  </div>
</div>
<main class="pg" id="tela"></main>

<script>
/*INICIO*/

/* ===== base ===== */
const ico = (n, c = 'ico') => `<i data-lucide="${n}" class="${c}"></i>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HOJE = DADOS.hoje;
const dataLocal = iso => { const [a, m, d] = iso.slice(0, 10).split('-').map(Number); return new Date(a, m - 1, d); };
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const somarDias = (iso, n) => { const d = dataLocal(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const diasEntre = (de, ate) => Math.round((dataLocal(ate) - dataLocal(de)) / 864e5);
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const maiuscula = s => s[0].toUpperCase() + s.slice(1);
const ddmm = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
// Dinheiro em centavos. Acima de mil reais o centavo só atrapalha a leitura; o
// valor exato fica no title/tooltip.
const brl = (c, cheio) => { const r = c / 100; return (cheio || Math.abs(r) < 1000 ? r.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round(r).toLocaleString('pt-BR')); };
const reais = (c, cheio) => `R$ ${brl(c, cheio)}`;
const compacto = c => { const r = c / 100; return r >= 1000 ? `R$ ${(r / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mil` : `R$ ${Math.round(r)}`; };
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const pctDe = (parte, todo) => todo ? Math.round(parte / todo * 100) : 0;
const limitar = x => Math.max(0, Math.min(1, x));
const irPara = href => { try { window.top.location.href = href; } catch {} };

const COR = { 'Aguardando Pagamento': '#10b981', 'Aguardando Retorno': '#84cc16', 'Desenvolvimento de Arte': '#06b6d4', 'Etiqueta Escolar': '#2563eb', 'Produzir': '#a855f7', 'Produção': '#6b7280', 'Avisar Cliente': '#ec4899', 'Retirada': '#0ea5e9', 'Entrega': '#14b8a6', 'Concluído': '#f97316' };
const ETAPAS = ['Aguardando Pagamento', 'Aguardando Retorno', 'Desenvolvimento de Arte', 'Etiqueta Escolar', 'Produzir', 'Produção', 'Avisar Cliente', 'Entrega', 'Retirada'];
const FILA = ['Desenvolvimento de Arte', 'Etiqueta Escolar', 'Produzir', 'Produção'];
// A fila vista por quem produz (visão Produção): sem Produzir.
const FILA_PRODUCAO = FILA.filter(e => e !== 'Produzir');
// Avisar o cliente não é trabalho de quem produz: na visão Produção não entra em
// "Para hoje" (e nenhum atraso de fora da fila da produção aparece lá).
const FORA_DA_PRODUCAO = ['Avisar Cliente'];
const PRONTAS = ['Avisar Cliente', 'Entrega', 'Retirada'];
// A esteira: por onde a O.S. anda, em três fases.
const FASES = [['Esperando o cliente', ['Aguardando Pagamento', 'Aguardando Retorno']], ['Na produção', FILA], ['Prontas', PRONTAS]];
const CURTO = { 'Aguardando Pagamento': 'Pagamento', 'Aguardando Retorno': 'Retorno', 'Desenvolvimento de Arte': 'Arte', 'Etiqueta Escolar': 'Etiqueta', 'Avisar Cliente': 'Avisar' };

/* ===== O.S. ===== */
const PEDIDOS = DADOS.pedidos;
const abertas = PEDIDOS.filter(p => ETAPAS.includes(p.status));
const saldo = p => p.valor - p.pago;
// Etapas em que prazo vencido não é atraso, a mesma regra do sistema
// (STATUSES_SEM_ATRASO, que a página manda): antes da arte, Aguardando
// Pagamento e Aguardando Retorno esperam o cliente, e não dependem da gráfica;
// em Retirada o serviço já está pronto. Concluído já foi entregue. Nelas o
// prazo de hoje também fica neutro e a O.S. não entra em "Prazos de hoje". A
// lista de reserva só vale com o arquivo aberto fora do sistema.
const SEM_ATRASO = [...(DADOS.semAtraso || ['Aguardando Pagamento', 'Aguardando Retorno', 'Retirada']), 'Concluído'];
const semAtraso = p => SEM_ATRASO.includes(p.status);
const atrasada = p => p.prazo && p.prazo < HOJE && !semAtraso(p);
const ehHoje = p => p.prazo === HOJE;
// Prazo de hoje que pede atenção: o de uma etapa que conta atraso.
const urgeHoje = p => ehHoje(p) && !semAtraso(p);
// Padrão do sistema para prazo: atrasada ou vencendo HOJE é vermelho; vence
// AMANHÃ é âmbar (as classes: "atraso" vermelho, "hoje" âmbar).
const urgeAmanha = p => p.prazo === somarDias(HOJE, 1) && !semAtraso(p);
// O filete de prioridade de uma linha de O.S.
const priOS = p => atrasada(p) || urgeHoje(p) ? 'pri-alta' : urgeAmanha(p) ? 'pri-media' : '';
const porPrazo = (a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999') || (a.hora || '99').localeCompare(b.hora || '99') || a.id - b.id;
const doLado = (p, nome) => p.resp.includes(nome);
const corLocal = l => DADOS.coresLocais?.[l] || '#64748b';
const foraDeCasa = p => p.locais.filter(l => l.toLowerCase() !== 'berlim');

function seloPrazo(p) {
  if (!p.prazo) return '<span class="selo">Sem prazo</span>';
  if (atrasada(p)) return `<span class="selo atraso">${ico('alert-triangle')}Atrasada · ${ddmm(p.prazo)}</span>`;
  if (urgeHoje(p)) return `<span class="selo atraso">${ico('clock')}${p.hora ? 'até ' + esc(p.hora) : 'Hoje'}</span>`;
  if (ehHoje(p)) return '<span class="selo">Hoje</span>';
  const d = diasEntre(HOJE, p.prazo);
  return `<span class="selo ${urgeAmanha(p) ? 'hoje' : ''}">${d === 1 ? 'Amanhã' : d < 7 ? SEMANA[dataLocal(p.prazo).getDay()].slice(0, 3) + ' ' + ddmm(p.prazo) : ddmm(p.prazo)}</span>`;
}
const linhaOS = (p, dir) => `<li><a class="lin" href="#" data-os="${p.id}" title="${esc(p.cliente)} — ${esc(p.resumo)}">
  <span class="dot" style="background:${COR[p.status] || '#6b7280'}" title="${esc(p.status)}"></span>
  <span class="lin-txt"><span class="lin-tit"><span class="oid">#${p.id}</span>${esc(p.cliente)}</span><span class="lin-sub">${esc(legivel(p.resumo))}</span></span>
  <span class="lin-dir">${dir}</span></a></li>`;

/* ===== pessoas ===== */
const EQUIPE = Object.fromEntries(DADOS.equipe.map(p => [p.nome, p]));
const duasLetras = n => { const p = n.trim().split(/\s+/); return p.length > 1 ? (p[0][0] + p.at(-1)[0]).toUpperCase() : p[0].slice(0, 1).toUpperCase() + p[0].slice(1, 2).toLowerCase(); };
const bolinha = (n, cls = '') => `<i class="av ${cls}" style="background:${EQUIPE[n]?.cor[0] || '#64748b'};color:${EQUIPE[n]?.cor[1] || '#fff'}">${esc(duasLetras(n))}</i>`;
// `visao` nula = a do cargo da pessoa. Só a equipe Administrador troca: hoje
// são quatro pessoas com papéis diferentes (e nenhuma com o cargo Financeiro),
// então quem cuida do caixa abre a visão Financeiro, quem cuida da fila a de
// Produção. As pendências continuam sendo as da pessoa.
const est = { eu: EQUIPE[DADOS.eu] ? DADOS.eu : DADOS.equipe[0]?.nome, visao: null, serie: 'dia', criacao: 'mes', escopo: 'minhas' };
const VISOES = [['Administrador', 'Geral'], ['Atendimento', 'Atendimento'], ['Produção', 'Produção'], ['Financeiro', 'Financeiro']];

/* ===== peças ===== */
function area(cls, icone, titulo, meta, corpo, pe, acao, id) {
  return `<section class="area ${cls}"${id ? ` id="${id}"` : ''}><div class="area-cab"><span class="area-ico">${ico(icone)}</span><h2>${titulo}</h2>${meta ? `<span class="area-meta">${meta}</span>` : ''}${acao || ''}</div>${corpo}${pe ? `<div class="area-pe">${pe}</div>` : ''}</section>`;
}
const ver = (rot, href) => `<a class="ver" href="#" data-ir="${href}">${rot}${ico('arrow-right', 'ico ico-s')}</a>`;
// Um módulo da visão Geral: o rótulo e os quadros dele, juntos.
const secao = (titulo, icone, blocos) => `<div class="secao"><h2 class="secao-tit">${ico(icone)}${titulo}</h2>${blocos.join('')}</div>`;
const vazio = txt => `<div class="vazio">${ico('check-circle-2')}${txt}</div>`;
const seg = (rotulo, opcoes, atual, attr, cls = '') => `<div class="seg ${cls}" role="group" aria-label="${rotulo}"><span class="seg-trilho"></span>${opcoes.map(([id, rot]) => `<button ${attr}="${id}" aria-pressed="${id === atual}">${rot}</button>`).join('')}</div>`;

// Os números do topo. Cada um traz, embaixo, o que o explica: a comparação
// (tend), a série recente (mini), a proporção (med) ou as O.S. uma a uma.
function numeros(cels) {
  return `<div class="numeros" style="--n:${cels.length}">${cels.map(c => {
    const tag = c.alvo ? `a href="#${c.alvo}" data-rolar="${c.alvo}"` : c.href ? `a href="#" data-ir="${c.href}"` : 'div';
    return `<${tag} class="n-cel a-${c.area || 'dados'} ${c.laranja ? 'laranja' : ''}" ${c.title ? `title="${esc(c.title)}"` : ''}>
      <span class="n-topo"><span class="n-ico">${ico(c.icone)}</span><span class="n-rot">${c.rot}</span></span>
      <span class="n-linha"><span class="n-val num ${c.alerta ? 'alerta' : ''}">${c.val}</span>${c.tend || ''}${c.mini || ''}</span>
      <span class="n-pe">${c.med || ''}<span class="n-ctx">${c.ctx || '&nbsp;'}</span></span>
    </${c.alvo || c.href ? 'a' : 'div'}>`; }).join('')}</div>`;
}
const dinheiro = c => `<small>R$</small>${brl(c)}`;
function tendencia(atual, antes, base) {
  if (!antes) return '';
  const pct = Math.round((atual - antes) / antes * 100);
  const txt = pct ? `${pct > 0 ? 'a mais' : 'a menos'} que ${base}` : `igual a ${base}`;
  return `<span class="tend ${pct > 0 ? 'sobe' : pct < 0 ? 'desce' : ''}" title="${esc(Math.abs(pct) + '% ' + txt)}">${pct ? ico(pct > 0 ? 'trending-up' : 'trending-down') : ''}${pct ? Math.abs(pct) + '%' : 'igual'}<span class="so-leitor"> ${txt}</span></span>`;
}
const MED = {
  // a série recente em colunas pequenas; `aceso` é o índice em destaque
  mini: (vals, aceso = vals.length - 1) => { const m = Math.max(1, ...vals); return `<span class="n-mini" aria-hidden="true">${vals.map((v, i) => `<i class="cy ${i === aceso ? 'aceso' : ''}" style="height:${v ? Math.max(8, v / m * 100) : 0}%;--i:${i}"></i>`).join('')}</span>`; },
  // partes de um todo: [{ v, cls }] — o resto do trilho fica vazio
  partes: (ps, todo) => `<span class="medidor rv" aria-hidden="true">${ps.filter(p => p.v > 0).map(p => `<i class="${p.cls || ''}" style="flex:${p.v}"></i>`).join('')}${todo > ps.reduce((s, p) => s + p.v, 0) ? `<i class="vazio" style="flex:${todo - ps.reduce((s, p) => s + p.v, 0)}"></i>` : ''}</span>`,
  // uma marca por O.S. (ou conta), na cor que importa para aquele número
  unidades: (lista, cor, titulo) => { const max = 36, mostrar = lista.slice(0, lista.length > max ? max - 1 : max);
    return `<span class="unid" aria-hidden="true">${mostrar.map((x, i) => `<i style="--i:${i};${cor ? `background:${cor(x)}` : ''}" title="${esc(titulo ? titulo(x) : '')}"></i>`).join('')}${lista.length > mostrar.length ? `<span>+${lista.length - mostrar.length}</span>` : ''}</span>`; },
};
const tituloOS = p => `#${p.id} · ${p.cliente} · ${p.status}`;
// Legenda dos quadradinhos: a cor e o que ela conta. Partes vazias saem.
const legenda = itens => itens.filter(([, , n]) => n).map(([cor, txt]) => `<span class="leg-i"><i style="background:${cor}"></i>${txt}</span>`).join(' · ');

/* ===== blocos ===== */
const GRAV = { critico: ['alert-triangle', 'Atrasado'], atencao: ['clock', 'Para hoje'], tarefa: ['list-todo', 'A fazer'] };
// Uma linha de aviso. Com `alvo`, ela rola até o card da própria tela que
// detalha o assunto, em vez de levar a outra tela.
const linhaPendencia = p => `<li><a class="lin" ${p.alvo ? `href="#${p.alvo}" data-rolar="${p.alvo}"` : `href="#" data-ir="${esc(p.destino || '/')}"`}><span class="g-ico ${p.gravidade}" title="${GRAV[p.gravidade]?.[1] || ''}">${ico(GRAV[p.gravidade]?.[0] || 'circle')}</span><span class="lin-txt"><span class="lin-tit">${esc(p.titulo)}</span><span class="lin-sub" title="${esc(p.detalhe)}">${esc(p.detalhe)}</span></span></a></li>`;
// As pendências da pessoa, pela regra do sino. Cada visão escolhe pelo assunto
// (`tipo`: conta, futura, tarefa...): `tirar` some com os que já têm card na
// tela ou não competem ao cargo; `so` mostra só aqueles.
// Quando a tela já tem o card de contas a pagar, as contas não se repetem uma a
// uma no aviso: viram uma linha só ("1 vencida · 4 até amanhã"), que leva ao
// card. O aviso continua dizendo que há conta vencida; a lista fica no card.
function agruparContas(lista, alvo) {
  const i = lista.findIndex(p => p.tipo === 'conta'); if (i < 0) return lista;
  const contas = lista.filter(p => p.tipo === 'conta'), venc = contas.filter(p => p.gravidade === 'critico').length, logo = contas.length - venc;
  const resumo = { tipo: 'conta', alvo, gravidade: venc ? 'critico' : 'atencao', titulo: 'Contas a pagar',
    detalhe: [venc ? plural(venc, 'vencida', 'vencidas') : '', logo ? `${logo} até amanhã` : ''].filter(Boolean).join(' · ') };
  const resto = lista.filter(p => p.tipo !== 'conta'); resto.splice(i, 0, resumo); return resto;
}
function blocoPendencias(nome, { tirar = [], so = null, titulo = 'Precisa de você', vazioTxt = 'Nenhuma pendência sua agora.', contasNoCard = null } = {}) {
  let lista = (DADOS.pendencias[nome] || []).filter(p => !tirar.includes(p.tipo) && (!so || so.includes(p.tipo)));
  if (contasNoCard) lista = agruparContas(lista, contasNoCard);
  // Tarefa com prazo para além de amanhã não pede nada hoje: sai da lista e
  // vira uma contagem no rodapé (continua inteira no sino e na Comunicação).
  const depois = lista.filter(p => p.depois).length;
  lista = lista.filter(p => !p.depois);
  const mostrar = lista.slice(0, 7);
  const corpo = lista.length
    ? `<ul class="lista">${mostrar.map(linhaPendencia).join('')}</ul>`
    : `<div class="tudo-ok"><span class="ok-ico">${ico('check')}</span><div><b>Tudo em dia</b><span>${vazioTxt}</span></div></div>`;
  const criticos = lista.filter(p => p.gravidade === 'critico').length;
  // "5 atrasados de 13": primeiro o que urge, depois o total, por extenso.
  const meta = !lista.length ? '' : !criticos ? plural(lista.length, 'aviso', 'avisos') : criticos === lista.length ? plural(criticos, 'atrasado', 'atrasados') : `${plural(criticos, 'atrasado', 'atrasados')} de ${lista.length}`;
  const pe = [lista.length > mostrar.length ? `e mais ${lista.length - mostrar.length} no sino da barra` : '', depois ? `${plural(depois, 'tarefa', 'tarefas')} para os próximos dias` : ''].filter(Boolean).join(' · ');
  return area(`a-obs${criticos ? ' elevado' : ''}`, 'bell', criticos ? `${titulo}<small>comece pelos atrasados</small>` : titulo, meta, corpo,
    pe ? `<span class="ver" style="cursor:default">${pe}</span>` : '');
}

// A visão Geral separa as pendências em três: as gerais, que cabem a quem
// administra a gráfica e não a uma pessoa; as fiscais, que têm card próprio; e
// o resto, que o sino pôs no nome da pessoa (tarefa, material a comprar, link
// de pagamento...) e vai para "No seu nome".
const AVISOS_GERAIS = ['conta', 'futura'];
const AVISOS_FISCAIS = ['faturamento', 'nf-emitir', 'nf-preencher'];
// "hoje", "ontem", "há 3 dias"
const haQuanto = iso => { const d = iso ? diasEntre(iso, HOJE) : 0; return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`; };

// No seu nome: o que é da pessoa, e não da gráfica — as O.S. dela na produção
// e as pendências pessoais. Os avisos gerais e os fiscais ficam nos cards deles.
function blocoNoSeuNome(eu) {
  const os = abertas.filter(p => FILA.includes(p.status) && doLado(p, eu)).sort(porPrazo);
  const avisos = (DADOS.pendencias[eu] || []).filter(p => !AVISOS_GERAIS.includes(p.tipo) && !AVISOS_FISCAIS.includes(p.tipo) && !p.depois);
  const total = os.length + avisos.length;
  const corpo = total ? listaEmGrupos([
    { icone: 'layers', rotulo: 'Suas O.S. na produção', itens: os, linha: p => linhaLimpa(p, `${prazoTexto(p)}<small>${esc(p.status)}</small>`), max: 5, resto: n => `e mais ${n} com prazo mais à frente` },
    { icone: 'list-todo', rotulo: 'Tarefas e avisos', itens: avisos, linha: linhaPendencia, max: 6, resto: n => `e mais ${n} no sino da barra` },
  ]) : `<div class="tudo-ok"><span class="ok-ico">${ico('check')}</span><div><b>Nada no seu nome</b><span>Nenhuma O.S., tarefa ou aviso seu agora.</span></div></div>`;
  const urge = os.filter(p => atrasada(p) || urgeHoje(p)).length + avisos.filter(p => p.gravidade === 'critico').length;
  return area(`a-itens${urge ? ' elevado' : ''}`, 'user-check', 'No seu nome', total ? String(total) : '', corpo, os.length ? ver('Abrir a Produção', '/producao') : '');
}

// Faturamento e notas fiscais: o que espera a aprovação de faturamento de uma
// empresa e o que espera emissão de nota. Card vazio encolhe para o cabeçalho.
function blocoFiscal() {
  const fat = [...DADOS.faturamento].sort((a, b) => a.desde.localeCompare(b.desde));
  const notas = [...DADOS.notas].sort((a, b) => a.quando.localeCompare(b.quando));
  const emitir = notas.filter(n => n.pronta), preencher = notas.filter(n => !n.pronta);
  const lin = (href, tit, sub, dir) => `<li><a class="lin" href="#" data-ir="${href}"><span class="lin-txt"><span class="lin-tit">${esc(tit)}</span><span class="lin-sub">${sub}</span></span>${dir ? `<span class="lin-dir"><small>${esc(dir)}</small></span>` : ''}</a></li>`;
  const cardFat = fat.length
    ? area('a-fin elevado', 'badge-check', 'Faturamento a aprovar<small>empresas em análise</small>', String(fat.length),
        `<ul class="lista">${fat.slice(0, 5).map(e => lin('/financeiro', e.nome, `cadastrada ${haQuanto(e.desde)}`)).join('')}</ul>`, fat.length > 5 ? ver(`Ver as ${fat.length}`, '/financeiro') : ver('Abrir o Financeiro', '/financeiro'), '', 'card-faturamento')
    : area('a-fin compacto', 'badge-check', 'Faturamento a aprovar', 'nada agora', '', '', '', 'card-faturamento');
  const cardNotas = notas.length
    ? area(`a-dados${emitir.length ? ' elevado' : ''}`, 'file-text', 'Notas fiscais<small>a emitir e a preencher</small>', emitir.length ? (emitir.length < notas.length ? `${emitir.length} a emitir de ${notas.length}` : `${emitir.length} a emitir`) : String(notas.length),
        listaEmGrupos([
          { icone: 'file-check-2', rotulo: 'Prontas para emitir', itens: emitir, linha: n => lin('/financeiro', n.cliente, `pedida ${haQuanto(n.quando)}`, n.tipo), max: 5, resto: k => `e mais ${k} para emitir` },
          { icone: 'file-pen-line', rotulo: 'A preencher · pedidas pelo cliente', itens: preencher, linha: n => lin('/notas-fiscais', n.cliente, `pedida ${haQuanto(n.quando)}`, n.tipo), max: 3, resto: k => `e mais ${k} a preencher` },
        ]), ver('Abrir notas fiscais', '/notas-fiscais'), '', 'card-notas')
    : area('a-dados compacto', 'file-text', 'Notas fiscais', 'nada agora', '', '', '', 'card-notas');
  return [cardFat, cardNotas];
}

// Vazio, encolhe para o cabeçalho, como os cards do Atendimento.
function blocoHoje(filtro, titulo = 'Prazos de hoje') {
  const hoje = abertas.filter(p => urgeHoje(p) && (!filtro || filtro(p))).sort(porPrazo);
  if (!hoje.length) return area('a-itens compacto', 'calendar-clock', titulo, 'nenhuma O.S. vence hoje', '', '', '', 'card-hoje');
  return area('a-itens', 'calendar-clock', titulo, String(hoje.length), `<ul class="lista">${hoje.slice(0, 8).map(linhaHoje).join('')}</ul>`, hoje.length > 8 ? ver(`Ver as ${hoje.length}`, '/producao') : '', '', 'card-hoje');
}

// A esteira da produção: quantas O.S. em cada etapa, na ordem em que andam.
// As cores são as das etapas no sistema; o número vai escrito em cima.
// `semAtrasoAqui`: etapas que, nesta visão, não mostram atraso (na Produção,
// Avisar Cliente — avisar não é trabalho de quem produz).
function blocoEsteira(semAtrasoAqui = []) {
  const n = e => abertas.filter(p => p.status === e).length;
  const contaAqui = p => atrasada(p) && !semAtrasoAqui.includes(p.status);
  const atrDe = e => abertas.filter(p => p.status === e && contaAqui(p)).length;
  const max = Math.max(1, ...ETAPAS.map(n));
  const atr = abertas.filter(contaAqui).length;
  let i = 0;
  const corpo = `<div class="est" role="img" aria-label="${ETAPAS.map(e => `${e}: ${n(e)}`).join(', ')}">${FASES.map(([fase, etapas]) => `
    <div class="est-fase"><div class="est-cols">${etapas.map(e => { const q = n(e), a = atrDe(e);
      return `<a href="#" data-ir="/producao" class="est-et ${q ? '' : 'zero'}" data-tip="${esc(e)}|${plural(q, 'O.S.', 'O.S.')}${a ? ` · ${a} atrasada${a === 1 ? '' : 's'}` : ''}" aria-label="${esc(e)}: ${q}">
        <span class="est-plot"><b class="est-q num">${q}</b><i class="est-barra cy" style="--cor:${COR[e]};--p:${q / max};--i:${i++}"></i></span>
        <span class="est-txt"><span class="est-nome">${esc(CURTO[e] || e)}</span>${a ? `<span class="est-atr">${plural(a, 'atrasada', 'atrasadas')}</span>` : ''}</span></a>`; }).join('')}</div>
      <div class="est-fase-rot"><span>${fase}</span><b class="num">${etapas.reduce((s, e) => s + n(e), 0)}</b></div></div>`).join('')}</div>`;
  return area('a-itens', 'layers', 'Produção agora', `${plural(abertas.length, 'O.S.', 'O.S.')}${atr ? ` · ${atr} atrasada${atr === 1 ? '' : 's'}` : ''}`, corpo, ver('Abrir a Produção', '/producao'), '', 'bloco-esteira');
}

// Vendas: o resumo do mês e o gráfico, por dia (os 15 últimos dias com venda)
// ou por mês (os 15 últimos meses, o corrente com a projeção tracejada).
function grafVendas(modo) {
  const V = DADOS.vendas.mes;
  const [a, m, dia] = HOJE.split('-').map(Number);
  const mesAtual = HOJE.slice(0, 7);
  let pontos, media, rotMedia, proj = 0;
  if (modo === 'mes') {
    // pl: o mês veio da planilha (antes do sistema), como na tela de Vendas.
    pontos = [...V.serieMes].reverse().map(s => { const [ano, mm] = s.rotulo.split('-').map(Number), atual = s.rotulo === mesAtual, pl = s.planilha_centavos > 0;
      return { v: s.centavos, atual, pl, x: mm === 1 ? `jan/${String(ano).slice(2)}` : MESES[mm - 1].slice(0, 3), tip: `${MESES[mm - 1]} de ${ano}${atual ? ' (até hoje)' : ''}${pl ? ' · planilha' : ''}` }; });
    const fechados = pontos.filter(p => !p.atual);
    media = fechados.length ? fechados.reduce((s, p) => s + p.v, 0) / fechados.length : 0;
    rotMedia = 'média dos meses fechados';
    if (pontos.at(-1)?.atual) proj = Math.round(V.bruto / dia * new Date(a, m, 0).getDate());
  } else {
    pontos = [...V.serieDia].reverse().map(s => { const d = dataLocal(s.rotulo);
      return { v: s.centavos, iso: s.rotulo, atual: s.rotulo === HOJE, x: s.rotulo === HOJE ? 'hoje' : String(d.getDate()), tip: `${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}` }; });
    media = pontos.length ? pontos.reduce((s, p) => s + p.v, 0) / pontos.length : 0;
    rotMedia = 'média por dia com venda';
  }
  if (!pontos.length) return vazio('Ainda sem vendas registradas.');
  // Eixo em dois degraus redondos (0, passo, 2×passo) que cobrem o maior valor.
  const maior = Math.max(...pontos.map(p => p.v), proj);
  const bruto = maior / 100 / 2 || 1, mag = 10 ** Math.floor(Math.log10(bruto));
  const passo = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= bruto) * 100;
  const pct = c => Math.min(100, c / (passo * 2) * 100);
  // Rótulo direto só no mais recente e no maior; o resto fica na dica.
  const ultimo = pontos.length - 1;
  const iMaior = pontos.reduce((k, p, j) => p.v > pontos[k].v ? j : k, 0);
  const cols = pontos.map((p, j) => {
    const temProj = j === ultimo && proj > p.v;
    const rot = temProj ? `<b class="graf-val suave ${j === ultimo && pontos.length > 4 ? 'fim' : ''}" style="bottom:calc(${pct(proj)}% + 4px)">~ ${compacto(proj)}</b>`
      : (j === ultimo || (j === iMaior && iMaior < ultimo - 1)) ? `<b class="graf-val ${j === ultimo ? (pontos.length > 4 ? 'fim' : '') : 'suave'}" style="bottom:calc(${pct(p.v)}% + 4px)">${compacto(p.v)}</b>` : '';
    const tip = `${esc(p.tip)}${modo === 'dia' ? ' · clique para ver' : ''}|${reais(p.v, true)}${temProj ? ` · projeção ~ ${reais(proj)}` : ''}`;
    const dentro = `${temProj ? `<span class="proj" style="bottom:${pct(p.v)}%;height:${pct(proj) - pct(p.v)}%"></span>` : ''}
      <i class="cy ${j === ultimo ? '' : 'passado'} ${p.pl ? 'pl' : ''}" style="height:${pct(p.v)}%;--i:${j}"></i>${rot}`;
    // Por dia, cada coluna abre o relatório do dia, como na tela de Vendas.
    return modo === 'dia'
      ? `<button class="graf-col" data-dia="${p.iso}" data-tip="${tip}" aria-label="${esc(p.tip)}: ${reais(p.v, true)}. Ver o que foi vendido">${dentro}</button>`
      : `<div class="graf-col" tabindex="0" data-tip="${tip}">${dentro}</div>`;
  }).join('');
  // Por dia as colunas são botões e o leitor de tela chega a elas; por mês o
  // gráfico é só figura, e a tabela escondida embaixo traz os números.
  return `<div class="graf" role="${modo === 'dia' ? 'group' : 'img'}" aria-label="Vendas ${modo === 'mes' ? 'por mês' : 'por dia'}; ${rotMedia}: ${reais(media)}">
    <div class="graf-area"${modo === 'dia' ? '' : ' aria-hidden="true"'}>
      ${[1, 2].map(k => `<div class="graf-grade" style="bottom:${k * 50}%" aria-hidden="true"><span>${compacto(passo * k)}</span></div>`).join('')}
      ${media ? `<div class="graf-media" style="bottom:${pct(media)}%"></div>` : ''}
      <div class="graf-cols">${cols}</div>
    </div>
    <div class="graf-x" aria-hidden="true">${pontos.map(p => `<span class="${p.atual ? 'hoje' : ''}">${p.x}</span>`).join('')}</div>
    <div class="graf-leg" aria-hidden="true">
      <span><i class="m-col"></i>${modo === 'mes' ? 'vendido no mês' : 'vendido no dia'}</span>
      ${pontos.some(p => p.pl) && V.inicioSistema ? `<span><i class="m-pl"></i>planilha · antes de ${MESES[+V.inicioSistema.slice(5, 7) - 1].slice(0, 3)}/${V.inicioSistema.slice(0, 4)}</span>` : ''}
      ${proj ? '<span><i class="m-proj"></i>projeção até o fim do mês</span>' : ''}
      ${media ? `<span><i class="m-media"></i>${rotMedia} <b class="num">${reais(media)}</b></span>` : ''}
      ${modo === 'dia' ? `<span class="dica">${ico('mouse-pointer-click', 'ico ico-s')}clique num dia para ver o que foi vendido</span>` : ''}
    </div>
    <table class="so-leitor"><caption>Vendas ${modo === 'mes' ? 'por mês' : 'por dia'}</caption><tbody>${pontos.map(p => `<tr><th>${esc(p.tip)}</th><td>${reais(p.v, true)}</td></tr>`).join('')}</tbody></table>
  </div>`;
}
function blocoVendas() {
  const V = DADOS.vendas.mes;
  const [a, m, dia] = HOJE.split('-').map(Number);
  // No ritmo atual: o vendido até hoje dividido pelos dias corridos, vezes os
  // dias do mês. Rotulado como estimativa — não é meta.
  const proj = Math.round(V.bruto / dia * new Date(a, m, 0).getDate());
  const stats = `<div class="stats">
    <div><span>Pedidos em ${MESES[m - 1]}</span><b class="num">${V.qtd.toLocaleString('pt-BR')}</b></div>
    <div><span>Ticket médio</span><b class="num">${reais(V.ticket)}</b></div>
    <div title="Estimativa: o vendido até hoje dividido pelos dias corridos, vezes os dias do mês"><span>No ritmo atual, fecha em</span><b class="num">~ ${reais(proj)}</b></div>
  </div>`;
  return area('a-fin elevado', 'bar-chart-3', `Vendas<small>${maiuscula(MESES[m - 1])} até hoje</small>`, '', `${stats}<div class="area-corpo" id="graf-vendas">${grafVendas(est.serie)}</div>`, ver('Abrir Vendas', '/vendas'),
    seg('Período do gráfico', [['dia', 'Por dia'], ['mes', 'Por mês']], est.serie, 'data-serie', 'peq'));
}

// Quadro de composição (DESIGN.md › Quadro de composição): o maior pedaço em
// destaque, a barra fatiada e a lista com a cor, o valor e a parte de cada um.
// `todo` é o total de verdade: quando a lista mostra só os primeiros, o que
// falta para ele vira a linha cinza "os demais", e a barra soma 100%.
const pctTxt = (parte, todo) => { if (!todo) return ''; const p = parte / todo * 100; return p > 0 && p < 1 ? '<1%' : `${Math.round(p)}%`; };
const COR_FORMA = { 'PIX': '#10b981', 'Cartão de Crédito': '#6366f1', 'Cartão de Débito': '#0ea5e9', 'Link de Pagamento': '#c525c6', 'Dinheiro': '#f59e0b', 'Depósito Bancário': '#a04a10', 'Boleto': '#64748b', 'Estorno': '#ef4444' };
const corForma = f => COR_FORMA[f] || '#9ca3af';
// Quem não tem cor no sistema (cliente, produto) pega a paleta categórica em ordem.
const corSlot = k => `var(--serie-${k % 8 + 1})`;
function composicao({ cls, icone, titulo, sub, itens, rotulo, valor = x => x.centavos, cor, frase, extra, todo, demais = 'os demais', pe }) {
  const lista = itens.map((x, k) => ({ x, rot: rotulo(x), v: valor(x), cor: cor(x, k), extra: extra?.(x) }));
  const somaPos = lista.reduce((s, i) => s + Math.max(0, i.v), 0);
  const resto = todo > somaPos ? todo - somaPos : 0;
  if (resto) lista.push({ rot: demais, v: resto, cor: 'var(--borda-forte)', resto: true });
  const pos = lista.filter(i => i.v > 0), total = pos.reduce((s, i) => s + i.v, 0);
  const cab = sub ? `${titulo}<small>${sub}</small>` : titulo;
  if (!total) return area(cls, icone, cab, '', vazio('Nada no período.'));
  const topo = pos.filter(i => !i.resto).sort((a, b) => b.v - a.v)[0] || pos[0];
  const corpo = `<div class="comp-corpo">
      <div class="comp-topo"><b class="num">${pctDe(topo.v, total)}<small>%</small></b><span>${frase(topo)}</span></div>
      <div class="fatias" role="img" aria-label="${esc(pos.map(i => `${i.rot}: ${pctTxt(i.v, total)}`).join(', '))}">${pos.map((i, k) => `<i class="cx" style="flex:${i.v};background:${i.cor};--i:${k}" title="${esc(i.rot)}: ${reais(i.v, true)}"></i>`).join('')}</div>
    </div>
    <ul class="comp-lista">${lista.map(i => `<li class="${i.resto ? 'resto' : ''}"><i style="background:${i.cor}"></i><span class="nome" title="${esc(i.rot)}">${esc(i.rot)}${i.extra ? `<small>${i.extra}</small>` : ''}</span><span class="v num ${i.v < 0 ? 'neg' : ''}">${reais(i.v)}</span><span class="p num">${i.v > 0 ? pctTxt(i.v, total) : ''}</span></li>`).join('')}</ul>`;
  return area(cls, icone, cab, reais(todo || total), corpo, pe);
}

function blocoCobrar(lista, titulo, icone = 'hand-coins') {
  const total = lista.reduce((s, p) => s + saldo(p), 0);
  const corpo = lista.length
    ? `<ul class="lista">${lista.slice(0, 6).map(p => linhaLimpa(p, `<span class="pz amanha num">falta ${reais(saldo(p))}</span><small>${esc(p.status)}</small>`)).join('')}</ul>`
    : vazio('Nada a cobrar agora.');
  return area('a-fin', icone, titulo, lista.length ? reais(total) : '', corpo, lista.length > 6 ? ver(`Ver as ${lista.length}`, '/baixa') : '', '', 'card-cobrar');
}

// A data em bloco: o dia e, embaixo, o mês. Vencida ou vence hoje em vermelho, amanhã em âmbar.
const priConta = c => !c.vencimento ? '' : c.vencimento <= HOJE ? 'pri-alta' : c.vencimento === somarDias(HOJE, 1) ? 'pri-media' : '';
function dataEmBloco(iso, neutro) {
  const d = dataLocal(iso), longe = Math.abs(diasEntre(HOJE, iso)) > 6;
  return `<span class="diaf ${neutro ? '' : iso <= HOJE ? 'atraso' : iso === somarDias(HOJE, 1) ? 'hoje' : ''}" title="${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}"><b class="num">${String(d.getDate()).padStart(2, '0')}</b><span>${MESES[d.getMonth()].slice(0, 3)}</span></span>`;
}
function blocoContas(destaque) {
  const limite = somarDias(HOJE, 7);
  const contas = DADOS.contas.filter(c => c.status !== 'Pago' && c.vencimento && c.vencimento <= limite).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const vencidas = contas.filter(c => c.vencimento < HOJE);
  const total = contas.reduce((s, c) => s + c.valor, 0);
  const corpo = contas.length
    ? `<ul class="lista">${contas.slice(0, 7).map(c => `<li><a class="lin ${priConta(c)}" href="#" data-conta="${c.id}">${dataEmBloco(c.vencimento)}<span class="lin-txt"><span class="lin-tit">${esc(c.descricao)}</span><span class="lin-sub">${c.vencimento < HOJE ? `<span class="desce">vencida</span> · ` : ''}<span class="cat-dot" style="--cat:${CATEG[c.categoria || 'Despesa']?.cor || '#9ca3af'}"></span>${esc(c.categoria || 'Sem categoria')}</span></span><span class="lin-dir num">${c.valor ? reais(c.valor) : '<small>valor a definir</small>'}</span></a></li>`).join('')}</ul>`
    : vazio('Nenhuma conta vence nos próximos 7 dias.');
  return area(`a-fin${destaque && contas.length ? ' elevado' : ''}`, 'receipt', destaque && contas.length ? 'Contas a pagar · 7 dias<small>as vencidas e as da semana</small>' : 'Contas a pagar · 7 dias', contas.length ? `${reais(total)}${vencidas.length ? ` · ${plural(vencidas.length, 'vencida', 'vencidas')}` : ''}` : '', corpo, contas.length > 7 ? ver(`Ver as ${contas.length}`, '/financeiro') : '', '', 'card-contas');
}

// Quem abriu O.S.: quantas cada pessoa abriu no período, a parte dela no total
// e, no mês, a comparação com o mesmo trecho do mês anterior. Conta pela data
// da venda (a tabela não guarda quando a O.S. foi criada). O período troca só
// este card, sem redesenhar a tela.
const PERIODOS_CRIACAO = [['hoje', 'Hoje'], ['semana', '7 dias'], ['mes', 'Mês']];
// A cor de cada pessoa no gráfico é a mesma que ela tem na Produção (a da
// bolinha), para ser reconhecida pela cor no sistema inteiro. O amarelo é
// claro no fundo branco; a legenda ao lado, com nome e número, compensa. O
// preto (usuário Produção) sumiria no tema escuro: vira a cor do texto.
const corGrafico = n => { const b = EQUIPE[n]?.cor[0] || '#64748b'; return b === '#000000' ? 'var(--tinta)' : b; };

function blocoCriacao() {
  const C = DADOS.criacao;
  if (!C) return '';
  const [a, m, dia] = HOJE.split('-').map(Number);
  const ini = { hoje: HOJE, semana: somarDias(HOJE, -6), mes: HOJE.slice(0, 8) + '01' }[est.criacao];
  const contar = lista => lista.reduce((o, [n]) => (o[n] = (o[n] || 0) + 1, o), {});
  const agora = contar(C.atual.filter(([, d]) => d >= ini && d <= HOJE));
  const antes = est.criacao === 'mes' ? contar(C.anterior) : {};
  const total = Object.values(agora).reduce((x, y) => x + y, 0);
  const nomes = Object.keys(agora).sort((x, y) => agora[y] - agora[x] || x.localeCompare(y));
  const mesAnt = MESES[(m + 10) % 12], baseAnt = `1 a ${Math.min(dia, new Date(a, m - 1, 0).getDate())} de ${mesAnt}`;
  const rotulo = n => n || 'Sem registro';
  const periodo = { hoje: 'hoje', semana: 'em 7 dias', mes: 'no mês' }[est.criacao];
  const vazioTxt = { hoje: 'Nenhuma O.S. aberta hoje ainda.', semana: 'Nenhuma O.S. aberta nos últimos 7 dias.', mes: 'Nenhuma O.S. aberta no mês.' }[est.criacao];

  let corpo = vazio(vazioTxt);
  if (nomes.length) {
    // Uma fatia por pessoa, na ordem do maior para o menor, com 2px de vão entre
    // elas (o vão separa as cores, não uma borda desenhada).
    const R = 80, CIRC = 2 * Math.PI * R, VAO = nomes.length > 1 ? 3 : 0;
    let acum = 0;
    const fatias = nomes.map((n, k) => {
      const tam = agora[n] / total * CIRC, f = { n, k, tam: Math.max(0.5, tam - VAO), ini: acum + VAO / 2 };
      acum += tam; return f;
    });
    const svg = `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trilho" cx="100" cy="100" r="${R}"/>${fatias.map(f =>
      `<circle class="fatia" data-p="${f.k}" cx="100" cy="100" r="${R}" style="stroke:${corGrafico(f.n)};stroke-dasharray:${f.tam.toFixed(2)} ${CIRC.toFixed(2)};stroke-dashoffset:${(-f.ini).toFixed(2)}" data-tip="${esc(rotulo(f.n))}|${plural(agora[f.n], 'O.S.', 'O.S.')} · ${pctDe(agora[f.n], total)}%"/>`).join('')}</svg>`;
    const leg = `<div><ul class="rosca-leg num" aria-label="O.S. abertas por pessoa ${periodo}">${nomes.map((n, k) =>
      `<li data-p="${k}"><span class="sw" style="background:${corGrafico(n)}"></span><span class="nome">${esc(rotulo(n))}</span><b class="q">${agora[n]}</b><span class="pct">${pctDe(agora[n], total)}%</span>${antes[n] ? tendencia(agora[n], antes[n], baseAnt) : ''}</li>`).join('')}</ul>${nomes.some(n => antes[n]) ? `<p class="rosca-nota">variação comparada com o período de ${baseAnt}</p>` : ''}</div>`;
    corpo = `<div class="rosca-wrap"><div class="rosca" role="img" aria-label="${esc(nomes.map(n => `${rotulo(n)} ${agora[n]}`).join(', '))}">${svg}<div class="rosca-centro"><b class="num">${total}</b><span>O.S.</span></div></div>${leg}</div>`;
  }
  return `<div id="bloco-criacao">${area('a-dados', 'file-plus-2', 'Quem abriu O.S.<small>pela data da venda</small>', '', corpo, '',
    seg('Período', PERIODOS_CRIACAO, est.criacao, 'data-criacao', 'peq'))}</div>`;
}

// De quem é a O.S. (no máximo duas bolinhas), para as listas da equipe toda.
const respMini = p => p.resp.length ? `<span class="resp-mini" title="${esc(p.resp.join(', '))}">${p.resp.slice(0, 2).map(n => bolinha(n)).join('')}</span>` : '';

// O catálogo grava os nomes em caixa alta ("ADESIVO VINIL BRANCO - M²"). Para
// ler numa lista: só a primeira letra maiúscula, e as medidas como se escrevem
// (A4, SRA3, 250g, m²).
function legivel(txt) {
  return String(txt || '').split(/\s*\+\s*/).map(item => {
    const t = item.toLowerCase().split(/\s+/).map(w => /\d/.test(w) ? w.toUpperCase().replace(/(\d)G$/, '$1g') : w).join(' ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }).join(' + ');
}

// O prazo em texto: atrasada e hoje em vermelho; amanhã em âmbar; o resto neutro.
function prazoTexto(p) {
  if (!p.prazo) return '<span class="pz">sem prazo</span>';
  if (atrasada(p)) return `<span class="pz atraso">atrasada · ${ddmm(p.prazo)}</span>`;
  if (urgeHoje(p)) return `<span class="pz atraso">hoje${p.hora ? ' até ' + esc(p.hora) : ''}</span>`;
  if (ehHoje(p)) return '<span class="pz">hoje</span>';
  const d = diasEntre(HOJE, p.prazo);
  if (d === 1) return `<span class="pz ${urgeAmanha(p) ? 'hoje' : 'amanha'}">amanhã${p.hora ? ' até ' + esc(p.hora) : ''}</span>`;
  return `<span class="pz">${d < 7 ? SEMANA[dataLocal(p.prazo).getDay()].slice(0, 3) + ' ' : ''}${ddmm(p.prazo)}</span>`;
}

/* ===== visão Produção: o que produzir ===== */
// O item "Entrega" não é algo a produzir: vira um selo na O.S.
const ehEntrega = nome => /^entrega\b/i.test(String(nome || '').trim());
const itensAProduzir = p => p.itens.filter(i => !ehEntrega(i[1]));
const temEntrega = p => p.entrega || p.itens.some(i => ehEntrega(i[1]));

// Uma O.S. na visão Produção, simples: os itens a fazer, um por linha (a
// especificação fica na gaveta, que abre no clique); o que já está feito numa
// linha discreta; e, no rodapé, cliente, nº e entrega, para achar a O.S.
// À direita, o que a lista pedir (`dir`). `tom` ('hoje' ou 'atraso') pinta o
// fundo da linha.
function linhaProducao(p, dir = '', tom = '') {
  const itens = itensAProduzir(p), aFazer = itens.filter(i => !i[2]), feitos = itens.filter(i => i[2]);
  const nome = i => esc(legivel(i[1]));
  let corpo;
  if (aFazer.length) corpo = aFazer.slice(0, 3).map(i => `<span class="prod-item" title="${nome(i)}">${nome(i)}</span>`).join('')
    + (aFazer.length > 3 ? `<span class="prod-feitos">+ ${plural(aFazer.length - 3, 'item', 'itens')} a fazer</span>` : '');
  else corpo = `<span class="prod-item">${itens.length ? itens.map(nome).join(' + ') : esc(legivel(p.resumo || 'Sem itens lançados'))}</span>`;
  const feitosTxt = !feitos.length ? '' : `<span class="prod-feitos">${ico('check', 'ico ico-s')}${aFazer.length ? `feito: ${feitos.map(nome).join(', ')}` : 'tudo feito'}</span>`;
  const rodape = `<span class="prod-rodape"><span>${esc(p.cliente)}</span><span class="oid">O.S. ${p.id}</span>${foraDeCasa(p).length ? `<span>${esc(foraDeCasa(p).join(', '))}</span>` : ''}${temEntrega(p) ? `<span class="tag-entrega">${ico('truck')}Entrega</span>` : ''}</span>`;
  return `<li${tom ? ` class="tom-${tom}"` : ''}><a class="lin prod" href="#" data-os="${p.id}" title="Abrir a O.S. ${p.id}"><span class="prod-txt">${corpo}${feitosTxt}${rodape}</span>${dir ? `<span class="prod-dir">${dir}</span>` : ''}</a></li>`;
}

// A lista da produção em grupos de prazo. A data sai da linha e vira cabeçalho;
// nos grupos que juntam vários dias, a linha mostra o dia à direita.
function gruposDePrazo(lista, linha) {
  const amanha = somarDias(HOJE, 1), fimSemana = somarDias(HOJE, 6);
  const hora = p => p.hora ? `<span class="selo ${urgeHoje(p) ? 'atraso' : urgeAmanha(p) ? 'hoje' : ''}">${ico('clock')}até ${esc(p.hora)}</span>` : '';
  const dia = p => `<span class="quando">${SEMANA[dataLocal(p.prazo).getDay()].slice(0, 3)} ${ddmm(p.prazo)}</span>`;
  // Atrasadas e Para hoje em vermelho; Amanhã em âmbar (o padrão de prazo).
  return [
    { tom: 'atraso', icone: 'alert-triangle', rotulo: 'Atrasadas', itens: lista.filter(atrasada), linha: p => linha(p, `<span class="quando">${ddmm(p.prazo)}</span>`, 'atraso') },
    { tom: 'atraso', icone: 'clock', rotulo: 'Para hoje', itens: lista.filter(p => p.prazo === HOJE), linha: p => linha(p, hora(p), 'atraso') },
    { tom: 'hoje', icone: 'calendar', rotulo: `Amanhã · ${SEMANA[dataLocal(amanha).getDay()]}`, itens: lista.filter(p => p.prazo === amanha), linha: p => linha(p, hora(p), 'hoje') },
    { icone: 'calendar-range', rotulo: 'Esta semana', itens: lista.filter(p => p.prazo > amanha && p.prazo <= fimSemana), linha: p => linha(p, dia(p) + hora(p)), max: 5, resto: n => `e mais ${n} esta semana` },
    { icone: 'calendar-range', rotulo: 'Mais adiante', itens: lista.filter(p => p.prazo > fimSemana), linha: p => linha(p, `<span class="quando">${ddmm(p.prazo)}</span>`), max: 3, resto: n => `e mais ${n} mais adiante` },
    { icone: 'calendar-x', rotulo: 'Sem prazo', itens: lista.filter(p => !p.prazo), linha: p => linha(p), max: 3, resto: n => `e mais ${n} sem prazo` },
  ];
}

// O resto da fila, enxuto: o que é, de quem é a O.S., o prazo e quem está com ela.
const linhaOutraProducao = p => { const nomes = itensAProduzir(p).map(i => legivel(i[1])).join(' + ') || legivel(p.resumo);
  // O mesmo fundo da lista de cima: atrasadas e de hoje vermelho, amanhã âmbar.
  const tom = atrasada(p) || urgeHoje(p) ? 'atraso' : urgeAmanha(p) ? 'hoje' : '';
  return `<li${tom ? ` class="tom-${tom}"` : ''}><a class="lin" href="#" data-os="${p.id}" title="${esc(nomes)}"><span class="lin-txt"><span class="lin-tit">${esc(nomes)}</span><span class="lin-sub">${esc(p.cliente)} · O.S. ${p.id}</span></span><span class="lin-dir junto">${p.resp.length ? respMini(p) : ''}<span>${prazoTexto(p)}${p.resp.length ? '' : '<small class="sem">sem responsável</small>'}</span></span></a></li>`; };

// Linha enxuta: número e cliente; embaixo o que é; à direita só o que decide.
// `pri`: o filete de prioridade da linha (pri-alta / pri-media), quando a lista é de prazo.
// `dirCls`: classe extra da coluna da direita ('junto': lado a lado).
const linhaLimpa = (p, dir, pri = '', dirCls = '') => `<li><a class="lin ${pri}" href="#" data-os="${p.id}" title="${esc(p.cliente)} — ${esc(p.resumo)}">
  <span class="lin-txt"><span class="lin-tit"><span class="oid">#${p.id}</span>${esc(p.cliente)}</span><span class="lin-sub">${esc(legivel(p.resumo))}</span></span>
  <span class="lin-dir ${dirCls}">${dir}</span></a></li>`;
// Uma O.S. que vence hoje: o título do card já diz "hoje", então a linha mostra
// o que muda a decisão — o horário limite, a etapa e com quem está.
const linhaHoje = p => linhaLimpa(p, `${p.resp.length ? respMini(p) : ''}<span>${p.hora ? `<span class="pz atraso">até ${esc(p.hora)}</span>` : ''}<small>${esc(CURTO[p.status] || p.status)}</small>${p.resp.length ? '' : '<small class="sem">sem responsável</small>'}</span>`, 'pri-alta', 'junto');

// Uma lista com rótulos de grupo; grupo vazio não aparece.
const listaEmGrupos = grupos => `<ul class="lista">${grupos.filter(g => g.itens.length).map(g =>
  `<li class="grupo-rot ${g.tom || ''}">${ico(g.icone)}${g.rotulo}<b class="num">${g.itens.length}</b></li>${g.itens.slice(0, g.max || 99).map(g.linha).join('')}${g.itens.length > (g.max || 99) ? `<li class="mais-grupo">${g.resto(g.itens.length - g.max)}</li>` : ''}`).join('')}</ul>`;

// Atendimento: o que ainda precisa ser produzido, no nome da pessoa (ou de
// todos), agrupado pela urgência — os grupos de cima são o "cobrar a
// produção". Minhas/Todas troca só o card.
function blocoProduzir(eu) {
  const minhas = est.escopo !== 'todas';
  const lista = abertas.filter(p => FILA.includes(p.status) && (!minhas || doLado(p, eu))).sort(porPrazo);
  const amanha = somarDias(HOJE, 1);
  const linha = p => linhaLimpa(p, `${prazoTexto(p)}<small>${esc(p.status)}${foraDeCasa(p).length ? ' · ' + esc(foraDeCasa(p).join(', ')) : ''}</small>${minhas ? '' : respMini(p)}`, priOS(p));
  const corpo = lista.length ? listaEmGrupos([
    { tom: 'atraso', icone: 'alert-triangle', rotulo: 'Atrasadas · cobrar a produção', itens: lista.filter(atrasada), linha },
    { tom: 'atraso', icone: 'clock', rotulo: 'Vencem hoje', itens: lista.filter(ehHoje), linha },
    { tom: 'hoje', icone: 'calendar', rotulo: 'Vencem amanhã', itens: lista.filter(p => p.prazo === amanha), linha },
    { icone: 'calendar-range', rotulo: 'Próximos dias', itens: lista.filter(p => !p.prazo || p.prazo > amanha), linha, max: 4, resto: n => `e mais ${n} com prazo mais à frente` },
  ]) : vazio(minhas ? 'Nada no seu nome esperando produção.' : 'Fila de produção vazia.');
  const urg = lista.filter(p => p.prazo && p.prazo <= amanha).length;
  return `<div id="bloco-produzir">${area(`a-itens${urg ? ' elevado' : ''}`, 'layers', minhas ? 'Sua fila na produção' : 'Fila da produção', lista.length ? String(lista.length) : '', corpo, ver('Abrir a Produção', '/producao'),
    seg('De quem', [['minhas', 'Minhas'], ['todas', 'Todas']], est.escopo, 'data-escopo', 'peq'))}</div>`;
}

/* ===== boletos a receber (visão Financeiro) =====
   Vêm do banco, e só quando a visão abre: a tela pede por mensagem, a página
   busca os boletos em aberto e responde. Enquanto isso, o card avisa. */
let BOLETOS = null, boletosPedidos = false;
function blocoBoletos() {
  const quadro = (cls, meta, corpo, pe) => `<div id="bloco-boletos">${area(`a-fin ${cls}`, 'barcode', 'Boletos a receber', meta, corpo, pe, '', 'card-boletos')}</div>`;
  const recado = (icone, txt) => `<div class="vazio">${ico(icone)}${txt}</div>`;
  if (window.parent === window) return quadro('', '', recado('info', 'Os boletos só carregam dentro do sistema.'), '');
  if (!BOLETOS) {
    if (!boletosPedidos) { boletosPedidos = true; window.parent.postMessage({ tipo: 'pedir-boletos' }, '/'); }
    return quadro('', '', recado('loader', 'Carregando os boletos…'), '');
  }
  if (BOLETOS.erro) return quadro('', '', recado('alert-triangle', esc(BOLETOS.erro)), '');
  const L = [...BOLETOS.lista].sort((x, y) => (x.vence || '9999').localeCompare(y.vence || '9999') || x.os - y.os);
  if (!L.length) return quadro('compacto', 'nada em aberto', '', '');
  const limite = somarDias(HOJE, 7), amanha = somarDias(HOJE, 1);
  const incompleto = b => !b.valor || !b.vence;
  const prontos = L.filter(b => !incompleto(b));
  const vencidos = prontos.filter(b => b.vence < HOJE), deHoje = prontos.filter(b => b.vence === HOJE);
  const semana = prontos.filter(b => b.vence > HOJE && b.vence <= limite), adiante = prontos.filter(b => b.vence > limite).length;
  const banco = b => `${esc(b.banco || 'Boleto')}${b.parcelas > 1 ? ` · ${b.parcelas}x` : ''}`;
  const sub = b => incompleto(b) ? [!b.valor ? 'falta o valor' : '', !b.vence ? 'falta o vencimento' : ''].filter(Boolean).join(' · ')
    : b.vence < HOJE ? `<span class="desce">vencido há ${plural(diasEntre(b.vence, HOJE), 'dia', 'dias')}</span> · ${banco(b)}` : banco(b);
  const pri = b => !b.vence ? '' : b.vence <= HOJE ? 'pri-alta' : b.vence === amanha ? 'pri-media' : '';
  const linha = b => `<li><a class="lin ${pri(b)}" href="#" data-ir="/financeiro" title="Abrir os boletos no Financeiro">${b.vence ? dataEmBloco(b.vence) : '<span class="diaf sem" title="Sem vencimento"><b>—</b></span>'}<span class="lin-txt"><span class="lin-tit"><span class="oid">#${b.os}</span>${esc(b.cliente)}</span><span class="lin-sub">${sub(b)}</span></span><span class="lin-dir num">${b.valor ? reais(b.valor) : '<small>sem valor</small>'}</span></a></li>`;
  const grupos = [
    { icone: 'file-pen-line', rotulo: 'A preencher', itens: L.filter(incompleto), linha, max: 4, resto: n => `e mais ${n} a preencher` },
    { tom: 'atraso', icone: 'alert-triangle', rotulo: 'Vencidos', itens: vencidos, linha, max: 5, resto: n => `e mais ${n} vencidos` },
    { tom: 'atraso', icone: 'clock', rotulo: 'Vencem hoje', itens: deHoje, linha, max: 5, resto: n => `e mais ${n} de hoje` },
    { icone: 'calendar-range', rotulo: 'Próximos 7 dias', itens: semana, linha, max: 5, resto: n => `e mais ${n} na semana` },
  ];
  const corpo = grupos.some(g => g.itens.length) ? listaEmGrupos(grupos) : recado('check-circle-2', 'Nenhum boleto vence nos próximos 7 dias.');
  return quadro(vencidos.length || deHoje.length ? 'elevado' : '', `${reais(L.reduce((s, b) => s + b.valor, 0))} · ${L.length} em aberto`, corpo,
    ver(adiante ? `Abrir os boletos · mais ${adiante} adiante` : 'Abrir os boletos', '/financeiro'));
}

// As respostas da página.
// (O atalho de WhatsApp nas linhas saiu: o WhatsApp Web isola a aba dele —
// Cross-Origin-Opener-Policy: same-origin —, então cada clique abria uma aba
// nova e recarregava todas as conversas. Nenhum site consegue reaproveitá-la.)
addEventListener('message', e => {
  if (e.source !== window.parent) return;
  const msg = e.data || {};
  if (msg.tipo === 'boletos') {
    BOLETOS = msg.erro ? { erro: msg.erro } : { lista: msg.lista || [] };
    const b = document.getElementById('bloco-boletos');
    if (b) { b.outerHTML = blocoBoletos(); lucide.createIcons(); ajustarLado(); }
  }
});

/* ===== gaveta: O.S. ou conta, a mesma da nova Produção ===== */
// No Início a O.S. é só para ver: o ⤢ (ou Enter) abre a O.S. completa, que é
// onde se muda alguma coisa. A conta tem as ações de hoje — marcar como paga
// (aqui só na tela, é protótipo) e editar, que abre o modal atual, que grava.
const gaveta = { tipo: null, id: null };
const porIdOS = id => PEDIDOS.find(p => p.id === id);
const porIdConta = id => DADOS.contas.find(c => c.id === id);
const avisoProto = txt => { document.querySelector('.aviso-proto')?.remove(); const t = document.createElement('div'); t.className = 'aviso-proto'; t.textContent = txt; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
// Pedir algo à página (abrir O.S., editar conta) abre um modal lá fora: o foco
// sai daqui junto, senão o Esc e o teclado ficam presos atrás do modal.
const paraPai = msg => { if (window.parent !== window) { document.activeElement?.blur(); window.parent.postMessage(msg, '/'); } };
const dataLonga = iso => { const d = dataLocal(iso); return `${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };

function detalheOS(p) {
